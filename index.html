async function savePurchaseInvoice(){
  if(!purchaseDraft.supplierId){ toast('اختار المورد أولاً', true); return; }
  if(purchaseDraft.lines.length===0){ toast('أضف صنف واحد على الأقل', true); return; }
  const supplier = DB.suppliers.find(s=>s.id===purchaseDraft.supplierId);
  const purchaseId = uid('pur');
  const invoiceItems = [];
  for(const line of purchaseDraft.lines){
    let part;
    if(line.partId){
      part = DB.inventory.find(p=>p.id===line.partId);
      part.qty += line.qty;
      part.costPrice = line.costPrice;
      if(line.sellPrice) part.sellPrice = line.sellPrice;
    } else {
      part = {id:uid('p'), name:line.name, sku:line.sku||'', category:line.category||'', unit:line.unit||'قطعة', qty:line.qty, minQty:2, costPrice:line.costPrice, sellPrice:line.sellPrice, warehouseId:line.warehouseId||defaultWhId(), createdAt:new Date().toISOString()};
      DB.inventory.push(part);
    }
    DB.stockMoves.push({id:uid('mv'), partId:part.id, type:'in', qty:line.qty, unitCost:line.costPrice, warehouseId:partWhId(part), date:new Date().toISOString(), note:'فاتورة شراء #'+(purchaseDraft.invoiceNo||'—')+' — '+purchaseDraft.paymentMethod+' — مخزن: '+whName(partWhId(part)), supplierId:purchaseDraft.supplierId, purchaseId});
    invoiceItems.push({partId:part.id, name:part.name, qty:line.qty, unitCost:line.costPrice});
  }
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('stockMoves', DB.stockMoves)]);
  const total = invoiceItems.reduce((s,it)=>s+it.qty*it.unitCost,0);
  const purchase = {
    id: purchaseId, purchaseNo: purchaseDraft.invoiceNo || nextNo(DB.purchases,'purchaseNo'),
    supplierId: purchaseDraft.supplierId,
    date: purchaseDraft.date ? new Date(purchaseDraft.date).toISOString() : new Date().toISOString(),
    note: 'طريقة الدفع: '+purchaseDraft.paymentMethod,
    paymentMethod: purchaseDraft.paymentMethod,
    items: invoiceItems, total, payments: []
  };
  if(purchaseDraft.paymentMethod !== 'آجل'){
    purchase.payments.push({id:uid('pay'), amount: total, date: new Date().toISOString()});
  }
  DB.purchases.push(purchase);
  await saveKey('purchases', DB.purchases);
  await logAction('فاتورة شراء جديدة #'+purchase.purchaseNo+' من '+supplier.name+' بقيمة '+money(total)+' ('+purchaseDraft.paymentMethod+')');
  toast('تم حفظ الفاتورة وتحديث المخزون وحساب المورد');
  purchaseDraft = null;
  currentTab='suppliers'; render();
}

function updateInvoicePreview(subtotal, vatRate){
  const discount = parseFloat(document.getElementById('invDiscount').value)||0;
  const afterDiscount = Math.max(subtotal-discount,0);
  const vat = afterDiscount*vatRate/100;
  const total = afterDiscount+vat;
  document.getElementById('invPreview').innerHTML = `
    <div class="flex-between"><span class="muted">بعد الخصم</span><span>${money(afterDiscount)}</span></div>
    ${vatRate>0?`<div class="flex-between"><span class="muted">الضريبة (${vatRate}%)</span><span>${money(vat)}</span></div>`:''}
    <div class="flex-between total-row" style="margin-top:6px"><span>الإجمالي المطلوب</span><span>${money(total)}</span></div>
  `;
}
async function createInvoiceFromJob(jobId){
  const job = DB.jobs.find(j=>j.id===jobId);
  // حماية من التكرار: ممنوع فاتورة تانية لنفس أمر الشغل
  if(DB.invoices.some(i=>i.jobId===jobId && !i.cancelled)){
    toast('يوجد فاتورة صادرة بالفعل لأمر الشغل ده', true); closeModal(); refreshContent(); return;
  }
  const subtotal = job.items.reduce((s,it)=>s+it.qty*it.unitPrice,0);
  const discount = parseFloat((document.getElementById('invDiscount')||{}).value)||0;
  const vatRate = DB.settings.vatRate||0;
  const afterDiscount = Math.max(subtotal-discount,0);
  const vatAmount = afterDiscount*vatRate/100;
  const total = afterDiscount+vatAmount;
  const inv = {
    id: uid('inv'), invNo: nextNo(DB.invoices,'invNo'),
    jobId, customerId: job.customerId, items: JSON.parse(JSON.stringify(job.items)),
    subtotal, discount, vatRate, vatAmount, total, payments: [], date: new Date().toISOString()
  };
  DB.invoices.push(inv);
  await saveKey('invoices', DB.invoices);
  // القاعدة: إصدار الفاتورة = تسليم السيارة وخروجها من المركز
  if(job.status !== 'تم التسليم'){
    job.status = 'تم التسليم';
    job.deliveredAt = new Date().toISOString();
    await saveKey('jobs', DB.jobs);
  }
  await logAction('إصدار فاتورة #'+inv.invNo+' بقيمة '+money(total)+' — تم تسليم السيارة وإقفال أمر الشغل #'+job.jobNo);
  closeModal(); toast('تم إصدار الفاتورة وتسليم السيارة — المتابعة من شاشة الفواتير');
  currentTab='invoices'; render();
}
function paymentStatus(inv){
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  if(paid<=0) return 'unpaid';
  if(paid<inv.total) return 'partial';
  return 'paid';
}

function invoiceMatchesFilters(inv){
  const f = invFilters;
  const cust = DB.customers.find(c=>c.id===inv.customerId);
  const job = inv.jobId ? DB.jobs.find(j=>j.id===inv.jobId) : null;
  const car = job ? DB.cars.find(c=>c.id===job.carId) : null;
  if(f.custType && ((cust&&cust.custType)||'فرد')!==f.custType) return false;
  if(f.status){
    if(f.status==='cancelled'){ if(!inv.cancelled) return false; }
    else { if(inv.cancelled) return false; if(paymentStatus(inv)!==f.status) return false; }
  }
  if(f.dateFrom && new Date(inv.date) < new Date(f.dateFrom)) return false;
  if(f.dateTo && new Date(inv.date) > new Date(new Date(f.dateTo).getTime()+86399999)) return false;
  if(f.search){
    const t = f.search.trim().toLowerCase();
    const hay = [cust&&cust.name, cust&&cust.phone, (cust&&cust.custType)||'فرد',
      inv.invNo, job&&job.jobNo, car&&car.plate, car&&carLabel(car)].filter(Boolean).join(' | ').toLowerCase();
    if(!hay.includes(t)) return false;
  }
  return true;
}

  const list = [...DB.invoices].filter(invoiceMatchesFilters).sort((a,b)=>new Date(b.date)-new Date(a.date));

function openPaymentModal(invId){
  const inv = DB.invoices.find(i=>i.id===invId);
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  const remaining = inv.total - paid;
  openModal(`
    <h3>تحصيل دفعة — فاتورة #${inv.invNo}</h3>
    <div class="muted" style="margin-bottom:12px">المتبقي: ${money(remaining)}</div>
    <div class="form-row"><label class="f-label">المبلغ</label><input class="f" id="payAmt" type="number" min="0" max="${remaining}" value="${remaining}"></div>

      <select class="f" id="payMethod">${DB.finAccounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select>
    </div>
    <button class="btn btn-accent" style="width:100%" onclick="savePayment('${invId}')">تأكيد التحصيل</button>
  `);

async function savePayment(invId){
  const amount = parseFloat(document.getElementById('payAmt').value)||0;
  if(amount<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const inv = DB.invoices.find(i=>i.id===invId);
  inv.payments = inv.payments || [];
  const paidSoFar = inv.payments.reduce((s,p)=>s+p.amount,0);
  const remaining = inv.total - paidSoFar;
  if(amount > remaining + 0.001){ toast('المبلغ أكبر من المتبقي على الفاتورة ('+money(remaining)+')', true); return; }
  const accId = (document.getElementById('payMethod')||{}).value;
  const acc = DB.finAccounts.find(a=>a.id===accId) || accountForMethod('كاش');
  const method = acc ? acc.name : 'كاش';
  const cust = DB.customers.find(c=>c.id===inv.customerId);
  inv.payments.push({id:uid('pay'), amount, method, accountId:acc?acc.id:null, date:new Date().toISOString()});
  if(acc) addFinMove(acc.id, 'in', amount, 'collection', 'تحصيل فاتورة #'+inv.invNo+(cust?' — '+cust.name:''));
  await Promise.all([saveKey('invoices', DB.invoices), saveKey('finMoves', DB.finMoves)]);
  await logAction('تحصيل دفعة '+money(amount)+' ('+method+') على فاتورة #'+inv.invNo);
  closeModal(); toast('تم تسجيل الدفعة'); refreshContent();
}

function downloadHTML(html, filename){
  const full = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${filename}</title>
  <style>
  body{font-family:Tahoma,Arial,sans-serif;color:#111;background:#fff;margin:0;padding:28px;}
  ${brandedInvoiceCSS()}
  </style></head><body>${html}
  <script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`;
  const blob = new Blob([full], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('تم تحميل الملف — افتحه وهيطبع تلقائياً');
}

let rcvFilters = { custType:'', status:'', dateFrom:'', dateTo:'', search:'' };
function invBalance(inv){
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  return { paid, balance: inv.total - paid };
}
/* ---- الفترة الزمنية للداشبورد المالي ---- */
let rcvPeriod = { preset:'this_month', from:'', to:'' };
function periodRange(st){
  st = st || rcvPeriod;
  const now = new Date();
  const d0 = (d)=>new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today0 = d0(now);
  let from, to;
  switch(st.preset){
    case 'today': from = today0; to = new Date(today0.getTime()+86399999); break;
    case 'yesterday': from = new Date(today0.getTime()-86400000); to = new Date(today0.getTime()-1); break;
    case 'this_week': { const dow=(now.getDay()+1)%7; /* السبت بداية الأسبوع */ from = new Date(today0.getTime()-dow*86400000); to = now; break; }
    case 'last_week': { const dow=(now.getDay()+1)%7; const thisWeekStart = new Date(today0.getTime()-dow*86400000); from = new Date(thisWeekStart.getTime()-7*86400000); to = new Date(thisWeekStart.getTime()-1); break; }
    case 'this_month': from = new Date(now.getFullYear(), now.getMonth(), 1); to = now; break;
    case 'last_month': from = new Date(now.getFullYear(), now.getMonth()-1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59); break;
    case 'this_quarter': { const q = Math.floor(now.getMonth()/3); from = new Date(now.getFullYear(), q*3, 1); to = now; break; }
    case 'this_year': from = new Date(now.getFullYear(), 0, 1); to = now; break;
    case 'all': from = new Date(2000,0,1); to = now; break;
    case 'custom':
      from = st.from ? new Date(st.from) : new Date(2000,0,1);
      to = st.to ? new Date(new Date(st.to).getTime()+86399999) : now;
      break;
    default: from = new Date(2000,0,1); to = now;
  }
  return {from, to};
}
function inPeriod(dateStr, range){ const d = new Date(dateStr); return d >= range.from && d <= range.to; }
function setRcvPreset(p){ rcvPeriod.preset = p; refreshContent(); }
const PERIOD_PRESETS = [['today','اليوم'],['yesterday','أمس'],['this_week','هذا الأسبوع'],['last_week','الأسبوع الماضي'],['this_month','هذا الشهر'],['last_month','الشهر الماضي'],['this_quarter','هذا الربع'],['this_year','هذه السنة'],['all','الكل']];

/* ---- محرك الربحية الإجمالية حسب الفترة (الملاحظة 16) ---- */
function computeProfitStats(range){
  const invs = DB.invoices.filter(i=>!i.cancelled && inPeriod(i.date, range));
  let sales=0, collected=0, inParts=0, extParts=0, extWork=0, paint=0;
  invs.forEach(inv=>{
    sales += inv.total;
    collected += (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
    const job = DB.jobs.find(j=>j.id===inv.jobId);
    if(job){
      job.items.forEach(it=>{
        const c = it.qty*(it.costPrice||0);
        if(it.kind==='part') inParts += c;
        else if(it.kind==='ext_part') extParts += c;
        else if(it.kind==='ext_work') extWork += c;
      });
      (job.internalCosts||[]).forEach(ic=>{ paint += ic.total; });
    }
  });
  const cost = inParts + extParts + extWork + paint;
  const debt = sales - collected;
  const profit = sales - cost;
  const margin = sales>0 ? profit/sales*100 : 0;
  return {count:invs.length, sales, collected, debt, cost, profit, margin, inParts, extParts, extWork, paint};
}

  const ps = computeProfitStats(range);
  return `

    ${stat(ps.margin.toFixed(1)+'%','نسبة الربحية', ps.margin<15 && ps.sales>0)}
  </div>
  <details style="margin-top:4px">

  const salesTotal = periodInvoices.reduce((s,i)=>s+i.total,0);

  let collectedTotal = 0;
  const byMethod = {};
  activeInvoices.forEach(inv=>(inv.payments||[]).forEach(p=>{
    if(!inPeriod(p.date, range)) return;
    collectedTotal += p.amount;
    const m = p.method || 'كاش';
    byMethod[m] = (byMethod[m]||0) + p.amount;
  }));
  // المديونيات: المتبقي على فواتير الفترة، مقسمة أفراد/شركات + أكبر المدينين
  const debtorMap = {};
  let indTotal=0, compTotal=0, indCount=0, compCount=0;

    const b = invBalance(inv);
    if(b.balance<=0.001) return;
    const cust = DB.customers.find(c=>c.id===inv.customerId);
    if(!cust) return;
    if(!debtorMap[cust.id]) debtorMap[cust.id] = {cust, total:0, invCount:0, invNos:[]};

  let list = [...DB.invoices].filter(i=>!i.cancelled).sort((a,b)=>new Date(b.date)-new Date(a.date));
  list = list.filter(inv=>{
    const cust = DB.customers.find(c=>c.id===inv.customerId);
    if(f.custType && ((cust&&cust.custType)||'فرد')!==f.custType) return false;
    if(f.status && paymentStatus(inv)!==f.status) return false;
    if(f.dateFrom && new Date(inv.date) < new Date(f.dateFrom)) return false;
    if(f.dateTo && new Date(inv.date) > new Date(new Date(f.dateTo).getTime()+86399999)) return false;
    if(f.search){
      const t = f.search.trim().toLowerCase();
      const hay = [cust&&cust.name, cust&&cust.phone].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(t)) return false;
    }
    return true;
  });
  if(list.length===0) return `<tr><td colspan="9" class="empty">لا توجد فواتير مطابقة</td></tr>`;
  return list.map(inv=>{
    const cust = DB.customers.find(c=>c.id===inv.customerId);
    const b = invBalance(inv);
    const st = paymentStatus(inv);
    return `<tr><td>#${inv.invNo}</td><td>${cust?cust.name:'—'}</td><td>${(cust&&cust.custType)||'فرد'}</td>
      <td>${fmtDate(inv.date)}</td><td>${money(inv.total)}</td><td>${money(b.paid)}</td>
      <td class="${b.balance>0?'low-stock':''}">${money(b.balance)}</td>
      <td><span class="tag ${stMap[st][1]}">${stMap[st][0]}</span></td>
      <td>${st!=='paid'?`<button class="btn btn-sm btn-accent" onclick="openPaymentModal('${inv.id}')">تحصيل</button>`:''}</td></tr>`;
  }).join('');
}

function accBalance(accId){
  const acc = DB.finAccounts.find(a=>a.id===accId);
  if(!acc) return 0;
  let b = acc.openingBalance||0;
  DB.finMoves.forEach(m=>{
    if(m.accountId!==accId) return;
    b += m.type==='in' ? m.amount : -m.amount;
  });
  return b;
}
function addFinMove(accountId, type, amount, kind, note){
  DB.finMoves.push({id:uid('fm'), accountId, type, amount, kind, note, actor:actorName(), date:new Date().toISOString()});
}
function accountForMethod(methodName){
  // مطابقة وسيلة الدفع بالحساب المناسب تلقائياً
  const byName = DB.finAccounts.find(a=>methodName && methodName.includes(a.name));
  if(byName) return byName;
  if(/كاش/.test(methodName||'') && !/فودافون/.test(methodName||'')) return DB.finAccounts.find(a=>a.kind==='خزنة') || DB.finAccounts[0];
  if(/بنك|تحويل|فيزا|POS|بطاقة/.test(methodName||'')) return DB.finAccounts.find(a=>a.kind==='بنك') || DB.finAccounts[0];
  if(/فودافون/.test(methodName||'')) return DB.finAccounts.find(a=>a.name.includes('فودافون')) || DB.finAccounts[0];
  return DB.finAccounts.find(a=>a.kind==='خزنة') || DB.finAccounts[0];
}

async function saveFinTransfer(){
  const fromId = document.getElementById('tfFrom').value;
  const toId = document.getElementById('tfTo').value;
  const amount = parseFloat(document.getElementById('tfAmount').value)||0;
  const note = document.getElementById('tfNote').value.trim();
  if(fromId===toId){ toast('اختار حسابين مختلفين', true); return; }
  if(amount<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const from = DB.finAccounts.find(a=>a.id===fromId), to = DB.finAccounts.find(a=>a.id===toId);
  if(amount > accBalance(fromId) + 0.001){ toast('المبلغ أكبر من رصيد '+from.name+' ('+money(accBalance(fromId))+')', true); return; }
  const n = 'تحويل: '+from.name+' ← '+to.name+(note?' — '+note:'');
  addFinMove(fromId, 'out', amount, 'transfer', n);
  addFinMove(toId, 'in', amount, 'transfer', n);
  await saveKey('finMoves', DB.finMoves);
  await logAction('تحويل '+money(amount)+' من '+from.name+' إلى '+to.name+(note?' — '+note:''));
  closeModal(); toast('تم التحويل'); refreshContent();
}

function readImageResized(file){
  return new Promise((resolve,reject)=>{
    if(file.size > 5*1024*1024){ toast('الصورة كبيرة جداً (أكثر من 5 ميجا) — استخدم صورة أصغر', true); return reject(new Error('too big')); }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>resolve(reader.result);
      img.onload = ()=>{
        try{
          const max = 1000; let w = img.width, h = img.height;
          if(w>max){ h = Math.round(h*max/w); w = max; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',0.7));
        }catch(err){ resolve(reader.result); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let techPeriod = { preset:'this_month', from:'', to:'' };

/* كل الفنيين اللي ليهم شغل (بالمفتاح الثابت) + الفنيين النشطين في الموارد البشرية */
function allTechKeys(){
  const s = new Set();
  DB.jobs.forEach(j=>j.items.forEach(it=>{
    if(it.kind==='service'){ const k = techKeyOf(it, j); if(k && k!=='غير محدد') s.add(k); }
  }));
  techEmployees().forEach(e=>s.add(e.id));
  return [...s].sort((a,b)=>techLabelOf(a).localeCompare(techLabelOf(b),'ar'));
}
function computeTechPerf(range){
  const techMap = {};
  const ensure = (t)=>{ if(!techMap[t]) techMap[t] = {servicesCount:0, laborValue:0, laborCollected:0, incentiveBase:0, rework:0, jobs:new Set(), days:new Set()}; return techMap[t]; };
  const excl = DB.settings.incentiveExclusions||[];
  // الاستبعاد بيقارن بالمفتاح والاسم — عشان الاستبعادات القديمة (المخزنة بالاسم) تفضل شغالة
  const isExcluded = (techKey, dStr)=>{
    const label = techLabelOf(techKey);
    const d = new Date(dStr);
    return excl.some(x=>(x.tech===techKey || x.tech===label) && d>=new Date(x.from) && d<=new Date(x.to+'T23:59:59'));
  };
  DB.jobs.forEach(j=>{
    if(j.status==='ملغاة') return;
    const inv = DB.invoices.find(i=>i.jobId===j.id && !i.cancelled);
    let collectRatio = 0;
    if(inv){
      const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
      collectRatio = inv.total>0 ? Math.min(paid/inv.total,1) : 0;
    }
    j.items.filter(it=>it.kind==='service').forEach(it=>{
      // الخدمات الجديدة ليها تاريخها الخاص؛ القديمة بتتبع تاريخ أمر الشغل
      const dStr = it.date || j.deliveredAt || j.receivedAt;
      if(!inPeriod(dStr, range)) return;
      const tech = techKeyOf(it, j);
      const d = ensure(tech);
      d.servicesCount++;
      const val = it.qty*it.unitPrice;
      d.laborValue += val;
      d.laborCollected += val*collectRatio;
      if(!isExcluded(tech, dStr)) d.incentiveBase += val*collectRatio;
      if(it.rework) d.rework++;
      d.days.add(new Date(dStr).toDateString());
      d.jobs.add(j.id);
    });
  });
  return techMap;
}

async function saveIncentiveExclusion(){
  if(session.role!=='owner'){ toast('صلاحية صاحب المركز فقط', true); return; }
  const tech = (document.getElementById('ieTech')||{}).value;
  const from = (document.getElementById('ieFrom')||{}).value;
  const to = (document.getElementById('ieTo')||{}).value;
  const reason = (document.getElementById('ieReason')||{}).value.trim();
  if(!tech || !from || !to){ toast('حدد الفني والفترة', true); return; }
  if(new Date(to) < new Date(from)){ toast('تاريخ النهاية قبل البداية', true); return; }
  if(!reason){ toast('اكتب سبب الاستبعاد', true); return; }
  if(!DB.settings.incentiveExclusions) DB.settings.incentiveExclusions = [];
  DB.settings.incentiveExclusions.push({ id:uid('ie'), tech, from, to, reason, by:actorName(), at:new Date().toISOString() });
  await saveKey('settings');
  await logAction('استبعاد أداء الفني '+techLabelOf(tech)+' من الحوافز ('+fmtDate(from)+' → '+fmtDate(to)+') — السبب: '+reason);
  closeModal(); toast('تم الاستبعاد — البيانات محفوظة والحافز متوقف للفترة دي'); refreshContent();
}
function removeIncentiveExclusion(id){
  if(session.role!=='owner'){ toast('صلاحية صاحب المركز فقط', true); return; }
  const x = (DB.settings.incentiveExclusions||[]).find(e=>e.id===id);
  if(!x) return;
  askConfirm('إلغاء استبعاد الفني '+techLabelOf(x.tech)+' ('+fmtDate(x.from)+' → '+fmtDate(x.to)+')؟ الفترة هترجع تتحسب في الحوافز.', async ()=>{
    DB.settings.incentiveExclusions = DB.settings.incentiveExclusions.filter(e=>e.id!==id);
    await saveKey('settings');
    await logAction('إلغاء استبعاد الفني '+techLabelOf(x.tech)+' من الحوافز ('+fmtDate(x.from)+' → '+fmtDate(x.to)+')');

function technicianReportHTML(techKey){

  const techName = techLabelOf(techKey);

function leaveDaysCount(from, to){
  if(!from || !to) return 0;
  const d = Math.round((new Date(to) - new Date(from))/86400000) + 1;
  return d>0 ? d : 0;
}

/* إحصائيات الموظف: الرصيد والمستخدم والمتبقي والرفض والغياب */
function empLeaveStats(empId){
  const emp = DB.employees.find(e=>e.id===empId);
  const approved = DB.leaveRequests.filter(r=>r.employeeId===empId && r.status==='approved');
  const usedRoutine = approved.filter(r=>r.type==='دورية').reduce((s,r)=>s+(r.days||0),0);
  const usedEmergency = approved.filter(r=>r.type==='طارئة').reduce((s,r)=>s+(r.days||0),0);
  const usedOther = approved.filter(r=>r.type!=='دورية' && r.type!=='طارئة').reduce((s,r)=>s+(r.days||0),0);
  const rejections = DB.leaveRequests.filter(r=>r.employeeId===empId && r.status==='rejected').length;
  const absences = (emp && emp.absences) ? emp.absences : [];
  const absenceDays = absences.reduce((s,a)=>s+(a.days||1),0);
  const absenceNoPermission = absences.filter(a=>a.noPermission).reduce((s,a)=>s+(a.days||1),0);
  const balRoutine = emp ? (emp.leaveRoutine||0) : 0;
  const balEmergency = emp ? (emp.leaveEmergency||0) : 0;
  return {
    balRoutine, balEmergency, total: balRoutine+balEmergency,
    usedRoutine, usedEmergency, usedOther, used: usedRoutine+usedEmergency,
    remRoutine: balRoutine-usedRoutine, remEmergency: balEmergency-usedEmergency,
    remaining: (balRoutine-usedRoutine)+(balEmergency-usedEmergency),
    rejections, absenceTimes: absences.length, absenceDays, absenceNoPermission
  };
}

  if(st==='نشط') return '<span class="tag tag-paid">نشط</span>';

}

async function saveNewEmployee(){
  const f = readEmployeeForm();
  if(!f.name){ toast('اكتب اسم الموظف', true); return; }
  if(DB.employees.some(e=>e.name===f.name && e.status!=='مستقيل')){ toast('فيه موظف بنفس الاسم موجود بالفعل', true); return; }
  DB.employees.push({ id:uid('emp'), empNo: nextNo(DB.employees,'empNo'), ...f, absences:[], createdAt:new Date().toISOString() });
  await saveKey('employees');
  await logAction('إضافة موظف جديد: '+f.name+' ('+(f.job||'—')+')');
  closeModal(); toast('تم حفظ ملف الموظف'); refreshContent();
}

async function saveAbsence(empId){

  const date = (document.getElementById('abDate')||{}).value;

/* ---- فلاتر شاشات الإجازات والأذونات والمأموريات (الملاحظة 24) ---- */
let hrFilter = { emp:'', preset:'all', from:'', to:'' };
function setHrFilterEmp(v){ hrFilter.emp = v; refreshContent(); }
function setHrFilterPreset(p){ hrFilter.preset = p; refreshContent(); }
function hrPeriodRange(){
  const now = new Date();
  const r = periodRange(hrFilter);
  // مدّ نهاية الفترات الجارية لآخرها — عشان الطلبات المستقبلية (إجازة الأسبوع الجاي مثلاً) تظهر
  if(hrFilter.preset==='this_week'){ r.to = new Date(r.from.getTime()+7*86400000-1); }
  else if(hrFilter.preset==='this_month'){ r.to = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59); }
  else if(hrFilter.preset==='this_quarter'){ const q=Math.floor(now.getMonth()/3); r.to = new Date(now.getFullYear(), q*3+3, 0, 23,59,59); }
  else if(hrFilter.preset==='this_year'){ r.to = new Date(now.getFullYear(), 11, 31, 23,59,59); }
  return r;
}
function hrFilterMatch(empId, dateStr){
  if(hrFilter.emp && empId!==hrFilter.emp) return false;
  if(hrFilter.preset==='all') return true;   // بدون فترة = كل التاريخ (حتى المستقبلي)
  return inPeriod(dateStr, hrPeriodRange());
}
function hrFilterBar(){
  const emps = [...DB.employees].sort((a,b)=>a.name.localeCompare(b.name,'ar'));

  <div class="section-head" style="margin-top:4px"><h3 style="font-size:15px">⏳ في انتظار الموافقة (${pending.length})</h3></div>

  </div>

async function saveLeaveRequest(){
  const empId = (document.getElementById('lvEmp')||{}).value;
  const type = (document.getElementById('lvType')||{}).value;
  const from = (document.getElementById('lvFrom')||{}).value;
  const to = (document.getElementById('lvTo')||{}).value;
  const reason = (document.getElementById('lvReason')||{}).value.trim();
  const notes = (document.getElementById('lvNotes')||{}).value.trim();
  const emp = DB.employees.find(e=>e.id===empId);
  if(!emp){ toast('اختر الموظف', true); return; }
  if(!from || !to){ toast('حدد تاريخ البداية والنهاية', true); return; }
  const days = leaveDaysCount(from, to);
  if(days<=0){ toast('تاريخ النهاية لازم يكون بعد البداية', true); return; }
  // منع التضارب: طلب متداخل مع إجازة قائمة أو منتظرة لنفس الموظف
  const overlap = DB.leaveRequests.some(r=>r.employeeId===empId && r.status!=='rejected' && !(new Date(to) < new Date(r.from) || new Date(from) > new Date(r.to)));
  if(overlap){ toast('فيه طلب إجازة تاني لنفس الموظف في نفس الفترة دي', true); return; }
  // فحص الرصيد للأنواع اللي بتخصم
  const st = empLeaveStats(empId);
  if(type==='دورية' && days > st.remRoutine){ toast('رصيد الإجازات الدورية مش كفاية (متبقي '+st.remRoutine+' يوم)', true); return; }
  if(type==='طارئة' && days > st.remEmergency){ toast('رصيد الإجازات الطارئة مش كفاية (متبقي '+st.remEmergency+' يوم)', true); return; }
  DB.leaveRequests.push({
    id:uid('lv'), reqNo: nextNo(DB.leaveRequests,'reqNo'),
    employeeId: empId, type, from, to, days, reason, notes,
    status:'pending', requestedBy: actorName(), date:new Date().toISOString()
  });
  await saveKey('leaveRequests');
  await logAction('طلب إجازة '+type+' '+days+' يوم — '+emp.name);
  closeModal(); toast('تم تقديم الطلب — في انتظار الموافقة'); refreshContent();
}
function approveLeave(reqId){
  const r = DB.leaveRequests.find(x=>x.id===reqId);
  if(!r || r.status!=='pending') return;
  const emp = DB.employees.find(e=>e.id===r.employeeId);
  const st = empLeaveStats(r.employeeId);
  const deducts = (r.type==='دورية' || r.type==='طارئة');
  if(r.type==='دورية' && r.days > st.remRoutine){ toast('رصيده الدوري مش كفاية (متبقي '+st.remRoutine+')', true); return; }
  if(r.type==='طارئة' && r.days > st.remEmergency){ toast('رصيده الطارئ مش كفاية (متبقي '+st.remEmergency+')', true); return; }
  const after = deducts ? st.remaining - r.days : st.remaining;
  askConfirm('الموافقة على إجازة <b>'+(emp?emp.name:'—')+'</b>؟<br>'+r.type+' — '+r.days+' يوم ('+fmtDate(r.from)+' → '+fmtDate(r.to)+')<br><br>'+
    (deducts ? 'الرصيد قبل الإجازة: <b>'+st.remaining+'</b> يوم — الرصيد بعدها: <b>'+after+'</b> يوم' : 'النوع ده ('+r.type+') مش بيخصم من رصيد الإجازات'), async ()=>{
    r.status='approved'; r.decidedBy=actorName(); r.decidedAt=new Date().toISOString();
    r.balanceBefore = st.remaining; r.balanceAfter = after;
    await saveKey('leaveRequests');
    await logAction('قبول إجازة '+r.type+' '+r.days+' يوم — '+(emp?emp.name:'—')+' (الرصيد بعدها: '+after+')');
    toast('تمت الموافقة — اتخصم من رصيده تلقائياً'); refreshContent();
  });
}
function rejectLeave(reqId){
  const r = DB.leaveRequests.find(x=>x.id===reqId);

/* ---- السلف والجزاءات والرواتب (الملاحظة 20) + دورة رواتب مرنة (الملاحظة 29) ----
   الرواتب مش مربوطة بالشهر الميلادي — دورة من تاريخ لتاريخ (مثال: 25/6 → 25/7)
   وقيمة اليوم = الراتب الشهري ÷ أيام العمل المتفق عليها (قابلة للضبط، الافتراضي 26) */
function workingDays(){ const d = parseFloat(DB.settings.payrollWorkingDays); return (d>0 ? d : 26); }
function empDayValue(emp){
  if(emp.dayValue>0) return emp.dayValue;
  const wd = workingDays();
  return wd>0 ? Math.round(((emp.salary||0)/wd)*100)/100 : 0;
}
function inRange(dateStr, from, to){
  if(!dateStr) return false;
  const d = (dateStr+'').slice(0,10);
  return d >= from && d <= to;
}
/* حساب راتب فترة: الأساسي + حوافز − (سلف + غياب + جزاءات + تأمينات + استقطاعات) */
function payrollCalc(emp, from, to){
  const wd = workingDays();
  const dayVal = empDayValue(emp);
  // اليومية: الأيام الفعلية في الفترة (بحد أقصى أيام العمل) — الشهري: الراتب كامل
  const spanDays = Math.round((new Date(to) - new Date(from))/86400000) + 1;
  const base = emp.salaryType==='يومية'
    ? Math.round(dayVal * Math.min(spanDays, wd) * 100)/100
    : (emp.salary||0);
  const advances  = (emp.advances||[]).filter(a=>inRange(a.date, from, to)).reduce((s,a)=>s+(a.amount||0),0);
  const absDays   = (emp.absences||[]).filter(a=>inRange(a.date, from, to)).reduce((s,a)=>s+(a.days||1),0);
  const absenceDeduct = Math.round(dayVal*absDays*100)/100;
  const penalties = (emp.penalties||[]).filter(p=>inRange(p.date, from, to)).reduce((s,p)=>s+(p.amount||0),0);
  const bonuses   = (emp.bonuses||[]).filter(b=>inRange(b.date, from, to)).reduce((s,b)=>s+(b.amount||0),0);
  const socialIns = emp.socialIns||0, healthIns = emp.healthIns||0, otherDeduct = emp.otherDeduct||0;
  const fixed = socialIns+healthIns+otherDeduct;
  const totalDeduct = advances+absenceDeduct+penalties+fixed;
  return { base, bonuses, dayVal, wd, spanDays, advances, absDays, absenceDeduct, penalties,
           socialIns, healthIns, otherDeduct, fixed, totalDeduct,
           net: Math.round((base + bonuses - totalDeduct)*100)/100 };
}

  if(!e) return;
  openModal(`

    <div class="grid g2">

/* ---- شاشة الرواتب بدورة مرنة (الملاحظة 29) ---- */
function defaultPayrollCycle(){
  // الافتراضي: دورة الشهر الحالي حسب يوم قفل الرواتب (مثال: 25/6 → 25/7)
  const d = parseInt(DB.settings.payrollCycleDay,10) || 25;
  const now = new Date();
  let to = new Date(now.getFullYear(), now.getMonth(), d);
  if(now.getDate() > d) to = new Date(now.getFullYear(), now.getMonth()+1, d);
  const from = new Date(to.getFullYear(), to.getMonth()-1, d);
  const iso = (x)=>new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10);
  return { from: iso(from), to: iso(to) };
}
let payrollPeriod = null;
let payrollFilter = { emp:'', dept:'' };
function getPayrollPeriod(){ if(!payrollPeriod) payrollPeriod = defaultPayrollCycle(); return payrollPeriod; }
function setPayrollFrom(v){ getPayrollPeriod(); if(v) payrollPeriod.from = v; refreshContent(); }
function setPayrollTo(v){ getPayrollPeriod(); if(v) payrollPeriod.to = v; refreshContent(); }
function setPayrollFilter(k, v){ payrollFilter[k] = v; refreshContent(); }
function periodLabel(from, to){ return fmtDate(from)+' → '+fmtDate(to); }
async function saveWorkingDays(){
  if(session.role!=='owner'){ toast('صلاحية صاحب المركز فقط', true); return; }
  const wd = parseFloat((document.getElementById('prWorkDays')||{}).value)||0;
  const cd = parseInt((document.getElementById('prCycleDay')||{}).value,10)||0;
  if(wd<=0 || wd>31){ toast('أيام العمل لازم تكون بين 1 و 31', true); return; }
  if(cd<1 || cd>28){ toast('يوم قفل الرواتب لازم يكون بين 1 و 28', true); return; }
  const oldWd = workingDays(), oldCd = parseInt(DB.settings.payrollCycleDay,10)||25;
  DB.settings.payrollWorkingDays = wd;
  DB.settings.payrollCycleDay = cd;
  await saveKey('settings');
  await logAction('تعديل إعدادات الرواتب — أيام العمل: من '+oldWd+' إلى '+wd+' · يوم القفل: من '+oldCd+' إلى '+cd);
  toast('تم حفظ إعدادات الرواتب'); refreshContent();
}

function refreshAuditTable(){ const b=document.getElementById('auditTableBody'); if(b) b.innerHTML = auditRowsHTML(); }
function auditRowsHTML(){
  const f = auditFilters;
  let list = [...DB.activityLog].sort((a,b)=>new Date(b.date)-new Date(a.date));
  list = list.filter(l=>{
    const actor = l.actor || l.role || '';
    if(f.actor && actor!==f.actor) return false;
    if(f.text && !l.text.toLowerCase().includes(f.text.trim().toLowerCase())) return false;
    if(f.dateFrom && new Date(l.date) < new Date(f.dateFrom)) return false;
    if(f.dateTo && new Date(l.date) > new Date(new Date(f.dateTo).getTime()+86399999)) return false;
    if(f.refNo && !l.text.includes('#'+f.refNo.trim())) return false;
    return true;
  }).slice(0,300);
  if(list.length===0) return `<tr><td colspan="4" class="empty">لا توجد عمليات مطابقة</td></tr>`;
  return list.map(l=>`<tr>
    <td style="white-space:nowrap">${fmtDateTime(l.date)}</td>
    <td style="font-weight:700">${l.actor||l.role||'—'}</td>
    <td class="muted" style="font-size:11.5px">${l.device||'—'}</td>
    <td>${l.text}</td></tr>`).join('');
}

async function saveNewStaff(){
  const name = document.getElementById('stName').value.trim();
  const role = document.getElementById('stRole').value;
  const username = document.getElementById('stUser').value.trim();
  const password = document.getElementById('stPass').value;
  if(!name || !username || !password){ toast('اكتب اسم الموظف واسم المستخدم وكلمة المرور', true); return; }
  if(password.length<4){ toast('كلمة المرور لازم تكون 4 حروف/أرقام على الأقل', true); return; }
  if(DB.staff.some(s=>s.username.toLowerCase()===username.toLowerCase())){ toast('اسم المستخدم ده موجود بالفعل', true); return; }
  DB.staff.push({id:uid('st'), name, username, password, role, active:true, createdAt:new Date().toISOString()});
  await saveKey('staff', DB.staff);
  await logAction('إنشاء حساب موظف جديد: '+name+' ('+ROLE_LABEL[role]+')');
  toast('تم إنشاء حساب '+name); refreshContent();
}
async function toggleStaff(id){
  const st = DB.staff.find(s=>s.id===id);
  st.active = st.active===false ? true : false;
  await saveKey('staff', DB.staff);
  await logAction((st.active?'تفعيل':'إيقاف')+' حساب الموظف: '+st.name);
  toast((st.active?'تم تفعيل ':'تم إيقاف ')+st.name); refreshContent();
}
function deleteStaff(id){
  const st = DB.staff.find(s=>s.id===id);
  askConfirmReason('حذف حساب الموظف "'+st.name+'" نهائياً؟ عملياته السابقة هتفضل مسجلة باسمه في سجل العمليات.', async (reason)=>{
    DB.staff = DB.staff.filter(s=>s.id!==id);
    await saveKey('staff', DB.staff);
    await logAction('حذف حساب الموظف: '+st.name+' — السبب: '+(reason||'—'));
    toast('تم حذف الحساب'); refreshContent();
  });
}
function openChangeStaffPass(id){
  const st = DB.staff.find(s=>s.id===id);
  openModal(`
    <h3>تغيير كلمة سر — ${st.name}</h3>
    <div class="form-row"><label class="f-label">كلمة المرور الجديدة</label><input class="f" id="newStPass" type="text"></div>
    <button class="btn btn-accent" style="width:100%" onclick="saveStaffPass('${id}')">حفظ</button>
  `);
}
async function saveStaffPass(id){
  const st = DB.staff.find(s=>s.id===id);
  const p = document.getElementById('newStPass').value;
  if(p.length<4){ toast('كلمة المرور لازم تكون 4 حروف/أرقام على الأقل', true); return; }
  st.password = p;
  await saveKey('staff', DB.staff);
  await logAction('تغيير كلمة سر الموظف: '+st.name);
  closeModal(); toast('تم تغيير كلمة السر'); refreshContent();
}
async function saveInvoiceInfo(){
  DB.settings.address = document.getElementById('setAddress').value.trim();
  DB.settings.phone = document.getElementById('setPhone').value.trim();
  DB.settings.warrantyText = document.getElementById('setWarranty').value;

async function saveTaxWa(){

function exportBackup(){
  const backup = {
    exportedAt: new Date().toISOString(),
    customers:DB.customers, cars:DB.cars, jobs:DB.jobs, inventory:DB.inventory, stockMoves:DB.stockMoves,
    invoices:DB.invoices, expenses:DB.expenses, suppliers:DB.suppliers, purchases:DB.purchases,
    supplierReturns:DB.supplierReturns, inventoryCounts:DB.inventoryCounts, warehouses:DB.warehouses, staff:DB.staff, finAccounts:DB.finAccounts, finMoves:DB.finMoves, appointments:DB.appointments, cannedServices:DB.cannedServices,
    activityLog:DB.activityLog, users:DB.users, settings:DB.settings
  };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'garage-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('تم تحميل النسخة الاحتياطية');
}
async function importBackup(){
  const fileInput = document.getElementById('restoreFile');
  const file = fileInput.files[0];
  if(!file){ toast('اختار ملف النسخة الاحتياطية أولاً', true); return; }
  askConfirm('هل أنت متأكد؟ سيتم استبدال كل البيانات الحالية بالكامل بمحتوى الملف.', async ()=>{
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      for(const key of ['customers','cars','jobs','inventory','stockMoves','invoices','expenses','suppliers','purchases','supplierReturns','inventoryCounts','warehouses','staff','finAccounts','finMoves','appointments','cannedServices','activityLog','users','settings']){
        if(data[key]!==undefined){ DB[key] = data[key]; await saveKey(key, DB[key]); }
      }
      toast('تم استرجاع البيانات بنجاح'); render();
    }catch(e){ toast('الملف غير صالح', true); }
  });
}
async function saveCenterName(){
  DB.settings.centerName = document.getElementById('setCenterName').value.trim() || 'مركز الصيانة';
  await saveKey('settings', DB.settings);
  toast('تم الحفظ'); render();
}
async function savePins(){
  Object.keys(ROLE_LABEL).forEach(r=>{
    const v = document.getElementById('pin_'+r).value.trim();
    if(v) DB.users[r] = v;
  });
  await saveKey('users', DB.users);
  toast('تم تحديث الأرقام السرية');
}

/* ======================= BOOT ======================= */
/* ---- الحماية من الضغط المتكرر + مراقبة الأداء (الملاحظة 12) ---- */
window._opBusy = false;
window._lastOpSig = ''; window._lastOpAt = 0;
window._perfLog = [];
function setBusy(on){
  document.body.classList.toggle('busy', on);
  let bar = document.getElementById('busyBar');
  if(!bar){ bar = document.createElement('div'); bar.id='busyBar'; bar.textContent='⏳ جاري تنفيذ العملية...'; document.body.appendChild(bar); }
  bar.style.display = on ? 'block' : 'none';
}
(function wrapExecutiveOps(){
  const opNames = ['saveNewCustomer','saveNewCar','saveNewJob','saveServiceRow','saveEditJobItem','saveExtItem',
    'createInvoiceFromJob','savePayment','saveExpense','saveNewPart','saveEditItem','saveStockIn','saveStockOut',
    'savePaintOut','saveExtOutFromStock','saveNewSupplier','saveSupplierPayment','saveSupplierReturn','savePurchaseInvoice',
    'saveCustomerReturn','saveStockAdjustment','saveScrap','saveTransfer','saveNewWarehouse','saveNewAppointment',
    'saveCannedService','saveCountProgress','submitCountForApproval','confirmCancelJob','saveInvoiceInfo','saveTaxWa','savePins','saveCenterName','saveNewStaff','toggleStaff','saveStaffPass','saveFinAccount','saveOpeningBalance','saveFinTransfer','saveExternalDeposit','saveCustodySettle','saveExpenseCat',
    'saveNewEmployee','saveEmployeeEdit','saveLeaveRequest','saveAbsence','saveAdvance','savePenalty','savePermit',
    'saveIncentivePct','saveIncentiveExclusion','saveBonus','saveWorkingDays'];
  opNames.forEach(name=>{
    const orig = window[name];
    if(typeof orig !== 'function') return;
    window[name] = async function(...args){
      // منع التنفيذ المتزامن (ضغطة تانية والأولى لسه شغالة)
      if(window._opBusy){ return; }
      // منع تكرار نفس العملية بنفس المدخلات خلال 4 ثواني (دبل كليك أو نت بطيء)
      const sig = name + '|' + JSON.stringify(args);
      const now = Date.now();
      if(sig === window._lastOpSig && (now - window._lastOpAt) < 4000){
        toast('العملية دي لسه متنفذة حالاً — اتجاهلت المحاولة المكررة', true);
        return;
      }
      window._lastOpSig = sig; window._lastOpAt = now;
      window._opBusy = true; setBusy(true);
      const t0 = performance.now();
      try{
        return await orig.apply(this, args);
      } finally {
        const ms = Math.round(performance.now() - t0);
        window._perfLog.push({op:name, ms, at:new Date().toISOString()});
        if(window._perfLog.length > 100) window._perfLog = window._perfLog.slice(-100);
        window._opBusy = false; setBusy(false);
      }
    };
  });
})();

window.addEventListener('error', function(e){
  console.error('Unhandled error:', e.error||e.message);
  try{ toast('حصل خطأ غير متوقع — لو الشاشة مش مظبوطة دوس "تحديث البيانات"', true); }catch(x){}
  e.preventDefault();
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled rejection:', e.reason);
  try{ toast('حصلت مشكلة في الاتصال — جرب تاني أو دوس "تحديث البيانات"', true); }catch(x){}
  e.preventDefault();
});
initApp();
