function openCreateInvoiceModal(jobId){
  const job = DB.jobs.find(j=>j.id===jobId);
  if(job.items.length===0){ toast('أضف بنود للأمر الأول', true); return; }
  const subtotal = job.items.reduce((s,it)=>s+it.qty*it.unitPrice,0);
  const defTax = DB.settings.vatRate||0;   // القيمة الافتراضية (0 غالباً) — والمستخدم يقدر يغيّرها يدوياً
  openModal(`
    <h3>إصدار فاتورة — أمر شغل #${job.jobNo}</h3>
    <div class="flex-between" style="font-weight:700"><span>الإجمالي الأولي (قبل الخصم)</span><span>${money(subtotal)}</span></div>
    ${can('bill.discount')
      ? `<div class="form-row" style="margin-top:12px"><label class="f-label">قيمة الخصم (اختياري)</label><input class="f" id="invDiscount" type="number" min="0" step="any" value="0" oninput="updateInvoicePreview(${subtotal})"></div>`
      : `<input type="hidden" id="invDiscount" value="0"><div class="muted" style="font-size:12px;margin-top:10px">🔒 مالكش صلاحية عمل خصم على الفاتورة</div>`}
    <div class="form-row"><label class="f-label">نسبة الضريبة % (اكتبها يدوياً — أي نسبة، الافتراضي 0)</label>
      <input class="f" id="invTaxPct" type="number" min="0" step="any" value="${defTax}" placeholder="0" oninput="updateInvoicePreview(${subtotal})"></div>
    <div class="card" style="margin-top:14px" id="invPreview"></div>
    <button class="btn btn-accent" style="width:100%;margin-top:14px" onclick="createInvoiceFromJob('${jobId}')">إصدار الفاتورة</button>
  `);
  updateInvoicePreview(subtotal);
}
function updateInvoicePreview(subtotal){
  const discount = Math.max(parseFloat((document.getElementById('invDiscount')||{}).value)||0, 0);
  const taxPct = Math.max(parseFloat((document.getElementById('invTaxPct')||{}).value)||0, 0);
  const afterDiscount = Math.max(subtotal-discount,0);
  const taxAmount = afterDiscount*taxPct/100;
  const total = afterDiscount+taxAmount;
  document.getElementById('invPreview').innerHTML = `
    <div class="flex-between"><span class="muted">الإجمالي الأولي</span><span>${money(subtotal)}</span></div>
    <div class="flex-between"><span class="muted">قيمة الخصم</span><span>${discount>0?'- ':''}${money(discount)}</span></div>
    <div class="flex-between"><span class="muted">صافي بعد الخصم</span><span>${money(afterDiscount)}</span></div>
    <div class="flex-between"><span class="muted">نسبة الضريبة</span><span>${taxPct}%</span></div>
    <div class="flex-between"><span class="muted">قيمة الضريبة</span><span>${money(taxAmount)}</span></div>
    <div class="flex-between total-row" style="margin-top:6px;font-weight:800"><span>الإجمالي النهائي</span><span>${money(total)}</span></div>
  `;
}
async function createInvoiceFromJob(jobId){
  if(!can('bill.create')){ toast('مالكش صلاحية إصدار الفواتير', true); return; }
  const job = DB.jobs.find(j=>j.id===jobId);
  // حماية من التكرار: ممنوع فاتورة تانية لنفس أمر الشغل
  if(DB.invoices.some(i=>i.jobId===jobId && !i.cancelled)){
    toast('يوجد فاتورة صادرة بالفعل لأمر الشغل ده', true); closeModal(); refreshContent(); return;
  }
  const subtotal = job.items.reduce((s,it)=>s+it.qty*it.unitPrice,0);
  let discount = Math.max(parseFloat((document.getElementById('invDiscount')||{}).value)||0, 0);
  if(discount>0 && !can('bill.discount')){ toast('مالكش صلاحية الخصم — الفاتورة هتتصدر بدون خصم', true); discount = 0; }
  const vatRate = Math.max(parseFloat((document.getElementById('invTaxPct')||{}).value)||0, 0);  // نسبة الضريبة اليدوية
  const afterDiscount = Math.max(subtotal-discount,0);
  const vatAmount = afterDiscount*vatRate/100;
  const total = afterDiscount+vatAmount;
  // ختم وقت واحد للفاتورة والتسليم — عشان مايبقاش بينهم فرق ثواني في التقارير (الملاحظة 59)
  const stamp = new Date().toISOString();
  const inv = {
    id: uid('inv'), invNo: nextNo(DB.invoices,'invNo'),
    jobId, customerId: job.customerId, items: JSON.parse(JSON.stringify(job.items)),
    subtotal, discount, vatRate, vatAmount, total, payments: [], date: stamp,
    notes:'', refNo:'', createdBy: actorName(),
    history: [{ id:uid('ih'), at:stamp, actor:actorName(), staffId:(session&&session.staffId)||null,
      action:'created', changes:[
        {field:'إجمالي البنود', before:'—', after:money(subtotal)},
        ...(discount>0?[{field:'الخصم', before:'—', after:money(discount)}]:[]),
        ...(vatRate>0?[{field:'الضريبة', before:'—', after:vatRate+'% ('+money(vatAmount)+')'}]:[]),
        {field:'إجمالي الفاتورة', before:'—', after:money(total)}
      ], reason:'' }]
  };
  DB.invoices.push(inv);
  await saveKey('invoices', DB.invoices);
  // القاعدة: إصدار الفاتورة = تسليم السيارة وخروجها من المركز
  // (لو السيارة اتسلّمت قبل كده بيوم أو أكتر، تاريخ التسليم بيفضل زي ما هو — والفاتورة ليها تاريخها المستقل)
  if(job.status !== 'تم التسليم'){
    job.status = 'تم التسليم';
    job.deliveredAt = stamp;
    await saveKey('jobs', DB.jobs);
  }
  await logAction('إصدار فاتورة #'+inv.invNo+' بقيمة '+money(total)+' — تم تسليم السيارة وإقفال أمر الشغل #'+job.jobNo);
  if(total <= 0) notify('invoice_zero', '⚠️ فاتورة #'+inv.invNo+' بإجمالي صفر', { category:'financial', refType:'invoice', refId:inv.id, refNo:inv.invNo });
  if(!(job.items||[]).length) notify('invoice_zero', '⚠️ إقفال أمر الشغل #'+job.jobNo+' وفوترته من غير أي بنود', { category:'financial', refType:'job', refId:job.id, refNo:job.jobNo });
  if(discount>0 && subtotal>0){
    const pct = discount/subtotal*100;
    if(pct >= (DB.settings.largeDiscountPct||15)){
      const custD = DB.customers.find(c=>c.id===job.customerId);
      pushNotif({ category:'financial', type:'large_discount', priority: pct>=25?'critical':'high', amount:discount,
        action:'خصم عالي '+pct.toFixed(1)+'% على فاتورة #'+inv.invNo+(custD?' — '+custD.name:''), refType:'invoice', refNo:inv.invNo });
    }
  }
  closeModal(); toast('تم إصدار الفاتورة وتسليم السيارة — تفضل بتحصيل الدفعة');
  currentTab='invoices'; render();
  // بعد الإصدار: نروح لشاشة تحصيل الدفعة على طول (لو عنده صلاحية التحصيل)
  if(can('bill.collect')) openPaymentModal(inv.id);
}
function paymentStatus(inv){
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  if(paid<=0) return 'unpaid';
  if(paid<inv.total) return 'partial';
  return 'paid';
}

function invoiceMatchesFilters(inv){
  const f = invFilters;
  const cust = DB.customers.find(c=>c.id===inv.customerId);
  const job = inv.jobId ? DB.jobs.find(j=>j.id===inv.jobId) : null;
  const car = job ? DB.cars.find(c=>c.id===job.carId) : null;
  if(f.custType && ((cust&&cust.custType)||'فرد')!==f.custType) return false;
  if(f.status){
    if(f.status==='cancelled'){ if(!inv.cancelled) return false; }
    else { if(inv.cancelled) return false; if(paymentStatus(inv)!==f.status) return false; }
  }
  if(f.dateFrom && new Date(inv.date) < new Date(f.dateFrom)) return false;
  if(f.dateTo && new Date(inv.date) > new Date(new Date(f.dateTo).getTime()+86399999)) return false;
  if(f.search){
    const t = f.search.trim().toLowerCase();
    const hay = [cust&&cust.name, cust&&cust.phone, (cust&&cust.custType)||'فرد',
      inv.invNo, job&&job.jobNo, car&&car.plate, car&&carLabel(car)].filter(Boolean).join(' | ').toLowerCase();
    if(!hay.includes(t)) return false;
  }
  return true;
}
function invRowsHTML(){
  const map = {unpaid:['غير محصلة','tag-unpaid'], partial:['محصلة جزئياً','tag-partial'], paid:['محصلة بالكامل','tag-paid']};
  const list = [...DB.invoices].filter(invoiceMatchesFilters).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(list.length===0) return `<tr><td colspan="10" class="empty">لا توجد فواتير مطابقة</td></tr>`;
  return list.map(inv=>{
    const cust = DB.customers.find(c=>c.id===inv.customerId);
    const job = inv.jobId ? DB.jobs.find(j=>j.id===inv.jobId) : null;
    const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);

    return `<tr>

      <td style="white-space:nowrap">${!inv.cancelled && st!=='paid'?`<button class="btn btn-sm btn-accent" onclick="openPaymentModal('${inv.id}')">تحصيل</button> `:''}
      ${!inv.cancelled && can('bill.edit')?`<button class="btn btn-sm" onclick="openEditInvoice('${inv.id}')">✏️ تعديل</button> `:''}
      ${!inv.cancelled && job && can('jobs.reopen')?`<button class="btn btn-sm" onclick="reopenJobOrder('${inv.id}')">🔄 إعادة فتح الأمر</button> `:''}
      ${!inv.cancelled && can('bill.cancel')?`<button class="btn btn-sm btn-danger" onclick="cancelInvoice('${inv.id}')">إلغاء</button>`:''}</td>
      <td style="white-space:nowrap">${can('bill.history')?`<button class="btn btn-sm" onclick="openInvoiceHistory('${inv.id}')">🕘 السجل</button> `:''}${job?`<button class="btn btn-sm" onclick="openWorkOrderReport('${job.id}')">📈 الربحية</button> `:''}${can('bill.print')?`<button class="btn btn-sm" onclick="printInvoice('${inv.id}')">🖨</button> <button class="btn btn-sm" onclick="downloadInvoice('${inv.id}')">⬇ تحميل</button>`:''}</td>
    </tr>`;

/* ================= الملاحظة 60: تعديل الفاتورة وإلغاؤها وسجلها الكامل =================
   القاعدة: بنود الفاتورة (القطع/الخدمات/الأعمال الخارجية/الدهانات/الكميات) ممنوع تعديلها
   نهائياً — عشان المخزون والمحاسبة يفضلوا مظبوطين. لو محتاج تعدّل البنود لازم
   «إعادة فتح أمر الشغل» وتصدر فاتورة جديدة. */
const INV_EVENT_LABEL = {
  created:'📄 إصدار الفاتورة', edited:'✏️ تعديل الفاتورة', cancelled:'🚫 إلغاء الفاتورة',
  reopened:'🔄 إعادة فتح أمر الشغل', payment:'💵 تحصيل دفعة'
};
/* سجل الفاتورة — بيضيف حدث الإصدار للفواتير القديمة اللي مالهاش سجل */
function invHistory(inv){
  const h = Array.isArray(inv.history) ? [...inv.history] : [];
  if(!h.some(e=>e.action==='created')){
    h.unshift({ id:'seed_'+inv.id, at:inv.date, actor:inv.createdBy||'—', action:'created', changes:[], reason:'' });
  }
  return h.sort((a,b)=>new Date(a.at)-new Date(b.at));
}
function invLog(inv, action, changes, reason){
  inv.history = Array.isArray(inv.history) ? inv.history : [];
  inv.history.push({
    id: uid('ih'), at: new Date().toISOString(), actor: actorName(),
    staffId: (session&&session.staffId)||null, action,
    changes: (changes||[]).filter(c=>String(c.before)!==String(c.after)), reason: reason||''
  });
}

function editInvCalc(inv){
  const subtotal = inv.subtotal!=null ? inv.subtotal : (inv.items||[]).reduce((s,it)=>s+it.qty*it.unitPrice,0);
  const discount = Math.max(parseFloat((document.getElementById('eiDiscount')||{}).value)||0, 0);
  const vatRate = Math.max(parseFloat((document.getElementById('eiVat')||{}).value)||0, 0);
  const afterDiscount = Math.max(subtotal-discount, 0);
  const vatAmount = afterDiscount*vatRate/100;
  return { subtotal, discount, vatRate, afterDiscount, vatAmount, total: afterDiscount+vatAmount };
}
function editInvRecalc(invId){
  const inv = DB.invoices.find(i=>i.id===invId); if(!inv) return;
  const box = document.getElementById('eiTotals'); if(!box) return;
  const c = editInvCalc(inv);
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  const short = c.total < paid - 0.01;
  box.innerHTML = `
    <div class="flex-between"><span class="muted">إجمالي البنود (ثابت — مش قابل للتعديل)</span><span>${money(c.subtotal)}</span></div>
    <div class="flex-between"><span class="muted">الخصم</span><span>− ${money(c.discount)}</span></div>
    <div class="flex-between"><span class="muted">الضريبة (${c.vatRate}%)</span><span>+ ${money(c.vatAmount)}</span></div>
    <div class="flex-between total-row" style="margin-top:6px;font-weight:800"><span>الإجمالي بعد التعديل</span><span>${money(c.total)}</span></div>
    <div class="flex-between" style="margin-top:4px"><span class="muted">المحصّل فعلاً</span><span>${money(paid)}</span></div>
    ${short?`<div class="card" style="border:1px solid var(--danger);color:var(--danger);padding:7px 9px;margin-top:8px;font-size:12px;font-weight:700">🚫 الإجمالي الجديد أقل من المحصّل (${money(paid)}) — يعني العميل هيبقى دافع زيادة. صحّح الخصم/الضريبة أو ارجع الفرق للعميل الأول.</div>`:''}`;
}
async function saveEditInvoice(invId){
  if(!can('bill.edit')){ toast('مالكش صلاحية تعديل الفواتير', true); return; }
  const inv = DB.invoices.find(i=>i.id===invId);
  if(!inv || inv.cancelled){ toast('الفاتورة غير متاحة للتعديل', true); return; }
  const reason = (document.getElementById('eiReason')||{}).value.trim();
  if(!reason){ toast('اكتب سبب التعديل — بيتسجل في سجل الفاتورة', true); return; }
  const c = editInvCalc(inv);
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  if(c.discount > c.subtotal){ toast('الخصم أكبر من إجمالي البنود', true); return; }
  if(c.total < paid - 0.01){ toast('الإجمالي الجديد أقل من المحصّل ('+money(paid)+') — مينفعش', true); return; }
  const changes = [];
  // الخصم (بصلاحية الخصم فقط)
  if(can('bill.discount') && Math.abs((inv.discount||0) - c.discount) > 0.001){
    changes.push({ field:'الخصم', before:money(inv.discount||0), after:money(c.discount) });
    inv.discount = c.discount;
  }
  if(Math.abs((inv.vatRate||0) - c.vatRate) > 0.001){
    changes.push({ field:'نسبة الضريبة', before:(inv.vatRate||0)+'%', after:c.vatRate+'%' });
    inv.vatRate = c.vatRate;
  }
  // إعادة حساب الإجمالي على أساس القيم المحدّثة
  const after = editInvCalcFrom(inv);
  if(Math.abs((inv.total||0) - after.total) > 0.001){
    changes.push({ field:'إجمالي الفاتورة', before:money(inv.total||0), after:money(after.total) });
  }
  inv.subtotal = after.subtotal; inv.vatAmount = after.vatAmount; inv.total = after.total;
  // الرقم المرجعي والملاحظات
  const refNo = ((document.getElementById('eiRef')||{}).value||'').trim();
  if((inv.refNo||'') !== refNo){ changes.push({ field:'الرقم المرجعي', before:inv.refNo||'—', after:refNo||'—' }); inv.refNo = refNo; }
  const notes = ((document.getElementById('eiNotes')||{}).value||'').trim();
  if((inv.notes||'') !== notes){ changes.push({ field:'ملاحظات الفاتورة', before:inv.notes||'—', after:notes||'—' }); inv.notes = notes; }
  // وسيلة السداد — قيد تصحيحي بدل حذف الحركات
  let finTouched = false;
  (inv.payments||[]).forEach((p,idx)=>{
    const sel = document.getElementById('eiPay_'+idx); if(!sel) return;
    const newAccId = sel.value;
    if(!newAccId || newAccId===p.accountId) return;
    const oldAcc = DB.finAccounts.find(a=>a.id===p.accountId);
    const newAcc = DB.finAccounts.find(a=>a.id===newAccId);
    if(!newAcc) return;
    if(oldAcc) addFinMove(oldAcc.id, 'out', p.amount, 'correction', 'تصحيح وسيلة سداد فاتورة #'+inv.invNo+' (نقل لـ'+newAcc.name+')');
    addFinMove(newAcc.id, 'in', p.amount, 'correction', 'تصحيح وسيلة سداد فاتورة #'+inv.invNo+(oldAcc?' (منقولة من '+oldAcc.name+')':''));
    changes.push({ field:'وسيلة السداد — دفعة '+money(p.amount), before:(oldAcc?oldAcc.name:(p.method||'—')), after:newAcc.name });
    p.accountId = newAcc.id; p.method = newAcc.name;
    finTouched = true;
  });
  if(changes.length===0){ toast('مفيش أي تعديل', true); return; }
  invLog(inv, 'edited', changes, reason);
  const saves = [saveKey('invoices', DB.invoices)];
  if(finTouched) saves.push(saveKey('finMoves', DB.finMoves));
  await Promise.all(saves);
  const cst = DB.customers.find(x=>x.id===inv.customerId);
  await logAction('✏️ تعديل فاتورة #'+inv.invNo+auditDetails([
    ['العميل', cst?cst.name:null],
    ...changes.map(ch=>[ch.field, ch.before+' ← '+ch.after]),
    ['السبب', reason]
  ]));
  pushNotif({ category:'financial', type:'invoice_edit', priority:'high', amount:inv.total,
    action: (actorName()||'مستخدم')+' عدّل فاتورة #'+inv.invNo+' ('+changes.map(ch=>ch.field).join(' · ')+')',
    refType:'invoice', refNo:inv.invNo });
  closeModal(); toast('تم حفظ تعديلات الفاتورة'); refreshContent();
}
/* حساب الإجمالي من قيم الفاتورة نفسها (بعد التحديث) */
function editInvCalcFrom(inv){
  const subtotal = inv.subtotal!=null ? inv.subtotal : (inv.items||[]).reduce((s,it)=>s+it.qty*it.unitPrice,0);
  const afterDiscount = Math.max(subtotal-(inv.discount||0), 0);
  const vatAmount = afterDiscount*(inv.vatRate||0)/100;
  return { subtotal, afterDiscount, vatAmount, total: afterDiscount+vatAmount };
}

    '• أمر الشغل هيرجع «جاري الشغل» وتقدر تعدّل بنوده.<br>'+

    (paid>0?'<b style="color:var(--danger)">⚠️ الفاتورة دي محصّل عليها '+money(paid)+' — الإلغاء <u>مش</u> هيرجّع الفلوس ولا القيود المالية تلقائياً. التسوية لازم تعملها يدوي.</b><br><br>':'')+
    '<b>مفيش أي حركة مخزون هترجع تلقائياً.</b></span>',
    async (reason)=>{

        { field:'حالة أمر الشغل', before:job.status, after:'جاري الشغل' }
      ], reason);
      job.status = 'جاري الشغل';
      job.deliveredAt = null;
      job.reopenedAt = new Date().toISOString();
      job.reopenedBy = actorName();

        ['الفاتورة الملغاة', '#'+inv.invNo], ['إجمالي الفاتورة', money(inv.total)],
        ['المحصّل عليها', paid>0?money(paid):'—'], ['السبب', reason||'—']
      ]));
      pushNotif({ category:'financial', type:'job_reopen', priority:'critical', amount:inv.total,
        action:(actorName()||'مستخدم')+' أعاد فتح أمر الشغل #'+job.jobNo+' وألغى فاتورة #'+inv.invNo,
        refType:'invoice', refNo:inv.invNo });
      closeModal(); toast('اتفتح أمر الشغل #'+job.jobNo+' — عدّل البنود وبعدها اصدر فاتورة جديدة'); refreshContent();
    });
}
/* ---------- إلغاء الفاتورة (حتى لو محصّلة — لصاحب الصلاحية) ---------- */
function cancelInvoice(invId){
  if(!can('bill.cancel')){ toast('مالكش صلاحية إلغاء الفواتير', true); return; }
  const inv = DB.invoices.find(i=>i.id===invId);
  if(!inv){ toast('الفاتورة غير موجودة', true); return; }
  if(inv.cancelled){ toast('الفاتورة ملغاة بالفعل', true); return; }
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  const warn = paid>0
    ? 'الفاتورة #'+inv.invNo+' <b>محصّل عليها '+money(paid)+' بالفعل</b>.<br><br>'+
      '<span style="font-size:12.5px">إلغاء الفاتورة <b>مش هيرجّع حركات المخزون ولا القيود المالية تلقائياً</b>.<br>'+
      'لو محتاج تصحيح في المخزون أو الحسابات، لازم تعمله يدوي من الشاشات المخصصة لكده.<br><br>تحب تكمّل؟</span>'
    : 'إلغاء الفاتورة #'+inv.invNo+'؟<br><span style="font-size:12.5px">هتُستبعد من كل حسابات المبيعات والمديونيات، وتقدر تصدر فاتورة جديدة لنفس أمر الشغل. <b>مفيش حركة مخزون هترجع تلقائياً.</b></span>';
  askConfirmReason(warn, async (reason)=>{
    inv.cancelled = true;
    inv.cancelledAt = new Date().toISOString();
    inv.cancelReason = reason||'';
    invLog(inv, 'cancelled', [
      { field:'حالة الفاتورة', before:'صادرة', after:'ملغاة' },
      ...(paid>0 ? [{ field:'المحصّل وقت الإلغاء', before:money(paid), after:'محتاج تسوية يدوية' }] : [])
    ], reason);
    await saveKey('invoices', DB.invoices);
    const cstI = DB.customers.find(c=>c.id===inv.customerId);
    await logAction('🚫 إلغاء فاتورة #'+inv.invNo+auditDetails([
      ['العميل', cstI?cstI.name:null], ['تاريخ الفاتورة', fmtDate(inv.date)],
      ['الإجمالي', money(inv.total)], ['المحصّل عليها', paid>0?money(paid):'—'],
      ['الخصم', inv.discount?money(inv.discount):null],
      ['الضريبة', inv.vatAmount?money(inv.vatAmount)+' ('+inv.vatRate+'%)':null],
      ['عدد البنود', (inv.items||[]).length], ['السبب', reason||'—']
    ]));
    pushNotif({ category:'financial', type:'invoice_cancel', priority: paid>0?'critical':'high', amount:inv.total,
      action:(actorName()||'مستخدم')+' ألغى فاتورة #'+inv.invNo+(paid>0?' (محصّل عليها '+money(paid)+')':''),
      refType:'invoice', refNo:inv.invNo });
    toast('تم إلغاء الفاتورة'); refreshContent();
  });
}
/* ============ الملاحظة 62: تحصيل بوسائل سداد متعددة (Split Payment) ============
   الفاتورة الواحدة ممكن تتسدد بأكتر من وسيلة مع بعض (كاش + انستاباي + فيزا + تحويل...).
   كل وسيلة بتتسجل كدفعة مستقلة بحسابها الخاص وحركتها المالية الخاصة — عشان
   تقرير كل خزنة/حساب يزيد بالمبلغ اللي دخله هو بالظبط. */
let _payRows = 0;
function openPaymentModal(invId){
  if(!can('bill.collect')){ toast('مالكش صلاحية التحصيل', true); return; }
  const inv = DB.invoices.find(i=>i.id===invId);
  if(!inv){ toast('الفاتورة غير موجودة', true); return; }
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  const remaining = inv.total - paid;
  _payRows = 0;
  openModal(`
    <h3>تحصيل فاتورة #${inv.invNo}</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px">تقدر تقسّم التحصيل على أكتر من وسيلة سداد مع بعض — كل وسيلة هتتسجل في حسابها لوحدها.</div>
    <div id="payRowsBox"></div>
    <button class="btn btn-sm" style="margin-bottom:12px" onclick="addPayRow('${invId}')">${ICONS.plus} إضافة وسيلة سداد</button>
    <div class="card" id="payTotals" style="margin-bottom:12px"></div>
    <button class="btn btn-accent" style="width:100%" onclick="savePayment('${invId}')">تأكيد التحصيل</button>
  `, true);
  addPayRow(invId, remaining);   // أول صف بالمتبقي كله (السلوك المعتاد)
}
function addPayRow(invId, presetAmount){
  const box = document.getElementById('payRowsBox'); if(!box) return;
  const idx = _payRows++;
  const div = document.createElement('div');
  div.className = 'grid g3';
  div.id = 'payRow_'+idx;
  div.setAttribute('style','align-items:end;gap:8px;margin-bottom:6px');
  div.innerHTML = `
    <div class="form-row" style="margin:0"><label class="f-label">وسيلة السداد / الحساب المستلم</label>
      <select class="f" id="payAcc_${idx}">${DB.finAccounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
    <div class="form-row" style="margin:0"><label class="f-label">المبلغ</label>
      <input class="f" id="payAmt_${idx}" type="number" min="0" step="0.01" value="${presetAmount!=null?Math.max(presetAmount,0):''}" oninput="payRecalc('${invId}')"></div>
    <div style="padding-bottom:10px">${idx>0?`<button class="btn btn-sm btn-danger" onclick="removePayRow(${idx},'${invId}')">حذف</button>`:'<span class="muted" style="font-size:11.5px">الصف الأساسي</span>'}</div>`;
  box.appendChild(div);
  payRecalc(invId);
}
function removePayRow(idx, invId){
  // بنصفّر المبلغ الأول عشان الصف يتشال من الحساب فوراً، وبعدين نشيله من الشاشة
  const amtEl = document.getElementById('payAmt_'+idx);
  if(amtEl) amtEl.value = '';
  const el = document.getElementById('payRow_'+idx);
  if(el) el.remove();
  payRecalc(invId);
}
/* قراءة كل الصفوف الحالية */
function readPayRows(){
  const rows = [];
  for(let i=0;i<_payRows;i++){
    const amtEl = document.getElementById('payAmt_'+i);
    const accEl = document.getElementById('payAcc_'+i);
    if(!amtEl || !accEl) continue;            // الصف اتشال
    const amount = parseFloat(amtEl.value)||0;
    if(amount<=0) continue;
    const acc = DB.finAccounts.find(a=>a.id===accEl.value) || accountForMethod('كاش');
    rows.push({ amount, accountId: acc?acc.id:null, method: acc?acc.name:'كاش' });
  }
  return rows;
}
function payRecalc(invId){
  const inv = DB.invoices.find(i=>i.id===invId); if(!inv) return;
  const box = document.getElementById('payTotals'); if(!box) return;
  const already = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  const now = readPayRows().reduce((s,r)=>s+r.amount,0);
  const totalPaid = already + now;
  const remaining = inv.total - totalPaid;
  const over = remaining < -0.01;
  box.innerHTML = `
    <div class="flex-between"><span class="muted">إجمالي الفاتورة</span><span style="font-weight:700">${money(inv.total)}</span></div>
    ${already>0?`<div class="flex-between"><span class="muted">محصّل سابقاً</span><span>${money(already)}</span></div>`:''}
    <div class="flex-between"><span class="muted">المحصّل دلوقتي</span><span>${money(now)}</span></div>
    <div class="flex-between total-row" style="margin-top:6px;font-weight:800"><span>إجمالي المدفوع</span><span>${money(totalPaid)}</span></div>
    <div class="flex-between" style="margin-top:4px"><span class="muted">المتبقي</span>
      <span style="font-weight:800;color:${over?'var(--danger)':(Math.abs(remaining)<0.01?'#1a7f37':'var(--accent-2)')}">${money(Math.max(remaining,0))}</span></div>
    <div style="margin-top:6px">${over
      ? `<span class="tag tag-cancel">🚫 إجمالي المدفوع أكبر من قيمة الفاتورة</span>`
      : (Math.abs(remaining)<0.01 ? `<span class="tag tag-paid">محصلة بالكامل</span>` : (totalPaid>0?`<span class="tag tag-partial">محصلة جزئياً</span>`:`<span class="tag tag-unpaid">غير محصلة</span>`))}</div>`;
}
async function savePayment(invId){
  if(!can('bill.collect')){ toast('مالكش صلاحية التحصيل', true); return; }
  const inv = DB.invoices.find(i=>i.id===invId);
  if(!inv){ toast('الفاتورة غير موجودة', true); return; }
  if(inv.cancelled){ toast('الفاتورة ملغاة — مينفعش تحصيل عليها', true); return; }
  const rows = readPayRows();
  if(!rows.length){ toast('اكتب مبلغ صحيح على وسيلة سداد واحدة على الأقل', true); return; }
  inv.payments = inv.payments || [];
  const paidSoFar = inv.payments.reduce((s,p)=>s+p.amount,0);
  const adding = rows.reduce((s,r)=>s+r.amount,0);
  const remaining = inv.total - paidSoFar;
  if(adding > remaining + 0.001){
    toast('إجمالي المدفوع أكبر من قيمة الفاتورة — المتبقي '+money(remaining), true); return;
  }
  const cust = DB.customers.find(c=>c.id===inv.customerId);
  const stamp = new Date().toISOString();
  rows.forEach(r=>{
    inv.payments.push({ id:uid('pay'), amount:r.amount, method:r.method, accountId:r.accountId, date:stamp });
    // كل وسيلة بحركتها المالية على حسابها هي — عشان تقارير الخزن تفضل مظبوطة
    if(r.accountId) addFinMove(r.accountId, 'in', r.amount, 'collection',
      'تحصيل فاتورة #'+inv.invNo+(cust?' — '+cust.name:'')+(rows.length>1?' (سداد مقسّم)':''));
  });
  const breakdown = rows.map(r=>r.method+': '+money(r.amount)).join(' · ');
  invLog(inv, 'payment', [{ field: rows.length>1?'تحصيل مقسّم على '+rows.length+' وسائل':'دفعة محصّلة',
    before: money(paidSoFar), after: money(paidSoFar+adding)+' ('+breakdown+')' }], '');
  await Promise.all([saveKey('invoices', DB.invoices), saveKey('finMoves', DB.finMoves)]);
  await logAction('تحصيل '+money(adding)+' على فاتورة #'+inv.invNo+auditDetails([
    ...rows.map(r=>[r.method, money(r.amount)]),
    ['إجمالي المحصّل الآن', money(adding)],
    ['إجمالي المدفوع على الفاتورة', money(paidSoFar+adding)],
    ['المتبقي', money(Math.max(inv.total-(paidSoFar+adding),0))]
  ]));
  closeModal();
  toast(rows.length>1 ? 'تم التحصيل المقسّم على '+rows.length+' وسائل سداد' : 'تم تسجيل الدفعة');
  refreshContent();
}

function printHTML(html){
  let area = document.getElementById('printArea');
  if(!area){ area = document.createElement('div'); area.id='printArea'; document.body.appendChild(area); }
  area.innerHTML = html;
  setTimeout(()=>{ try{ window.print(); }catch(e){ toast('الطباعة المباشرة متقفلة هنا — استخدم زرار "تحميل" واطبع الملف من المتصفح', true); } }, 150);
}
function downloadHTML(html, filename){
  const full = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${filename}</title>
  <style>
  body{font-family:Tahoma,Arial,sans-serif;color:#111;background:#fff;margin:0;padding:28px;}
  ${brandedInvoiceCSS()}
  </style></head><body>${html}
  <script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`;
  const blob = new Blob([full], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('تم تحميل الملف — افتحه وهيطبع تلقائياً');
}

function invBalance(inv){
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  return { paid, balance: inv.total - paid };
}
/* ---- الفترة الزمنية للداشبورد المالي ---- */
let rcvPeriod = { preset:'this_month', from:'', to:'' };
function periodRange(st){
  st = st || rcvPeriod;
  const now = new Date();
  const d0 = (d)=>new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today0 = d0(now);
  let from, to;
  switch(st.preset){
    case 'today': from = today0; to = new Date(today0.getTime()+86399999); break;
    case 'yesterday': from = new Date(today0.getTime()-86400000); to = new Date(today0.getTime()-1); break;
    case 'this_week': { const dow=(now.getDay()+1)%7; /* السبت بداية الأسبوع */ from = new Date(today0.getTime()-dow*86400000); to = now; break; }
    case 'last_week': { const dow=(now.getDay()+1)%7; const thisWeekStart = new Date(today0.getTime()-dow*86400000); from = new Date(thisWeekStart.getTime()-7*86400000); to = new Date(thisWeekStart.getTime()-1); break; }
    case 'this_month': from = new Date(now.getFullYear(), now.getMonth(), 1); to = now; break;
    case 'last_month': from = new Date(now.getFullYear(), now.getMonth()-1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59); break;
    case 'this_quarter': { const q = Math.floor(now.getMonth()/3); from = new Date(now.getFullYear(), q*3, 1); to = now; break; }
    case 'this_year': from = new Date(now.getFullYear(), 0, 1); to = now; break;
    case 'all': from = new Date(2000,0,1); to = now; break;
    case 'custom':
      from = st.from ? new Date(st.from) : new Date(2000,0,1);
      to = st.to ? new Date(new Date(st.to).getTime()+86399999) : now;
      break;
    default: from = new Date(2000,0,1); to = now;
  }
  return {from, to};
}
function inPeriod(dateStr, range){ const d = new Date(dateStr); return d >= range.from && d <= range.to; }
function setRcvPreset(p){ rcvPeriod.preset = p; refreshContent(); }
const PERIOD_PRESETS = [['today','اليوم'],['yesterday','أمس'],['this_week','هذا الأسبوع'],['last_week','الأسبوع الماضي'],['this_month','هذا الشهر'],['last_month','الشهر الماضي'],['this_quarter','هذا الربع'],['this_year','هذه السنة'],['all','الكل']];

/* ---- محرك الربحية الإجمالية حسب الفترة (الملاحظة 16) ---- */
function computeProfitStats(range){
  const invs = DB.invoices.filter(i=>!i.cancelled && inPeriod(i.date, range));
  let sales=0, collected=0, inParts=0, extParts=0, extWork=0, paint=0;
  invs.forEach(inv=>{
    sales += inv.total;
    collected += (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
    const job = DB.jobs.find(j=>j.id===inv.jobId);
    if(job){
      job.items.forEach(it=>{
        const c = it.qty*(it.costPrice||0);
        if(it.kind==='part') inParts += c;
        else if(it.kind==='ext_part') extParts += c;
        else if(it.kind==='ext_work') extWork += c;
      });
      (job.internalCosts||[]).forEach(ic=>{ paint += ic.total; });
    }
  });
  const cost = inParts + extParts + extWork + paint;
  const debt = sales - collected;
  const profit = sales - cost;
  const margin = sales>0 ? profit/sales*100 : 0;
  // الملاحظة 56: الهالك خسارة تشغيلية داخلية بتتخصم من الربح — منفصلة عشان تفضل واضحة
  const scrapCost = DB.stockMoves.filter(m=>m.type==='scrap' && inPeriod(m.date, range))
    .reduce((s,m)=>s+(m.qty||0)*(m.unitCost||0),0);
  const netProfit = profit - scrapCost;
  const netMargin = sales>0 ? netProfit/sales*100 : 0;
  return {count:invs.length, sales, collected, debt, cost, profit, margin, inParts, extParts, extWork, paint, scrapCost, netProfit, netMargin};
}

function rcvRowsHTML(){

    if(f.custType && ((cust&&cust.custType)||'فرد')!==f.custType) return false;
    if(f.status && paymentStatus(inv)!==f.status) return false;
    if(f.dateFrom && new Date(inv.date) < new Date(f.dateFrom)) return false;
    if(f.dateTo && new Date(inv.date) > new Date(new Date(f.dateTo).getTime()+86399999)) return false;
    if(f.search){
      const t = f.search.trim().toLowerCase();
      const hay = [cust&&cust.name, cust&&cust.phone].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(t)) return false;
    }
    return true;
  });
  if(list.length===0) return `<tr><td colspan="9" class="empty">لا توجد فواتير مطابقة</td></tr>`;

    return `<tr><td>#${inv.invNo}</td><td>${cust?cust.name:'—'}</td><td>${(cust&&cust.custType)||'فرد'}</td>

  }).join('');
}

/* ======================= FINANCE (الخزنة والحسابات المالية — الملاحظة 17) ======================= */
function accBalance(accId){
  const acc = DB.finAccounts.find(a=>a.id===accId);
  if(!acc) return 0;
  let b = acc.openingBalance||0;
  DB.finMoves.forEach(m=>{
    if(m.accountId!==accId) return;
    b += m.type==='in' ? m.amount : -m.amount;
  });
  return b;
}
function addFinMove(accountId, type, amount, kind, note, extra){
  const m = Object.assign({id:uid('fm'), accountId, type, amount, kind, note, actor:actorName(), date:new Date().toISOString()}, extra||{});
  DB.finMoves.push(m);
  return m;
}
function accountForMethod(methodName){
  // مطابقة وسيلة الدفع بالحساب المناسب تلقائياً
  const byName = DB.finAccounts.find(a=>methodName && methodName.includes(a.name));
  if(byName) return byName;
  if(/كاش/.test(methodName||'') && !/فودافون/.test(methodName||'')) return DB.finAccounts.find(a=>a.kind==='خزنة') || DB.finAccounts[0];
  if(/بنك|تحويل|فيزا|POS|بطاقة/.test(methodName||'')) return DB.finAccounts.find(a=>a.kind==='بنك') || DB.finAccounts[0];
  if(/فودافون/.test(methodName||'')) return DB.finAccounts.find(a=>a.name.includes('فودافون')) || DB.finAccounts[0];

async function saveFinTransfer(){
  if(!can('fin.manage')){ toast('مالكش صلاحية إدارة الخزنة والتحويلات', true); return; }
  const fromId = document.getElementById('tfFrom').value;
  const toId = document.getElementById('tfTo').value;
  const amount = parseFloat(document.getElementById('tfAmount').value)||0;
  const note = document.getElementById('tfNote').value.trim();
  if(fromId===toId){ toast('اختار حسابين مختلفين', true); return; }
  if(amount<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const from = DB.finAccounts.find(a=>a.id===fromId), to = DB.finAccounts.find(a=>a.id===toId);
  if(amount > accBalance(fromId) + 0.001){ toast('المبلغ أكبر من رصيد '+from.name+' ('+money(accBalance(fromId))+')', true); return; }
  const n = 'تحويل: '+from.name+' ← '+to.name+(note?' — '+note:'');
  addFinMove(fromId, 'out', amount, 'transfer', n);
  addFinMove(toId, 'in', amount, 'transfer', n);
  await saveKey('finMoves', DB.finMoves);
  await logAction('تحويل '+money(amount)+' من '+from.name+' إلى '+to.name+(note?' — '+note:''));
  closeModal(); toast('تم التحويل'); refreshContent();
}

function readImageResized(file){
  return new Promise((resolve,reject)=>{
    if(file.size > 5*1024*1024){ toast('الصورة كبيرة جداً (أكثر من 5 ميجا) — استخدم صورة أصغر', true); return reject(new Error('too big')); }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>resolve(reader.result);
      img.onload = ()=>{
        try{
          const max = 1000; let w = img.width, h = img.height;
          if(w>max){ h = Math.round(h*max/w); w = max; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',0.7));
        }catch(err){ resolve(reader.result); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  if(!can('fin.expenses')){ toast('مالكش صلاحية تسجيل المصروفات', true); return; }
  const catId = (document.getElementById('expCatSel')||{}).value;
  const cat = DB.expenseCategories.find(c=>c.id===catId);
  const amount = parseFloat(document.getElementById('expAmt').value)||0;
  const description = (document.getElementById('expDesc')||{}).value.trim();
  const notes = (document.getElementById('expNotes')||{}).value.trim();
  const dateVal = (document.getElementById('expDate')||{}).value;
  const accId = (document.getElementById('expAcc')||{}).value;
  if(!cat){ toast('اختر نوع المصروف', true); return; }
  if(amount<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const acc = DB.finAccounts.find(a=>a.id===accId);
  let receipt = '';
  const fileEl = document.getElementById('expReceipt');
  if(fileEl && fileEl.files && fileEl.files[0]){
    try{ receipt = await readImageResized(fileEl.files[0]); }catch(err){ if(err && err.message==='too big') return; }
  }
  const date = dateVal ? new Date(dateVal+'T'+new Date().toTimeString().slice(0,8)).toISOString() : new Date().toISOString();
  DB.expenses.push({

  await Promise.all([saveKey('expenses'), saveKey('finMoves')]);

  if(amount >= (DB.settings.largeExpenseThreshold||20000)){

function renderExpenseReport(){

  const operational = total - investment;
  const thisM = DB.expenses.filter(e=>inPeriod(e.date, periodRange({preset:'this_month'}))).reduce((s,e)=>s+(e.amount||0),0);
  const lastM = DB.expenses.filter(e=>inPeriod(e.date, periodRange({preset:'last_month'}))).reduce((s,e)=>s+(e.amount||0),0);

      <table><thead><tr><th>البند</th><th>المبلغ</th><th>النسبة</th></tr></thead><tbody>

      </tbody></table>
    </div>`;
  return `

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      ${PERIOD_PRESETS.map(([id,lbl])=>`<button class="btn btn-sm ${expensePeriod.preset===id?'btn-accent':''}" onclick="setExpPreset('${id}')">${lbl}</button>`).join('')}

      <input class="f" type="date" value="${expensePeriod.to}" onchange="expensePeriod.to=this.value;expensePeriod.preset='custom';refreshContent()">
    </div>
  </div>
  <div class="grid g4" style="margin-bottom:20px">
    ${stat(money(total),'إجمالي المصروفات — '+periodLbl, total>0)}
    ${stat(money(operational),'مصروفات تشغيلية')}
    ${stat(money(investment),'مصروفات استثمارية (أصول)')}
    ${stat(cats.length?cats[0][0]:'—','أعلى بند مصروف')}
  </div>
  <div class="grid g2" style="margin-bottom:22px">
    ${stat(money(thisM),'مصروفات هذا الشهر')}
    ${stat((diff>=0?'▲ +':'▼ ')+money(Math.abs(diff)),'الفرق عن الشهر الماضي ('+money(lastM)+')', diff>0)}
  </div>
  ${tableCard('توزيع المصروفات حسب النوع', cats)}

async function saveCustody(){
  if(!can('fin.custody_create')){ toast('مالكش صلاحية إصدار عهد', true); return; }
  const amount = parseFloat((document.getElementById('cuAmount')||{}).value)||0;
  const empId = (document.getElementById('cuEmp')||{}).value;
  const purpose = ((document.getElementById('cuPurpose')||{}).value||'').trim();
  const sourceId = (document.getElementById('cuSource')||{}).value;
  const notes = ((document.getElementById('cuNotes')||{}).value||'').trim();
  const emp = DB.employees.find(e=>e.id===empId);
  const src = DB.finAccounts.find(a=>a.id===sourceId);
  if(amount<=0){ toast('اكتب قيمة صحيحة', true); return; }
  if(!emp){ toast('اختار الموظف', true); return; }
  if(!src){ toast('اختار مصدر الصرف', true); return; }
  // عهدة مفتوحة واحدة لكل موظف
  const existing = empOpenCustody(empId);
  if(existing){ toast('الموظف '+emp.name+' عنده عهدة مفتوحة بقيمة '+money(existing.amount)+' — لازم تتسوّى الأول قبل عهدة جديدة', true); return; }
  const c = {
    id: uid('cus'), custodyNo: nextNo(DB.custodies,'custodyNo'),
    amount, employeeId: empId, employeeName: emp.name, purpose,
    sourceAccountId: sourceId, sourceName: src.name, notes,
    status: 'open', settlement: null, createdAt: new Date().toISOString(), actor: actorName()
  };
  DB.custodies.push(c);

function addCustodyLine(custodyId){
  const catId = (document.getElementById('clCat')||{}).value;
  const amt = parseFloat((document.getElementById('clAmt')||{}).value)||0;
  const desc = ((document.getElementById('clDesc')||{}).value||'').trim();
  const cat = DB.expenseCategories.find(c=>c.id===catId);
  if(!cat){ toast('اختار نوع المصروف', true); return; }
  if(amt<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const c = DB.custodies.find(x=>x.id===custodyId);
  const spent = _custodyLines.reduce((s,l)=>s+l.amount,0);
  if(spent+amt > c.amount + 0.005){ toast('إجمالي البنود بيتعدّى قيمة العهدة ('+money(c.amount)+')', true); return; }
  _custodyLines.push({ categoryId:cat.id, catName:cat.name, group:cat.group, amount:amt, description:desc });

}

async function saveSettleCustody(custodyId){
  if(!can('fin.custody_settle')){ toast('مالكش صلاحية تسوية العهد', true); return; }
  const c = DB.custodies.find(x=>x.id===custodyId);
  if(!c || c.status!=='open'){ toast('العهدة مش مفتوحة', true); return; }
  const spent = _custodyLines.reduce((s,l)=>s+l.amount,0);
  const remaining = Math.round((c.amount - spent)*100)/100;
  // لو فيه فلوس باقية لازم المستخدم يختار الحساب اللي هترجع له بإيده (مش شرط مصدر الصرف)
  let returnAccId = null, returnAccName = null;
  if(remaining>0.5){
    returnAccId = (document.getElementById('clReturnAcc')||{}).value;
    if(!returnAccId){ toast('اختار الحساب اللي المتبقي ('+money(remaining)+') هيرجع له', true); return; }
    const raChk = DB.finAccounts.find(a=>a.id===returnAccId);
    if(!raChk){ toast('الحساب اللي اخترته مش موجود', true); return; }
  }
  const emp = DB.employees.find(e=>e.id===c.employeeId);
  // 1) حوّل كل بند لمصروف حقيقي (بدون خصم من حساب — الفلوس خرجت وقت إصدار العهدة)
  const createdExpenses = [];
  _custodyLines.forEach(l=>{
    const exp = { id:uid('exp'), expNo: nextNo(DB.expenses,'expNo'),
      category:l.catName, categoryId:l.categoryId, group:l.group,
      description:l.description, note:l.description, amount:l.amount,
      accountId:null, payAccount:'عهدة #'+c.custodyNo, fromCustody:c.id,
      actor:actorName(), date:new Date().toISOString() };
    DB.expenses.push(exp); createdExpenses.push(exp);
  });
  // 2) رجوع المتبقي للحساب اللي المستخدم اختاره (اتأكدنا منه فوق)
  if(remaining>0.5){
    const ra = DB.finAccounts.find(a=>a.id===returnAccId);
    if(ra){ addFinMove(returnAccId, 'in', remaining, 'custody_return', 'استرجاع باقي عهدة #'+c.custodyNo+' — '+custodyEmpName(c)); returnAccName = ra.name; }
  }
  // 3) اقفل العهدة
  const notes = ((document.getElementById('clNotes')||{}).value||'').trim();
  c.status = 'closed';
  c.settlement = { lines: JSON.parse(JSON.stringify(_custodyLines)), totalExpenses: spent, remaining, returnedAccId:returnAccId, returnedAccName:returnAccName, notes, at:new Date().toISOString(), by:actorName() };
  c.closedAt = new Date().toISOString();
  const saves = [saveKey('custodies'), saveKey('expenses')];
  if(remaining>0.5) saves.push(saveKey('finMoves'));
  await Promise.all(saves);
  await logAction('تسوية عهدة #'+c.custodyNo+' — '+custodyEmpName(c)+': مصروفات '+money(spent)+(remaining>0.5?' + استرجاع '+money(remaining)+' لـ '+(returnAccName||'—'):'')+' ('+_custodyLines.length+' بند)');
  pushNotif({ category:'financial', type:'custody_settle', priority:'medium', amount:spent,
    action:'تسوية عهدة #'+c.custodyNo+' — '+custodyEmpName(c)+' (مصروفات '+money(spent)+(remaining>0.5?' + مرتجع '+money(remaining):'')+')', refType:'expense' });
  _custodyLines = [];
  closeModal(); toast('تمت تسوية العهدة وإقفالها'+(spent>0?' — اتسجّل '+money(spent)+' مصروفات':'')); refreshContent();
}

let techPeriod = { preset:'this_month', from:'', to:'' };
function setTechPreset(p){ techPeriod.preset = p; refreshContent(); }
/* كل الفنيين اللي ليهم شغل (بالمفتاح الثابت) + الفنيين النشطين في الموارد البشرية */
function allTechKeys(){
  const s = new Set();
  DB.jobs.forEach(j=>j.items.forEach(it=>{
    if(it.kind==='service'){ const k = techKeyOf(it, j); if(k && k!=='غير محدد') s.add(k); }
  }));
  techEmployees().forEach(e=>s.add(e.id));
  return [...s].sort((a,b)=>techLabelOf(a).localeCompare(techLabelOf(b),'ar'));
}
function computeTechPerf(range){
  const techMap = {};
  const ensure = (t)=>{ if(!techMap[t]) techMap[t] = {servicesCount:0, laborValue:0, laborCollected:0, incentiveBase:0, rework:0, jobs:new Set(), days:new Set()}; return techMap[t]; };
  const excl = DB.settings.incentiveExclusions||[];
  // الاستبعاد بيقارن بالمفتاح والاسم — عشان الاستبعادات القديمة (المخزنة بالاسم) تفضل شغالة
  const isExcluded = (techKey, dStr)=>{
    const label = techLabelOf(techKey);
    const d = new Date(dStr);
    return excl.some(x=>(x.tech===techKey || x.tech===label) && d>=new Date(x.from) && d<=new Date(x.to+'T23:59:59'));
  };
  DB.jobs.forEach(j=>{
    if(j.status==='ملغاة') return;
    const inv = DB.invoices.find(i=>i.jobId===j.id && !i.cancelled);
    let collectRatio = 0;
    if(inv){
      const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
      collectRatio = inv.total>0 ? Math.min(paid/inv.total,1) : 0;
    }
    j.items.filter(it=>it.kind==='service').forEach(it=>{
      // الخدمات الجديدة ليها تاريخها الخاص؛ القديمة بتتبع تاريخ أمر الشغل
      const dStr = it.date || j.deliveredAt || j.receivedAt;
      if(!inPeriod(dStr, range)) return;
      const tech = techKeyOf(it, j);
      const d = ensure(tech);
      d.servicesCount++;
      const val = it.qty*it.unitPrice;
      d.laborValue += val;
      d.laborCollected += val*collectRatio;
      if(!isExcluded(tech, dStr)) d.incentiveBase += val*collectRatio;
      if(it.rework) d.rework++;
      d.days.add(new Date(dStr).toDateString());
      d.jobs.add(j.id);
    });
  });
  return techMap;
}

function empLeaveStats(empId){
  const emp = DB.employees.find(e=>e.id===empId);
  const approved = DB.leaveRequests.filter(r=>r.employeeId===empId && r.status==='approved');
  const usedRoutine = approved.filter(r=>r.type==='دورية').reduce((s,r)=>s+(r.days||0),0);
  const usedEmergency = approved.filter(r=>r.type==='طارئة').reduce((s,r)=>s+(r.days||0),0);
  const usedOther = approved.filter(r=>r.type!=='دورية' && r.type!=='طارئة').reduce((s,r)=>s+(r.days||0),0);
  const rejections = DB.leaveRequests.filter(r=>r.employeeId===empId && r.status==='rejected').length;
  const absences = (emp && emp.absences) ? emp.absences : [];
  const absenceDays = absences.reduce((s,a)=>s+(a.days||1),0);
  const absenceNoPermission = absences.filter(a=>a.noPermission).reduce((s,a)=>s+(a.days||1),0);
  const balRoutine = emp ? (emp.leaveRoutine||0) : 0;
  const balEmergency = emp ? (emp.leaveEmergency||0) : 0;
  return {
    balRoutine, balEmergency, total: balRoutine+balEmergency,
    usedRoutine, usedEmergency, usedOther, used: usedRoutine+usedEmergency,
    remRoutine: balRoutine-usedRoutine, remEmergency: balEmergency-usedEmergency,
    remaining: (balRoutine-usedRoutine)+(balEmergency-usedEmergency),
    rejections, absenceTimes: absences.length, absenceDays, absenceNoPermission
  };
}

/* ============ الملاحظة 68: نظام الحضور والانصراف واستيراد البصمة ============
   المبدأ: جهاز البصمة مصدر بصمات خام فقط (Raw Punches). كل المعالجة والقواعد

   لو الشغل عدّى نص الليل، ومابيعتبرش 12:00AM حد بين دخول وخروج. */
function attRules(){

    dedupWindowMins:  s.dedupWindowMins  != null ? s.dedupWindowMins  : 3,   // بصمتين خلالها = تكرار
    minSessionMins:   s.minSessionMins   != null ? s.minSessionMins   : 5,

const ATT_STATUS_LABEL = { ok:'مكتمل', review:'يحتاج مراجعة', unmatched:'موظف غير معروف', manual:'مُصحّح يدوياً' };
/* ---------- تحليل التاريخ والوقت (يدعم صيغ كتير) ---------- */
function attParseDate(str, fmt){
  str = String(str||'').trim(); if(!str) return null;
  let m = str.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);          // ISO yyyy-mm-dd
  if(m) return { y:+m[1], mo:+m[2], d:+m[3] };
  m = str.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);            // dd/mm/yyyy أو mm/dd/yyyy
  if(m){ let a=+m[1], b=+m[2], y=+m[3]; if(y<100) y+=2000;
    return (fmt==='mdy') ? { y, mo:a, d:b } : { y, mo:b, d:a }; }   // الافتراضي يوم/شهر (مصر)
  return null;
}
function attParseTime(str){
  str = String(str||'').trim(); if(!str) return null;
  const ampm = /p\.?\s*m/i.test(str) ? 'pm' : (/a\.?\s*m/i.test(str) ? 'am' : null);
  const m = str.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/); if(!m) return null;
  let h=+m[1]; const mi=+m[2], se=+(m[3]||0);
  if(ampm==='pm' && h<12) h+=12;
  if(ampm==='am' && h===12) h=0;
  return { h, mi, se };
}
function attToTs(dateStr, timeStr, fmt){
  const d = attParseDate(dateStr, fmt); if(!d) return null;
  const t = attParseTime(timeStr) || attParseTime(dateStr) || { h:0, mi:0, se:0 };
  const dt = new Date(d.y, d.mo-1, d.d, t.h, t.mi, t.se||0);
  return isNaN(dt.getTime()) ? null : dt.getTime();
}
function attDateStr(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function attTimeStr(ts){ if(ts==null) return '—'; const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtMins(m){ if(m==null||isNaN(m)) return '—'; m=Math.max(0,Math.round(m)); const h=Math.floor(m/60), mm=m%60; return (h?h+'س ':'')+(mm||!h?mm+'د':''); }
/* ---------- تحليل ملف CSV/TSV (بدون أي مكتبات) ---------- */
function attParseDelimited(text){
  text = String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/﻿/g,'').trim();
  if(!text) return [];
  const first = text.split('\n')[0];
  const delim = first.indexOf('\t')>=0 ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = [];
  text.split('\n').forEach(line=>{
    if(!line.trim()) return;
    const cells=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(inQ){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
      else { if(ch==='"') inQ=true; else if(ch===delim){ cells.push(cur); cur=''; } else cur+=ch; } }
    cells.push(cur);
    rows.push(cells.map(c=>String(c).trim()));
  });
  return rows;
}
/* ---------- المحرك السياقي: تجميع البصمات في جلسات ---------- */
/* punches: [{ts, punchId}] لموظف واحد. بيرجّع جلسات + بصمات مكررة اتشالت. */
function attBuildSessions(punches, rules){
  const R = rules || attRules();
  const sorted = punches.slice().filter(p=>p.ts!=null).sort((a,b)=>a.ts-b.ts);
  const kept=[], dupIds=[];
  sorted.forEach(p=>{
    if(kept.length && (p.ts - kept[kept.length-1].ts) < R.dedupWindowMins*60000) dupIds.push(p.punchId);
    else kept.push(p);
  });
  const sessions=[]; let i=0;
  while(i < kept.length){
    const inP = kept[i];
    if(i+1 >= kept.length){
      sessions.push({ inTs:inP.ts, outTs:null, punchIds:[inP.punchId], status:'review', reason:'دخول بدون خروج' });
      break;
    }
    const outP = kept[i+1];
    const durMs = outP.ts - inP.ts;
    if(durMs > R.maxSessionHours*3600000){
      // الخروج بعيد جداً — دخول ناقص خروجه، والبصمة اللي بعده بداية جلسة جديدة
      sessions.push({ inTs:inP.ts, outTs:null, punchIds:[inP.punchId], status:'review', reason:'دخول بدون خروج (فرق غير منطقي مع البصمة التالية)' });
      i += 1; continue;
    }
    // زوج صحيح — ممكن يعدّي نص الليل (تاريخ الحضور = تاريخ الدخول)
    const short = durMs < R.minSessionMins*60000;
    sessions.push({ inTs:inP.ts, outTs:outP.ts, punchIds:[inP.punchId, outP.punchId],
      status: short ? 'review' : 'ok', reason: short ? 'مدة عمل قصيرة غير طبيعية' : '' });
    i += 2;
  }
  return { sessions, dupIds };
}
/* ---------- حساب الساعات (مرن أو ثابت) ---------- */
function attComputeHours(sess, emp, rules){
  const R = rules || attRules();
  if(sess.outTs == null) return { workedMins:0, regularMins:0, otMins:0, lateMins:0 };
  const workedMins = Math.round((sess.outTs - sess.inTs)/60000);
  const mode = (emp && emp.attMode) === 'fixed' ? 'fixed' : 'flexible';
  let regularMins = workedMins, otMins = 0, lateMins = 0;
  if(mode==='fixed' && emp && emp.shiftStart && emp.shiftEnd){
    const inD = new Date(sess.inTs);
    const [sh,sm] = String(emp.shiftStart).split(':').map(Number);
    const [eh,em] = String(emp.shiftEnd).split(':').map(Number);
    const startTs = new Date(inD.getFullYear(),inD.getMonth(),inD.getDate(),sh||0,sm||0).getTime();
    let endTs = new Date(inD.getFullYear(),inD.getMonth(),inD.getDate(),eh||0,em||0).getTime();
    if(endTs <= startTs) endTs += 24*3600000;   // شيفت بيعدّي نص الليل
    const grace = (emp.graceMin!=null ? emp.graceMin : R.defaultGraceMin) * 60000;
    lateMins = Math.max(0, Math.round((sess.inTs - (startTs+grace))/60000));
    otMins   = R.otEnabled ? Math.max(0, Math.round((sess.outTs - endTs)/60000)) : 0;
    regularMins = Math.max(0, workedMins - otMins);
  } else {
    // مرن: الإضافي بعد عتبة الساعات المعتمدة
    if(R.otEnabled && workedMins > R.otThresholdHours*60){
      otMins = workedMins - R.otThresholdHours*60;
      regularMins = R.otThresholdHours*60;
    }
  }
  return { workedMins, regularMins, otMins, lateMins };
}
/* ---------- التخزين والمعالجة (فصل البصمة الخام عن النتيجة المعالَجة) ---------- */
function resolveEmpByFp(fpId){
  const f = String(fpId==null?'':fpId).trim(); if(!f) return null;
  return DB.employees.find(e=> String(e.fpId||'').trim()===f && e.status!=='مستقيل') || null;
}
function punchHash(fpId, ts){ return String(fpId==null?'':fpId).trim()+'|'+ts; }
function attSessionsFor(empId){ return DB.attendance.filter(r=>r.kind==='session' && r.empId===empId); }
/* إعادة معالجة بصمات موظف → توليد جلسات (بيحافظ على الجلسات المُصححة يدوياً) */
function attReprocessEmployee(empId){
  const rules = attRules();
  const emp = DB.employees.find(e=>e.id===empId);
  const punches = DB.attendance.filter(r=>r.kind==='punch' && r.empId===empId).map(r=>({ ts:r.ts, punchId:r.id }));
  const manualKeys = new Set(DB.attendance.filter(s=>s.kind==='session' && s.empId===empId && s.manual).map(s=>s.dateStr));
  // شيل الجلسات التلقائية القديمة (المُصححة يدوياً بتفضل)
  DB.attendance = DB.attendance.filter(r=>!(r.kind==='session' && r.empId===empId && !r.manual));
  DB.attendance.forEach(r=>{ if(r.kind==='punch' && r.empId===empId) r.dup=false; });
  const { sessions, dupIds } = attBuildSessions(punches, rules);
  if(dupIds.length){ const ds=new Set(dupIds); DB.attendance.forEach(r=>{ if(r.kind==='punch' && ds.has(r.id)) r.dup=true; }); }
  sessions.forEach(s=>{
    const dateStr = attDateStr(s.inTs);
    if(manualKeys.has(dateStr)) return;
    const hrs = attComputeHours(s, emp, rules);
    DB.attendance.push({ id:uid('att'), kind:'session', empId, dateStr, inTs:s.inTs, outTs:s.outTs,
      mode:(emp&&emp.attMode)==='fixed'?'fixed':'flexible',
      workedMins:hrs.workedMins, regularMins:hrs.regularMins, otMins:hrs.otMins, lateMins:hrs.lateMins,
      status:s.status, reason:s.reason, punchIds:s.punchIds, corrections:[], manual:false,
      processedAt:new Date().toISOString() });
  });
}
function attReprocessAll(){
  [...new Set(DB.attendance.filter(r=>r.kind==='punch' && r.empId).map(r=>r.empId))].forEach(attReprocessEmployee);
}
/* ---------- منطق الاستيراد ---------- */
let attImportDraft = null;   // { fileName, headers, rows, mapping:{empId,empName,date,time,dateFmt} }
const ATT_MAP_FIELDS = [['empId','رقم الموظف (البصمة) *'],['empName','اسم الموظف (اختياري)'],['date','التاريخ *'],['time','الوقت *']];
function attGuessMapping(headers){
  const norm = s => String(s||'').toLowerCase().replace(/\s|_/g,'');
  const find = keys => { for(let i=0;i<headers.length;i++){ const h=norm(headers[i]); if(keys.some(k=>h.includes(k))) return i; } return -1; };
  return {
    empId: find(['empid','employeeid','userid','acno','رقمالموظف','كودالموظف','رقمالبصمة','id']),
    empName: find(['name','اسم','employeename']),
    date: find(['date','تاريخ','يوم']),
    time: find(['time','وقت','ساعة','clock','punch']),
    dateFmt: 'dmy'
  };
}
function attStartImportFromText(text, fileName){
  const rows = attParseDelimited(text);
  if(rows.length < 2){ toast('الملف فاضي أو مفيهوش بيانات كفاية', true); return; }
  // أول صف يبان إنه عناوين لو مافيهوش أرقام كتير
  const headers = rows[0];
  const body = rows.slice(1).filter(r=>r.some(c=>c!==''));
  attImportDraft = { fileName: fileName||'لصق يدوي', headers, rows: body,
    mapping: (DB.settings && DB.settings.attMapping && DB.settings.attMapping.headersSig===headers.join('|'))
      ? Object.assign({}, DB.settings.attMapping) : attGuessMapping(headers) };
  refreshContent();
}
function attMapVal(row, idx){ return (idx!=null && idx>=0 && idx<row.length) ? row[idx] : ''; }
function attPreviewRow(row, mp){
  const fpId = attMapVal(row, mp.empId);
  const dateS = attMapVal(row, mp.date);
  const timeS = attMapVal(row, mp.time);
  const ts = attToTs(dateS, timeS, mp.dateFmt);
  const emp = resolveEmpByFp(fpId);
  let problem = '';
  if(!fpId) problem = 'رقم موظف فاضي';
  else if(ts==null) problem = 'تاريخ/وقت غير مقروء';
  else if(!emp) problem = 'موظف غير معروف';
  return { fpId, ts, emp, dateS, timeS, name: attMapVal(row, mp.empName), problem };
}
async function attCommitImport(){
  if(!(can('hr.attendance'))){ toast('مالكش صلاحية استيراد الحضور', true); return; }
  const d = attImportDraft; if(!d){ return; }
  const mp = d.mapping;
  if(mp.empId==null||mp.empId<0 || mp.date==null||mp.date<0 || mp.time==null||mp.time<0){
    toast('لازم تحدد أعمدة: رقم الموظف والتاريخ والوقت', true); return;
  }
  const existingHashes = new Set(DB.attendance.filter(r=>r.kind==='punch').map(r=>r.hash));
  const importId = uid('imp');
  const now = new Date().toISOString();
  let accepted=0, dup=0, bad=0, unmatched=0; const seenThis=new Set(); const touchedEmps=new Set(); const unmatchedFps=new Set();
  d.rows.forEach(row=>{
    const pr = attPreviewRow(row, mp);
    if(!pr.fpId || pr.ts==null){ bad++; return; }
    const hash = punchHash(pr.fpId, pr.ts);
    if(existingHashes.has(hash) || seenThis.has(hash)){ dup++; return; }
    seenThis.add(hash);
    const empId = pr.emp ? pr.emp.id : null;
    if(!empId){ unmatched++; unmatchedFps.add(String(pr.fpId).trim()); }
    DB.attendance.push({ id:uid('pnc'), kind:'punch', importId, fpId:String(pr.fpId).trim(),
      empId, ts:pr.ts, hash, raw:{ date:pr.dateS, time:pr.timeS, name:pr.name }, dup:false, at:now });
    accepted++;
    if(empId) touchedEmps.add(empId);
  });
  touchedEmps.forEach(attReprocessEmployee);
  const reviewCount = DB.attendance.filter(r=>r.kind==='session' && touchedEmps.has(r.empId) && r.status==='review').length;
  DB.attendance.push({ id:importId, kind:'import', fileName:d.fileName, at:now, by:actorName(),
    total:d.rows.length, accepted, review:reviewCount, unmatched, dup, unmatchedFps:[...unmatchedFps],
    status: (bad||unmatched||dup)?'مكتمل بملاحظات':'مكتمل' });
  // حفظ الـmapping للمرة الجاية
  DB.settings.attMapping = Object.assign({}, mp, { headersSig:d.headers.join('|') });
  await Promise.all([saveKey('attendance'), saveKey('settings', DB.settings)]);
  await logAction('استيراد بصمة: '+d.fileName+' — '+accepted+' بصمة مقبولة · '+dup+' مكرر · '+unmatched+' غير معروف');
  notify('att_import', 'استيراد حضور: '+d.fileName+' — '+accepted+' بصمة'+(unmatched?' · '+unmatched+' موظف غير معروف':''),
    { category:'system' });
  attImportDraft = null;
  toast('تم الاستيراد: '+accepted+' بصمة'+(dup?' ('+dup+' مكرر اتجاهل)':''));
  refreshContent();
}

function attReadFile(input){
  const file = input.files && input.files[0]; if(!file) return;

  rd.onerror = () => toast('تعذّر قراءة الملف', true);
  rd.readAsText(file, 'utf-8');
}

async function saveAttCorrect(sessionId){
  if(!can('hr.att_edit')){ toast('مالكش صلاحية تعديل الحضور', true); return; }
  const s = DB.attendance.find(r=>r.id===sessionId); if(!s) return;
  const reason = ((document.getElementById('acReason')||{}).value||'').trim();
  if(!reason){ toast('اكتب سبب التعديل', true); return; }
  const emp = DB.employees.find(e=>e.id===s.empId);
  const base = new Date(s.inTs); const mkTs = (hhmm, nextDay)=>{ if(!hhmm) return null;
    const [h,m]=hhmm.split(':').map(Number); const dt=new Date(base.getFullYear(),base.getMonth(),base.getDate(),h,m);
    if(nextDay) dt.setDate(dt.getDate()+1); return dt.getTime(); };
  const newIn = mkTs((document.getElementById('acIn')||{}).value, false);
  const newOut = mkTs((document.getElementById('acOut')||{}).value, (document.getElementById('acNextDay')||{}).checked);
  const newStatus = (document.getElementById('acStatus')||{}).value;
  const changes = [];
  if(newIn!=null && newIn!==s.inTs){ changes.push(['الدخول', attTimeStr(s.inTs), attTimeStr(newIn)]); s.inTs=newIn; }
  if(newOut!==s.outTs){ changes.push(['الخروج', s.outTs?attTimeStr(s.outTs):'—', newOut?attTimeStr(newOut):'—']); s.outTs=newOut; }
  if(newStatus!==(s.status==='review'?'review':'ok')){ changes.push(['الحالة', ATT_STATUS_LABEL[s.status]||s.status, ATT_STATUS_LABEL[newStatus]]); }
  // إعادة حساب الساعات بعد التعديل
  const hrs = attComputeHours({ inTs:s.inTs, outTs:s.outTs }, emp, attRules());
  s.workedMins=hrs.workedMins; s.regularMins=hrs.regularMins; s.otMins=hrs.otMins; s.lateMins=hrs.lateMins;
  s.status = newStatus; s.manual = true;
  s.corrections = s.corrections || [];
  s.corrections.push({ by:actorName(), at:new Date().toISOString(), reason, changes });
  await saveKey('attendance');
  await logAction('تصحيح حضور '+(emp?emp.name:'')+' يوم '+s.dateStr+auditDetails([
    ...changes.map(c=>[c[0], c[1]+' ← '+c[2]]), ['السبب', reason] ]));
  notify('att_edit', 'تصحيح حضور '+(emp?emp.name:'')+' ('+s.dateStr+') — '+changes.map(c=>c[0]).join('، ')+' — '+reason,
    { category:'system' });
  closeModal(); toast('تم حفظ التصحيح'); refreshContent();
}

    ${employeeFormHTML()}
    <button class="btn btn-accent" style="width:100%" onclick="saveNewEmployee()">حفظ ملف الموظف</button>`);
}
async function saveNewEmployee(){
  if(!(can('hr.employees'))){ toast('مالكش صلاحية إدارة ملفات الموظفين', true); return; }   /* حارس م65 */
  const f = readEmployeeForm();
  if(!f.name){ toast('اكتب اسم الموظف', true); return; }
  if(DB.employees.some(e=>e.name===f.name && e.status!=='مستقيل')){ toast('فيه موظف بنفس الاسم موجود بالفعل', true); return; }
  DB.employees.push({ id:uid('emp'), empNo: nextNo(DB.employees,'empNo'), ...f, absences:[], createdAt:new Date().toISOString() });
  await saveKey('employees');
  await logAction('إضافة موظف جديد: '+f.name+' ('+(f.job||'—')+')');
  closeModal(); toast('تم حفظ ملف الموظف'); refreshContent();
}
function openEditEmployeeModal(id){
  const e = DB.employees.find(x=>x.id===id);
  if(!e) return;
  openModal(`<h3>تعديل ملف: ${e.name} <span class="muted" style="font-size:12px">#${e.empNo}</span></h3>
    ${employeeFormHTML(e)}
    <button class="btn btn-accent" style="width:100%" onclick="saveEmployeeEdit('${id}')">حفظ التعديلات</button>`);
}
async function saveEmployeeEdit(id){
  if(!(can('hr.employees'))){ toast('مالكش صلاحية إدارة ملفات الموظفين', true); return; }   /* حارس م65 */
  const e = DB.employees.find(x=>x.id===id);
  if(!e) return;
  const f = readEmployeeForm();
  if(!f.name){ toast('اكتب اسم الموظف', true); return; }
  Object.assign(e, f);
  await saveKey('employees');
  await logAction('تعديل ملف الموظف: '+e.name);
  closeModal(); toast('تم حفظ التعديلات'); refreshContent();
}

let empDetailPeriod = { emp:null, from:'', to:'' };
function setEmpDetailPeriod(empId, k, v){
  if(empDetailPeriod.emp!==empId) empDetailPeriod = { emp:empId, from:'', to:'' };
  if(k==='clear'){ empDetailPeriod.from=''; empDetailPeriod.to=''; }
  else empDetailPeriod[k] = v;
  openEmployeeDetail(empId);
}

function openAbsenceModal(empId){
  const e = DB.employees.find(x=>x.id===empId);
  if(!e) return;
  openModal(`
    <h3>تسجيل غياب — ${e.name}</h3>
    <div class="grid g2">
      <div class="form-row"><label class="f-label">تاريخ الغياب</label><input class="f" id="abDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-row"><label class="f-label">عدد الأيام (ينفع جزء من يوم: 0.5)</label><input class="f" id="abDays" type="number" min="0.25" step="0.25" value="1"></div>
    </div>
    <div class="form-row"><label class="f-label">نوع الغياب</label>
      <select class="f" id="abPerm"><option value="no">بدون إذن</option><option value="yes">بإذن</option></select></div>
    <div class="form-row"><label class="f-label">ملاحظة (اختياري)</label><input class="f" id="abNote"></div>
    <button class="btn btn-danger" style="width:100%" onclick="saveAbsence('${empId}')">تسجيل الغياب</button>
  `);
}
async function saveAbsence(empId){
  if(!(can('hr.penalties'))){ toast('مالكش صلاحية تسجيل الغياب والخصومات', true); return; }   /* حارس م65 */
  const e = DB.employees.find(x=>x.id===empId);
  if(!e) return;
  const date = (document.getElementById('abDate')||{}).value;
  const days = parseFloat(document.getElementById('abDays').value)||1;
  const noPermission = (document.getElementById('abPerm')||{}).value !== 'yes';
  const note = (document.getElementById('abNote')||{}).value.trim();
  if(!date){ toast('اختر تاريخ الغياب', true); return; }
  if(!e.absences) e.absences = [];
  e.absences.push({ id:uid('abs'), date, days, noPermission, note, recordedBy:actorName(), createdAt:new Date().toISOString() });
  await saveKey('employees');
  await logAction('تسجيل غياب '+days+' يوم '+(noPermission?'بدون إذن':'بإذن')+' — '+e.name);
  closeModal(); toast('تم تسجيل الغياب'); openEmployeeDetail(empId);
}
/* ---- فلاتر شاشات الإجازات والأذونات والمأموريات (الملاحظة 24) ---- */
let hrFilter = { emp:'', preset:'all', from:'', to:'' };
function setHrFilterEmp(v){ hrFilter.emp = v; refreshContent(); }
function setHrFilterPreset(p){ hrFilter.preset = p; refreshContent(); }
function hrPeriodRange(){
  const now = new Date();
  const r = periodRange(hrFilter);
  // مدّ نهاية الفترات الجارية لآخرها — عشان الطلبات المستقبلية (إجازة الأسبوع الجاي مثلاً) تظهر
  if(hrFilter.preset==='this_week'){ r.to = new Date(r.from.getTime()+7*86400000-1); }
  else if(hrFilter.preset==='this_month'){ r.to = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59); }
  else if(hrFilter.preset==='this_quarter'){ const q=Math.floor(now.getMonth()/3); r.to = new Date(now.getFullYear(), q*3+3, 0, 23,59,59); }
  else if(hrFilter.preset==='this_year'){ r.to = new Date(now.getFullYear(), 11, 31, 23,59,59); }
  return r;
}
function hrFilterMatch(empId, dateStr){
  if(hrFilter.emp && empId!==hrFilter.emp) return false;
  if(hrFilter.preset==='all') return true;   // بدون فترة = كل التاريخ (حتى المستقبلي)
  return inPeriod(dateStr, hrPeriodRange());
}
function hrFilterBar(){
  const emps = [...DB.employees].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  return `
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      ${PERIOD_PRESETS.map(([id,lbl])=>`<button class="btn btn-sm ${hrFilter.preset===id?'btn-accent':''}" onclick="setHrFilterPreset('${id}')">${lbl}</button>`).join('')}
    </div>
    <div class="grid g3">
      <div class="form-row" style="margin:0"><label class="f-label">الموظف / الفني</label>
        <select class="f" onchange="setHrFilterEmp(this.value)">
          <option value="">— كل الموظفين —</option>
          ${emps.map(e=>`<option value="${e.id}" ${hrFilter.emp===e.id?'selected':''}>${e.name}</option>`).join('')}
        </select></div>
      <div class="form-row" style="margin:0"><label class="f-label">من تاريخ</label>
        <input class="f" type="date" value="${hrFilter.from}" onchange="hrFilter.from=this.value;hrFilter.preset='custom';refreshContent()"></div>
      <div class="form-row" style="margin:0"><label class="f-label">إلى تاريخ</label>
        <input class="f" type="date" value="${hrFilter.to}" onchange="hrFilter.to=this.value;hrFilter.preset='custom';refreshContent()"></div>
    </div>
  </div>`;
}

function renderLeaveRequests(){
  const canDecide = hrCanManage();
  const all = [...DB.leaveRequests].filter(r=>hrFilterMatch(r.employeeId, r.from)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const pending = all.filter(r=>r.status==='pending');
  const decided = all.filter(r=>r.status!=='pending');
  const approvedCount = all.filter(r=>r.status==='approved').length;
  const rejectedCount = all.filter(r=>r.status==='rejected').length;
  const row = (r)=>{
    const emp = DB.employees.find(e=>e.id===r.employeeId);
    return `<tr>
      <td>#${r.reqNo||'—'}</td><td style="font-weight:700">${emp?emp.name:'—'}</td>
      <td>${r.type}</td>
      <td style="white-space:nowrap;font-size:12.5px">${fmtDate(r.from)} → ${fmtDate(r.to)} (${r.days} يوم)</td>
      <td class="muted" style="font-size:12px">${r.reason||'—'}</td>
      <td>${leaveStatusTag(r.status)}${r.status!=='pending' && r.decidedBy?`<div class="muted" style="font-size:10.5px">${r.decidedBy}</div>`:''}</td>

          <button class="btn btn-sm btn-accent" onclick="approveLeave('${r.id}')">قبول</button>
          <button class="btn btn-sm btn-danger" onclick="rejectLeave('${r.id}')">رفض</button>
        </div>` : (r.status==='approved' && r.balanceAfter!==undefined ? `<span class="muted" style="font-size:11px">الرصيد بعدها: ${r.balanceAfter}</span>`:'')}</td>
    </tr>`;
  };
  return `
  ${hrFilterBar()}
  <div class="grid g3" style="margin-bottom:18px">
    ${stat(String(all.length),'عدد طلبات الإجازة')}
    ${stat(String(approvedCount),'المقبول منها')}
    ${stat(String(rejectedCount),'المرفوض منها', rejectedCount>0)}
  </div>
  <div class="section-head"><h3>طلبات الإجازات</h3>
    <button class="btn btn-accent" onclick="openNewLeaveModal()">${ICONS.plus} طلب إجازة جديد</button></div>
  ${DB.employees.length===0?`<div class="muted" style="margin-bottom:12px">⚠️ لسه مفيش موظفين متكودين${canDecide?' — سجّلهم الأول من "ملفات الموظفين"':' — اطلب من الحسابات تسجيلهم الأول'}.</div>`:''}
  <div class="section-head" style="margin-top:4px"><h3 style="font-size:15px">⏳ في انتظار الموافقة (${pending.length})</h3></div>
  <div class="card" style="margin-bottom:18px">
    <table><thead><tr><th>رقم</th><th>الموظف</th><th>النوع</th><th>المدة</th><th>السبب</th><th>الحالة</th><th></th></tr></thead>
    <tbody>${pending.length? pending.map(row).join('') : `<tr><td colspan="7" class="empty">مفيش طلبات منتظرة</td></tr>`}</tbody></table>
  </div>
  <div class="section-head"><h3 style="font-size:15px">📋 السجل (${decided.length})</h3></div>
  <div class="card">
    <table><thead><tr><th>رقم</th><th>الموظف</th><th>النوع</th><th>المدة</th><th>السبب</th><th>الحالة</th><th></th></tr></thead>
    <tbody>${decided.length? decided.map(row).join('') : `<tr><td colspan="7" class="empty">مفيش طلبات سابقة</td></tr>`}</tbody></table>
  </div>`;

    <div class="form-row"><label class="f-label">الموظف</label>

async function saveLeaveRequest(){
  if(!(canScreen('hr'))){ toast('مالكش صلاحية على شاشة الموارد البشرية', true); return; }   /* حارس م65 */
  const empId = (document.getElementById('lvEmp')||{}).value;
  const type = (document.getElementById('lvType')||{}).value;
  const from = (document.getElementById('lvFrom')||{}).value;
  const to = (document.getElementById('lvTo')||{}).value;
  const reason = (document.getElementById('lvReason')||{}).value.trim();
  const notes = (document.getElementById('lvNotes')||{}).value.trim();
  const emp = DB.employees.find(e=>e.id===empId);
  if(!emp){ toast('اختر الموظف', true); return; }
  if(!from || !to){ toast('حدد تاريخ البداية والنهاية', true); return; }
  const days = leaveDaysCount(from, to);
  if(days<=0){ toast('تاريخ النهاية لازم يكون بعد البداية', true); return; }
  // منع التضارب: طلب متداخل مع إجازة قائمة أو منتظرة لنفس الموظف
  const overlap = DB.leaveRequests.some(r=>r.employeeId===empId && r.status!=='rejected' && !(new Date(to) < new Date(r.from) || new Date(from) > new Date(r.to)));
  if(overlap){ toast('فيه طلب إجازة تاني لنفس الموظف في نفس الفترة دي', true); return; }
  // فحص الرصيد للأنواع اللي بتخصم
  const st = empLeaveStats(empId);
  if(type==='دورية' && days > st.remRoutine){ toast('رصيد الإجازات الدورية مش كفاية (متبقي '+st.remRoutine+' يوم)', true); return; }
  if(type==='طارئة' && days > st.remEmergency){ toast('رصيد الإجازات الطارئة مش كفاية (متبقي '+st.remEmergency+' يوم)', true); return; }
  DB.leaveRequests.push({
    id:uid('lv'), reqNo: nextNo(DB.leaveRequests,'reqNo'),
    employeeId: empId, type, from, to, days, reason, notes,
    status:'pending', requestedBy: actorName(), date:new Date().toISOString()
  });
  await saveKey('leaveRequests');
  await logAction('طلب إجازة '+type+' '+days+' يوم — '+emp.name);
  closeModal(); toast('تم تقديم الطلب — في انتظار الموافقة'); refreshContent();
}
function approveLeave(reqId){
  if(!(can('hr.approve'))){ toast('مالكش صلاحية اعتماد الإجازات', true); return; }   /* حارس م65 */
  const r = DB.leaveRequests.find(x=>x.id===reqId);
  if(!r || r.status!=='pending') return;
  const emp = DB.employees.find(e=>e.id===r.employeeId);
  const st = empLeaveStats(r.employeeId);
  const deducts = (r.type==='دورية' || r.type==='طارئة');
  if(r.type==='دورية' && r.days > st.remRoutine){ toast('رصيده الدوري مش كفاية (متبقي '+st.remRoutine+')', true); return; }
  if(r.type==='طارئة' && r.days > st.remEmergency){ toast('رصيده الطارئ مش كفاية (متبقي '+st.remEmergency+')', true); return; }
  const after = deducts ? st.remaining - r.days : st.remaining;
  askConfirm('الموافقة على إجازة <b>'+(emp?emp.name:'—')+'</b>؟<br>'+r.type+' — '+r.days+' يوم ('+fmtDate(r.from)+' → '+fmtDate(r.to)+')<br><br>'+
    (deducts ? 'الرصيد قبل الإجازة: <b>'+st.remaining+'</b> يوم — الرصيد بعدها: <b>'+after+'</b> يوم' : 'النوع ده ('+r.type+') مش بيخصم من رصيد الإجازات'), async ()=>{
    r.status='approved'; r.decidedBy=actorName(); r.decidedAt=new Date().toISOString();
    r.balanceBefore = st.remaining; r.balanceAfter = after;
    await saveKey('leaveRequests');
    await logAction('قبول إجازة '+r.type+' '+r.days+' يوم — '+(emp?emp.name:'—')+' (الرصيد بعدها: '+after+')');
    pushNotif({ category:'hr', type:'leave_decision', priority:'medium',
      action:'اعتماد إجازة '+r.type+' ('+r.days+' يوم) لـ '+(emp?emp.name:'—'), refType:'employee', refId:r.employeeId });
    toast('تمت الموافقة — اتخصم من رصيده تلقائياً'); refreshContent();
  });
}
function rejectLeave(reqId){
  if(!(can('hr.approve'))){ toast('مالكش صلاحية اعتماد الإجازات', true); return; }   /* حارس م65 */

/* ---- السلف والجزاءات والرواتب (الملاحظة 20) + دورة رواتب مرنة (الملاحظة 29) ----
   الرواتب مش مربوطة بالشهر الميلادي — دورة من تاريخ لتاريخ (مثال: 25/6 → 25/7)
   وقيمة اليوم = الراتب الشهري ÷ أيام العمل المتفق عليها (قابلة للضبط، الافتراضي 26) */
function workingDays(){ const d = parseFloat(DB.settings.payrollWorkingDays); return (d>0 ? d : 26); }
function empDayValue(emp){
  if(emp.dayValue>0) return emp.dayValue;
  const wd = workingDays();
  return wd>0 ? Math.round(((emp.salary||0)/wd)*100)/100 : 0;
}
function inRange(dateStr, from, to){
  if(!dateStr) return false;
  const d = (dateStr+'').slice(0,10);
  return d >= from && d <= to;
}
/* حساب راتب فترة: الأساسي + حوافز − (سلف + غياب + جزاءات + تأمينات + استقطاعات) */
function payrollCalc(emp, from, to){
  const wd = workingDays();
  const dayVal = empDayValue(emp);
  // اليومية: الأيام الفعلية في الفترة (بحد أقصى أيام العمل) — الشهري: الراتب كامل
  const spanDays = Math.round((new Date(to) - new Date(from))/86400000) + 1;
  const base = emp.salaryType==='يومية'
    ? Math.round(dayVal * Math.min(spanDays, wd) * 100)/100
    : (emp.salary||0);
  const advances  = (emp.advances||[]).filter(a=>inRange(a.date, from, to)).reduce((s,a)=>s+(a.amount||0),0);
  const absDays   = (emp.absences||[]).filter(a=>inRange(a.date, from, to)).reduce((s,a)=>s+(a.days||1),0);
  const absenceDeduct = Math.round(dayVal*absDays*100)/100;
  const penalties = (emp.penalties||[]).filter(p=>inRange(p.date, from, to)).reduce((s,p)=>s+(p.amount||0),0);
  const bonuses   = (emp.bonuses||[]).filter(b=>inRange(b.date, from, to)).reduce((s,b)=>s+(b.amount||0),0);
  const socialIns = emp.socialIns||0, healthIns = emp.healthIns||0, otherDeduct = emp.otherDeduct||0;
  const fixed = socialIns+healthIns+otherDeduct;
  const totalDeduct = advances+absenceDeduct+penalties+fixed;
  return { base, bonuses, dayVal, wd, spanDays, advances, absDays, absenceDeduct, penalties,
           socialIns, healthIns, otherDeduct, fixed, totalDeduct,
           net: Math.round((base + bonuses - totalDeduct)*100)/100 };
}

  if(!e) return;
  openModal(`

/* ---- شاشة الرواتب بدورة مرنة (الملاحظة 29) ---- */
function defaultPayrollCycle(){
  // الافتراضي: دورة الشهر الحالي حسب يوم قفل الرواتب (مثال: 25/6 → 25/7)
  const d = parseInt(DB.settings.payrollCycleDay,10) || 25;
  const now = new Date();
  let to = new Date(now.getFullYear(), now.getMonth(), d);
  if(now.getDate() > d) to = new Date(now.getFullYear(), now.getMonth()+1, d);
  const from = new Date(to.getFullYear(), to.getMonth()-1, d);
  const iso = (x)=>new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10);
  return { from: iso(from), to: iso(to) };
}
let payrollPeriod = null;
let payrollFilter = { emp:'', dept:'' };
function getPayrollPeriod(){ if(!payrollPeriod) payrollPeriod = defaultPayrollCycle(); return payrollPeriod; }
function setPayrollFrom(v){ getPayrollPeriod(); if(v) payrollPeriod.from = v; refreshContent(); }
function setPayrollTo(v){ getPayrollPeriod(); if(v) payrollPeriod.to = v; refreshContent(); }
function setPayrollFilter(k, v){ payrollFilter[k] = v; refreshContent(); }
function periodLabel(from, to){ return fmtDate(from)+' → '+fmtDate(to); }
async function saveWorkingDays(){
  if(!isOwnerSession()){ toast('صلاحية صاحب المركز فقط', true); return; }
  const wd = parseFloat((document.getElementById('prWorkDays')||{}).value)||0;
  const cd = parseInt((document.getElementById('prCycleDay')||{}).value,10)||0;
  if(wd<=0 || wd>31){ toast('أيام العمل لازم تكون بين 1 و 31', true); return; }
  if(cd<1 || cd>28){ toast('يوم قفل الرواتب لازم يكون بين 1 و 28', true); return; }
  const oldWd = workingDays(), oldCd = parseInt(DB.settings.payrollCycleDay,10)||25;
  DB.settings.payrollWorkingDays = wd;
  DB.settings.payrollCycleDay = cd;
  await saveKey('settings');
  await logAction('تعديل إعدادات الرواتب — أيام العمل: من '+oldWd+' إلى '+wd+' · يوم القفل: من '+oldCd+' إلى '+cd);
  toast('تم حفظ إعدادات الرواتب'); refreshContent();
}

function toolHoursOut(mv){ return mv ? (Date.now() - new Date(mv.date)) / 3600000 : 0; }
function isToolOverdue(mv){ return toolHoursOut(mv) > TOOL_OVERDUE_HOURS; }
function overdueTools(){
  return DB.tools.filter(t=>t.status==='مصروفة').map(t=>({ t, mv: openCheckout(t.id) }))
    .filter(x=>x.mv && isToolOverdue(x.mv));
}
function toolStats(){
  const s = { total: DB.tools.length };
  TOOL_STATUS.forEach(st=>{ s[st] = DB.tools.filter(t=>t.status===st).length; });
  // فحص التطابق: الإجمالي لازم يساوي مجموع الحالات
  s.sumStatuses = TOOL_STATUS.reduce((a,st)=>a+s[st],0);
  s.mismatch = s.total - s.sumStatuses;
  return s;
}

  const body = toolsView==='out' ? renderToolsOut() : toolsView==='log' ? renderToolsLog() : renderToolsList();
  return tabsBar + dash + body;

function openNewToolModal(){
  if(!toolsCanManage()){ toast('إضافة العدد صلاحية صاحب المركز فقط', true); return; }
  openModal(`<h3>عدة خاصة جديدة</h3>${toolFormHTML()}
    <button class="btn btn-accent" style="width:100%" onclick="saveNewTool()">حفظ العدة</button>`);
}
async function saveNewTool(){
  if(!(can('tools.manage'))){ toast('مالكش صلاحية إدارة العدد', true); return; }   /* حارس م65 */
  if(!toolsCanManage()){ toast('إضافة العدد صلاحية صاحب المركز فقط', true); return; }
  const f = readToolForm();
  if(!f.name){ toast('اكتب اسم العدة', true); return; }
  if(!f.code){ toast('اكتب كود العدة', true); return; }
  if(DB.tools.some(t=>t.code===f.code)){ toast('الكود ده مستخدم بالفعل', true); return; }
  DB.tools.push({ id:uid('tl'), seq: nextNo(DB.tools,'seq'), ...f, createdAt:new Date().toISOString() });
  await saveKey('tools');
  await logAction('إضافة عدة خاصة: '+f.name+' ('+f.code+')');
  closeModal(); toast('تم حفظ العدة'); refreshContent();
}
function openEditToolModal(toolId){
  if(!toolsCanManage()){ toast('التعديل صلاحية صاحب المركز فقط', true); return; }
  const x = DB.tools.find(t=>t.id===toolId);
  if(!x) return;
  openModal(`<h3>تعديل العدة — ${x.name}</h3>${toolFormHTML(x)}

async function saveToolEdit(toolId){
  if(!(can('tools.manage'))){ toast('مالكش صلاحية إدارة العدد', true); return; }   /* حارس م65 */
  if(!toolsCanManage()){ toast('التعديل صلاحية صاحب المركز فقط', true); return; }
  const x = DB.tools.find(t=>t.id===toolId);
  if(!x) return;
  const f = readToolForm();
  if(!f.name){ toast('اكتب اسم العدة', true); return; }
  if(DB.tools.some(t=>t.code===f.code && t.id!==toolId)){ toast('الكود ده مستخدم بالفعل', true); return; }
  const oldStatus = x.status;
  Object.assign(x, f);
  await saveKey('tools');
  await logAction('تعديل العدة: '+x.name+(oldStatus!==f.status?' — الحالة من "'+oldStatus+'" إلى "'+f.status+'"':''));
  closeModal(); toast('تم حفظ التعديلات'); refreshContent();

function deleteTool(toolId){

  askConfirmReason('حذف العدة «'+x.name+'» نهائياً؟'+(hasHistory?'<br><span class="muted" style="font-size:12px">ليها سجل حركة — الأفضل تخليها "خارج الخدمة" بدل الحذف عشان السجل يفضل مفهوم.</span>':''), async (reason)=>{
    DB.tools = DB.tools.filter(t=>t.id!==toolId);
