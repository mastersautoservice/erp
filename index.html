    <button class="btn btn-accent" style="width:100%" onclick="saveCustody()">إصدار العهدة</button>
  `);
}
async function saveCustody(){
  if(!can('fin.custody_create')){ toast('مالكش صلاحية إصدار عهد', true); return; }
  const amount = parseFloat((document.getElementById('cuAmount')||{}).value)||0;
  const empId = (document.getElementById('cuEmp')||{}).value;
  const purpose = ((document.getElementById('cuPurpose')||{}).value||'').trim();
  const sourceId = (document.getElementById('cuSource')||{}).value;
  const notes = ((document.getElementById('cuNotes')||{}).value||'').trim();
  const emp = DB.employees.find(e=>e.id===empId);
  const src = DB.finAccounts.find(a=>a.id===sourceId);
  if(amount<=0){ toast('اكتب قيمة صحيحة', true); return; }
  if(!emp){ toast('اختار الموظف', true); return; }
  if(!src){ toast('اختار مصدر الصرف', true); return; }
  // عهدة مفتوحة واحدة لكل موظف
  const existing = empOpenCustody(empId);
  if(existing){ toast('الموظف '+emp.name+' عنده عهدة مفتوحة بقيمة '+money(existing.amount)+' — لازم تتسوّى الأول قبل عهدة جديدة', true); return; }
  const c = {
    id: uid('cus'), custodyNo: nextNo(DB.custodies,'custodyNo'),
    amount, employeeId: empId, employeeName: emp.name, purpose,
    sourceAccountId: sourceId, sourceName: src.name, notes,
    status: 'open', settlement: null, createdAt: new Date().toISOString(), actor: actorName()
  };
  DB.custodies.push(c);
  addFinMove(sourceId, 'out', amount, 'custody', 'عهدة #'+c.custodyNo+' — '+emp.name+(purpose?' — '+purpose:''));
  await Promise.all([saveKey('custodies'), saveKey('finMoves')]);
  await logAction('إصدار عهدة #'+c.custodyNo+' بقيمة '+money(amount)+' للموظف '+emp.name+' من '+src.name+(purpose?' — '+purpose:''));
  pushNotif({ category:'financial', type:'custody_open', priority:'medium', amount,
    action:'إصدار عهدة #'+c.custodyNo+' للموظف '+emp.name+(purpose?' — '+purpose:''), refType:'expense' });
  closeModal(); toast('تم إصدار العهدة وخصمها من '+src.name); refreshContent();
}
/* ---- سطور تسوية العهدة (في الذاكرة أثناء الفتح) ---- */
let _custodyLines = [];
function openSettleCustodyModal(custodyId){
  if(!can('fin.custody_settle')){ toast('مالكش صلاحية تسوية العهد', true); return; }
  const c = DB.custodies.find(x=>x.id===custodyId);
  if(!c || c.status!=='open'){ toast('العهدة دي مش مفتوحة', true); return; }
  _custodyLines = [];
  renderSettleModal(custodyId);
}
function renderSettleModal(custodyId){
  const c = DB.custodies.find(x=>x.id===custodyId);
  const spent = _custodyLines.reduce((s,l)=>s+l.amount,0);
  const remaining = Math.round((c.amount - spent)*100)/100;
  const catOpts = `<option value="">— اختار النوع —</option>`+ (typeof expCatOptionsHTML==='function' ? expCatOptionsHTML().replace('<option value="">— اختر نوع المصروف —</option>','') : DB.expenseCategories.map(ct=>`<option value="${ct.id}">${ct.name}</option>`).join(''));
  openModal(`
    <h3>📤 تسوية عهدة #${c.custodyNo} <span class="muted" style="font-size:12px">— ${custodyEmpName(c)} — ${money(c.amount)}</span></h3>
    <div class="grid g3" style="margin-bottom:12px">
      ${stat(money(c.amount),'قيمة العهدة')}
      ${stat(money(spent),'المصروفات المسجّلة', spent>c.amount)}
      ${stat(money(remaining),'المتبقي', remaining<0)}
    </div>
    <label class="f-label">بنود المصروفات الفعلية</label>
    <div class="card" style="margin:6px 0 10px">
      <table style="margin-bottom:8px"><tbody>
      ${_custodyLines.length? _custodyLines.map((l,i)=>`<tr><td>${l.catName}</td><td class="muted" style="font-size:11.5px">${l.description||'—'}</td><td style="font-weight:700">${money(l.amount)}</td><td style="width:50px"><button class="btn btn-sm btn-danger" onclick="removeCustodyLine(${i})">حذف</button></td></tr>`).join('') : '<tr><td class="empty">مفيش بنود لسه — ضيف بند تحت</td></tr>'}
      </tbody></table>
      <div class="grid g3">
        <div class="form-row" style="margin:0"><select class="f" id="clCat">${catOpts}</select></div>
        <div class="form-row" style="margin:0"><input class="f" id="clDesc" placeholder="وصف (اختياري)"></div>
        <div class="form-row" style="margin:0;display:flex;gap:4px"><input class="f" id="clAmt" type="number" min="0" placeholder="المبلغ"><button class="btn" onclick="addCustodyLine('${custodyId}')">➕</button></div>
      </div>
    </div>
    ${remaining>0.5?`
    <div class="grid g2">
      <div class="form-row"><label class="f-label">المتبقي (${money(remaining)}) هيرجع لحساب <span style="color:var(--danger)">*</span></label>
        <select class="f" id="clReturnAcc"><option value="">— اختار الحساب —</option>${DB.finAccounts.map(a=>`<option value="${a.id}">${a.name} (${money(accBalance(a.id))})</option>`).join('')}</select></div>
      <div class="form-row"><label class="f-label">ملاحظات التسوية</label><input class="f" id="clNotes"></div>
    </div>`:`<div class="form-row"><label class="f-label">ملاحظات التسوية</label><input class="f" id="clNotes"></div>`}
    <div class="muted" style="font-size:12px;margin-bottom:10px">البنود هتتحوّل لمصروفات حقيقية في التقارير، والمتبقي هيتضاف للحساب اللي تختاره.</div>
    <button class="btn btn-accent" style="width:100%" onclick="saveSettleCustody('${custodyId}')">تأكيد التسوية وإقفال العهدة</button>
  `);
}
function addCustodyLine(custodyId){
  const catId = (document.getElementById('clCat')||{}).value;
  const amt = parseFloat((document.getElementById('clAmt')||{}).value)||0;
  const desc = ((document.getElementById('clDesc')||{}).value||'').trim();
  const cat = DB.expenseCategories.find(c=>c.id===catId);
  if(!cat){ toast('اختار نوع المصروف', true); return; }
  if(amt<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const c = DB.custodies.find(x=>x.id===custodyId);
  const spent = _custodyLines.reduce((s,l)=>s+l.amount,0);

}

async function saveSettleCustody(custodyId){
  if(!can('fin.custody_settle')){ toast('مالكش صلاحية تسوية العهد', true); return; }
  const c = DB.custodies.find(x=>x.id===custodyId);
  if(!c || c.status!=='open'){ toast('العهدة مش مفتوحة', true); return; }
  const spent = _custodyLines.reduce((s,l)=>s+l.amount,0);
  const remaining = Math.round((c.amount - spent)*100)/100;
  // لو فيه فلوس باقية لازم المستخدم يختار الحساب اللي هترجع له بإيده (مش شرط مصدر الصرف)
  let returnAccId = null, returnAccName = null;
  if(remaining>0.5){
    returnAccId = (document.getElementById('clReturnAcc')||{}).value;
    if(!returnAccId){ toast('اختار الحساب اللي المتبقي ('+money(remaining)+') هيرجع له', true); return; }
    const raChk = DB.finAccounts.find(a=>a.id===returnAccId);
    if(!raChk){ toast('الحساب اللي اخترته مش موجود', true); return; }
  }
  const emp = DB.employees.find(e=>e.id===c.employeeId);
  // 1) حوّل كل بند لمصروف حقيقي (بدون خصم من حساب — الفلوس خرجت وقت إصدار العهدة)
  const createdExpenses = [];
  _custodyLines.forEach(l=>{
    const exp = { id:uid('exp'), expNo: nextNo(DB.expenses,'expNo'),
      category:l.catName, categoryId:l.categoryId, group:l.group,
      description:l.description, note:l.description, amount:l.amount,
      accountId:null, payAccount:'عهدة #'+c.custodyNo, fromCustody:c.id,
      actor:actorName(), date:new Date().toISOString() };
    DB.expenses.push(exp); createdExpenses.push(exp);
  });
  // 2) رجوع المتبقي للحساب اللي المستخدم اختاره (اتأكدنا منه فوق)
  if(remaining>0.5){
    const ra = DB.finAccounts.find(a=>a.id===returnAccId);
    if(ra){ addFinMove(returnAccId, 'in', remaining, 'custody_return', 'استرجاع باقي عهدة #'+c.custodyNo+' — '+custodyEmpName(c)); returnAccName = ra.name; }
  }
  // 3) اقفل العهدة
  const notes = ((document.getElementById('clNotes')||{}).value||'').trim();
  c.status = 'closed';
  c.settlement = { lines: JSON.parse(JSON.stringify(_custodyLines)), totalExpenses: spent, remaining, returnedAccId:returnAccId, returnedAccName:returnAccName, notes, at:new Date().toISOString(), by:actorName() };
  c.closedAt = new Date().toISOString();
  const saves = [saveKey('custodies'), saveKey('expenses')];
  if(remaining>0.5) saves.push(saveKey('finMoves'));
  await Promise.all(saves);
  await logAction('تسوية عهدة #'+c.custodyNo+' — '+custodyEmpName(c)+': مصروفات '+money(spent)+(remaining>0.5?' + استرجاع '+money(remaining)+' لـ '+(returnAccName||'—'):'')+' ('+_custodyLines.length+' بند)');
  pushNotif({ category:'financial', type:'custody_settle', priority:'medium', amount:spent,
    action:'تسوية عهدة #'+c.custodyNo+' — '+custodyEmpName(c)+' (مصروفات '+money(spent)+(remaining>0.5?' + مرتجع '+money(remaining):'')+')', refType:'expense' });
  _custodyLines = [];
  closeModal(); toast('تمت تسوية العهدة وإقفالها'+(spent>0?' — اتسجّل '+money(spent)+' مصروفات':'')); refreshContent();
}

let techPeriod = { preset:'this_month', from:'', to:'' };
function setTechPreset(p){ techPeriod.preset = p; refreshContent(); }
/* كل الفنيين اللي ليهم شغل (بالمفتاح الثابت) + الفنيين النشطين في الموارد البشرية */
function allTechKeys(){
  const s = new Set();
  DB.jobs.forEach(j=>j.items.forEach(it=>{
    if(it.kind==='service'){ const k = techKeyOf(it, j); if(k && k!=='غير محدد') s.add(k); }
  }));
  techEmployees().forEach(e=>s.add(e.id));
  return [...s].sort((a,b)=>techLabelOf(a).localeCompare(techLabelOf(b),'ar'));
}
function computeTechPerf(range){
  const techMap = {};
  const ensure = (t)=>{ if(!techMap[t]) techMap[t] = {servicesCount:0, laborValue:0, laborCollected:0, incentiveBase:0, rework:0, jobs:new Set(), days:new Set()}; return techMap[t]; };
  const excl = DB.settings.incentiveExclusions||[];
  // الاستبعاد بيقارن بالمفتاح والاسم — عشان الاستبعادات القديمة (المخزنة بالاسم) تفضل شغالة
  const isExcluded = (techKey, dStr)=>{
    const label = techLabelOf(techKey);
    const d = new Date(dStr);
    return excl.some(x=>(x.tech===techKey || x.tech===label) && d>=new Date(x.from) && d<=new Date(x.to+'T23:59:59'));
  };
  DB.jobs.forEach(j=>{
    if(j.status==='ملغاة') return;
    const inv = DB.invoices.find(i=>i.jobId===j.id && !i.cancelled);
    let collectRatio = 0;
    if(inv){
      const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
      collectRatio = inv.total>0 ? Math.min(paid/inv.total,1) : 0;
    }
    j.items.filter(it=>it.kind==='service').forEach(it=>{
      // الخدمات الجديدة ليها تاريخها الخاص؛ القديمة بتتبع تاريخ أمر الشغل
      const dStr = it.date || j.deliveredAt || j.receivedAt;
      if(!inPeriod(dStr, range)) return;
      const tech = techKeyOf(it, j);
      const d = ensure(tech);
      d.servicesCount++;
      const val = it.qty*it.unitPrice;
      d.laborValue += val;
      d.laborCollected += val*collectRatio;
      if(!isExcluded(tech, dStr)) d.incentiveBase += val*collectRatio;
      if(it.rework) d.rework++;
      d.days.add(new Date(dStr).toDateString());
      d.jobs.add(j.id);
    });
  });
  return techMap;
}

async function saveIncentiveExclusion(){

      <div class="flex-between">
        <div>
          <span style="font-weight:800">#${job.jobNo}</span>
          <span class="muted" style="font-size:12px;margin-right:8px">${car.plate||''} · ${cust.name||''}</span>
          <span class="muted" style="font-size:12px;margin-right:8px">${fmtDate(job.receivedAt)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="tag tag-paid">محصلة</span>
          <span style="font-weight:800;color:var(--accent)">${money(laborVal)}</span>
        </div>

      <div class="muted" style="font-size:12px;margin-top:6px">${techItems.map(it=>it.name+' ('+money(it.qty*it.unitPrice)+')').join(' · ')}</div>

  }).join('')}

function leaveDaysCount(from, to){
  if(!from || !to) return 0;
  const d = Math.round((new Date(to) - new Date(from))/86400000) + 1;
  return d>0 ? d : 0;
}

/* إحصائيات الموظف: الرصيد والمستخدم والمتبقي والرفض والغياب */
function empLeaveStats(empId){
  const emp = DB.employees.find(e=>e.id===empId);
  const approved = DB.leaveRequests.filter(r=>r.employeeId===empId && r.status==='approved');
  const usedRoutine = approved.filter(r=>r.type==='دورية').reduce((s,r)=>s+(r.days||0),0);
  const usedEmergency = approved.filter(r=>r.type==='طارئة').reduce((s,r)=>s+(r.days||0),0);
  const usedOther = approved.filter(r=>r.type!=='دورية' && r.type!=='طارئة').reduce((s,r)=>s+(r.days||0),0);
  const rejections = DB.leaveRequests.filter(r=>r.employeeId===empId && r.status==='rejected').length;
  const absences = (emp && emp.absences) ? emp.absences : [];
  const absenceDays = absences.reduce((s,a)=>s+(a.days||1),0);
  const absenceNoPermission = absences.filter(a=>a.noPermission).reduce((s,a)=>s+(a.days||1),0);
  const balRoutine = emp ? (emp.leaveRoutine||0) : 0;
  const balEmergency = emp ? (emp.leaveEmergency||0) : 0;
  return {
    balRoutine, balEmergency, total: balRoutine+balEmergency,
    usedRoutine, usedEmergency, usedOther, used: usedRoutine+usedEmergency,
    remRoutine: balRoutine-usedRoutine, remEmergency: balEmergency-usedEmergency,
    remaining: (balRoutine-usedRoutine)+(balEmergency-usedEmergency),
    rejections, absenceTimes: absences.length, absenceDays, absenceNoPermission
  };
}

function openEmployeeDetail(empId){
  const e = DB.employees.find(x=>x.id===empId);
  if(!e) return;
  if(empDetailPeriod.emp!==empId) empDetailPeriod = { emp:empId, from:'', to:'' };
  const fp = empDetailPeriod;
  const fltOn = !!(fp.from || fp.to);
  const inP = d => (!fp.from || new Date(d) >= new Date(fp.from)) && (!fp.to || new Date(d) <= new Date(new Date(fp.to).getTime()+86399999));
  const st = empLeaveStats(empId);
  const history = [...DB.leaveRequests.filter(r=>r.employeeId===empId)].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const absences = [...(e.absences||[])].filter(a=>inP(a.date)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const advances = [...(e.advances||[])].filter(a=>inP(a.date)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const penalties = [...(e.penalties||[])].filter(p=>inP(p.date)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const empPermits = DB.permits.filter(p=>p.employeeId===empId).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const earlyPermits = empPermits.filter(p=>p.kind==='early');
  const errands = empPermits.filter(p=>p.kind==='errand');
  const bonuses = [...(e.bonuses||[])].filter(b=>inP(b.date)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totAdv = advances.reduce((s,a)=>s+(a.amount||0),0);
  const totPen = penalties.reduce((s,p)=>s+(p.amount||0),0);
  const totBon = bonuses.reduce((s,b)=>s+(b.amount||0),0);
  const inPeriodLbl = fltOn ? ' (في الفترة)' : '';
  openModal(`
    <h3>${e.name} <span class="muted" style="font-size:12px">#${e.empNo} — ${e.job||'—'} (${e.dept||'—'})</span></h3>
    <div style="margin-bottom:10px">${empStatusTag(e.status)}
      <span class="muted" style="font-size:12px;margin-right:8px">تعيين: ${e.hireDate?fmtDate(e.hireDate):'—'} · موبايل: <span style="direction:ltr;display:inline-block">${e.phone||'—'}</span> · راتب ${e.salaryType==='يومية'?'يومية':'شهري'}: ${money(e.salary||0)} · قيمة اليوم: ${money(empDayValue(e))} (÷ ${workingDays()} يوم عمل)${(e.socialIns||e.healthIns||e.otherDeduct)?' · استقطاعات ثابتة: '+money((e.socialIns||0)+(e.healthIns||0)+(e.otherDeduct||0)):''}</span></div>
    ${e.notes?`<div class="muted" style="font-size:12px;margin-bottom:10px">📝 ${e.notes}</div>`:''}
    <div class="grid g3" style="margin-bottom:12px">
      ${stat(String(st.total),'إجمالي الإجازات المتاحة')}
      ${stat(String(st.used),'الإجازات المستخدمة')}
      ${stat(String(st.remaining),'الإجازات المتبقية', st.remaining<=0)}
    </div>
    <div class="grid g3" style="margin-bottom:12px">
      ${stat(String(st.rejections),'مرات الرفض', st.rejections>0)}
      ${stat(String(st.absenceTimes),'مرات الغياب', st.absenceTimes>0)}
      ${stat(String(st.absenceNoPermission),'أيام غياب بدون إذن', st.absenceNoPermission>0)}
    </div>
    <div class="grid g4" style="margin-bottom:12px">
      ${stat(money(totAdv),'إجمالي السلف'+inPeriodLbl, totAdv>0)}
      ${stat(money(totPen),'إجمالي الجزاءات'+inPeriodLbl, totPen>0)}
      ${stat(money(totBon),'إجمالي الحوافز'+inPeriodLbl)}
      ${stat(String(earlyPermits.filter(p=>p.status==='approved').length)+' / '+String(errands.filter(p=>p.status==='approved').length),'أذونات / مأموريات معتمدة')}
    </div>
    <div class="card" style="margin-bottom:12px">
      <label class="f-label">📅 فلترة بفترة (بتفلتر: السلف · الجزاءات · الحوافز · الغياب — وإجمالياتهم فوق)</label>
      <div class="grid g3" style="margin-top:4px">
        <div class="form-row" style="margin:0"><label class="f-label">من تاريخ</label><input class="f" type="date" value="${fp.from}" onchange="setEmpDetailPeriod('${empId}','from',this.value)"></div>
        <div class="form-row" style="margin:0"><label class="f-label">إلى تاريخ</label><input class="f" type="date" value="${fp.to}" onchange="setEmpDetailPeriod('${empId}','to',this.value)"></div>
        <div class="form-row" style="margin:0;display:flex;align-items:flex-end"><button class="btn btn-sm" style="width:100%" onclick="setEmpDetailPeriod('${empId}','clear','')">عرض الكل</button></div>
      </div>
      ${fltOn?`<div style="font-size:12px;margin-top:6px;color:var(--accent);font-weight:700">معروض دلوقتي: من ${fp.from?fmtDate(fp.from):'البداية'} إلى ${fp.to?fmtDate(fp.to):'النهاردة'}</div>`:''}
    </div>
    <div class="muted" style="font-size:12px;margin-bottom:14px">دوري: متبقي ${st.remRoutine} من ${st.balRoutine} · طارئ: متبقي ${st.remEmergency} من ${st.balEmergency}${st.usedOther?` · إجازات أخرى (مرضية/بدون راتب): ${st.usedOther} يوم`:''}</div>
    ${hrCanManage()?`
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      ${can('hr.employees')?`<button class="btn" style="flex:1" onclick="openEditEmployeeModal('${empId}')">✏️ تعديل الملف</button>
      <button class="btn" style="flex:1" onclick="openAbsenceModal('${empId}')">🚫 غياب</button>
      <button class="btn" style="flex:1" onclick="openAdvanceModal('${empId}')">💰 سلفة</button>
      <button class="btn" style="flex:1" onclick="openBonusModal('${empId}')">🎁 حافز</button>`:''}
      ${can('hr.penalties')?`<button class="btn" style="flex:1" onclick="openPenaltyModal('${empId}')">⚖️ جزاء</button>`:''}
      ${can('hr.payroll')?`<button class="btn btn-accent" style="flex:1" onclick="openPayslip('${empId}')">🧾 كشف الراتب</button>`:''}
    </div>`:''}
    <label class="f-label">سجل الإجازات (${history.length})</label>
    <table style="margin:6px 0 14px"><tbody>
    ${history.length? history.map(r=>`<tr>
      <td style="font-size:12px;white-space:nowrap">${fmtDate(r.from)} → ${fmtDate(r.to)}</td>
      <td>${r.type} (${r.days} يوم)</td><td>${leaveStatusTag(r.status)}</td>
      <td class="muted" style="font-size:11.5px">${r.reason||'—'}</td></tr>`).join('') : '<tr><td class="empty">مفيش إجازات مسجلة</td></tr>'}
    </tbody></table>
    <label class="f-label">سجل الغياب (${absences.length})${inPeriodLbl}</label>
    <table style="margin:6px 0 14px"><tbody>
    ${absences.length? absences.map(a=>`<tr>
      <td style="font-size:12px;white-space:nowrap">${fmtDate(a.date)}</td><td>${a.days||1} يوم</td>
      <td>${a.noPermission?'<span class="tag tag-unpaid">بدون إذن</span>':'<span class="muted">بإذن</span>'}</td>
      <td class="muted" style="font-size:11.5px">${a.note||'—'}</td></tr>`).join('') : '<tr><td class="empty">مفيش غياب مسجل 👏</td></tr>'}
    </tbody></table>
    <label class="f-label">السلف (${advances.length})${inPeriodLbl}</label>
    <table style="margin:6px 0 14px"><tbody>
    ${advances.length? advances.map(a=>`<tr>
      <td style="font-size:12px;white-space:nowrap">${fmtDate(a.date)}</td>
      <td style="font-weight:700">${money(a.amount)}</td>
      <td class="muted" style="font-size:11.5px">${a.reason||'—'}</td>
      <td class="muted" style="font-size:11.5px">${a.note||'—'}</td></tr>`).join('') : '<tr><td class="empty">مفيش سلف مسجلة</td></tr>'}
    </tbody></table>
    <label class="f-label">الجزاءات (${penalties.length})${inPeriodLbl}</label>
    <table style="margin:6px 0 14px"><tbody>
    ${penalties.length? penalties.map(p=>`<tr>
      <td style="font-size:12px;white-space:nowrap">${fmtDate(p.date)}</td>
      <td style="font-weight:700;color:var(--danger)">${money(p.amount)}</td>
      <td class="muted" style="font-size:11.5px">${p.reason||'—'}</td>
      <td class="muted" style="font-size:11.5px">${p.note||'—'}</td></tr>`).join('') : '<tr><td class="empty">مفيش جزاءات 👏</td></tr>'}
    </tbody></table>
    <label class="f-label">الحوافز والمكافآت (${bonuses.length})${inPeriodLbl}</label>
    <table style="margin:6px 0 14px"><tbody>
    ${bonuses.length? bonuses.map(b=>`<tr>
      <td style="font-size:12px;white-space:nowrap">${fmtDate(b.date)}</td>
      <td style="font-weight:700;color:var(--accent)">+ ${money(b.amount)}</td>
      <td class="muted" style="font-size:11.5px">${b.reason||'—'}</td>
      <td class="muted" style="font-size:11.5px">${b.note||'—'}</td></tr>`).join('') : '<tr><td class="empty">مفيش حوافز مسجلة</td></tr>'}
    </tbody></table>
    <label class="f-label">أذونات الانصراف المبكر (${earlyPermits.length})</label>
    <table style="margin:6px 0 14px"><tbody>
    ${earlyPermits.length? earlyPermits.map(p=>`<tr>
      <td style="font-size:12px;white-space:nowrap">${fmtDate(p.date)}</td>
      <td>${p.leaveTime||'—'}${p.remainHours?' ('+p.remainHours+' ساعة متبقية)':''}</td>

      <td class="muted" style="font-size:11.5px">${p.reason||'—'}</td></tr>`).join('') : '<tr><td class="empty">مفيش أذونات انصراف</td></tr>'}
    </tbody></table>
    <label class="f-label">المأموريات (${errands.length})</label>
    <table style="margin-top:6px"><tbody>
    ${errands.length? errands.map(p=>`<tr>
      <td style="font-size:12px;white-space:nowrap">${fmtDate(p.date)}</td>
      <td>${p.errandType||'—'}${p.outTime?' · '+p.outTime+(p.backTime?' → '+p.backTime:''):''}</td>
      <td>${leaveStatusTag(p.status)}</td>
      <td class="muted" style="font-size:11.5px">${p.desc||'—'}${p.destination?' — '+p.destination:''}</td></tr>`).join('') : '<tr><td class="empty">مفيش مأموريات</td></tr>'}
    </tbody></table>
  `);
}
function openAbsenceModal(empId){
  const e = DB.employees.find(x=>x.id===empId);
  if(!e) return;
  openModal(`
    <h3>تسجيل غياب — ${e.name}</h3>
    <div class="grid g2">
      <div class="form-row"><label class="f-label">تاريخ الغياب</label><input class="f" id="abDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-row"><label class="f-label">عدد الأيام (ينفع جزء من يوم: 0.5)</label><input class="f" id="abDays" type="number" min="0.25" step="0.25" value="1"></div>
    </div>
    <div class="form-row"><label class="f-label">نوع الغياب</label>
      <select class="f" id="abPerm"><option value="no">بدون إذن</option><option value="yes">بإذن</option></select></div>
    <div class="form-row"><label class="f-label">ملاحظة (اختياري)</label><input class="f" id="abNote"></div>
    <button class="btn btn-danger" style="width:100%" onclick="saveAbsence('${empId}')">تسجيل الغياب</button>
  `);
}
async function saveAbsence(empId){
  const e = DB.employees.find(x=>x.id===empId);
  if(!e) return;
  const date = (document.getElementById('abDate')||{}).value;
  const days = parseFloat(document.getElementById('abDays').value)||1;
  const noPermission = (document.getElementById('abPerm')||{}).value !== 'yes';
  const note = (document.getElementById('abNote')||{}).value.trim();
  if(!date){ toast('اختر تاريخ الغياب', true); return; }
  if(!e.absences) e.absences = [];
  e.absences.push({ id:uid('abs'), date, days, noPermission, note, recordedBy:actorName(), createdAt:new Date().toISOString() });
  await saveKey('employees');
  await logAction('تسجيل غياب '+days+' يوم '+(noPermission?'بدون إذن':'بإذن')+' — '+e.name);
  closeModal(); toast('تم تسجيل الغياب'); openEmployeeDetail(empId);
}
/* ---- فلاتر شاشات الإجازات والأذونات والمأموريات (الملاحظة 24) ---- */
let hrFilter = { emp:'', preset:'all', from:'', to:'' };
function setHrFilterEmp(v){ hrFilter.emp = v; refreshContent(); }
function setHrFilterPreset(p){ hrFilter.preset = p; refreshContent(); }
function hrPeriodRange(){
  const now = new Date();
  const r = periodRange(hrFilter);
  // مدّ نهاية الفترات الجارية لآخرها — عشان الطلبات المستقبلية (إجازة الأسبوع الجاي مثلاً) تظهر
  if(hrFilter.preset==='this_week'){ r.to = new Date(r.from.getTime()+7*86400000-1); }
  else if(hrFilter.preset==='this_month'){ r.to = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59); }
  else if(hrFilter.preset==='this_quarter'){ const q=Math.floor(now.getMonth()/3); r.to = new Date(now.getFullYear(), q*3+3, 0, 23,59,59); }
  else if(hrFilter.preset==='this_year'){ r.to = new Date(now.getFullYear(), 11, 31, 23,59,59); }
  return r;
}
function hrFilterMatch(empId, dateStr){
  if(hrFilter.emp && empId!==hrFilter.emp) return false;
  if(hrFilter.preset==='all') return true;   // بدون فترة = كل التاريخ (حتى المستقبلي)
  return inPeriod(dateStr, hrPeriodRange());
}

  const emps = [...DB.employees].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  return `
  <div class="card" style="margin-bottom:16px">

      ${PERIOD_PRESETS.map(([id,lbl])=>`<button class="btn btn-sm ${hrFilter.preset===id?'btn-accent':''}" onclick="setHrFilterPreset('${id}')">${lbl}</button>`).join('')}
    </div>
    <div class="grid g3">
      <div class="form-row" style="margin:0"><label class="f-label">الموظف / الفني</label>
        <select class="f" onchange="setHrFilterEmp(this.value)">
          <option value="">— كل الموظفين —</option>
          ${emps.map(e=>`<option value="${e.id}" ${hrFilter.emp===e.id?'selected':''}>${e.name}</option>`).join('')}
        </select></div>
      <div class="form-row" style="margin:0"><label class="f-label">من تاريخ</label>
        <input class="f" type="date" value="${hrFilter.from}" onchange="hrFilter.from=this.value;hrFilter.preset='custom';refreshContent()"></div>
      <div class="form-row" style="margin:0"><label class="f-label">إلى تاريخ</label>
        <input class="f" type="date" value="${hrFilter.to}" onchange="hrFilter.to=this.value;hrFilter.preset='custom';refreshContent()"></div>
    </div>
  </div>`;
}

function renderLeaveRequests(){
  const canDecide = hrCanManage();
  const all = [...DB.leaveRequests].filter(r=>hrFilterMatch(r.employeeId, r.from)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const pending = all.filter(r=>r.status==='pending');
  const decided = all.filter(r=>r.status!=='pending');
  const approvedCount = all.filter(r=>r.status==='approved').length;
  const rejectedCount = all.filter(r=>r.status==='rejected').length;
  const row = (r)=>{
    const emp = DB.employees.find(e=>e.id===r.employeeId);
    return `<tr>
      <td>#${r.reqNo||'—'}</td><td style="font-weight:700">${emp?emp.name:'—'}</td>
      <td>${r.type}</td>
      <td style="white-space:nowrap;font-size:12.5px">${fmtDate(r.from)} → ${fmtDate(r.to)} (${r.days} يوم)</td>
      <td class="muted" style="font-size:12px">${r.reason||'—'}</td>
      <td>${leaveStatusTag(r.status)}${r.status!=='pending' && r.decidedBy?`<div class="muted" style="font-size:10.5px">${r.decidedBy}</div>`:''}</td>
      <td>${r.status==='pending' && canDecide ? `
        <div style="display:flex;gap:4px">
          <button class="btn btn-sm btn-accent" onclick="approveLeave('${r.id}')">قبول</button>
          <button class="btn btn-sm btn-danger" onclick="rejectLeave('${r.id}')">رفض</button>
        </div>` : (r.status==='approved' && r.balanceAfter!==undefined ? `<span class="muted" style="font-size:11px">الرصيد بعدها: ${r.balanceAfter}</span>`:'')}</td>
    </tr>`;
  };
  return `
  ${hrFilterBar()}
  <div class="grid g3" style="margin-bottom:18px">
    ${stat(String(all.length),'عدد طلبات الإجازة')}
    ${stat(String(approvedCount),'المقبول منها')}
    ${stat(String(rejectedCount),'المرفوض منها', rejectedCount>0)}
  </div>
  <div class="section-head"><h3>طلبات الإجازات</h3>
    <button class="btn btn-accent" onclick="openNewLeaveModal()">${ICONS.plus} طلب إجازة جديد</button></div>
  ${DB.employees.length===0?`<div class="muted" style="margin-bottom:12px">⚠️ لسه مفيش موظفين متكودين${canDecide?' — سجّلهم الأول من "ملفات الموظفين"':' — اطلب من الحسابات تسجيلهم الأول'}.</div>`:''}
  <div class="section-head" style="margin-top:4px"><h3 style="font-size:15px">⏳ في انتظار الموافقة (${pending.length})</h3></div>
  <div class="card" style="margin-bottom:18px">
    <table><thead><tr><th>رقم</th><th>الموظف</th><th>النوع</th><th>المدة</th><th>السبب</th><th>الحالة</th><th></th></tr></thead>
    <tbody>${pending.length? pending.map(row).join('') : `<tr><td colspan="7" class="empty">مفيش طلبات منتظرة</td></tr>`}</tbody></table>
  </div>
  <div class="section-head"><h3 style="font-size:15px">📋 السجل (${decided.length})</h3></div>
  <div class="card">
    <table><thead><tr><th>رقم</th><th>الموظف</th><th>النوع</th><th>المدة</th><th>السبب</th><th>الحالة</th><th></th></tr></thead>
    <tbody>${decided.length? decided.map(row).join('') : `<tr><td colspan="7" class="empty">مفيش طلبات سابقة</td></tr>`}</tbody></table>
  </div>`;
}

async function saveLeaveRequest(){
  const empId = (document.getElementById('lvEmp')||{}).value;
  const type = (document.getElementById('lvType')||{}).value;
  const from = (document.getElementById('lvFrom')||{}).value;
  const to = (document.getElementById('lvTo')||{}).value;
  const reason = (document.getElementById('lvReason')||{}).value.trim();
  const notes = (document.getElementById('lvNotes')||{}).value.trim();
  const emp = DB.employees.find(e=>e.id===empId);
  if(!emp){ toast('اختر الموظف', true); return; }
  if(!from || !to){ toast('حدد تاريخ البداية والنهاية', true); return; }
  const days = leaveDaysCount(from, to);
  if(days<=0){ toast('تاريخ النهاية لازم يكون بعد البداية', true); return; }
  // منع التضارب: طلب متداخل مع إجازة قائمة أو منتظرة لنفس الموظف
  const overlap = DB.leaveRequests.some(r=>r.employeeId===empId && r.status!=='rejected' && !(new Date(to) < new Date(r.from) || new Date(from) > new Date(r.to)));
  if(overlap){ toast('فيه طلب إجازة تاني لنفس الموظف في نفس الفترة دي', true); return; }
  // فحص الرصيد للأنواع اللي بتخصم
  const st = empLeaveStats(empId);
  if(type==='دورية' && days > st.remRoutine){ toast('رصيد الإجازات الدورية مش كفاية (متبقي '+st.remRoutine+' يوم)', true); return; }

/* ---- السلف والجزاءات والرواتب (الملاحظة 20) + دورة رواتب مرنة (الملاحظة 29) ----
   الرواتب مش مربوطة بالشهر الميلادي — دورة من تاريخ لتاريخ (مثال: 25/6 → 25/7)
   وقيمة اليوم = الراتب الشهري ÷ أيام العمل المتفق عليها (قابلة للضبط، الافتراضي 26) */
function workingDays(){ const d = parseFloat(DB.settings.payrollWorkingDays); return (d>0 ? d : 26); }
function empDayValue(emp){
  if(emp.dayValue>0) return emp.dayValue;
  const wd = workingDays();
  return wd>0 ? Math.round(((emp.salary||0)/wd)*100)/100 : 0;
}
function inRange(dateStr, from, to){
  if(!dateStr) return false;
  const d = (dateStr+'').slice(0,10);
  return d >= from && d <= to;
}
/* حساب راتب فترة: الأساسي + حوافز − (سلف + غياب + جزاءات + تأمينات + استقطاعات) */
function payrollCalc(emp, from, to){
  const wd = workingDays();
  const dayVal = empDayValue(emp);
  // اليومية: الأيام الفعلية في الفترة (بحد أقصى أيام العمل) — الشهري: الراتب كامل
  const spanDays = Math.round((new Date(to) - new Date(from))/86400000) + 1;
  const base = emp.salaryType==='يومية'
    ? Math.round(dayVal * Math.min(spanDays, wd) * 100)/100
    : (emp.salary||0);
  const advances  = (emp.advances||[]).filter(a=>inRange(a.date, from, to)).reduce((s,a)=>s+(a.amount||0),0);
  const absDays   = (emp.absences||[]).filter(a=>inRange(a.date, from, to)).reduce((s,a)=>s+(a.days||1),0);
  const absenceDeduct = Math.round(dayVal*absDays*100)/100;
  const penalties = (emp.penalties||[]).filter(p=>inRange(p.date, from, to)).reduce((s,p)=>s+(p.amount||0),0);
  const bonuses   = (emp.bonuses||[]).filter(b=>inRange(b.date, from, to)).reduce((s,b)=>s+(b.amount||0),0);
  const socialIns = emp.socialIns||0, healthIns = emp.healthIns||0, otherDeduct = emp.otherDeduct||0;
  const fixed = socialIns+healthIns+otherDeduct;
  const totalDeduct = advances+absenceDeduct+penalties+fixed;
  return { base, bonuses, dayVal, wd, spanDays, advances, absDays, absenceDeduct, penalties,
           socialIns, healthIns, otherDeduct, fixed, totalDeduct,
           net: Math.round((base + bonuses - totalDeduct)*100)/100 };
}

/* ---- شاشة الرواتب بدورة مرنة (الملاحظة 29) ---- */
function defaultPayrollCycle(){
  // الافتراضي: دورة الشهر الحالي حسب يوم قفل الرواتب (مثال: 25/6 → 25/7)
  const d = parseInt(DB.settings.payrollCycleDay,10) || 25;
  const now = new Date();
  let to = new Date(now.getFullYear(), now.getMonth(), d);
  if(now.getDate() > d) to = new Date(now.getFullYear(), now.getMonth()+1, d);
  const from = new Date(to.getFullYear(), to.getMonth()-1, d);
  const iso = (x)=>new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10);
  return { from: iso(from), to: iso(to) };
}
let payrollPeriod = null;
let payrollFilter = { emp:'', dept:'' };
function getPayrollPeriod(){ if(!payrollPeriod) payrollPeriod = defaultPayrollCycle(); return payrollPeriod; }
function setPayrollFrom(v){ getPayrollPeriod(); if(v) payrollPeriod.from = v; refreshContent(); }
function setPayrollTo(v){ getPayrollPeriod(); if(v) payrollPeriod.to = v; refreshContent(); }
function setPayrollFilter(k, v){ payrollFilter[k] = v; refreshContent(); }
function periodLabel(from, to){ return fmtDate(from)+' → '+fmtDate(to); }
async function saveWorkingDays(){
  if(!isOwnerSession()){ toast('صلاحية صاحب المركز فقط', true); return; }
  const wd = parseFloat((document.getElementById('prWorkDays')||{}).value)||0;
  const cd = parseInt((document.getElementById('prCycleDay')||{}).value,10)||0;
  if(wd<=0 || wd>31){ toast('أيام العمل لازم تكون بين 1 و 31', true); return; }
  if(cd<1 || cd>28){ toast('يوم قفل الرواتب لازم يكون بين 1 و 28', true); return; }
  const oldWd = workingDays(), oldCd = parseInt(DB.settings.payrollCycleDay,10)||25;
  DB.settings.payrollWorkingDays = wd;
  DB.settings.payrollCycleDay = cd;
  await saveKey('settings');
  await logAction('تعديل إعدادات الرواتب — أيام العمل: من '+oldWd+' إلى '+wd+' · يوم القفل: من '+oldCd+' إلى '+cd);
  toast('تم حفظ إعدادات الرواتب'); refreshContent();
}

    .sort((a,b)=>new Date(b.date)-new Date(a.date))[0] || null;

function toolHoursOut(mv){ return mv ? (Date.now() - new Date(mv.date)) / 3600000 : 0; }
function isToolOverdue(mv){ return toolHoursOut(mv) > TOOL_OVERDUE_HOURS; }
function overdueTools(){
  return DB.tools.filter(t=>t.status==='مصروفة').map(t=>({ t, mv: openCheckout(t.id) }))
    .filter(x=>x.mv && isToolOverdue(x.mv));

function toolStats(){
  const s = { total: DB.tools.length };

  s.sumStatuses = TOOL_STATUS.reduce((a,st)=>a+s[st],0);
  s.mismatch = s.total - s.sumStatuses;
  return s;
}

      ${toolsCanIssue()?`<td style="width:90px"><button class="btn btn-sm btn-accent" onclick="openToolReturnModal('${t.id}')">استلام</button></td>`:''}
    </tr>`).join('')}</tbody></table>
  </div>`:''}`;
  const body = toolsView==='out' ? renderToolsOut() : toolsView==='log' ? renderToolsLog() : renderToolsList();
  return tabsBar + dash + body;
}
function renderToolsList(){
  const t = toolsSearch;
  const list = DB.tools.filter(x=>{
    if(!t) return true;
    return [x.name, x.code, x.category, x.serial, x.notes].filter(Boolean).join(' ').toLowerCase().includes(t);
  }).sort((a,b)=>(a.code||'').localeCompare(b.code||''));
  return `
  <div class="card" style="margin-bottom:16px">
    <div class="search-box" style="max-width:100%">${ICONS.search}
      <input placeholder="بحث: اسم العدة، الكود، الفئة، السيريال..." value="${toolsSearch}" oninput="setToolsSearch(this.value)"></div>
  </div>
  <div class="section-head"><h3>العدد الخاصة (${list.length})</h3>
    ${toolsCanManage()?`<button class="btn btn-accent" onclick="openNewToolModal()">${ICONS.plus} عدة جديدة</button>`:''}</div>
  <div class="card">
    <table><thead><tr><th>الكود</th><th>الاسم</th><th>الفئة</th><th>الحالة</th><th>مع مين</th><th>المدة بره</th><th></th></tr></thead>
    <tbody>${list.length? list.map(x=>{
      const mv = x.status==='مصروفة' ? openCheckout(x.id) : null;
      const over = mv && isToolOverdue(mv);
      return `<tr onclick="openToolDetail('${x.id}')" style="cursor:pointer">
        <td style="font-weight:700;color:var(--accent)">${x.code||'—'}</td>
        <td>${x.name}${x.serial?`<div class="muted" style="font-size:10.5px">سيريال: ${x.serial}</div>`:''}</td>
        <td class="muted">${x.category||'—'}</td>
        <td>${toolStatusTag(x.status)}</td>
        <td>${mv?techLabelOf(mv.technicianId):'—'}</td>
        <td style="${over?'color:var(--danger);font-weight:800':''}">${mv?durationText(mv.date):'—'}</td>
        <td onclick="event.stopPropagation()">${toolsCanIssue()? (x.status==='متاحة'
          ? `<button class="btn btn-sm btn-accent" onclick="openToolIssueModal('${x.id}')">صرف</button>`
          : x.status==='مصروفة' ? `<button class="btn btn-sm" onclick="openToolReturnModal('${x.id}')">استلام</button>` : '') : ''}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="7" class="empty">${t?'مفيش نتائج':'لسه مفيش عدد مسجلة'+(toolsCanManage()?' — دوس "عدة جديدة"':'')}</td></tr>`}
    </tbody></table>
  </div>`;
}
function renderToolsOut(){
  const out = DB.tools.filter(t=>t.status==='مصروفة').map(t=>({t, mv:openCheckout(t.id)}))
    .filter(x=>x.mv).sort((a,b)=>new Date(a.mv.date)-new Date(b.mv.date));
  return `
  <div class="section-head"><h3>📤 العدد المصروفة حالياً (${out.length})</h3></div>
  <div class="card">
    <table><thead><tr><th>الكود</th><th>العدة</th><th>الفني</th><th>وقت الصرف</th><th>المدة بره المخزن</th><th>أمر الشغل</th><th>صرفها</th><th></th></tr></thead>
    <tbody>${out.length? out.map(({t,mv})=>{
      const job = mv.jobId ? DB.jobs.find(j=>j.id===mv.jobId) : null;
      const over = isToolOverdue(mv);
      return `<tr>
        <td style="font-weight:700;color:var(--accent)">${t.code||'—'}</td>
        <td>${t.name}</td>
        <td style="font-weight:700">${techLabelOf(mv.technicianId)}</td>
        <td style="white-space:nowrap;font-size:12.5px">${fmtDateTime(mv.date)}</td>
        <td style="${over?'color:var(--danger);font-weight:800':'font-weight:700'}">${durationText(mv.date)}${over?' 🚨':''}</td>
        <td>${job?'#'+job.jobNo:'—'}</td>
        <td class="muted" style="font-size:11.5px">${mv.actor||'—'}</td>
        <td>${toolsCanIssue()?`<button class="btn btn-sm btn-accent" onclick="openToolReturnModal('${t.id}')">استلام</button>`:''}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="8" class="empty">مفيش عدد بره المخزن 👏</td></tr>`}
    </tbody></table>
  </div>`;
}
function renderToolsLog(){
  const moves = [...DB.toolMoves].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,200);
  return `
  <div class="section-head"><h3>📋 سجل حركة العدد (آخر ${moves.length})</h3></div>
  <div class="card">
    <table><thead><tr><th>الوقت</th><th>الحركة</th><th>العدة</th><th>الفني</th><th>المدة</th><th>الحالة عند الاستلام</th><th>بواسطة</th></tr></thead>
    <tbody>${moves.length? moves.map(m=>{
      const t = DB.tools.find(x=>x.id===m.toolId);
      return `<tr>
        <td style="white-space:nowrap;font-size:12px">${fmtDateTime(m.date)}</td>
        <td>${m.type==='out'?'<span class="tag tag-working">صرف</span>':'<span class="tag tag-paid">استلام</span>'}</td>
        <td>${t?t.name:'—'} <span class="muted" style="font-size:11px">${t?(t.code||''):''}</span></td>
        <td>${m.technicianId?techLabelOf(m.technicianId):'—'}</td>
        <td>${m.type==='in'&&m.durationFrom?durationText(m.durationFrom, m.date):'—'}</td>
        <td>${m.condition||'—'}</td>
        <td class="muted" style="font-size:11.5px">${m.actor||'—'}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="7" class="empty">مفيش حركات مسجلة</td></tr>`}
    </tbody></table>
  </div>`;
}
/* ---- بيانات العدة ---- */
function toolFormHTML(x){
  x = x || {};
  return `
    <div class="grid g2">
      <div class="form-row"><label class="f-label">اسم العدة</label><input class="f" id="tlName" value="${x.name||''}" placeholder="مثال: جهاز فحص أعطال"></div>
      <div class="form-row"><label class="f-label">كود العدة</label><input class="f" id="tlCode" value="${x.code||('ST-'+nextNo(DB.tools,'seq'))}"></div>
    </div>
    <div class="grid g2">
      <div class="form-row"><label class="f-label">الفئة</label>
        <select class="f" id="tlCat">${TOOL_CATEGORIES.map(c=>`<option value="${c}" ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="form-row"><label class="f-label">الرقم التسلسلي (اختياري)</label><input class="f" id="tlSerial" value="${x.serial||''}"></div>
    </div>
    <div class="grid g2">
      <div class="form-row"><label class="f-label">تاريخ الشراء</label><input class="f" id="tlDate" type="date" value="${x.purchaseDate||new Date().toISOString().slice(0,10)}"></div>
      <div class="form-row"><label class="f-label">تكلفة الشراء</label><input class="f" id="tlCost" type="number" min="0" value="${x.cost||0}"></div>
    </div>
    <div class="grid g2">
      <div class="form-row"><label class="f-label">المورد (اختياري)</label>
        <select class="f" id="tlSupplier"><option value="">— بدون —</option>${activeSuppliers().map(s=>`<option value="${s.id}" ${x.supplierId===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
      <div class="form-row"><label class="f-label">الحالة</label>
        <select class="f" id="tlStatus">${TOOL_STATUS.map(s=>`<option value="${s}" ${(x.status||'متاحة')===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div class="form-row"><label class="f-label">ملاحظات (اختياري)</label><input class="f" id="tlNotes" value="${x.notes||''}"></div>`;
}
function readToolForm(){
  return {
    name: document.getElementById('tlName').value.trim(),
    code: document.getElementById('tlCode').value.trim(),
    category: (document.getElementById('tlCat')||{}).value,
    serial: document.getElementById('tlSerial').value.trim(),
    purchaseDate: (document.getElementById('tlDate')||{}).value,
    cost: parseFloat(document.getElementById('tlCost').value)||0,
    supplierId: (document.getElementById('tlSupplier')||{}).value || null,
    status: (document.getElementById('tlStatus')||{}).value || 'متاحة',
    notes: document.getElementById('tlNotes').value.trim()
  };
}
function openNewToolModal(){
  if(!toolsCanManage()){ toast('إضافة العدد صلاحية صاحب المركز فقط', true); return; }
  openModal(`<h3>عدة خاصة جديدة</h3>${toolFormHTML()}
    <button class="btn btn-accent" style="width:100%" onclick="saveNewTool()">حفظ العدة</button>`);
}
async function saveNewTool(){
  if(!toolsCanManage()){ toast('إضافة العدد صلاحية صاحب المركز فقط', true); return; }
  const f = readToolForm();
  if(!f.name){ toast('اكتب اسم العدة', true); return; }
  if(!f.code){ toast('اكتب كود العدة', true); return; }
  if(DB.tools.some(t=>t.code===f.code)){ toast('الكود ده مستخدم بالفعل', true); return; }
  DB.tools.push({ id:uid('tl'), seq: nextNo(DB.tools,'seq'), ...f, createdAt:new Date().toISOString() });
  await saveKey('tools');
  await logAction('إضافة عدة خاصة: '+f.name+' ('+f.code+')');
  closeModal(); toast('تم حفظ العدة'); refreshContent();
}
function openEditToolModal(toolId){
  if(!toolsCanManage()){ toast('التعديل صلاحية صاحب المركز فقط', true); return; }
  const x = DB.tools.find(t=>t.id===toolId);
  if(!x) return;
  openModal(`<h3>تعديل العدة — ${x.name}</h3>${toolFormHTML(x)}
    <button class="btn btn-accent" style="width:100%" onclick="saveToolEdit('${toolId}')">حفظ التعديلات</button>`);
}
async function saveToolEdit(toolId){
  if(!toolsCanManage()){ toast('التعديل صلاحية صاحب المركز فقط', true); return; }
  const x = DB.tools.find(t=>t.id===toolId);
  if(!x) return;
  const f = readToolForm();
  if(!f.name){ toast('اكتب اسم العدة', true); return; }
  if(DB.tools.some(t=>t.code===f.code && t.id!==toolId)){ toast('الكود ده مستخدم بالفعل', true); return; }
  const oldStatus = x.status;
  Object.assign(x, f);
  await saveKey('tools');
  await logAction('تعديل العدة: '+x.name+(oldStatus!==f.status?' — الحالة من "'+oldStatus+'" إلى "'+f.status+'"':''));
  closeModal(); toast('تم حفظ التعديلات'); refreshContent();
}
function deleteTool(toolId){
  if(!toolsCanManage()){ toast('الحذف صلاحية صاحب المركز فقط', true); return; }
  const x = DB.tools.find(t=>t.id===toolId);
  if(!x) return;
  if(x.status==='مصروفة'){ toast('مينفعش تحذف عدة مصروفة — استلمها الأول', true); return; }
  const hasHistory = DB.toolMoves.some(m=>m.toolId===toolId);
  askConfirmReason('حذف العدة «'+x.name+'» نهائياً؟'+(hasHistory?'<br><span class="muted" style="font-size:12px">ليها سجل حركة — الأفضل تخليها "خارج الخدمة" بدل الحذف عشان السجل يفضل مفهوم.</span>':''), async (reason)=>{
    DB.tools = DB.tools.filter(t=>t.id!==toolId);
    await saveKey('tools');
    const supT = x.supplierId ? (DB.suppliers.find(s=>s.id===x.supplierId)||{}).name : null;
    await logAction('🗑️ حذف عدة خاصة «'+x.name+'»'+auditDetails([
      ['الكود', x.code], ['الفئة', x.category], ['السيريال', x.serial],
      ['التكلفة', x.cost?money(x.cost):null], ['تاريخ الشراء', x.purchaseDate?fmtDate(x.purchaseDate):null],
      ['المورد', supT], ['الحالة قبل الحذف', x.status],
      ['عدد حركات الصرف/الاستلام', DB.toolMoves.filter(m=>m.toolId===toolId).length||null],
      ['السبب', reason||'—']
    ]));
    closeModal(); toast('تم حذف العدة'); refreshContent();
  });
}
function openToolDetail(toolId){
  const x = DB.tools.find(t=>t.id===toolId);
  if(!x) return;
  const mv = openCheckout(toolId);
  const sup = x.supplierId ? DB.suppliers.find(s=>s.id===x.supplierId) : null;
  const history = DB.toolMoves.filter(m=>m.toolId===toolId).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const outs = DB.toolMoves.filter(m=>m.toolId===toolId && m.type==='out').length;
  openModal(`
    <h3>${x.name} <span class="muted" style="font-size:12px">${x.code||''}</span></h3>
    <div style="margin-bottom:10px">${toolStatusTag(x.status)}
      <span class="muted" style="font-size:12px;margin-right:8px">${x.category||'—'}${x.serial?' · سيريال: '+x.serial:''} · شراء: ${x.purchaseDate?fmtDate(x.purchaseDate):'—'} · التكلفة: ${money(x.cost||0)}${sup?' · المورد: '+sup.name:''}</span></div>
    ${x.notes?`<div class="muted" style="font-size:12px;margin-bottom:10px">📝 ${x.notes}</div>`:''}
    ${mv?`<div class="card" style="margin-bottom:12px;${isToolOverdue(mv)?'border:1px solid var(--danger)':''}">
      <div style="font-weight:800">📤 مصروفة حالياً مع: ${techLabelOf(mv.technicianId)}</div>
      <div class="muted" style="font-size:12.5px;margin-top:4px">من ${fmtDateTime(mv.date)} · <b style="${isToolOverdue(mv)?'color:var(--danger)':'color:var(--accent)'}">بره المخزن من ${durationText(mv.date)}</b>${mv.jobId?' · أمر شغل #'+((DB.jobs.find(j=>j.id===mv.jobId)||{}).jobNo||'—'):''}</div>
      ${mv.purpose?`<div class="muted" style="font-size:12px;margin-top:4px">الغرض: ${mv.purpose}</div>`:''}
    </div>`:''}
    <div class="grid g2" style="margin-bottom:12px">
      ${stat(String(outs),'عدد مرات الصرف')}
      ${stat(String(history.length),'إجمالي الحركات')}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      ${toolsCanIssue() && x.status==='متاحة' ? `<button class="btn btn-accent" style="flex:1" onclick="openToolIssueModal('${toolId}')">📤 صرف لفني</button>`:''}
      ${toolsCanIssue() && x.status==='مصروفة' ? `<button class="btn btn-accent" style="flex:1" onclick="openToolReturnModal('${toolId}')">📥 استلام</button>`:''}
      ${toolsCanManage()?`<button class="btn" style="flex:1" onclick="openEditToolModal('${toolId}')">✏️ تعديل</button>`:''}
      ${toolsCanManage()?`<button class="btn btn-danger" style="flex:1" onclick="deleteTool('${toolId}')">حذف</button>`:''}
    </div>
    <label class="f-label">سجل حركة العدة (${history.length})</label>
    <table style="margin-top:6px"><tbody>
    ${history.length? history.map(m=>`<tr>
      <td style="font-size:12px;white-space:nowrap">${fmtDateTime(m.date)}</td>
      <td>${m.type==='out'?'<span class="tag tag-working">صرف</span>':'<span class="tag tag-paid">استلام</span>'}</td>
      <td>${m.technicianId?techLabelOf(m.technicianId):'—'}</td>
      <td>${m.type==='in'&&m.durationFrom?durationText(m.durationFrom, m.date):''}${m.condition?' · '+m.condition:''}</td>
      <td class="muted" style="font-size:11px">${m.actor||'—'}</td>
    </tr>`).join('') : '<tr><td class="empty">مفيش حركات</td></tr>'}
    </tbody></table>
  `);
}
/* ---- صرف العدة ---- */
function openToolIssueModal(toolId){
  if(!toolsCanIssue()){ toast('الصرف صلاحية المخزن أو صاحب المركز فقط', true); return; }
  const x = DB.tools.find(t=>t.id===toolId);
  if(!x) return;
  if(x.status!=='متاحة'){ toast('العدة مش متاحة (حالتها: '+x.status+')', true); return; }
  const techs = techEmployees();
  if(techs.length===0){ toast('مفيش فنيين نشطين في الموارد البشرية', true); return; }
  const openJobs = DB.jobs.filter(j=>!isJobClosed(j) && j.status!=='ملغاة');
  openModal(`
    <h3>📤 صرف عدة — ${x.name} <span class="muted" style="font-size:12px">${x.code||''}</span></h3>
    <div class="form-row"><label class="f-label">الفني المستلم</label>
      <select class="f" id="tiTech">${techOptionsHTML()}</select></div>
    <div class="form-row"><label class="f-label">أمر الشغل المرتبط (اختياري)</label>
      <select class="f" id="tiJob"><option value="">— بدون —</option>${openJobs.map(j=>{
        const car = DB.cars.find(c=>c.id===j.carId)||{};
        return `<option value="${j.id}">#${j.jobNo} — ${car.plate||''}</option>`;
      }).join('')}</select></div>
    <div class="form-row"><label class="f-label">الغرض / ملاحظات</label><input class="f" id="tiPurpose" placeholder="مثال: فك فلتر زيت"></div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">⏱️ وقت الصرف بيتسجل تلقائياً، والعداد هيبدأ على طول.</div>
    <button class="btn btn-accent" style="width:100%" onclick="saveToolIssue('${toolId}')">تأكيد الصرف</button>
  `);
}
async function saveToolIssue(toolId){
  if(!toolsCanIssue()){ toast('الصرف صلاحية المخزن أو صاحب المركز فقط', true); return; }
  const x = DB.tools.find(t=>t.id===toolId);
  if(!x) return;
  if(x.status!=='متاحة'){ toast('العدة مش متاحة', true); return; }
  const techId = (document.getElementById('tiTech')||{}).value;
  const jobId = (document.getElementById('tiJob')||{}).value || null;
  const purpose = ((document.getElementById('tiPurpose')||{}).value||'').trim();
  if(!techId){ toast('اختار الفني المستلم', true); return; }
  x.status = 'مصروفة';
  DB.toolMoves.push({ id:uid('tm'), toolId, type:'out', technicianId:techId, jobId, purpose,
    date:new Date().toISOString(), actor:actorName(), returnedAt:null });
  await Promise.all([saveKey('tools'), saveKey('toolMoves')]);
  const job = jobId ? DB.jobs.find(j=>j.id===jobId) : null;
  await logAction('صرف عدة: '+x.name+' ('+x.code+') للفني '+techLabelOf(techId)+(job?' — أمر شغل #'+job.jobNo:''));
  closeModal(); toast('تم صرف العدة للفني '+techLabelOf(techId)+' — العداد بدأ'); refreshContent();
}
/* ---- استلام العدة ---- */
function openToolReturnModal(toolId){
  if(!toolsCanIssue()){ toast('الاستلام صلاحية المخزن أو صاحب المركز فقط', true); return; }
  const x = DB.tools.find(t=>t.id===toolId);
  const mv = openCheckout(toolId);
  if(!x || !mv){ toast('العدة دي مش مصروفة', true); return; }
  openModal(`
    <h3>📥 استلام عدة — ${x.name} <span class="muted" style="font-size:12px">${x.code||''}</span></h3>
    <div class="card" style="margin-bottom:12px">
      <div>مصروفة للفني: <b>${techLabelOf(mv.technicianId)}</b></div>
      <div class="muted" style="font-size:12.5px;margin-top:4px">من ${fmtDateTime(mv.date)} · <b style="color:var(--accent)">مدة الاستخدام: ${durationText(mv.date)}</b></div>
    </div>
    <div class="form-row"><label class="f-label">حالة العدة عند الاستلام</label>
      <select class="f" id="trCond">${TOOL_CONDITIONS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
    <div class="form-row"><label class="f-label">ملاحظات (اختياري)</label><input class="f" id="trNote"></div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">لو الحالة مش "سليمة"، حالة العدة هتتغير تلقائياً (تحت الصيانة / تالفة) بدل ما ترجع متاحة.</div>
    <button class="btn btn-accent" style="width:100%" onclick="saveToolReturn('${toolId}')">تأكيد الاستلام</button>
  `);
}
async function saveToolReturn(toolId){
  if(!toolsCanIssue()){ toast('الاستلام صلاحية المخزن أو صاحب المركز فقط', true); return; }
  const x = DB.tools.find(t=>t.id===toolId);
  const mv = openCheckout(toolId);
  if(!x || !mv){ toast('العدة دي مش مصروفة', true); return; }
  const cond = (document.getElementById('trCond')||{}).value || 'سليمة';
  const note = ((document.getElementById('trNote')||{}).value||'').trim();
  const now = new Date().toISOString();
  // الحالة الجديدة حسب حالة الاستلام
  x.status = cond==='سليمة' ? 'متاحة' : (cond==='تالفة' ? 'تالفة' : 'تحت الصيانة');
  mv.returnedAt = now;
  DB.toolMoves.push({ id:uid('tm'), toolId, type:'in', technicianId:mv.technicianId, jobId:mv.jobId,
    condition:cond, note, durationFrom:mv.date, date:now, actor:actorName() });
  await Promise.all([saveKey('tools'), saveKey('toolMoves')]);
  await logAction('استلام عدة: '+x.name+' ('+x.code+') من الفني '+techLabelOf(mv.technicianId)+
    ' — مدة الاستخدام: '+durationText(mv.date, now)+' — الحالة: '+cond);
  closeModal();
  toast('تم الاستلام — مدة الاستخدام: '+durationText(mv.date, now)+(cond!=='سليمة'?' — الحالة: '+x.status:''));
  refreshContent();
}

/* ======================= NOTIFICATION CENTER — مركز الإشعارات والحوكمة (الملاحظة 33) =======================
   طبقة مراقبة فقط: بتسجّل الإجراءات الحساسة اللي نفّذها المفوَّضون عشان صاحب المركز يتابع —
   من غير ما توقف أي عملية أو تلغي أي صلاحية. المدير بيعتمد جوه قسمه، والأدمن بيتفرّج ويحاسب. */
const NOTIF_PRIORITY = { critical:'حرجة', high:'عالية', medium:'متوسطة', low:'منخفضة' };
const NOTIF_PRIORITY_ORDER = ['critical','high','medium','low'];
const NOTIF_CAT_LABEL = { hr:'موارد بشرية', inventory:'المخزون', financial:'مالية', jobs:'أوامر الشغل', permissions:'الصلاحيات' };
function currentPosition(){
  if(!session) return '—';
  const dept = ROLE_LABEL[session.role]||session.role;
  const tpl = session.template ? (ROLE_TEMPLATES[session.template]||{}).label : null;
  return tpl ? dept+' / '+tpl : dept;
}
/* الدالة المركزية — بتنشئ إشعار للأدمن (مراقبة). آمنة: أي خطأ ما بيوقفش العملية الأصلية */
function pushNotif(opts){
  try{
    if(isOwnerSession()) return;   // الأدمن نفسه مش محتاج إشعار بأفعاله
    const n = {
      id: uid('ntf'), notifNo: nextNo(DB.notifications,'notifNo'),
      category: opts.category||'jobs', type: opts.type||'', priority: opts.priority||'medium',
      userName: session ? (session.staffName||ROLE_LABEL[session.role]||'—') : '—',
      dept: session ? (ROLE_LABEL[session.role]||session.role) : '—',
      position: currentPosition(),
      action: opts.action||'', amount: opts.amount||0,
      refType: opts.refType||null, refId: opts.refId||null, refNo: opts.refNo||null,
      status: 'completed',   // الإجراء اتنفّذ فعلاً (المفوَّض معاه صلاحية) — للمتابعة فقط
      comments: [], seen: false, date: new Date().toISOString()
    };
    DB.notifications.push(n);
    if(DB.notifications.length>1000) DB.notifications = DB.notifications.slice(-1000);
    saveKey('notifications').catch(()=>{});
  }catch(e){ /* المراقبة ماتوقفش التشغيل أبداً */ }
}
/* التنبيهات الحيّة (محسوبة لحظياً — مش متخزنة): مديونيات، طلبات منتظرة، هالك مستني */
function debtReminders(){
  const now = Date.now();
  const out = [];
  DB.invoices.filter(i=>!i.cancelled).forEach(inv=>{
    const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
    const due = inv.total - paid;
    if(due <= 0.5) return;
    const cust = DB.customers.find(c=>c.id===inv.customerId);
    const isCompany = cust && cust.custType==='شركة';
    const days = Math.floor((now - new Date(inv.date))/86400000);
    const interval = isCompany ? 30 : 10;
    if(days < interval) return;
    out.push({ inv, cust, due, days, isCompany, interval });
  });
  return out.sort((a,b)=>b.due-a.due);
}
function pendingLeaveReqs(){ return DB.leaveRequests.filter(r=>r.status==='pending'); }
function pendingPermits(kind){ return DB.permits.filter(p=>p.status==='pending' && (!kind||p.kind===kind)); }
function damagedWaiting(){ return DB.tools.filter(t=>t.status==='تالفة' || t.status==='تحت الصيانة'); }
/* موظفين سلفهم عالية: إجمالي سلف الدورة الحالية ≥ نسبة من الراتب (افتراضي 50%) */
function highAdvanceEmployees(){
  const pct = DB.settings.highAdvancePct || 50;
  const { from, to } = (typeof getPayrollPeriod==='function' ? getPayrollPeriod() : { from:'2000-01-01', to:'2999-01-01' });
  const inR = (d)=>{ const x=(d||'').slice(0,10); return x>=from && x<=to; };
  return DB.employees.filter(e=>e.status==='نشط' && (e.salary||0)>0).map(e=>{
    const adv = (e.advances||[]).filter(a=>inR(a.date)).reduce((s,a)=>s+(a.amount||0),0);
    return { e, adv, ratio: adv/(e.salary||1)*100 };
  }).filter(x=>x.ratio >= pct).sort((a,b)=>b.ratio-a.ratio);
}
/* موظفين غيابهم عالي: أيام غياب الدورة الحالية ≥ حد (افتراضي 3 أيام) */
function highAbsenceEmployees(){
  const th = DB.settings.highAbsenceDays || 3;
  const { from, to } = (typeof getPayrollPeriod==='function' ? getPayrollPeriod() : { from:'2000-01-01', to:'2999-01-01' });
  const inR = (d)=>{ const x=(d||'').slice(0,10); return x>=from && x<=to; };
  return DB.employees.filter(e=>e.status==='نشط').map(e=>{
    const days = (e.absences||[]).filter(a=>inR(a.date)).reduce((s,a)=>s+(a.days||1),0);
    return { e, days };
  }).filter(x=>x.days >= th).sort((a,b)=>b.days-a.days);
}
/* قطع راكدة: رصيد موجود + مفيش أي صرف من فترة (افتراضي 90 يوم) */
function stagnantParts(){
  const days = DB.settings.stagnantDays || 90;
  const cutoff = Date.now() - days*86400000;
  return activeInventory().filter(p=>{
    if((p.qty||0) <= 0) return false;
    if(p.createdAt && new Date(p.createdAt).getTime() > cutoff) return false; // صنف جديد لسه
    const lastOut = DB.stockMoves.filter(m=>m.partId===p.id && (m.type==='out')).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    if(!lastOut) return true; // مااتصرفش خالص
    return new Date(lastOut.date).getTime() < cutoff;
  }).map(p=>{
    const lastOut = DB.stockMoves.filter(m=>m.partId===p.id && m.type==='out').sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    return { p, lastOut: lastOut?lastOut.date:null, value: (p.qty||0)*(p.costPrice||0) };
  }).sort((a,b)=>b.value-a.value);
}
function lowStockParts(){ return activeInventory().filter(p=>(p.qty||0) <= (p.minQty||0)); }
function overdueCustodiesAlert(){ return (typeof overdueCustodies==='function') ? overdueCustodies() : []; }
function liveAlertsCount(){
  return debtReminders().length + pendingLeaveReqs().length + pendingPermits().length + damagedWaiting().length
    + highAdvanceEmployees().length + highAbsenceEmployees().length + stagnantParts().length + lowStockParts().length
    + overdueCustodiesAlert().length;
}
function unseenNotifCount(){ return DB.notifications.filter(n=>!n.seen).length; }
function pendingNotifCount(){
  if(!session || !canScreen('notifications')) return 0;
  return unseenNotifCount() + liveAlertsCount();
}
let notifFilter = { category:'', priority:'', status:'' };
let notifShowArchived = false;
function setNotifFilter(k,v){ notifFilter[k]=v; refreshContent(); }
function toggleNotifArchive(){ notifShowArchived = !notifShowArchived; refreshContent(); }
function priorityTag(p){
  const c = p==='critical'?'tag-unpaid': p==='high'?'tag-inspect': p==='medium'?'tag-working':'tag-received';
  return `<span class="tag ${c}">${NOTIF_PRIORITY[p]||p}</span>`;
}
function notifStatusTag(s){
  if(s==='approved') return '<span class="tag tag-paid">تمت المراجعة</span>';
  if(s==='rejected') return '<span class="tag tag-unpaid">مرفوض</span>';
  if(s==='pending') return '<span class="tag tag-inspect">منتظر</span>';
  return '<span class="tag tag-working">مكتمل</span>';
}

async function addNotifComment(id){
  const n = DB.notifications.find(x=>x.id===id); if(!n) return;
  const el = document.getElementById('notifComment'); const t = (el?el.value:'').trim();
  if(!t){ toast('اكتب التعليق', true); return; }
  if(!n.comments) n.comments = [];
  n.comments.push({ text:t, by:actorName(), at:new Date().toISOString() });
  await saveKey('notifications');
  toast('تم إضافة التعليق'); openNotifDetail(id);
}
async function setNotifStatus(id, status){
  const n = DB.notifications.find(x=>x.id===id); if(!n) return;
  n.status = status; n.seen = true;
  await saveKey('notifications');
  await logAction((status==='approved'?'مراجعة':'وضع علامة متابعة على')+' إشعار #'+n.notifNo+': '+n.action);
  closeModal(); toast('تم التحديث'); refreshContent();
}
async function markAllNotifsSeen(){
  DB.notifications.forEach(n=>{ n.seen = true; });
  await saveKey('notifications');
  toast('اتحددوا كلهم كمقروء'); refreshContent();
}
function openNotifRecord(id){
  const n = DB.notifications.find(x=>x.id===id); if(!n) return;
  closeModal();
  if(n.refType==='job' && n.refId){ openJobDetail(n.refId); }
  else if(n.refType==='employee' && n.refId){ currentTab='hr'; render(); openEmployeeDetail(n.refId); }
  else if(n.refType==='invoice'){ goTab('invoices'); }
  else if(n.refType==='inventory'){ goTab('stockmoves'); }
  else if(n.refType==='expense'){ goTab('expenses'); }
  else { toast('السجل المرتبط مش متاح للفتح المباشر', true); }
}

function refreshAuditTable(){ const b=document.getElementById('auditTableBody'); if(b) b.innerHTML = auditRowsHTML(); }
function auditRowsHTML(){
  const f = auditFilters;
  let list = [...DB.activityLog].sort((a,b)=>new Date(b.date)-new Date(a.date));
  list = list.filter(l=>{
    const actor = l.actor || l.role || '';
    if(f.actor && actor!==f.actor) return false;
    if(f.text && !l.text.toLowerCase().includes(f.text.trim().toLowerCase())) return false;
    if(f.dateFrom && new Date(l.date) < new Date(f.dateFrom)) return false;
    if(f.dateTo && new Date(l.date) > new Date(new Date(f.dateTo).getTime()+86399999)) return false;
    if(f.refNo && !l.text.includes('#'+f.refNo.trim())) return false;
    return true;
  }).slice(0,300);
  if(list.length===0) return `<tr><td colspan="4" class="empty">لا توجد عمليات مطابقة</td></tr>`;
  return list.map(l=>`<tr>
    <td style="white-space:nowrap">${fmtDateTime(l.date)}</td>
    <td style="font-weight:700">${l.actor||l.role||'—'}</td>
    <td class="muted" style="font-size:11.5px">${l.device||'—'}</td>
    <td>${l.text}</td></tr>`).join('');
}

function templateOptionsFor(dept){
  const tpls = allTemplates();
  const list = Object.entries(tpls).filter(([,t])=>t.dept===dept || t.custom);

  return `<option value="">— بدون قالب (افتراضي القسم) —</option>`+
    list.map(([k,t])=>`<option value="${k}">${t.custom?'⭐ ':''}${t.label}</option>`).join('');
}

  const dept = (document.getElementById('stDept')||{}).value || 'reception';
  const sel = document.getElementById('stTemplate');
  if(sel) sel.innerHTML = templateOptionsFor(dept);
}
async function saveNewStaff(){
  if(!can('settings.users')){ toast('مالكش صلاحية إدارة المستخدمين', true); return; }
  const name = document.getElementById('stName').value.trim();
  const dept = (document.getElementById('stDept')||{}).value || 'reception';
  const template = (document.getElementById('stTemplate')||{}).value || '';
  const username = document.getElementById('stUser').value.trim();
  const password = document.getElementById('stPass').value;
  if(!name || !username || !password){ toast('اكتب اسم الموظف واسم المستخدم وكلمة المرور', true); return; }
  if(password.length<4){ toast('كلمة المرور لازم تكون 4 حروف/أرقام على الأقل', true); return; }
  if(DB.staff.some(s=>s.username.toLowerCase()===username.toLowerCase())){ toast('اسم المستخدم ده موجود بالفعل', true); return; }
  const tpl = allTemplates()[template];
  const perms = tpl ? { screens:[...tpl.screens], actions:[...tpl.actions] } : fullDeptPerms(dept);
  const emp = DB.employees.find(e=>e.name===name && e.status==='نشط');
  DB.staff.push({ id:uid('st'), name, username, password,
    dept, role: dept, template, employeeId: emp?emp.id:null,
    screens: perms.screens, actions: perms.actions, permsV: 2,
    active:true, createdAt:new Date().toISOString() });
  await saveKey('staff', DB.staff);
  await logAction('إنشاء مستخدم: '+name+' — القسم: '+(ROLE_LABEL[dept]||dept)+(tpl?' — القالب: '+tpl.label:'')+' — '+perms.screens.length+' شاشة و'+perms.actions.length+' إجراء');
  toast('تم إنشاء حساب '+name); refreshContent();
}

   المستوى 3: الصلاحيات التفصيلية لكل إجراء — مع بحث وⓘ شرح وقوالب مخصصة */
function permRowHTML(id, checked, label, info){
  const searchKey = normSearch(label+' '+(info||''));
  return `<label class="permrow" data-search="${searchKey}" style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;cursor:pointer">
    <input type="checkbox" id="${id}" ${checked?'checked':''} style="width:16px;height:16px"> <span>${label}</span>
    ${info?`<span title="${info.replace(/"/g,'&quot;')}" onclick="event.preventDefault();toast(this.getAttribute('title'))" style="cursor:help;color:var(--accent-2);font-size:12px;font-weight:800">ⓘ</span>`:''}
  </label>`;
}
function filterPermsUI(q){
  const key = normSearch(q||'');
  if(typeof document.querySelectorAll !== 'function') return; // بيئة الاختبار
  document.querySelectorAll('.permrow').forEach(el=>{
    el.style.display = (!key || (el.getAttribute('data-search')||'').includes(key)) ? 'flex' : 'none';
  });
}
/* هل النص بيطابق صلاحية معينة؟ (منطق البحث — مفصول للاختبار) */
function permMatchesSearch(q, label, info){
  const key = normSearch(q||'');
  if(!key) return true;
  return normSearch(label+' '+(info||'')).includes(key);
}

function collectPermSelections(){
  const screens = Object.keys(SCREEN_LABELS).filter(s=>{ const el = document.getElementById('pm_scr_'+s); return el && el.checked; });
  const actions = ALL_ACTIONS.filter(k=>{ const el = document.getElementById('pm_act_'+k.replace(/\./g,'_')); return el && el.checked; });
  return { screens, actions };
}
function applyPermTemplate(tplKey){
  const tpl = allTemplates()[tplKey];
  if(!tpl) return;
  Object.keys(SCREEN_LABELS).forEach(s=>{ const el = document.getElementById('pm_scr_'+s); if(el) el.checked = tpl.screens.includes(s); });
  ALL_ACTIONS.forEach(k=>{ const el = document.getElementById('pm_act_'+k.replace(/\./g,'_')); if(el) el.checked = tpl.actions.includes(k); });
  toast('اتطبّق قالب: '+tpl.label+' — دوس حفظ للتأكيد');
}
async function saveCustomTemplate(staffId){
  if(!can('settings.users')){ toast('مالكش صلاحية إدارة المستخدمين', true); return; }
  const name = ((document.getElementById('pmNewTplName')||{}).value||'').trim();
  if(!name){ toast('اكتب اسم القالب الأول', true); return; }
  const sel = collectPermSelections();
  DB.settings.customTemplates = DB.settings.customTemplates || {};
  const key = 'custom_'+uid('tpl');
  DB.settings.customTemplates[key] = { label:name, screens:sel.screens, actions:sel.actions };
  await saveKey('settings', DB.settings);
  await logAction('حفظ قالب صلاحيات مخصص: «'+name+'» — '+sel.screens.length+' شاشة و'+sel.actions.length+' إجراء');
  toast('اتحفظ القالب «'+name+'» — هيظهر في قوائم القوالب');
}
async function savePerms(staffId){
  if(!can('settings.users')){ toast('مالكش صلاحية إدارة المستخدمين', true); return; }
  const st = DB.staff.find(s=>s.id===staffId);
  if(!st) return;
  const dept = st.dept || st.role;
  const oldScreens = Array.isArray(st.screens) ? [...st.screens] : fullDeptPerms(dept).screens;
  const oldActions = Array.isArray(st.actions) ? [...st.actions] : fullDeptPerms(dept).actions;
  // الملاحظة 41: بنقرا كل شاشات السيستم (أساسية + إضافية) مش شاشات القسم بس
  const sel = collectPermSelections();
  const screens = sel.screens, actions = sel.actions;
  const tplSel = (document.getElementById('pmTemplate')||{}).value || '';
  st.screens = screens; st.actions = actions;
  st.permsV = 2;   // صلاحيات صريحة ومستقلة — مفيش توسعة توافق بعد كده
  if(tplSel) st.template = tplSel;
  st.dept = dept; st.role = dept;
  await saveKey('staff', DB.staff);
  const diff = (a,b,fn)=>{
    const added = b.filter(x=>!a.includes(x)).map(fn);
    const removed = a.filter(x=>!b.includes(x)).map(fn);
    return [added.length?'+ '+added.join('، '):'', removed.length?'− '+removed.join('، '):''].filter(Boolean).join(' | ') || 'بدون تغيير';
  };
  const scrDiff = diff(oldScreens, screens, s=>SCREEN_LABELS[s]||s);
  const actDiff = diff(oldActions, actions, k=>actionLabel(k));
  await logAction('تعديل صلاحيات «'+st.name+'» — الشاشات: '+scrDiff+' · الإجراءات: '+actDiff);
  pushNotif({ category:'permissions', type:'permission_change', priority:'critical',
    action:'تعديل صلاحيات المستخدم «'+st.name+'» — الشاشات: '+scrDiff+' · الإجراءات: '+actDiff });
  closeModal(); toast('تم حفظ صلاحيات '+st.name); refreshContent();
}
async function toggleStaff(id){
  const st = DB.staff.find(s=>s.id===id);

}

// بناء كائن النسخة الاحتياطية — كل أنواع البيانات (DATA_KEYS) + المستخدمين والإعدادات (KV_KEYS)
function buildBackupObject(){
  const backup = { exportedAt: new Date().toISOString(), appVersion: APP_VERSION };
  DATA_KEYS.forEach(k=>{ backup[k] = DB[k]; });
  KV_KEYS.forEach(k=>{ backup[k] = DB[k]; });
  return backup;
}
function exportBackup(){
  const backup = buildBackupObject();
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'garage-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  const total = DATA_KEYS.reduce((s,k)=>s+((DB[k]||[]).length||0),0);
  // سجّل تاريخ آخر نسخة احتياطية (لتذكير الـ backup الدوري)
  DB.settings.lastBackupAt = new Date().toISOString();
  saveKey('settings', DB.settings);
  toast('تم تحميل النسخة الاحتياطية الكاملة ('+total+' سجل)');
  refreshContent();
}
/* حالة تذكير النسخة الاحتياطية: المدة المختارة، آخر نسخة، وهل فات الموعد */
function backupStatus(){
  const days = (DB.settings && DB.settings.backupReminderDays) || 7;
  const lastStr = DB.settings && DB.settings.lastBackupAt;
  const last = lastStr ? new Date(lastStr) : null;
  const daysSince = last ? Math.floor((Date.now() - last.getTime())/86400000) : null;
  const overdue = !last || daysSince >= days;
  return { intervalDays: days, last, lastStr, daysSince, overdue };
}
async function saveBackupInterval(){

  DB.settings.backupReminderDays = v;
  await saveKey('settings', DB.settings);

}
async function importBackup(){
  const fileInput = document.getElementById('restoreFile');
  const file = fileInput.files[0];
  if(!file){ toast('اختار ملف النسخة الاحتياطية أولاً', true); return; }
  askConfirm('هل أنت متأكد؟ سيتم استبدال كل البيانات الحالية بالكامل بمحتوى الملف.', async ()=>{
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      for(const key of [...DATA_KEYS, ...KV_KEYS]){
        if(data[key]!==undefined){ DB[key] = data[key]; await saveKey(key, DB[key]); }
      }
      toast('تم استرجاع البيانات بنجاح'); render();
    }catch(e){ toast('الملف غير صالح', true); }
  });
}

/* ---- الحماية من الضغط المتكرر + مراقبة الأداء (الملاحظة 12) ---- */
window._opBusy = false;
window._lastOpSig = ''; window._lastOpAt = 0;
window._perfLog = [];
function setBusy(on){
  document.body.classList.toggle('busy', on);
  let bar = document.getElementById('busyBar');
  if(!bar){ bar = document.createElement('div'); bar.id='busyBar'; bar.textContent='⏳ جاري تنفيذ العملية...'; document.body.appendChild(bar); }
  bar.style.display = on ? 'block' : 'none';
}
(function wrapExecutiveOps(){
  const opNames = ['saveNewCustomer','saveNewCar','saveNewJob','saveServiceRow','saveEditJobItem','saveExtItem',
    'createInvoiceFromJob','savePayment','saveExpense','saveNewPart','saveEditItem','saveStockIn','saveStockOut',
    'savePaintOut','saveExtOutFromStock','saveNewSupplier','saveSupplierPayment','saveSupplierReturn','savePurchaseInvoice',
    'saveCustomerReturn','saveStockAdjustment','saveScrap','saveTransfer','saveNewWarehouse','saveNewAppointment',
    'saveCannedService','saveCountProgress','submitCountForApproval','confirmCancelJob','saveInvoiceInfo','saveTaxWa','savePins','saveCenterName','saveNewStaff','toggleStaff','saveStaffPass','savePerms','saveFinAccount','saveOpeningBalance','saveFinTransfer','saveExternalDeposit','saveCustodySettle','saveExpenseCat',
    'saveNewEmployee','saveEmployeeEdit','saveLeaveRequest','saveAbsence','saveAdvance','savePenalty','savePermit',
    'saveIncentivePct','saveIncentiveExclusion','saveBonus','saveWorkingDays',
    'saveNewTool','saveToolEdit','saveToolIssue','saveToolReturn',
    'setNotifStatus','addNotifComment','saveNotifThresholds','saveCustody','saveSettleCustody'];
  opNames.forEach(name=>{
    const orig = window[name];
    if(typeof orig !== 'function') return;
    window[name] = async function(...args){
      // منع التنفيذ المتزامن (ضغطة تانية والأولى لسه شغالة)
      if(window._opBusy){ return; }
      // منع تكرار نفس العملية بنفس المدخلات خلال 4 ثواني (دبل كليك أو نت بطيء)
      const sig = name + '|' + JSON.stringify(args);
      const now = Date.now();
      if(sig === window._lastOpSig && (now - window._lastOpAt) < 4000){
        toast('العملية دي لسه متنفذة حالاً — اتجاهلت المحاولة المكررة', true);
        return;
      }
      window._lastOpSig = sig; window._lastOpAt = now;
      window._opBusy = true; setBusy(true);
      const t0 = performance.now();
      try{
        return await orig.apply(this, args);
      } finally {
        const ms = Math.round(performance.now() - t0);
        window._perfLog.push({op:name, ms, at:new Date().toISOString()});
        if(window._perfLog.length > 100) window._perfLog = window._perfLog.slice(-100);
        window._opBusy = false; setBusy(false);
      }
    };
  });
})();

});
window.addEventListener('unhandledrejection', function(e){

  try{ toast('حصلت مشكلة في الاتصال — جرب تاني أو دوس "تحديث البيانات"', true); }catch(x){}

});
