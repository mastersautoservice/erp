async function saveExtOutFromStock(){
  if(!can('jobs.edit')){ toast('مالكش صلاحية تعديل أوامر الشغل', true); return; }
  const jobId = document.getElementById('exJob').value;
  const name = document.getElementById('exName').value.trim();
  const supplierId = document.getElementById('exSupplier').value || null;
  const qty = parseFloat(document.getElementById('exQty').value)||1;
  const costPrice = parseFloat(document.getElementById('exCost').value)||0;
  const sellPrice = parseFloat(document.getElementById('exSell').value)||0;
  const payMethod = document.getElementById('exPay').value;
  const note = document.getElementById('exNote').value.trim();
  const job = DB.jobs.find(j=>j.id===jobId);
  if(!job){ toast('اختار أمر الشغل', true); return; }
  if(!name){ toast('اكتب اسم القطعة', true); return; }
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(payMethod==='آجل' && !supplierId){ toast('السداد الآجل لازم يتربط بمورد — اختار المورد', true); return; }
  const car = DB.cars.find(c=>c.id===job.carId);
  // 1) بند في فاتورة العميل بسعر البيع + التكلفة على أمر الشغل
  job.items.push({id:uid('it'), kind:'ext_part', name, qty, unitPrice:sellPrice, costPrice, supplierId, payMethod, note});
  // 2) فاتورة شراء على المورد (آجل = مديونية / كاش = مدفوعة)
  let purchaseId = null;
  if(supplierId){
    purchaseId = uid('pur');
    const purchase = {
      id: purchaseId, purchaseNo: nextNo(DB.purchases,'purchaseNo'), supplierId,
      date: new Date().toISOString(), paymentMethod: payMethod,
      note: 'قطعة غيار خارجية — أمر شغل #'+job.jobNo+(car?' — '+car.plate:''),
      items: [{partId:null, name, qty, unitCost:costPrice}],
      total: qty*costPrice, payments: [], jobId: job.id, extKind:'ext_part'
    };
    if(payMethod!=='آجل') purchase.payments.push({id:uid('pay'), amount:purchase.total, date:new Date().toISOString()});
    DB.purchases.push(purchase);
  }
  // 3) حركة مخزنية مستقلة بدون تأثير على أي رصيد
  DB.stockMoves.push({
    id:uid('mv'), partId:null, extName:name, type:'ext_part', qty, unitCost:costPrice, unitPrice:sellPrice,
    supplierId, purchaseId, payMethod, jobId:job.id, customerId:job.customerId,
    date:new Date().toISOString(), actor:actorName(),
    note:'قطعة غيار خارجية — أمر شغل #'+job.jobNo+(car?' — '+car.plate:'')+(note?' — '+note:'')
  });
  const saves = [saveKey('jobs', DB.jobs), saveKey('stockMoves', DB.stockMoves)];
  if(supplierId) saves.push(saveKey('purchases', DB.purchases));
  await Promise.all(saves);
  await logAction('قطعة غيار خارجية: '+name+' لأمر الشغل #'+job.jobNo+' — تكلفة '+money(qty*costPrice)+' / بيع '+money(qty*sellPrice)+' ('+payMethod+')');
  toast('تم صرف القطعة الخارجية'+(payMethod==='آجل'?' وتسجيل المديونية على المورد':''));
  document.getElementById('exName').value=''; document.getElementById('exNote').value='';
  document.getElementById('exQty').value='1'; document.getElementById('exCost').value='0'; document.getElementById('exSell').value='0';
}

async function saveStockOut(){
  if(!can('inv.issue')){ toast('مالكش صلاحية صرف القطع', true); return; }
  const jobId = document.getElementById('mvJob').value;
  const partId = document.getElementById('mvPart').value;
  const qty = parseFloat(document.getElementById('mvQty').value)||0;
  const p = DB.inventory.find(x=>x.id===partId);
  const job = DB.jobs.find(j=>j.id===jobId);
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(qty>p.qty){ toast('الكمية أكبر من المتاح في المخزون', true); return; }
  const car = DB.cars.find(c=>c.id===job.carId);
  p.qty -= qty;
  job.items.push({id:uid('it'), kind:'part', name:p.name, qty, unitPrice:p.sellPrice, costPrice:p.costPrice, partId:p.id});
  const carDesc = car ? ` — السيارة: ${car.plate}${carLabel(car)?' / '+carLabel(car):''}` : '';
  DB.stockMoves.push({id:uid('mv'), partId, type:'out', qty, unitCost:p.costPrice, unitPrice:p.sellPrice, date:new Date().toISOString(), note:'صرف لأمر شغل #'+job.jobNo+carDesc, jobId:job.id, customerId:job.customerId, actor:actorName()});
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('jobs', DB.jobs), saveKey('stockMoves', DB.stockMoves)]);
  toast('تم صرف القطعة لأمر الشغل #'+job.jobNo); refreshContent();
  await logAction('صرف '+qty+' من '+p.name+' لأمر الشغل #'+job.jobNo);
}

/* ======================= ITEM CARD (كارت الصنف / Item Ledger) ======================= */
let icFilters = { dateFrom:'', dateTo:'', supplierId:'', type:'', jobNo:'' };
function itemMoves(partId){
  return DB.stockMoves.filter(m=>m.partId===partId).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function itemStats(partId){
  const moves = itemMoves(partId);
  const inMoves = moves.filter(m=>m.type==='in' && m.unitCost!==undefined);
  const totalInQty = inMoves.reduce((s,m)=>s+m.qty,0);
  const totalInValue = inMoves.reduce((s,m)=>s+m.qty*(m.unitCost||0),0);
  const avgCost = totalInQty>0 ? totalInValue/totalInQty : 0;
  const lastIn = [...inMoves].reverse()[0];
  const lastSupplier = lastIn && lastIn.supplierId ? DB.suppliers.find(s=>s.id===lastIn.supplierId) : null;
  return { avgCost, lastCost: lastIn?lastIn.unitCost:null, lastSupplier };
}

function refreshItemLedger(partId){
  const el = document.getElementById('itemLedgerBody');
  if(el) el.innerHTML = itemLedgerRowsHTML(partId);
}
function itemLedgerRowsHTML(partId){
  let moves = itemMoves(partId);
  const f = icFilters;
  if(f.dateFrom) moves = moves.filter(m=>new Date(m.date) >= new Date(f.dateFrom));
  if(f.dateTo) moves = moves.filter(m=>new Date(m.date) <= new Date(new Date(f.dateTo).getTime()+86399999));
  if(f.type) moves = moves.filter(m=>m.type===f.type);
  if(f.supplierId) moves = moves.filter(m=>m.supplierId===f.supplierId);
  if(f.jobNo){
    moves = moves.filter(m=>{
      const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
      return job && job.jobNo.includes(f.jobNo.trim());
    });
  }
  if(moves.length===0) return `<div class="empty">لا توجد حركات مطابقة</div>`;
  let balance = 0;
  const withBalance = moves.map(m=>{
    if(m.type==='in' || m.type==='customer_return' || m.type==='transfer_in') balance += m.qty;
    else if(m.type==='out' || m.type==='return' || m.type==='scrap' || m.type==='paint_out' || m.type==='transfer_out') balance -= m.qty;
    else if(m.type==='adjustment'){ /* balance already reflects the corrected qty, approximate by not changing running calc precisely */ }
    return {...m, balanceAfter: balance};
  });
  const typeTagMap = {
    in: '<span class="tag tag-ready">شراء</span>', out: '<span class="tag tag-cancel">صرف</span>',
    customer_return: '<span class="tag tag-inspect">مرتجع عميل</span>', return: '<span class="tag tag-partial">مرتجع مورد</span>',
    adjustment: '<span class="tag tag-working">تسوية</span>', scrap: '<span class="tag tag-cancel">هالك/تالف</span>', paint_out: '<span class="tag tag-partial">خامات دهان</span>',
    transfer_in: '<span class="tag tag-ready">تحويل وارد</span>',
    transfer_out: '<span class="tag tag-working">تحويل صادر</span>'
  };
  return `<table><thead><tr><th>التاريخ</th><th>النوع</th><th>التفاصيل</th><th>الكمية</th><th>السعر</th><th>الرصيد بعدها</th></tr></thead>
  <tbody>${[...withBalance].reverse().map(m=>{
    const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
    const car = job ? DB.cars.find(c=>c.id===job.carId) : null;
    const cust = job ? DB.customers.find(c=>c.id===job.customerId) : (m.customerId?DB.customers.find(c=>c.id===m.customerId):null);
    const supplier = m.supplierId ? DB.suppliers.find(s=>s.id===m.supplierId) : null;
    const purchase = m.purchaseId ? DB.purchases.find(pu=>pu.id===m.purchaseId) : null;
    let details = [];
    if(m.type==='in'){
      if(supplier) details.push('مورد: '+supplier.name);
      if(purchase) details.push('فاتورة #'+purchase.purchaseNo);
    } else if(m.type==='out'){
      if(job) details.push('أمر شغل #'+job.jobNo);
      if(car) details.push(car.plate+' — '+carLabel(car));
      if(cust) details.push(cust.name);
      if(job && (job.technicianId||job.technician)) details.push('الفني: '+(job.technicianId?techLabelOf(job.technicianId):job.technician));
    } else if(m.type==='customer_return'){
      if(job) details.push('أمر شغل #'+job.jobNo);
      if(cust) details.push(cust.name);
    } else if(m.type==='return'){
      if(supplier) details.push('مورد: '+supplier.name);
    }
    if(m.note) details.push(m.note);
    moveTrackParts(m).forEach(x=>details.push(x));
    const price = m.unitCost!=null ? 'شراء: '+money(m.unitCost) : (m.unitPrice!=null ? 'بيع: '+money(m.unitPrice) : '—');
    const clickable = job ? `onclick="openWorkOrderReport('${job.id}')" style="cursor:pointer"` : '';
    return `<tr ${clickable}><td>${fmtDateTime(m.date)}</td><td>${typeTagMap[m.type]||m.type}</td>
      <td class="muted" style="max-width:220px">${details.join(' · ')||'—'}</td>
      <td>${m.qty}</td><td>${price}</td><td>${m.balanceAfter}</td></tr>`;
  }).join('')}</tbody></table>`;
}

async function saveExtItem(jobId, kind){
  if(!can('jobs.edit')){ toast('مالكش صلاحية تعديل أوامر الشغل', true); return; }
  const job = DB.jobs.find(j=>j.id===jobId);
  const name = document.getElementById('extName').value.trim();
  const supplierId = document.getElementById('extSupplier').value || null;
  const qty = parseFloat(document.getElementById('extQty').value)||1;
  const costPrice = parseFloat(document.getElementById('extCost').value)||0;
  const sellPrice = parseFloat(document.getElementById('extSell').value)||0;
  const payMethod = document.getElementById('extPay').value;
  const note = document.getElementById('extNote').value.trim();
  if(!name){ toast('اكتب الاسم', true); return; }
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(payMethod==='آجل' && !supplierId){ toast('السداد الآجل لازم يتربط بمورد — اختار المورد', true); return; }
  const car = DB.cars.find(c=>c.id===job.carId);
  const kindTxt = kind==='ext_part'?'قطعة غيار خارجية':'أعمال خارجية';
  // 1) إضافة البند للفاتورة/أمر الشغل
  const item = {id:uid('it'), kind, name, qty, unitPrice:sellPrice, costPrice, supplierId, payMethod, note};
  job.items.push(item);
  await saveKey('jobs', DB.jobs);
  // 2) فاتورة شراء على المورد (آجل = مديونية / كاش = مدفوعة) مربوطة بأمر الشغل
  let purchaseId = null;
  if(supplierId){
    purchaseId = uid('pur');
    const purchase = {
      id: purchaseId, purchaseNo: nextNo(DB.purchases,'purchaseNo'), supplierId,
      date: new Date().toISOString(), paymentMethod: payMethod,
      note: kindTxt+' — أمر شغل #'+job.jobNo+(car?' — '+car.plate:''),
      items: [{partId:null, name, qty, unitCost:costPrice}],
      total: qty*costPrice, payments: [],
      jobId: job.id, extKind: kind
    };
    if(payMethod!=='آجل') purchase.payments.push({id:uid('pay'), amount:purchase.total, date:new Date().toISOString()});
    DB.purchases.push(purchase);
    await saveKey('purchases', DB.purchases);
  }
  // 3) حركة مخزنية مستقلة (دخول 1 → خروج 1: لا تؤثر على أي رصيد)
  DB.stockMoves.push({
    id:uid('mv'), partId:null, extName:name, type:kind, qty, unitCost:costPrice, unitPrice:sellPrice,
    supplierId, purchaseId, payMethod, jobId:job.id, customerId:job.customerId,
    date:new Date().toISOString(),
    note: kindTxt+' — أمر شغل #'+job.jobNo+(car?' — '+car.plate:'')+(note?' — '+note:'')
  });
  await saveKey('stockMoves', DB.stockMoves);
  await logAction(kindTxt+': '+name+' لأمر الشغل #'+job.jobNo+' — تكلفة '+money(qty*costPrice)+' / بيع '+money(qty*sellPrice)+' ('+payMethod+(supplierId?' — '+((DB.suppliers.find(s=>s.id===supplierId)||{}).name||''):'')+')');
  closeModal();
  toast('تمت الإضافة'+(payMethod==='آجل'?' وتسجيل المديونية على المورد':''));
  openJobDetail(jobId); refreshContent();
}

    approvedAt: null, approvedBy: null,
    lines: items.map(p=>({partId:p.id, sku:p.sku||'', name:p.name, unit:p.unit||'قطعة', wh:whName(partWhId(p)), costPrice:p.costPrice, systemQty:p.qty, physicalQty:null}))
  };

  await logAction('إنشاء جرد جديد #'+ic.countNo+' — '+ic.warehouseName+' ('+ic.lines.length+' صنف)');

function countDiffLabel(line){
  if(line.physicalQty===null || line.physicalQty==='' || line.physicalQty===undefined) return ['—',''];
  const diff = line.physicalQty - line.systemQty;
  if(diff===0) return ['لا يوجد فرق','tag-paid'];
  if(diff<0) return ['عجز '+Math.abs(diff),'tag-unpaid'];
  return ['زيادة +'+diff,'tag-partial'];
}
function renderInventoryCount(){
  const ic = DB.inventoryCounts.find(x=>x.id===currentCountId);
  if(!ic) return `<div class="empty">الجرد غير موجود</div>`;
  const editable = ic.status!=='approved';
  const filled = ic.lines.filter(l=>l.physicalQty!==null && l.physicalQty!=='').length;
  const withDiff = ic.lines.filter(l=>l.physicalQty!==null && l.physicalQty!=='' && l.physicalQty!==l.systemQty);
  const shortage = withDiff.filter(l=>l.physicalQty<l.systemQty);
  const surplus = withDiff.filter(l=>l.physicalQty>l.systemQty);
  const shortageValue = shortage.reduce((s,l)=>s+(l.systemQty-l.physicalQty)*(l.costPrice||0),0);
  const statusTag = ic.status==='approved' ? '<span class="tag tag-paid">معتمد ومُسوَّى</span>'
    : ic.status==='pending_approval' ? '<span class="tag tag-partial">بانتظار اعتماد المالك</span>'
    : '<span class="tag tag-inspect">جاري الجرد</span>';
  const prev = [...DB.inventoryCounts].filter(x=>x.id!==ic.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5);
  return `
  <div class="section-head">
    <h3>جرد: ${ic.warehouseName||'جميع المخازن'} — #${ic.countNo} ${statusTag}</h3>
    <button class="btn" onclick="goTab('inventory')">رجوع للمخزون</button>
  </div>
  <div class="muted" style="font-size:12.5px;margin-bottom:14px">
    أُنشئ: ${fmtDateTime(ic.createdAt)} بواسطة ${ic.createdBy}
    ${ic.approvedAt?` · اعتُمد: ${fmtDateTime(ic.approvedAt)} بواسطة ${ic.approvedBy}`:''}
  </div>
  <div class="grid g4" style="margin-bottom:16px">
    ${stat(ic.lines.length+'','إجمالي الأصناف')}
    ${stat(filled+' / '+ic.lines.length,'تم جردها')}
    ${stat(String(shortage.length),'أصناف بها عجز', shortage.length>0)}
    ${stat(String(surplus.length),'أصناف بها زيادة')}
  </div>
  ${shortage.length? `<div class="muted" style="font-size:12.5px;margin-bottom:14px;color:var(--danger)">قيمة العجز التقديرية (بسعر الشراء): ${money(shortageValue)}</div>`:''}
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    ${editable?`<button class="btn btn-accent" onclick="saveCountProgress()">💾 حفظ التقدم</button>`:''}
    <button class="btn" onclick="printCountSheet('${ic.id}')">🖨 طباعة كشف الجرد</button>
    <button class="btn" onclick="downloadCountSheet('${ic.id}')">⬇ تحميل للطباعة / PDF</button>
    <button class="btn" onclick="exportCountCSV('${ic.id}')">⬇ تصدير Excel</button>
    ${editable && can('inv.count_approve') && withDiff.length>0 ? `<button class="btn btn-danger" onclick="approveCount('${ic.id}')">✔ اعتماد التسوية النهائية</button>` : ''}
    ${editable && !can('inv.count_approve') && ic.status==='draft' && filled>0 ? `<button class="btn" onclick="submitCountForApproval('${ic.id}')">📤 إرسال للاعتماد</button>` : ''}
  </div>
  ${editable && !can('inv.count_approve') ? `<div class="muted" style="font-size:12px;margin-bottom:12px">صلاحيتك: تعبئة الكميات الفعلية وعرض الفروقات — اعتماد التسوية النهائية لأصحاب الصلاحية.</div>`:''}
  <div class="card">
    <table>
      <thead><tr><th>#</th><th>الكود</th><th>الصنف</th><th>الوحدة</th><th>سعر الشراء</th><th>رصيد النظام</th><th>الرصيد الفعلي</th><th>الفرق</th></tr></thead>
      <tbody>
      ${ic.lines.map((l,idx)=>{
        const [dLbl,dCls] = countDiffLabel(l);
        return `<tr>
          <td class="muted">${idx+1}</td><td class="muted">${l.sku||'—'}</td><td>${l.name}</td>
          <td class="muted">${l.unit}</td><td>${money(l.costPrice)}</td>
          <td style="font-weight:800">${l.systemQty}</td>
          <td style="width:110px">${editable
            ? `<input class="f" type="number" min="0" style="padding:6px 8px" value="${l.physicalQty===null?'':l.physicalQty}" onchange="setCountQty(${idx}, this.value)">`
            : (l.physicalQty===null?'—':l.physicalQty)}</td>
          <td id="cdiff_${idx}">${dCls?`<span class="tag ${dCls}">${dLbl}</span>`:dLbl}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>
  ${prev.length? `
  <div class="section-head" style="margin-top:22px"><h3>جردات سابقة</h3></div>
  <div class="card"><table><thead><tr><th>رقم</th><th>التاريخ</th><th>الحالة</th><th></th></tr></thead>
  <tbody>${prev.map(x=>`<tr><td>#${x.countNo}</td><td>${fmtDate(x.createdAt)}</td>
  <td>${x.status==='approved'?'<span class="tag tag-paid">معتمد</span>':'<span class="tag tag-inspect">مفتوح</span>'}</td>

  const ic = DB.inventoryCounts.find(x=>x.id===currentCountId);

  if(cell) cell.innerHTML = dCls?`<span class="tag ${dCls}">${dLbl}</span>`:dLbl;
}

async function submitCountForApproval(icId){
  const ic = DB.inventoryCounts.find(x=>x.id===icId);
  ic.status = 'pending_approval';
  ic.submittedBy = actorName();
  await saveKey('inventoryCounts', DB.inventoryCounts);
  await logAction('إرسال جرد المخزن #'+ic.countNo+' لاعتماد المالك');
  toast('تم إرسال الجرد لاعتماد صاحب المركز');

function approveCount(icId){
  if(!can('inv.count_approve')){ toast('مالكش صلاحية اعتماد الجرد', true); return; }
  const ic = DB.inventoryCounts.find(x=>x.id===icId);
  const withDiff = ic.lines.filter(l=>l.physicalQty!==null && l.physicalQty!=='' && l.physicalQty!==l.systemQty);
  if(withDiff.length===0){ toast('لا توجد فروقات للتسوية', true); return; }
  askConfirm('اعتماد التسوية النهائية لجرد #'+ic.countNo+'؟ سيتم تعديل رصيد '+withDiff.length+' صنف في المخزون ليطابق الجرد الفعلي، وتسجيل حركة تسوية موثقة لكل صنف. هذا الإجراء نهائي.', async ()=>{
    const enteredBy = ic.submittedBy || ic.createdBy;
    for(const l of withDiff){
      const p = DB.inventory.find(x=>x.id===l.partId);
      if(!p) continue;
      const before = p.qty;
      const after = l.physicalQty;
      const diff = after - before;
      p.qty = after;
      DB.stockMoves.push({
        id: uid('mv'), partId: p.id, type:'adjustment', qty: Math.abs(diff), unitCost: p.costPrice,
        date: new Date().toISOString(),
        note: (diff<0?'تسوية مخزون - عجز جرد':'تسوية مخزون - زيادة جرد')
          +' #'+ic.countNo+' — قبل: '+before+' بعد: '+after+' (فرق '+(diff>0?'+':'')+diff+')'
          +' — أدخل الجرد: '+enteredBy+' — اعتمده: '+actorName()
      });
    }
    ic.status = 'approved';
    ic.approvedAt = new Date().toISOString();
    ic.approvedBy = actorName();
    await saveKey('inventory', DB.inventory);
    await saveKey('stockMoves', DB.stockMoves);
    await saveKey('inventoryCounts', DB.inventoryCounts);
    await logAction('اعتماد تسوية جرد المخزن #'+ic.countNo+' — تعديل '+withDiff.length+' صنف');

    refreshContent();
  });
}

async function saveScrap(){

/* ======================= SUPPLIERS ======================= */
/* ---- الملاحظة 47: سجل حركات المورد (خصومات + تسويات) — بيتخزن على المورد نفسه زي سلف الموظفين ---- */
function supLedger(sup){ return (sup && sup.ledger) ? sup.ledger : []; }
/* الرصيد الافتتاحي بإشارته: "علينا للمورد" موجب · "له عندنا" سالب */
function supOpeningSigned(sup){
  if(!sup || !sup.openingBalance) return 0;
  const v = Math.abs(parseFloat(sup.openingBalance)||0);
  return sup.openingType==='debit' ? -v : v;
}
function supplierBalance(supplierId){
  const sup = DB.suppliers.find(s=>s.id===supplierId);
  const purchases = DB.purchases.filter(p=>p.supplierId===supplierId);
  const totalPurchased = purchases.reduce((s,p)=>s+p.total,0);
  const totalPaid = purchases.reduce((s,p)=>s+(p.payments||[]).reduce((a,x)=>a+x.amount,0),0);
  const returns = DB.supplierReturns.filter(r=>r.supplierId===supplierId);
  const totalReturns = returns.reduce((s,r)=>s+r.total,0);
  const led = supLedger(sup);
  const totalDiscounts = led.filter(e=>e.kind==='discount').reduce((s,e)=>s+(e.amount||0),0);
  const totalAdjust = led.filter(e=>e.kind==='adjustment').reduce((s,e)=>s+(e.amount||0),0);
  const opening = supOpeningSigned(sup);
  const balance = opening + totalPurchased - totalPaid - totalReturns - totalDiscounts + totalAdjust;
  return { opening, totalPurchased, totalPaid, totalReturns, totalDiscounts, totalAdjust,
    discountsCount: led.filter(e=>e.kind==='discount').length,
    balance, count: purchases.length, returnsCount: returns.length };
}
/* عليه أي حركة مالية؟ (لو أيوة → الرصيد الافتتاحي بيتقفل للحفاظ على سلامة الحسابات) */
function supplierHasTransactions(supplierId){
  const sup = DB.suppliers.find(s=>s.id===supplierId);
  if(DB.purchases.some(p=>p.supplierId===supplierId)) return true;
  if(DB.supplierReturns.some(r=>r.supplierId===supplierId)) return true;
  if(supLedger(sup).length>0) return true;
  return false;
}
/* متوسط فترة السداد بالأيام (من تاريخ الفاتورة لتاريخ آخر دفعة عليها) */
function supAvgPaymentDays(supplierId){
  const paid = DB.purchases.filter(p=>p.supplierId===supplierId && (p.payments||[]).length>0);
  if(!paid.length) return null;
  const days = paid.map(p=>{
    const last = [...p.payments].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    return Math.max(0, Math.round((new Date(last.date)-new Date(p.date))/86400000));
  });
  return Math.round(days.reduce((s,d)=>s+d,0)/days.length);
}
/* كشف حساب موحّد بالترتيب الزمني: افتتاحي + فواتير + مدفوعات + مرتجعات + خصومات + تسويات */
function supplierStatement(supplierId){
  const sup = DB.suppliers.find(s=>s.id===supplierId);
  const rows = [];
  const op = supOpeningSigned(sup);
  if(op !== 0) rows.push({ date: sup.createdAt||'2000-01-01', type:'رصيد افتتاحي', desc: sup.openingType==='debit'?'له عندنا':'علينا له', amount: op });
  DB.purchases.filter(p=>p.supplierId===supplierId).forEach(p=>{
    rows.push({ date:p.date, type:'فاتورة شراء', desc:'#'+p.purchaseNo, amount:p.total });
    (p.payments||[]).forEach(pay=>rows.push({ date:pay.date, type:'سداد', desc:'على فاتورة #'+p.purchaseNo, amount:-pay.amount }));
  });
  DB.supplierReturns.filter(r=>r.supplierId===supplierId).forEach(r=>{
    rows.push({ date:r.date, type:'مرتجع للمورد', desc:r.name||'—', amount:-(r.total||0) });
  });
  supLedger(sup).forEach(e=>{
    rows.push({ date:e.date, type: e.kind==='discount'?'خصم من المورد':'تسوية رصيد',
      desc:(e.reason||'')+(e.notes?' — '+e.notes:'')+' · بواسطة '+(e.by||'—'),
      amount: e.kind==='discount' ? -(e.amount||0) : (e.amount||0) });
  });
  rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
  let run = 0;
  rows.forEach(r=>{ run += r.amount; r.running = run; });
  return rows;
}
/* الملاحظة 44: أرشفة المورد — بشرط رصيد صفر (مفيش مستحقات معلقة) */
let supShowArchived = false;
function toggleSupArchived(){ supShowArchived = !supShowArchived; refreshContent(); }
function archiveSupplier(supplierId){
  if(!isOwnerSession()){ toast('أرشفة الموردين صلاحية صاحب المركز فقط', true); return; }
  const sup = DB.suppliers.find(s=>s.id===supplierId); if(!sup) return;
  const b = supplierBalance(supplierId);
  if(Math.abs(b.balance) > 0.005){ toast('مينفعش أرشفة المورد — عليه رصيد مستحق ('+money(b.balance)+'). سدّده الأول.', true); return; }
  askConfirmReason('أرشفة المورد «'+sup.name+'»؟<br><span class="muted" style="font-size:12px">هيختفي من قوائم الاختيار والموردين النشطين، وكل تاريخه (مشتريات/كشف حساب/تقارير) هيفضل زي ما هو. تقدر ترجّعه في أي وقت.</span>', async (reason)=>{
    sup.archived = true; sup.archivedAt = new Date().toISOString(); sup.archivedBy = actorName();
    await saveKey('suppliers', DB.suppliers);
    await logAction('🗄️ أرشفة مورد: '+sup.name+(reason?' — السبب: '+reason:''));
    closeModal(); toast('تم أرشفة المورد «'+sup.name+'»'); refreshContent();
  });
}
async function restoreSupplier(supplierId){
  if(!isOwnerSession()){ toast('استرجاع الموردين صلاحية صاحب المركز فقط', true); return; }
  const sup = DB.suppliers.find(s=>s.id===supplierId); if(!sup) return;
  sup.archived = false; delete sup.archivedAt; delete sup.archivedBy;
  await saveKey('suppliers', DB.suppliers);
  await logAction('♻️ استرجاع مورد من الأرشيف: '+sup.name);
  closeModal(); toast('رجع المورد «'+sup.name+'» نشط تاني'); refreshContent();
}
/* الملاحظة 47: فلتر ثلاثي (نشط/مؤرشف/الكل) + بحث بالاسم والتليفون ومسؤول التواصل والمنطقة والملاحظات */
let supStatusFilter = 'active';   // active | archived | all
let supSearchTerm = '';
function setSupStatusFilter(v){ supStatusFilter = v; refreshContent(); }
function setSupSearch(v){ supSearchTerm = v; const b=document.getElementById('supListBox'); if(b) b.innerHTML = supplierCardsHTML(); }
function supMatchesSearch(sup){
  const q = normSearch(supSearchTerm);
  if(!q) return true;
  return normSearch([sup.name, sup.phone, sup.phone2, sup.contactPerson, sup.area, sup.city, sup.address, sup.note, sup.email].filter(Boolean).join(' ')).includes(q);
}
function visibleSuppliers(){
  return [...DB.suppliers]
    .filter(s=> supStatusFilter==='all' ? true : (supStatusFilter==='archived' ? !!s.archived : !s.archived))
    .filter(supMatchesSearch)
    .sort((a,b)=>a.name.localeCompare(b.name,'ar'));
}
function supplierCardsHTML(){
  const list = visibleSuppliers();
  if(!list.length) return emptyState(supSearchTerm?'مفيش مورد مطابق للبحث':'لسه مفيش موردين مسجلين');
  return list.map(sup=>{
    const b = supplierBalance(sup.id);
    return `
    <div class="card" style="cursor:pointer${sup.archived?';opacity:.55':''}" onclick="openSupplierDetail('${sup.id}')">
      <div style="font-weight:800;font-size:15px">${sup.name}${sup.archived?' <span class="muted" style="font-size:11px">🗄️ مؤرشف</span>':''}</div>
      <div class="muted" style="font-size:12.5px;margin-top:2px">${sup.phone||'—'}${sup.contactPerson?' · '+sup.contactPerson:''}${sup.area?' · '+sup.area:''}</div>
      <div class="flex-between" style="margin-top:14px">
        <span class="muted" style="font-size:12px">فواتير: ${b.count}${b.discountsCount?' · خصومات: '+b.discountsCount:''}</span>
        <span style="font-weight:800;${b.balance>0.005?'color:var(--danger)':(b.balance<-0.005?'color:var(--accent-2)':'color:var(--success)')}">${money(b.balance)}</span>
      </div>
      ${sup.archived && isOwnerSession() ? `<button class="btn btn-sm btn-accent" style="width:100%;margin-top:10px" onclick="event.stopPropagation(); restoreSupplier('${sup.id}')">♻️ استرجاع المورد</button>` : ''}
    </div>`;
  }).join('');
}
function renderSuppliers(){
  const archivedCount = DB.suppliers.filter(s=>s.archived).length;
  const totalOwed = activeSuppliers().reduce((s,sup)=>s+supplierBalance(sup.id).balance,0);
  return `
  <div class="section-head"><h3>الموردين (${activeSuppliers().length}${archivedCount?` + ${archivedCount} مؤرشف`:''}) — إجمالي المستحق ${money(totalOwed)}</h3>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="openNewPurchaseInvoicePage()">🧾 فاتورة شراء جديدة</button>
      <button class="btn btn-accent" onclick="openNewSupplierModal()">${ICONS.plus} مورد جديد</button>
    </div></div>
  <div class="grid g2" style="max-width:760px;margin-bottom:12px">
    <div class="form-row" style="margin:0"><input class="f" placeholder="🔎 ابحث باسم المورد، تليفون، مسؤول التواصل، منطقة، ملاحظات..." value="${supSearchTerm}" oninput="setSupSearch(this.value)" autocomplete="off"></div>
    <div class="form-row" style="margin:0"><select class="f" onchange="setSupStatusFilter(this.value)">
      ${[['active','✅ الموردين النشطين'],['archived','🗄️ الموردين المؤرشفين'],['all','الكل (نشط + مؤرشف)']]
        .map(([v,l])=>`<option value="${v}" ${supStatusFilter===v?'selected':''}>${l}</option>`).join('')}
    </select></div>
  </div>
  <div class="grid g3" id="supListBox">${supplierCardsHTML()}</div>`;
}
/* ---- الملاحظة 47: نموذج بيانات المورد الكامل (إنشاء + تعديل) ---- */

function readSupplierForm(){
  const v = id => ((document.getElementById(id)||{}).value||'').trim();
  return {
    name: v('supName'), phone: v('supPhone'), phone2: v('supPhone2'), email: v('supEmail'),
    contactPerson: v('supContact'), address: v('supAddress'), area: v('supArea'), city: v('supCity'),
    note: v('supNote'), paymentTerms: v('supTerms'),
    creditLimit: parseFloat(v('supCredit'))||0
  };
}
function openNewSupplierModal(){
  openModal(`
    <h3>مورد جديد</h3>
    ${supplierFormHTML(null)}
    <button class="btn btn-accent" style="width:100%;margin-top:10px" onclick="saveNewSupplier()">حفظ المورد</button>
  `);
}
async function saveNewSupplier(){
  const f = readSupplierForm();
  if(!f.name){ toast('اكتب اسم المورد', true); return; }
  if(DB.suppliers.some(s=>s.name===f.name && !s.archived)){ toast('فيه مورد بنفس الاسم موجود بالفعل', true); return; }
  const opening = Math.abs(parseFloat((document.getElementById('supOpening')||{}).value)||0);
  const openingType = (document.getElementById('supOpeningType')||{}).value || 'credit';
  DB.suppliers.push({ id:uid('sup'), ...f, openingBalance:opening, openingType, ledger:[], createdAt:new Date().toISOString() });
  await saveKey('suppliers', DB.suppliers);
  await logAction('إضافة مورد: '+f.name+(opening?' — رصيد افتتاحي '+money(opening)+' ('+(openingType==='debit'?'له عندنا':'علينا له')+')':''));
  closeModal(); toast('تم إضافة المورد'); refreshContent();
}
function openEditSupplierModal(supplierId){
  const sup = DB.suppliers.find(s=>s.id===supplierId); if(!sup) return;
  openModal(`
    <h3>تعديل بيانات المورد — ${sup.name}</h3>
    ${supplierFormHTML(sup)}
    <button class="btn btn-accent" style="width:100%;margin-top:10px" onclick="saveEditSupplier('${supplierId}')">حفظ التعديلات</button>
  `);
}
async function saveEditSupplier(supplierId){
  const sup = DB.suppliers.find(s=>s.id===supplierId); if(!sup) return;
  const f = readSupplierForm();
  if(!f.name){ toast('اكتب اسم المورد', true); return; }
  if(DB.suppliers.some(s=>s.id!==supplierId && s.name===f.name && !s.archived)){ toast('فيه مورد تاني بنفس الاسم', true); return; }
  Object.assign(sup, f);
  // الرصيد الافتتاحي بيتعدل بس لو مفيش أي حركة مالية (سلامة الحسابات)
  if(!supplierHasTransactions(supplierId)){
    sup.openingBalance = Math.abs(parseFloat((document.getElementById('supOpening')||{}).value)||0);
    sup.openingType = (document.getElementById('supOpeningType')||{}).value || 'credit';
  }
  await saveKey('suppliers', DB.suppliers);
  await logAction('تعديل بيانات المورد: '+sup.name);
  closeModal(); toast('تم حفظ بيانات المورد'); openSupplierDetail(supplierId); refreshContent();
}
function openSupplierDetail(supplierId){
  openModal(supplierDetailHTML(supplierId));
}

function openSupplierReturnModal(supplierId){
  const purchasedPartIds = new Set(DB.purchases.filter(p=>p.supplierId===supplierId).flatMap(p=>p.items.map(i=>i.partId)));
  const parts = activeInventory().filter(p=>purchasedPartIds.has(p.id));
  const partsToShow = parts.length ? parts : activeInventory();
  if(partsToShow.length===0){ toast('مفيش أصناف في المخزون أصلاً', true); return; }
  openModal(`
    <h3>تسجيل مرتجع للمورد</h3>
    <div class="form-row"><label class="f-label">القطعة</label>
      <select class="f" id="retPart" onchange="retShowCost(this.value)">
        ${partsToShow.map(p=>`<option value="${p.id}">${p.name} (متاح بالمخزون: ${p.qty})</option>`).join('')}
      </select>
    </div>
    <div class="grid g2">
      <div class="form-row"><label class="f-label">الكمية المرتجعة</label><input class="f" id="retQty" type="number" min="1" value="1"></div>
      <div class="form-row"><label class="f-label">سعر الوحدة (تكلفة)</label><input class="f" id="retCost" type="number" min="0" value="${partsToShow[0].costPrice}"></div>
    </div>
    <div class="form-row"><label class="f-label">سبب المرتجع (اختياري)</label><input class="f" id="retNote" placeholder="مثال: قطعة تالفة"></div>
    <button class="btn btn-accent" style="width:100%" onclick="saveSupplierReturn('${supplierId}')">تأكيد المرتجع</button>
  `);
}
async function saveSupplierReturn(supplierId){
  const partId = document.getElementById('retPart').value;
  const qty = parseFloat(document.getElementById('retQty').value)||0;
  const cost = parseFloat(document.getElementById('retCost').value)||0;
  const note = document.getElementById('retNote').value.trim();
  const p = DB.inventory.find(x=>x.id===partId);
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(qty>p.qty){ toast('الكمية المرتجعة أكبر من المتاح في المخزون', true); return; }
  p.qty -= qty;
  const ret = {id:uid('ret'), supplierId, partId, name:p.name, qty, unitCost:cost, total:qty*cost, date:new Date().toISOString(), note};
  DB.supplierReturns.push(ret);
  DB.stockMoves.push({id:uid('mv'), partId, type:'return', qty, unitCost:cost, date:new Date().toISOString(), note:'مرتجع لمورد'+(note?' — '+note:''), supplierId});
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('supplierReturns', DB.supplierReturns), saveKey('stockMoves', DB.stockMoves)]);
  closeModal(); toast('تم تسجيل المرتجع وخصمه من مديونية المورد'); refreshContent();
}
function openSupplierPaymentModal(supplierId){
  const b = supplierBalance(supplierId);
  openModal(`
    <h3>تسديد دفعة للمورد</h3>
    <div class="card" style="margin-bottom:12px"><div class="flex-between"><span>رصيد المورد المستحق</span><span style="font-weight:800">${money(b.balance)}</span></div></div>

    <button class="btn btn-accent" style="width:100%" onclick="saveSupplierPayment('${supplierId}')">تأكيد الدفع</button>
  `);

function supPayRecalc(bal){
  const disc = Math.max(parseFloat((document.getElementById('supDiscAmt')||{}).value)||0, 0);
  const pay = Math.max(parseFloat((document.getElementById('supPayAmt')||{}).value)||0, 0);
  const row = document.getElementById('supDiscReasonRow');
  if(row) row.style.display = disc>0 ? 'block' : 'none';
  const after = Math.round((bal - disc - pay)*100)/100;
  const box = document.getElementById('supPayPreview');
  if(box) box.innerHTML = `
    <div class="flex-between"><span class="muted">الرصيد قبل</span><span>${money(bal)}</span></div>
    ${disc>0?`<div class="flex-between"><span class="muted">− خصم من المورد</span><span>${money(disc)}</span></div>`:''}
    <div class="flex-between"><span class="muted">− المدفوع</span><span>${money(pay)}</span></div>
    <div class="flex-between total-row" style="margin-top:6px;font-weight:800"><span>الرصيد بعد العملية</span><span style="${after<-0.005?'color:var(--danger)':''}">${money(after)}</span></div>`;
}
async function saveSupplierPayment(supplierId){
  if(!can('sup.pay')){ toast('مالكش صلاحية سداد الموردين', true); return; }
  let amount = parseFloat(document.getElementById('supPayAmt').value)||0;
  // الملاحظة 47: الخصم حركة محاسبية مستقلة — مابيعدّلش قيم الفواتير أبداً
  const discAmt = Math.max(parseFloat((document.getElementById('supDiscAmt')||{}).value)||0, 0);
  const discReason = ((document.getElementById('supDiscReason')||{}).value||'').trim();
  if(discAmt>0 && !discReason){ toast('اكتب سبب الخصم — إلزامي مع أي خصم', true); return; }
  if(amount<=0 && discAmt<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const bal = supplierBalance(supplierId).balance;
  if(discAmt + amount > bal + 0.001){ toast('الخصم + المدفوع أكبر من المستحق للمورد ('+money(bal)+')', true); return; }
  const supForDisc = DB.suppliers.find(s=>s.id===supplierId);
  if(discAmt>0){
    supForDisc.ledger = supForDisc.ledger || [];
    supForDisc.ledger.push({ id:uid('sled'), kind:'discount', amount:discAmt, reason:discReason,
      date:new Date().toISOString(), by:actorName() });
    await saveKey('suppliers', DB.suppliers);
    await logAction('💸 خصم من المورد '+supForDisc.name+' بقيمة '+money(discAmt)+' — السبب: '+discReason);
    pushNotif({ category:'financial', type:'supplier_discount', priority:'high', amount:discAmt,
      action:'خصم من المورد '+supForDisc.name+' بقيمة '+money(discAmt)+' — '+discReason, refType:'expense' });
  }
  if(amount<=0){
    closeModal(); toast('اتسجل الخصم '+money(discAmt)+' على حساب المورد'); refreshContent(); return;
  }
  // Apply payment across unpaid purchases, oldest first
  const purchases = DB.purchases.filter(p=>p.supplierId===supplierId).sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const p of purchases){
    if(amount<=0) break;
    const paidSoFar = (p.payments||[]).reduce((s,x)=>s+x.amount,0);
    const remaining = p.total - paidSoFar;
    if(remaining<=0) continue;
    const toPay = Math.min(remaining, amount);
    p.payments = p.payments || [];
    p.payments.push({id:uid('spay'), amount:toPay, date:new Date().toISOString()});
    amount -= toPay;
  }
  await saveKey('purchases', DB.purchases);
  const paidTotal = parseFloat(document.getElementById('supPayAmt').value)||0;
  const supName = (DB.suppliers.find(s=>s.id===supplierId)||{}).name;
  // خصم من الحساب المالي المختار
  const accId = (document.getElementById('supPayAcc')||{}).value;
  const acc = DB.finAccounts.find(a=>a.id===accId);
  if(acc) addFinMove(acc.id, 'out', paidTotal, 'supplier', 'سداد مورد: '+supName);
  // also log as an expense so it reflects in accounts/reports
  DB.expenses.push({id:uid('exp'), category:'سداد مورد', amount: paidTotal, note: supName, accountId:acc?acc.id:null, payAccount:acc?acc.name:null, date:new Date().toISOString()});
  await Promise.all([saveKey('expenses', DB.expenses), saveKey('finMoves', DB.finMoves)]);
  await logAction('سداد '+money(paidTotal)+' للمورد '+supName+(acc?' من '+acc.name:''));
  closeModal(); toast('تم تسجيل الدفعة للمورد'+(acc?' وخصمها من '+acc.name:'')); refreshContent();
}

async function saveSupplierAdjust(supplierId){
  if(!isOwnerSession()){ toast('تسوية أرصدة الموردين صلاحية صاحب المركز فقط', true); return; }
  const sup = DB.suppliers.find(s=>s.id===supplierId); if(!sup) return;
  const cur = supplierBalance(supplierId).balance;
  const correct = parseFloat((document.getElementById('sadjCorrect')||{}).value);
  const reason = ((document.getElementById('sadjReason')||{}).value||'').trim();
  const notes = ((document.getElementById('sadjNotes')||{}).value||'').trim();
  if(isNaN(correct)){ toast('اكتب الرصيد الصحيح', true); return; }
  if(!reason){ toast('سبب التسوية إلزامي', true); return; }
  const diff = Math.round((correct - cur)*100)/100;
  if(Math.abs(diff) < 0.005){ toast('الرصيد الصحيح زي الحالي بالظبط — مفيش تسوية', true); return; }
  sup.ledger = sup.ledger || [];
  sup.ledger.push({ id:uid('sled'), kind:'adjustment', amount:diff, reason, notes,
    date:new Date().toISOString(), by:actorName(), prevBalance:cur, newBalance:correct });
  await saveKey('suppliers', DB.suppliers);
  await logAction('⚖️ تسوية رصيد المورد '+sup.name+' — من '+money(cur)+' إلى '+money(correct)+' (فرق '+(diff>0?'+':'')+money(diff)+') — السبب: '+reason+(notes?' — '+notes:''));
  pushNotif({ category:'financial', type:'supplier_adjust', priority:'critical', amount:Math.abs(diff),
    action:'تسوية رصيد المورد '+sup.name+': '+money(cur)+' ← '+money(correct)+' — '+reason, refType:'expense' });
  closeModal(); toast('اتسجلت التسوية — الرصيد بقى '+money(correct)); openSupplierDetail(supplierId); refreshContent();
}

/* ============ الملاحظة 39: بحث ذكي في المخزون + منع تكرار الأصناف ============ */
/* تطبيع النص للبحث: توحيد الألف/الياء/التاء المربوطة، شيل التشكيل، أرقام عربية→إنجليزية، lowercase */
function normSearch(s){
  return String(s||'')
    .toLowerCase()
    .replace(/[ً-ْـ]/g,'')
    .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
    .replace(/[٠-٩]/g, d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))
    .replace(/[^a-z0-9؀-ۿ]+/g,' ')
    .trim();
}
/* مسافة تحرير بسيطة بسقف (للأخطاء الإملائية) */
function editDist(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let dp=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){
    let prev=dp[0]; dp[0]=i; let rowMin=dp[0];
    for(let j=1;j<=b.length;j++){
      const t=dp[j];
      dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev+(a[i-1]===b[j-1]?0:1));
      prev=t; if(dp[j]<rowMin) rowMin=dp[j];
    }
    if(rowMin>max) return max+1;
  }
  return dp[b.length];
}
/* نص البحث المجمّع لكل صنف (اسم + كود + OEM + رقم المورد + ماركة + كلمات بديلة + فئة + وصف) — بكاش للأداء */
const _partHayCache = new WeakMap();
function partHaystack(p){
  const sig = [p.name,p.sku,p.oemNo,p.supplierPartNo,p.barcode,p.brand,p.keywords,p.category,p.description].join('|');
  const c = _partHayCache.get(p);
  if(c && c.sig===sig) return c.text;
  const text = normSearch([p.name,p.sku,p.oemNo,p.supplierPartNo,p.barcode,p.brand,p.keywords,p.category,p.description].filter(Boolean).join(' '));
  _partHayCache.set(p,{sig,text});
  return text;
}
/* درجة تطابق 0..1: نسبة كلمات البحث اللي لقيناها (جزئي أو بخطأ إملائي بسيط) */
function partMatchScore(qTokens, p){
  const hayTokens = partHaystack(p).split(' ');
  if(!hayTokens.length) return 0;
  let matched = 0;
  for(const qt of qTokens){
    let hit = false;
    for(const ht of hayTokens){
      if(ht.includes(qt) || (qt.length>=3 && qt.includes(ht) && ht.length>=3)){ hit=true; break; }
      if(qt.length>=4){ const cap=qt.length>=7?2:1; if(editDist(qt,ht,cap)<=cap){ hit=true; break; } }
    }
    if(hit) matched++;
  }
  return matched/qTokens.length;
}
/* البحث الذكي: يرجّع [{part, score}] مرتبة بالأفضل */
function smartSearchParts(query, limit){
  const qTokens = normSearch(query).split(' ').filter(t=>t.length>=2);
  if(!qTokens.length) return [];
  const scored = [];
  for(const p of activeInventory()){
    const score = partMatchScore(qTokens, p);
    if(score>0) scored.push({part:p, score});
  }
  scored.sort((a,b)=> b.score-a.score || a.part.name.localeCompare(b.part.name,'ar'));
  return scored.slice(0, limit||8);
}
/* حركات التوريد بسعر (الأحدث أولاً) — لآخر سعر شراء ومتوسط التكلفة والتاريخ */
function partInMoves(partId){
  return DB.stockMoves.filter(m=>m.partId===partId && m.type==='in' && m.unitCost!=null)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
}
function lastPurchaseInfo(partId){
  const mv = partInMoves(partId)[0];
  if(!mv){ const p=DB.inventory.find(x=>x.id===partId); return { price:p?p.costPrice:0, date:null, supplierName:null }; }
  const s = mv.supplierId ? DB.suppliers.find(x=>x.id===mv.supplierId) : null;
  return { price:mv.unitCost, date:mv.date, supplierName:s?s.name:null };
}
function avgPurchaseCost(partId){
  const ms = partInMoves(partId);
  if(!ms.length){ const p=DB.inventory.find(x=>x.id===partId); return p?p.costPrice:0; }
  const tq = ms.reduce((s,m)=>s+m.qty,0)||1;
  return ms.reduce((s,m)=>s+m.qty*m.unitCost,0)/tq;
}
function partPurchaseHistory(partId, n){
  return partInMoves(partId).slice(0, n||3).map(mv=>({
    date:mv.date, price:mv.unitCost,
    supplier:(mv.supplierId && (DB.suppliers.find(x=>x.id===mv.supplierId)||{}).name)||'—'
  }));
}
/* نفس الصنف في مخازن تانية (بنفس الاسم بعد التطبيع) */
function partSiblings(p){ const key=normSearch(p.name); return DB.inventory.filter(x=>normSearch(x.name)===key); }
/* صفوف نتائج البحث المبسطة: كود · اسم · متاح · آخر شراء · [تفاصيل] */
function smartRowsHTML(parts){

async function savePurchaseInvoice(){
  if(!can('inv.receive')){ toast('مالكش صلاحية تسجيل المشتريات', true); return; }
  if(!purchaseDraft.supplierId){ toast('اختار المورد أولاً', true); return; }
  if(purchaseDraft.lines.length===0){ toast('أضف صنف واحد على الأقل', true); return; }
  // الملاحظة 45: حماية خلفية — لو صنف في الفاتورة اتأرشف (مثلاً من جهاز تاني) أو المورد اتأرشف، الحفظ يترفض قبل أي تعديل
  const archivedLine = purchaseDraft.lines.find(l=>l.partId && (DB.inventory.find(p=>p.id===l.partId)||{}).archived);
  if(archivedLine){ toast('الصنف «'+archivedLine.name+'» مؤرشف — استرجعه من الأرشيف الأول أو شيله من الفاتورة', true); return; }
  const supplier = DB.suppliers.find(s=>s.id===purchaseDraft.supplierId);
  if(supplier && supplier.archived){ toast('المورد «'+supplier.name+'» مؤرشف — استرجعه من الأرشيف الأول', true); return; }
  const purchaseId = uid('pur');
  const invoiceItems = [];
  for(const line of purchaseDraft.lines){
    let part;
    if(line.partId){
      part = DB.inventory.find(p=>p.id===line.partId);
      part.qty += line.qty;
      part.costPrice = line.costPrice;
      if(line.sellPrice) part.sellPrice = line.sellPrice;
    } else {
      part = {id:uid('p'), name:line.name, sku:line.sku||'', brand:line.brand||'', oemNo:line.oemNo||'', category:line.category||'', unit:line.unit||'قطعة', qty:line.qty, minQty:2, costPrice:line.costPrice, sellPrice:line.sellPrice, warehouseId:line.warehouseId||defaultWhId(), createdAt:new Date().toISOString()};
      DB.inventory.push(part);
    }
    DB.stockMoves.push({id:uid('mv'), partId:part.id, type:'in', qty:line.qty, unitCost:line.costPrice, warehouseId:partWhId(part), date:new Date().toISOString(), note:'فاتورة شراء #'+(purchaseDraft.invoiceNo||'—')+' — '+purchaseDraft.paymentMethod+' — مخزن: '+whName(partWhId(part)), supplierId:purchaseDraft.supplierId, purchaseId,
      notes:line.notes||'', reqById:line.reqById||'', reqByName:line.reqByName||'', forJobId:line.forJobId||'', forJobNo:line.forJobNo||'', forCarId:line.forCarId||'', forCarLbl:line.forCarLbl||''});
    invoiceItems.push({partId:part.id, name:part.name, qty:line.qty, unitCost:line.costPrice});
  }
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('stockMoves', DB.stockMoves)]);
  const total = invoiceItems.reduce((s,it)=>s+it.qty*it.unitCost,0);
  const purchase = {
    id: purchaseId, purchaseNo: purchaseDraft.invoiceNo || nextNo(DB.purchases,'purchaseNo'),
    supplierId: purchaseDraft.supplierId,
    date: purchaseDraft.date ? new Date(purchaseDraft.date).toISOString() : new Date().toISOString(),
    note: 'طريقة الدفع: '+purchaseDraft.paymentMethod,
    paymentMethod: purchaseDraft.paymentMethod,
    items: invoiceItems, total, payments: []
  };
  if(purchaseDraft.paymentMethod !== 'آجل'){
    purchase.payments.push({id:uid('pay'), amount: total, date: new Date().toISOString()});
  }
  DB.purchases.push(purchase);
  await saveKey('purchases', DB.purchases);
  await logAction('فاتورة شراء جديدة #'+purchase.purchaseNo+' من '+supplier.name+' بقيمة '+money(total)+' ('+purchaseDraft.paymentMethod+')');
  toast('تم حفظ الفاتورة وتحديث المخزون وحساب المورد');
  purchaseDraft = null;
  currentTab='suppliers'; render();
}

function updateInvoicePreview(subtotal){

    <div class="flex-between"><span class="muted">نسبة الضريبة</span><span>${taxPct}%</span></div>
    <div class="flex-between"><span class="muted">قيمة الضريبة</span><span>${money(taxAmount)}</span></div>
    <div class="flex-between total-row" style="margin-top:6px;font-weight:800"><span>الإجمالي النهائي</span><span>${money(total)}</span></div>
  `;
}
async function createInvoiceFromJob(jobId){
  if(!can('bill.create')){ toast('مالكش صلاحية إصدار الفواتير', true); return; }
  const job = DB.jobs.find(j=>j.id===jobId);
  // حماية من التكرار: ممنوع فاتورة تانية لنفس أمر الشغل
  if(DB.invoices.some(i=>i.jobId===jobId && !i.cancelled)){
    toast('يوجد فاتورة صادرة بالفعل لأمر الشغل ده', true); closeModal(); refreshContent(); return;
  }
  const subtotal = job.items.reduce((s,it)=>s+it.qty*it.unitPrice,0);
  let discount = Math.max(parseFloat((document.getElementById('invDiscount')||{}).value)||0, 0);
  if(discount>0 && !can('bill.discount')){ toast('مالكش صلاحية الخصم — الفاتورة هتتصدر بدون خصم', true); discount = 0; }
  const vatRate = Math.max(parseFloat((document.getElementById('invTaxPct')||{}).value)||0, 0);  // نسبة الضريبة اليدوية
  const afterDiscount = Math.max(subtotal-discount,0);
  const vatAmount = afterDiscount*vatRate/100;
  const total = afterDiscount+vatAmount;
  const inv = {
    id: uid('inv'), invNo: nextNo(DB.invoices,'invNo'),
    jobId, customerId: job.customerId, items: JSON.parse(JSON.stringify(job.items)),
    subtotal, discount, vatRate, vatAmount, total, payments: [], date: new Date().toISOString()
  };
  DB.invoices.push(inv);
  await saveKey('invoices', DB.invoices);
  // القاعدة: إصدار الفاتورة = تسليم السيارة وخروجها من المركز
  if(job.status !== 'تم التسليم'){
    job.status = 'تم التسليم';
    job.deliveredAt = new Date().toISOString();
    await saveKey('jobs', DB.jobs);
  }
  await logAction('إصدار فاتورة #'+inv.invNo+' بقيمة '+money(total)+' — تم تسليم السيارة وإقفال أمر الشغل #'+job.jobNo);
  if(discount>0 && subtotal>0){
    const pct = discount/subtotal*100;
    if(pct >= (DB.settings.largeDiscountPct||15)){
      const custD = DB.customers.find(c=>c.id===job.customerId);
      pushNotif({ category:'financial', type:'large_discount', priority: pct>=25?'critical':'high', amount:discount,
        action:'خصم عالي '+pct.toFixed(1)+'% على فاتورة #'+inv.invNo+(custD?' — '+custD.name:''), refType:'invoice', refNo:inv.invNo });
    }
  }
  closeModal(); toast('تم إصدار الفاتورة وتسليم السيارة — تفضل بتحصيل الدفعة');
  currentTab='invoices'; render();
  // بعد الإصدار: نروح لشاشة تحصيل الدفعة على طول (لو عنده صلاحية التحصيل)
  if(can('bill.collect')) openPaymentModal(inv.id);
}
function paymentStatus(inv){
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  if(paid<=0) return 'unpaid';
  if(paid<inv.total) return 'partial';
  return 'paid';
}

function invoiceMatchesFilters(inv){
  const f = invFilters;
  const cust = DB.customers.find(c=>c.id===inv.customerId);
  const job = inv.jobId ? DB.jobs.find(j=>j.id===inv.jobId) : null;
  const car = job ? DB.cars.find(c=>c.id===job.carId) : null;
  if(f.custType && ((cust&&cust.custType)||'فرد')!==f.custType) return false;
  if(f.status){
    if(f.status==='cancelled'){ if(!inv.cancelled) return false; }
    else { if(inv.cancelled) return false; if(paymentStatus(inv)!==f.status) return false; }
  }
  if(f.dateFrom && new Date(inv.date) < new Date(f.dateFrom)) return false;
  if(f.dateTo && new Date(inv.date) > new Date(new Date(f.dateTo).getTime()+86399999)) return false;
  if(f.search){
    const t = f.search.trim().toLowerCase();
    const hay = [cust&&cust.name, cust&&cust.phone, (cust&&cust.custType)||'فرد',
      inv.invNo, job&&job.jobNo, car&&car.plate, car&&carLabel(car)].filter(Boolean).join(' | ').toLowerCase();
    if(!hay.includes(t)) return false;
  }
  return true;
}
function invRowsHTML(){
  const map = {unpaid:['غير محصلة','tag-unpaid'], partial:['محصلة جزئياً','tag-partial'], paid:['محصلة بالكامل','tag-paid']};
  const list = [...DB.invoices].filter(invoiceMatchesFilters).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(list.length===0) return `<tr><td colspan="10" class="empty">لا توجد فواتير مطابقة</td></tr>`;
  return list.map(inv=>{
    const cust = DB.customers.find(c=>c.id===inv.customerId);
    const job = inv.jobId ? DB.jobs.find(j=>j.id===inv.jobId) : null;
    const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
    const st = paymentStatus(inv);
    return `<tr>

      <td>${!inv.cancelled && st!=='paid'?`<button class="btn btn-sm btn-accent" onclick="openPaymentModal('${inv.id}')">تحصيل</button>`:''}
      ${!inv.cancelled && paid===0 && can('bill.cancel')?` <button class="btn btn-sm btn-danger" onclick="cancelInvoice('${inv.id}')">إلغاء</button>`:''}</td>
      <td style="white-space:nowrap">${job?`<button class="btn btn-sm" onclick="openWorkOrderReport('${job.id}')">📈 الربحية</button> `:''}${can('bill.print')?`<button class="btn btn-sm" onclick="printInvoice('${inv.id}')">🖨</button> <button class="btn btn-sm" onclick="downloadInvoice('${inv.id}')">⬇ تحميل</button>`:''}</td>

function cancelInvoice(invId){
  if(!can('bill.cancel')){ toast('مالكش صلاحية إلغاء الفواتير', true); return; }
  const inv = DB.invoices.find(i=>i.id===invId);
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  if(paid>0){ toast('لا يمكن إلغاء فاتورة عليها دفعات محصلة', true); return; }
  askConfirmReason('هل أنت متأكد من إلغاء الفاتورة #'+inv.invNo+'؟ ستُستبعد من كل حسابات المبيعات والمديونيات، ويمكن إصدار فاتورة جديدة لنفس أمر الشغل.', async (reason)=>{
    inv.cancelled = true;
    inv.cancelledAt = new Date().toISOString();
    inv.cancelReason = reason||'';
    await saveKey('invoices', DB.invoices);
    const cstI = DB.customers.find(c=>c.id===inv.customerId);
    await logAction('🚫 إلغاء فاتورة #'+inv.invNo+auditDetails([
      ['العميل', cstI?cstI.name:null], ['تاريخ الفاتورة', fmtDate(inv.date)],
      ['الإجمالي', money(inv.total)], ['الخصم', inv.discount?money(inv.discount):null],
      ['الضريبة', inv.vatAmount?money(inv.vatAmount)+' ('+inv.vatRate+'%)':null],
      ['عدد البنود', (inv.items||[]).length], ['السبب', reason||'—']

}
function openPaymentModal(invId){
  const inv = DB.invoices.find(i=>i.id===invId);
  const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
  const remaining = inv.total - paid;
  openModal(`
    <h3>تحصيل دفعة — فاتورة #${inv.invNo}</h3>
    <div class="muted" style="margin-bottom:12px">المتبقي: ${money(remaining)}</div>
    <div class="form-row"><label class="f-label">المبلغ</label><input class="f" id="payAmt" type="number" min="0" max="${remaining}" value="${remaining}"></div>
    <div class="form-row"><label class="f-label">وسيلة السداد / الحساب المستلم</label>
      <select class="f" id="payMethod">${DB.finAccounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select>
    </div>
    <button class="btn btn-accent" style="width:100%" onclick="savePayment('${invId}')">تأكيد التحصيل</button>

async function savePayment(invId){
  if(!can('bill.collect')){ toast('مالكش صلاحية التحصيل', true); return; }
  const amount = parseFloat(document.getElementById('payAmt').value)||0;
  if(amount<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const inv = DB.invoices.find(i=>i.id===invId);
  inv.payments = inv.payments || [];
  const paidSoFar = inv.payments.reduce((s,p)=>s+p.amount,0);
  const remaining = inv.total - paidSoFar;
  if(amount > remaining + 0.001){ toast('المبلغ أكبر من المتبقي على الفاتورة ('+money(remaining)+')', true); return; }
  const accId = (document.getElementById('payMethod')||{}).value;
  const acc = DB.finAccounts.find(a=>a.id===accId) || accountForMethod('كاش');
  const method = acc ? acc.name : 'كاش';
  const cust = DB.customers.find(c=>c.id===inv.customerId);
  inv.payments.push({id:uid('pay'), amount, method, accountId:acc?acc.id:null, date:new Date().toISOString()});
  if(acc) addFinMove(acc.id, 'in', amount, 'collection', 'تحصيل فاتورة #'+inv.invNo+(cust?' — '+cust.name:''));
  await Promise.all([saveKey('invoices', DB.invoices), saveKey('finMoves', DB.finMoves)]);
  await logAction('تحصيل دفعة '+money(amount)+' ('+method+') على فاتورة #'+inv.invNo);
  closeModal(); toast('تم تسجيل الدفعة'); refreshContent();
}

function downloadHTML(html, filename){
  const full = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${filename}</title>
  <style>
  body{font-family:Tahoma,Arial,sans-serif;color:#111;background:#fff;margin:0;padding:28px;}
  ${brandedInvoiceCSS()}
  </style></head><body>${html}
  <script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`;
  const blob = new Blob([full], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('تم تحميل الملف — افتحه وهيطبع تلقائياً');
}

/* ---- الفترة الزمنية للداشبورد المالي ---- */
let rcvPeriod = { preset:'this_month', from:'', to:'' };
function periodRange(st){
  st = st || rcvPeriod;
  const now = new Date();
  const d0 = (d)=>new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today0 = d0(now);
  let from, to;
  switch(st.preset){
    case 'today': from = today0; to = new Date(today0.getTime()+86399999); break;
    case 'yesterday': from = new Date(today0.getTime()-86400000); to = new Date(today0.getTime()-1); break;
    case 'this_week': { const dow=(now.getDay()+1)%7; /* السبت بداية الأسبوع */ from = new Date(today0.getTime()-dow*86400000); to = now; break; }
    case 'last_week': { const dow=(now.getDay()+1)%7; const thisWeekStart = new Date(today0.getTime()-dow*86400000); from = new Date(thisWeekStart.getTime()-7*86400000); to = new Date(thisWeekStart.getTime()-1); break; }
    case 'this_month': from = new Date(now.getFullYear(), now.getMonth(), 1); to = now; break;
    case 'last_month': from = new Date(now.getFullYear(), now.getMonth()-1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59); break;
    case 'this_quarter': { const q = Math.floor(now.getMonth()/3); from = new Date(now.getFullYear(), q*3, 1); to = now; break; }
    case 'this_year': from = new Date(now.getFullYear(), 0, 1); to = now; break;
    case 'all': from = new Date(2000,0,1); to = now; break;
    case 'custom':
      from = st.from ? new Date(st.from) : new Date(2000,0,1);
      to = st.to ? new Date(new Date(st.to).getTime()+86399999) : now;
      break;
    default: from = new Date(2000,0,1); to = now;
  }
  return {from, to};
}
function inPeriod(dateStr, range){ const d = new Date(dateStr); return d >= range.from && d <= range.to; }
function setRcvPreset(p){ rcvPeriod.preset = p; refreshContent(); }

/* ---- محرك الربحية الإجمالية حسب الفترة (الملاحظة 16) ---- */
function computeProfitStats(range){
  const invs = DB.invoices.filter(i=>!i.cancelled && inPeriod(i.date, range));
  let sales=0, collected=0, inParts=0, extParts=0, extWork=0, paint=0;
  invs.forEach(inv=>{
    sales += inv.total;
    collected += (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
    const job = DB.jobs.find(j=>j.id===inv.jobId);
    if(job){
      job.items.forEach(it=>{
        const c = it.qty*(it.costPrice||0);
        if(it.kind==='part') inParts += c;
        else if(it.kind==='ext_part') extParts += c;
        else if(it.kind==='ext_work') extWork += c;
      });
      (job.internalCosts||[]).forEach(ic=>{ paint += ic.total; });
    }
  });
  const cost = inParts + extParts + extWork + paint;
  const debt = sales - collected;
  const profit = sales - cost;
  const margin = sales>0 ? profit/sales*100 : 0;
  return {count:invs.length, sales, collected, debt, cost, profit, margin, inParts, extParts, extWork, paint};
}
function profitReportHTML(range){
  if(!can('rep.profit')) return `<div class="empty">🔒 تقارير الربحية متاحة لأصحاب الصلاحية فقط</div>`;
  const ps = computeProfitStats(range);
  return `
  <div class="grid g4" style="margin-bottom:10px">
    ${stat(String(ps.count),'عدد الفواتير')}

    ${stat(ps.margin.toFixed(1)+'%','نسبة الربحية', ps.margin<15 && ps.sales>0)}
  </div>

function accBalance(accId){
  const acc = DB.finAccounts.find(a=>a.id===accId);
  if(!acc) return 0;
  let b = acc.openingBalance||0;
  DB.finMoves.forEach(m=>{
    if(m.accountId!==accId) return;
    b += m.type==='in' ? m.amount : -m.amount;
  });
  return b;
}
function addFinMove(accountId, type, amount, kind, note){
  DB.finMoves.push({id:uid('fm'), accountId, type, amount, kind, note, actor:actorName(), date:new Date().toISOString()});
}
function accountForMethod(methodName){
  // مطابقة وسيلة الدفع بالحساب المناسب تلقائياً
  const byName = DB.finAccounts.find(a=>methodName && methodName.includes(a.name));
  if(byName) return byName;
  if(/كاش/.test(methodName||'') && !/فودافون/.test(methodName||'')) return DB.finAccounts.find(a=>a.kind==='خزنة') || DB.finAccounts[0];
  if(/بنك|تحويل|فيزا|POS|بطاقة/.test(methodName||'')) return DB.finAccounts.find(a=>a.kind==='بنك') || DB.finAccounts[0];
  if(/فودافون/.test(methodName||'')) return DB.finAccounts.find(a=>a.name.includes('فودافون')) || DB.finAccounts[0];
  return DB.finAccounts.find(a=>a.kind==='خزنة') || DB.finAccounts[0];
}

function readImageResized(file){
  return new Promise((resolve,reject)=>{
    if(file.size > 5*1024*1024){ toast('الصورة كبيرة جداً (أكثر من 5 ميجا) — استخدم صورة أصغر', true); return reject(new Error('too big')); }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>resolve(reader.result);
      img.onload = ()=>{
        try{
          const max = 1000; let w = img.width, h = img.height;
          if(w>max){ h = Math.round(h*max/w); w = max; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',0.7));
        }catch(err){ resolve(reader.result); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  if(!can('fin.expenses')){ toast('مالكش صلاحية تسجيل المصروفات', true); return; }
  const catId = (document.getElementById('expCatSel')||{}).value;
  const cat = DB.expenseCategories.find(c=>c.id===catId);
  const amount = parseFloat(document.getElementById('expAmt').value)||0;
  const description = (document.getElementById('expDesc')||{}).value.trim();
  const notes = (document.getElementById('expNotes')||{}).value.trim();
  const dateVal = (document.getElementById('expDate')||{}).value;
  const accId = (document.getElementById('expAcc')||{}).value;
  if(!cat){ toast('اختر نوع المصروف', true); return; }
  if(amount<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const acc = DB.finAccounts.find(a=>a.id===accId);
  let receipt = '';
  const fileEl = document.getElementById('expReceipt');
  if(fileEl && fileEl.files && fileEl.files[0]){
    try{ receipt = await readImageResized(fileEl.files[0]); }catch(err){ if(err && err.message==='too big') return; }
  }
  const date = dateVal ? new Date(dateVal+'T'+new Date().toTimeString().slice(0,8)).toISOString() : new Date().toISOString();
  DB.expenses.push({
    id:uid('exp'), expNo: nextNo(DB.expenses,'expNo'),
    category: cat.name, categoryId: cat.id, group: cat.group,
    description, notes, note: description, amount,
    accountId: acc?acc.id:null, payAccount: acc?acc.name:null,
    receipt, actor: actorName(), date
  });
  if(acc) addFinMove(acc.id, 'out', amount, 'expense', 'مصروف: '+cat.name+(description?' — '+description:''));
  await Promise.all([saveKey('expenses'), saveKey('finMoves')]);
  await logAction('مصروف '+money(amount)+' — '+cat.name+(acc?' من '+acc.name:''));
  if(amount >= (DB.settings.largeExpenseThreshold||20000)){
    pushNotif({ category:'financial', type:'large_expense', priority: amount>=50000?'critical':'high', amount,
      action:'مصروف كبير: '+cat.name+(description?' — '+description:''), refType:'expense' });
  }
  closeModal(); toast('تم حفظ المصروف وخصمه من '+(acc?acc.name:'')); refreshContent();
}

function openNewExpenseCatModal(){

async function saveExpenseCat(){
  const name = document.getElementById('ecName').value.trim();
  const group = (document.getElementById('ecGroup')||{}).value || EXPENSE_GROUPS[0];
  if(!name){ toast('اكتب اسم النوع', true); return; }
  if(DB.expenseCategories.some(c=>c.name===name && c.group===group)){ toast('النوع ده موجود بالفعل في نفس المجموعة', true); return; }
  DB.expenseCategories.push({id:uid('ec'), name, group, createdAt:new Date().toISOString()});
  await saveKey('expenseCategories');
  await logAction('إضافة نوع مصروف: '+name+' ('+group+')');
  closeModal(); toast('تم إضافة النوع'); refreshContent();
}
async function deleteExpenseCat(id){
  const c = DB.expenseCategories.find(x=>x.id===id);
  if(!c) return;
  const used = DB.expenses.some(e=>e.categoryId===id || e.category===c.name);
  askConfirm('حذف نوع المصروف "'+c.name+'"؟'+(used?'<br><span class="muted">(فيه مصروفات مسجلة عليه — هتفضل موجودة في التقارير)</span>':''), async ()=>{
    DB.expenseCategories = DB.expenseCategories.filter(x=>x.id!==id);
    await saveKey('expenseCategories');
    await logAction('🗑️ حذف نوع مصروف «'+c.name+'»'+auditDetails([
      ['المجموعة', c.group],
      ['مصروفات مسجلة عليه', used ? DB.expenses.filter(e=>e.categoryId===id || e.category===c.name).length+' مصروف (بتفضل في التقارير)' : 'لا يوجد']
    ]));
    toast('تم الحذف'); refreshContent();
  });
}
function renderExpenseReport(){
  const range = periodRange(expensePeriod);
  const inRange = DB.expenses.filter(e=>inPeriod(e.date, range));
  const total = inRange.reduce((s,e)=>s+(e.amount||0),0);
  const sumBy = (fn)=>{ const m={}; inRange.forEach(e=>{ const k=fn(e)||'غير محدد'; m[k]=(m[k]||0)+(e.amount||0); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const cats = sumBy(e=>e.category);
  const accs = sumBy(e=>e.payAccount);
  const groups = sumBy(e=>expGroupOf(e));
  const investment = inRange.filter(e=>INVESTMENT_GROUPS.includes(expGroupOf(e))).reduce((s,e)=>s+(e.amount||0),0);
  const operational = total - investment;
  const thisM = DB.expenses.filter(e=>inPeriod(e.date, periodRange({preset:'this_month'}))).reduce((s,e)=>s+(e.amount||0),0);
  const lastM = DB.expenses.filter(e=>inPeriod(e.date, periodRange({preset:'last_month'}))).reduce((s,e)=>s+(e.amount||0),0);
  const diff = thisM - lastM;
  const periodLbl = PERIOD_PRESETS.find(x=>x[0]===expensePeriod.preset)?.[1] || 'فترة مخصصة';
  const bar = (val)=>{ const pct = total>0?Math.round(val/total*100):0; return `<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;max-width:160px;background:var(--surface-2);border-radius:6px;height:8px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--accent)"></div></div><span>${pct}%</span></div>`; };
  const tableCard = (title, rows)=>`
    <div class="section-head"><h3>${title}</h3></div>
    <div class="card" style="margin-bottom:16px">
      <table><thead><tr><th>البند</th><th>المبلغ</th><th>النسبة</th></tr></thead><tbody>
      ${rows.length? rows.map(([k,v])=>`<tr><td>${k}</td><td style="font-weight:700">${money(v)}</td><td>${bar(v)}</td></tr>`).join('') : `<tr><td colspan="3" class="empty">لا توجد مصروفات في الفترة</td></tr>`}
      </tbody></table>
    </div>`;
  return `
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      ${PERIOD_PRESETS.map(([id,lbl])=>`<button class="btn btn-sm ${expensePeriod.preset===id?'btn-accent':''}" onclick="setExpPreset('${id}')">${lbl}</button>`).join('')}
    </div>
    <div class="grid g2" style="max-width:440px">
      <input class="f" type="date" value="${expensePeriod.from}" onchange="expensePeriod.from=this.value;expensePeriod.preset='custom';refreshContent()">
      <input class="f" type="date" value="${expensePeriod.to}" onchange="expensePeriod.to=this.value;expensePeriod.preset='custom';refreshContent()">
    </div>
  </div>
  <div class="grid g4" style="margin-bottom:20px">
    ${stat(money(total),'إجمالي المصروفات — '+periodLbl, total>0)}
    ${stat(money(operational),'مصروفات تشغيلية')}
    ${stat(money(investment),'مصروفات استثمارية (أصول)')}
    ${stat(cats.length?cats[0][0]:'—','أعلى بند مصروف')}
  </div>
  <div class="grid g2" style="margin-bottom:22px">
    ${stat(money(thisM),'مصروفات هذا الشهر')}
    ${stat((diff>=0?'▲ +':'▼ ')+money(Math.abs(diff)),'الفرق عن الشهر الماضي ('+money(lastM)+')', diff>0)}
  </div>
  ${tableCard('توزيع المصروفات حسب النوع', cats)}
  ${tableCard('توزيع المصروفات حسب المجموعة', groups)}
  ${tableCard('توزيع المصروفات حسب وسيلة الدفع / الحساب', accs)}`;
}

/* ======================= CUSTODY MANAGEMENT — العهد (الملاحظة 34) =======================
   عهد نثرية للموظفين (Petty Cash Advances) — جزء من المالية والمصروفات، مش من الموارد البشرية.
   الإصدار بيخصم من الحساب فوراً (مش مصروف)، والتسوية بتحوّل بنود المصروف لمصروفات حقيقية
   وترجّع الباقي للحساب اللي تختاره. عهدة مفتوحة واحدة لكل موظف. */
const CUSTODY_OVERDUE_HOURS = 48;
let custodyFilter = { emp:'', status:'', source:'', from:'', to:'' };
function setCustodyFilter(k,v){ custodyFilter[k]=v; refreshContent(); }
function custodyStatusLabel(s){ return s==='open'?'مفتوحة': s==='closed'?'مقفولة': s==='settled'?'مسوّاة':'مقفولة'; }
function custodyStatusTag(s){
  if(s==='open') return '<span class="tag tag-working">مفتوحة</span>';
  return '<span class="tag tag-paid">مقفولة</span>';
}
function custodyHoursOpen(c){ return c.status==='open' ? (Date.now()-new Date(c.createdAt))/3600000 : 0; }
function isCustodyOverdue(c){ return c.status==='open' && custodyHoursOpen(c) > CUSTODY_OVERDUE_HOURS; }
function openCustodies(){ return DB.custodies.filter(c=>c.status==='open'); }
function overdueCustodies(){ return openCustodies().filter(isCustodyOverdue); }
function empOpenCustody(empId){ return DB.custodies.find(c=>c.employeeId===empId && c.status==='open'); }
function custodyEmpName(c){ const e=DB.employees.find(x=>x.id===c.employeeId); return e?e.name:(c.employeeName||'—'); }
function renderCustodies(){
  const canCreate = can('fin.custody_create');
  const emps = [...DB.employees].filter(e=>e.status==='نشط').sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const allEmps = [...DB.employees].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  // فلترة
  let list = [...DB.custodies];
  if(custodyFilter.emp) list = list.filter(c=>c.employeeId===custodyFilter.emp);
  if(custodyFilter.status) list = list.filter(c=>c.status===custodyFilter.status);
  if(custodyFilter.source) list = list.filter(c=>c.sourceAccountId===custodyFilter.source);
  if(custodyFilter.from) list = list.filter(c=>(c.createdAt||'').slice(0,10) >= custodyFilter.from);
  if(custodyFilter.to) list = list.filter(c=>(c.createdAt||'').slice(0,10) <= custodyFilter.to);
  list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const open = openCustodies();
  const overdue = overdueCustodies();
  const openTotal = open.reduce((s,c)=>s+c.amount,0);
  const closedTotal = DB.custodies.filter(c=>c.status!=='open').reduce((s,c)=>s+c.amount,0);
  return `
  <div class="grid g4" style="margin-bottom:16px">
    ${stat(String(open.length),'عهد مفتوحة', open.length>0)}
    ${stat(money(openTotal),'إجمالي العهد المفتوحة', openTotal>0)}
    ${stat(String(overdue.length),'عهد متأخرة (+'+CUSTODY_OVERDUE_HOURS+' ساعة)', overdue.length>0)}
    ${stat(money(closedTotal),'إجمالي العهد المقفولة')}
  </div>
  <div class="section-head"><h3>👛 عهد الموظفين</h3>
    ${canCreate?`<button class="btn btn-accent" onclick="openNewCustodyModal()">${ICONS.plus} عهدة جديدة</button>`:''}</div>
  <div class="card" style="margin-bottom:16px">
    <div class="grid g4">
      <div class="form-row" style="margin:0"><label class="f-label">الموظف</label>
        <select class="f" onchange="setCustodyFilter('emp',this.value)"><option value="">كل الموظفين</option>${allEmps.map(e=>`<option value="${e.id}" ${custodyFilter.emp===e.id?'selected':''}>${e.name}</option>`).join('')}</select></div>
      <div class="form-row" style="margin:0"><label class="f-label">الحالة</label>
        <select class="f" onchange="setCustodyFilter('status',this.value)"><option value="">الكل</option><option value="open" ${custodyFilter.status==='open'?'selected':''}>مفتوحة</option><option value="closed" ${custodyFilter.status==='closed'?'selected':''}>مقفولة</option></select></div>
      <div class="form-row" style="margin:0"><label class="f-label">مصدر الصرف</label>
        <select class="f" onchange="setCustodyFilter('source',this.value)"><option value="">الكل</option>${DB.finAccounts.map(a=>`<option value="${a.id}" ${custodyFilter.source===a.id?'selected':''}>${a.name}</option>`).join('')}</select></div>
      <div class="form-row" style="margin:0"><label class="f-label">من — إلى</label>
        <div style="display:flex;gap:4px"><input class="f" type="date" value="${custodyFilter.from}" onchange="setCustodyFilter('from',this.value)"><input class="f" type="date" value="${custodyFilter.to}" onchange="setCustodyFilter('to',this.value)"></div></div>
    </div>
  </div>
  <div class="card">
    <table><thead><tr><th>رقم</th><th>الموظف</th><th>الغرض</th><th>المبلغ</th><th>المصدر</th><th>التاريخ</th><th>المدة</th><th>الحالة</th><th></th></tr></thead>
    <tbody>${list.length? list.map(c=>{
      const over = isCustodyOverdue(c);
      return `<tr style="${over?'background:rgba(224,37,37,.10)':''}">
        <td style="font-weight:700;color:var(--accent)">#${c.custodyNo}</td>
        <td style="font-weight:700">${custodyEmpName(c)}</td>
        <td class="muted">${c.purpose||'—'}</td>
        <td style="font-weight:800">${money(c.amount)}</td>
        <td class="muted">${c.sourceName||'—'}</td>
        <td style="white-space:nowrap;font-size:12px">${fmtDate(c.createdAt)}</td>
        <td style="${over?'color:var(--danger);font-weight:800':''}">${c.status==='open'?durationText(c.createdAt)+(over?' 🚨':''):'—'}</td>
        <td>${custodyStatusTag(c.status)}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm" onclick="openCustodyDetail('${c.id}')">تفاصيل</button>
          ${c.status==='open' && can('fin.custody_settle')?`<button class="btn btn-sm btn-accent" onclick="openSettleCustodyModal('${c.id}')">تسوية</button>`:''}
        </td></tr>`;
    }).join('') : `<tr><td colspan="9" class="empty">مفيش عهد ${custodyFilter.emp||custodyFilter.status?'مطابقة للفلتر':'مسجلة'}</td></tr>`}
    </tbody></table>
  </div>`;
}

        <select class="f" id="cuEmp">${emps.map(e=>`<option value="${e.id}">${e.name}${empOpenCustody(e.id)?' ⚠️ (عنده عهدة مفتوحة)':''}</option>`).join('')}</select></div>
    </div>
