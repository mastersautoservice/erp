async function saveNewPart(){
  if(!can('inv.item_create')){ toast('مالكش صلاحية إضافة أصناف', true); return; }
  const name = document.getElementById('pName').value.trim();
  if(!name){ toast('اكتب اسم القطعة', true); return; }
  const part = {
    id:uid('p'), name, sku:document.getElementById('pSku').value.trim(),
    warehouseId: document.getElementById('pWh').value || defaultWhId(),
    category: document.getElementById('pCategory').value.trim(),
    unit: document.getElementById('pUnit').value.trim() || 'قطعة',
    qty: parseFloat(document.getElementById('pQty').value)||0,
    minQty: parseFloat(document.getElementById('pMin').value)||0,
    costPrice: parseFloat(document.getElementById('pCost').value)||0,
    sellPrice: parseFloat(document.getElementById('pSell').value)||0,
    createdAt: new Date().toISOString(),
  };
  DB.inventory.push(part);
  await saveKey('inventory', DB.inventory);
  if(part.qty>0){
    DB.stockMoves.push({id:uid('mv'), partId:part.id, type:'in', qty:part.qty, date:new Date().toISOString(), note:'رصيد افتتاحي'});

  }
  closeModal(); toast('تم إضافة الصنف'); refreshContent();
}

async function saveStockIn(partId){
  if(!can('inv.receive')){ toast('مالكش صلاحية التوريد', true); return; }
  // الملاحظة 45: حماية خلفية — ممنوع توريد على صنف مؤرشف حتى لو اتفتحت النافذة بأي طريقة
  const pGuard = DB.inventory.find(x=>x.id===partId);
  if(pGuard && pGuard.archived){ toast('الصنف مؤرشف — استرجعه من الأرشيف الأول قبل التوريد', true); return; }
  const qty = parseFloat(document.getElementById('inQty').value)||0;
  const cost = parseFloat(document.getElementById('inCost').value)||0;
  const note = document.getElementById('inNote').value.trim();
  const supplierId = document.getElementById('inSupplier').value;
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  const p = DB.inventory.find(x=>x.id===partId);
  p.qty += qty;
  if(cost>0) p.costPrice = cost;
  let purchaseId = null;
  if(supplierId){
    purchaseId = uid('pur');
  }
  DB.stockMoves.push({id:uid('mv'), partId, type:'in', qty, unitCost:cost, date:new Date().toISOString(), note, supplierId: supplierId||null, purchaseId});
  await saveKey('inventory', DB.inventory);
  await saveKey('stockMoves', DB.stockMoves);

  if(supplierId){
    const supplier = DB.suppliers.find(s=>s.id===supplierId);
    const purchase = {
      id: purchaseId, purchaseNo: nextNo(DB.purchases,'purchaseNo'),
      supplierId, date: new Date().toISOString(), note,
      items: [{partId, name:p.name, qty, unitCost:cost}],
      total: qty*cost, payments: []
    };
    DB.purchases.push(purchase);
    await saveKey('purchases', DB.purchases);
    closeModal(); toast('تم التوريد وتسجيل فاتورة شراء من '+supplier.name); refreshContent();
  } else {
    closeModal(); toast('تم التوريد'); refreshContent();
  }
}

function jobMatchesSearch(job, term){
  if(!term) return true;
  const t = term.trim().toLowerCase();
  const car = DB.cars.find(c=>c.id===job.carId) || {};
  const cust = DB.customers.find(c=>c.id===job.customerId) || {};
  const haystack = [
    job.jobNo, job.status, job.notes, job.technician,
    car.plate, car.make, car.model, car.year, car.vin, car.color,
    cust.name, cust.phone
  ].filter(Boolean).join(' | ').toLowerCase();
  return haystack.includes(t);
}
function customerMatchesSearch(cust, term){
  if(!term) return true;
  const t = term.trim().toLowerCase();
  const cars = DB.cars.filter(c=>c.customerId===cust.id);
  const haystack = [cust.name, cust.phone, ...cars.flatMap(c=>[c.plate,c.make,c.model,c.year,c.vin,c.color])]
    .filter(Boolean).join(' | ').toLowerCase();
  return haystack.includes(t);
}

const MOVE_TYPE_WORDS = {
  in:'توريد شراء استلام وارد',
  out:'صرف صرف قطع خروج',
  customer_return:'مرتجع عميل مرتجعات',
  return:'مرتجع مورد مرتجعات',
  adjustment:'تسوية جرد تعديل كمية',

  paint_out:'خامات دهان دهانات صرف خامات',
  transfer_in:'تحويل وارد تحويل مخزني',
  transfer_out:'تحويل صادر تحويل مخزني',
};
const _moveHayCache = new WeakMap();
function moveHaystack(m){
  const cached = _moveHayCache.get(m);
  if(cached && cached.v === m._hv) return cached.text;
  const parts = [];
  const p = m.partId ? DB.inventory.find(x=>x.id===m.partId) : null;
  if(p) parts.push(p.name, p.sku, p.oemNo, p.supplierPartNo, p.barcode, p.brand, p.category, p.keywords);
  if(m.extName) parts.push(m.extName);
  parts.push(MOVE_TYPE_WORDS[m.type]||m.type);
  const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
  if(job){
    parts.push('أمر شغل', job.jobNo, job.notes);
    const car = DB.cars.find(c=>c.id===job.carId);
    if(car) parts.push(car.plate, car.make, car.model, car.year, carLabel(car));
    const cu = DB.customers.find(c=>c.id===job.customerId);
    if(cu) parts.push(cu.name, cu.phone);
  }
  if(m.forJobNo) parts.push('أمر شغل', m.forJobNo);
  if(m.forCarLbl) parts.push(m.forCarLbl);
  if(m.customerId){ const cu = DB.customers.find(c=>c.id===m.customerId); if(cu) parts.push(cu.name, cu.phone); }
  if(m.supplierId){ const su = DB.suppliers.find(s=>s.id===m.supplierId); if(su) parts.push('مورد', su.name, su.phone, su.contactPerson); }
  if(m.purchaseId){ const pu = DB.purchases.find(x=>x.id===m.purchaseId); if(pu) parts.push('فاتورة شراء', pu.purchaseNo, pu.invoiceNo, pu.paymentMethod); }
  const whId = m.warehouseId || (p ? partWhId(p) : null);
  if(whId) parts.push(whName(whId));
  if(m.fromWhId) parts.push(whName(m.fromWhId));
  if(m.toWhId) parts.push(whName(m.toWhId));
  parts.push(m.note, m.notes, m.reqByName, m.actor, m.reason, m.payMethod, m.id);
  const text = normSearch(parts.filter(Boolean).join(' '));
  m._hv = (m._hv||0) + 1;
  _moveHayCache.set(m, { v:m._hv, text });
  return text;
}
/* كل كلمة في البحث لازم تتلاقى (بحث تراكمي) — جزئي وبتطبيع عربي/إنجليزي */
function moveMatchesSearch(m, q){
  const key = normSearch(q||'');
  if(!key) return true;
  const hay = moveHaystack(m);
  return key.split(' ').filter(Boolean).every(tok => hay.includes(tok));
}
/* الملاحظة 38: أجزاء عرض تتبع الحركة (طالب/أمر/سيارة/ملاحظات) */
function moveTrackParts(m){
  const parts = [];
  if(m.reqByName) parts.push('طلبها: '+m.reqByName);
  if(m.forJobNo) parts.push('لأمر #'+m.forJobNo);
  if(m.forCarLbl) parts.push('لسيارة: '+m.forCarLbl);
  if(m.notes) parts.push('📝 '+m.notes);
  return parts;
}
function moveMatchesFilters(m){
  const f = mvFilters;
  // الملاحظة 51: البحث الشامل بيشتغل مع باقي الفلاتر (مش بدلها)
  if(f.q && !moveMatchesSearch(m, f.q)) return false;
  if(f.dateFrom && new Date(m.date) < new Date(f.dateFrom)) return false;
  if(f.dateTo && new Date(m.date) > new Date(new Date(f.dateTo).getTime()+86399999)) return false;
  if(f.type==='transfer'){ if(m.type!=='transfer_in' && m.type!=='transfer_out') return false; }
  else if(f.type && m.type!==f.type) return false;
  if(f.supplierId && m.supplierId!==f.supplierId) return false;
  if(f.partId && m.partId!==f.partId) return false;
  if(f.reqById && m.reqById!==f.reqById) return false;
  if(f.jobNo){
    const jn = f.jobNo.trim();
    const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
    const matchConsumed = job && job.jobNo.includes(jn);
    const matchRelated = m.forJobNo && String(m.forJobNo).includes(jn);
    if(!matchConsumed && !matchRelated) return false;
  }
  if(f.carCust){
    const t = f.carCust.trim().toLowerCase();
    const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
    const car = job ? DB.cars.find(c=>c.id===job.carId) : null;
    const cust = m.customerId ? DB.customers.find(c=>c.id===m.customerId) : (job ? DB.customers.find(c=>c.id===job.customerId) : null);
    const haystack = [car&&car.plate, car&&carLabel(car), cust&&cust.name, cust&&cust.phone].filter(Boolean).join(' ').toLowerCase();
    if(!haystack.includes(t)) return false;
  }
  return true;
}

/* ============ الملاحظة 55: مركز التنقّل — المرجع بيفتح المستند المصدر حسب نوع الحركة ============ */
function moveReference(m){
  const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
  switch(m.type){
    case 'out': case 'ext_part': case 'ext_work': case 'paint_out':
      if(job) return { icon:'🧾', text:'أمر شغل #'+job.jobNo, act:`openWorkOrderReport('${job.id}')` };
      break;
    case 'in':
      if(m.purchaseId){ const pu=DB.purchases.find(x=>x.id===m.purchaseId); if(pu) return { icon:'📦', text:'فاتورة شراء #'+pu.purchaseNo, act:`openPurchaseView('${pu.id}')` }; }
      return { icon:'📥', text:(m.note&&/افتتاح/.test(m.note))?'رصيد افتتاحي':'توريد مخزون', act:`openMoveDetails('${m.id}')` };
    case 'return':
      if(m.retId && DB.supplierReturns.some(r=>r.id===m.retId)) return { icon:'↩', text:'مرتجع مورد', act:`openSupplierReturnDoc('${m.retId}')` };
      return { icon:'↩', text:'مرتجع مورد', act:`openMoveDetails('${m.id}')` };
    case 'customer_return':
      return { icon:'↩', text:'مرتجع عميل'+(job?' — أمر #'+job.jobNo:''), act:`openMoveDetails('${m.id}')` };
    case 'adjustment':
      if(m.countId){ const ic=DB.inventoryCounts.find(x=>x.id===m.countId); if(ic) return { icon:'📋', text:'جرد #'+ic.countNo, act:`openCountReport('${ic.id}')` }; }
      return { icon:'⚖', text:'تسوية مخزون', act:`openMoveDetails('${m.id}')` };
    case 'scrap':
      return { icon:'🗑', text:'هالك/تالف', act:`openMoveDetails('${m.id}')` };
    case 'transfer_in': case 'transfer_out':
      return { icon:'🔄', text:'تحويل: '+whName(m.fromWhId)+' ← '+whName(m.toWhId), act:`openMoveDetails('${m.id}')` };
  }
  return { icon:'👁', text:'عرض التفاصيل', act:`openMoveDetails('${m.id}')` };
}
/* سطر ثانوي صغير تحت المرجع (مورد/تكلفة/حالة سداد) */
function moveRefSub(m){
  const bits = [];
  const supplier = m.supplierId ? DB.suppliers.find(s=>s.id===m.supplierId) : null;
  if(supplier && (m.type==='ext_part'||m.type==='ext_work'||m.type==='scrap')) bits.push('مورد: '+supplier.name);
  if(m.type==='ext_part' || m.type==='ext_work'){
    if(m.purchaseId){ const pu=DB.purchases.find(x=>x.id===m.purchaseId);
      if(pu){ const paid=(pu.payments||[]).reduce((s,x)=>s+x.amount,0); bits.push(paid>=pu.total?'✅ مسدد للمورد':(paid>0?'⚠ مسدد جزئياً':'🔴 آجل')); } }
    else if(m.payMethod){ bits.push(m.payMethod); }
  }
  if(m.reqByName) bits.push('طلبها: '+m.reqByName);
  return bits.join(' · ');
}

/* ============ الملاحظة 63: اعتماد فواتير الشراء وتصحيح الأسعار ============
   السيناريو: القطع بتوصل قبل فاتورة المورد، فالمخزن بيستلم فوراً بأسعار مبدئية.
   لما فاتورة المورد الرسمية توصل، بنصحّح الأسعار **بند بند** — ده مش تسوية مخزون
   (الكميات ماتتغيرش)، ده تصحيح سعر شراء بس.
   المبدأ المحاسبي المحفوظ: **السجلات التاريخية للمبيعات ماتتغيرش أبداً** —
   فواتير العملاء وأوامر الشغل المقفولة بتفضل بتكلفتها وقت الصرف. */
const PUR_EDIT_REASONS = ['وصول فاتورة المورد الرسمية','تصحيح خطأ إدخال','خصم من المورد','فرق شحن/نولون','تصحيح تسعير من المورد','أخرى'];
function purStatus(p){ return p.status || 'approved'; }   // الفواتير القديمة تُعتبر معتمدة
function purIsClosed(p){   // مقفولة مالياً = مسدد عليها فعلياً
  const paid = (p.payments||[]).reduce((s,x)=>s+x.amount,0);
  return paid > 0.01;
}
function purStatusTag(p){
  const st = purStatus(p);
  const lock = purIsClosed(p) ? ' <span class="tag tag-cancel">🔒 مقفولة مالياً</span>' : '';
  return (st==='pending'
    ? '<span class="tag tag-partial">🟡 بانتظار فاتورة المورد</span>'
    : '<span class="tag tag-paid">🟢 معتمدة</span>') + lock;
}
/* مين مسموحله يعدّل الفاتورة دي دلوقتي؟ */
/* الملاحظة 69: صلاحية التعديل الحبيبية — تعديل عام أو كمية أو سعر */
function canEditPurchaseAny(){ return can('pur.edit') || can('pur.edit_qty') || can('pur.edit_price') || can('pur.approve'); }
function canEditPurchase(p){
  if(!p) return { ok:false, why:'الفاتورة غير موجودة' };
  if(purIsClosed(p) && !isOwnerSession()) return { ok:false, why:'الفاتورة مقفولة مالياً — التعديل لصاحب المركز فقط' };
  if(purStatus(p)==='pending') return canEditPurchaseAny()
    ? { ok:true } : { ok:false, why:'مالكش صلاحية تعديل فواتير الشراء' };
  return (can('pur.edit')||can('pur.edit_qty')||can('pur.edit_price')) ? { ok:true } : { ok:false, why:'الفاتورة معتمدة — تعديلها محتاج صلاحية تعديل فواتير الشراء' };
}
function purLog(p, action, changes, reason){
  p.history = Array.isArray(p.history) ? p.history : [];
  p.history.push({ id:uid('ph'), at:new Date().toISOString(), actor:actorName(),
    action, changes:(changes||[]).filter(c=>String(c.before)!==String(c.after)), reason:reason||'' });
}

function readPurchaseLines(p){
  return (p.items||[]).map((it,i)=>{
    const q = document.getElementById('epQty_'+i), c = document.getElementById('epCost_'+i);
    return { idx:i, qty: q?(parseFloat(q.value)||0):it.qty, unitCost: c?(parseFloat(c.value)||0):it.unitCost };
  });
}
function epRecalc(purchaseId){
  const p = DB.purchases.find(x=>x.id===purchaseId); if(!p) return;
  const lines = readPurchaseLines(p);
  lines.forEach(l=>{ const el=document.getElementById('epLineTot_'+l.idx); if(el) el.textContent = money(l.qty*l.unitCost); });
  const newTotal = lines.reduce((s,l)=>s+l.qty*l.unitCost,0);
  const diff = newTotal - (p.total||0);
  const box = document.getElementById('epTotals'); if(!box) return;
  box.innerHTML = `
    <div class="flex-between"><span class="muted">الإجمالي قبل التعديل</span><span>${money(p.total||0)}</span></div>
    <div class="flex-between total-row" style="margin-top:6px;font-weight:800"><span>الإجمالي بعد التعديل</span><span>${money(newTotal)}</span></div>
    <div class="flex-between" style="margin-top:4px"><span class="muted">الفرق على حساب المورد</span>
      <span style="font-weight:800;color:${diff>0?'var(--danger)':(diff<0?'#1a7f37':'var(--muted)')}">${diff>0?'+ ':(diff<0?'− ':'')}${money(Math.abs(diff))}</span></div>`;
}
async function saveEditPurchase(purchaseId){
  const p = DB.purchases.find(x=>x.id===purchaseId);
  const gate = canEditPurchase(p);
  if(!gate.ok){ toast(gate.why, true); return; }
  const reasonSel = (document.getElementById('epReason')||{}).value || '';
  const reasonNote = ((document.getElementById('epReasonNote')||{}).value||'').trim();
  const reason = reasonSel + (reasonNote?' — '+reasonNote:'');
  if(!reasonSel){ toast('اختار سبب التعديل', true); return; }
  const wasApproved = purStatus(p)==='approved';
  const closed = purIsClosed(p);
  const lines = readPurchaseLines(p);
  const changes = [];
  const costTouched = [];
  lines.forEach(l=>{
    const it = p.items[l.idx]; if(!it) return;
    if(Math.abs((it.unitCost||0) - l.unitCost) > 0.001){
      changes.push({ field:'سعر شراء «'+it.name+'»', before:money(it.unitCost||0), after:money(l.unitCost) });
      costTouched.push({ it, oldCost:it.unitCost, newCost:l.unitCost });
      it.unitCost = l.unitCost;
    }
    if(Math.abs((it.qty||0) - l.qty) > 0.001){
      const dq = l.qty - it.qty;
      changes.push({ field:'كمية «'+it.name+'»', before:it.qty, after:l.qty });
      // الكمية بتتعدّل على المخزون بالفرق بس (استلام زيادة أو نقص)
      const part = it.partId ? DB.inventory.find(x=>x.id===it.partId) : null;
      if(part) part.qty = Math.max((part.qty||0) + dq, 0);
      it.qty = l.qty;
    }
  });
  // بيانات فاتورة المورد
  const supNo = ((document.getElementById('epSupNo')||{}).value||'').trim();
  const supDate = ((document.getElementById('epSupDate')||{}).value||'').trim();
  const notes = ((document.getElementById('epNotes')||{}).value||'').trim();
  if((p.supInvNo||'')!==supNo){ changes.push({ field:'رقم فاتورة المورد', before:p.supInvNo||'—', after:supNo||'—' }); p.supInvNo = supNo; }
  if((p.supInvDate||'')!==supDate){ changes.push({ field:'تاريخ فاتورة المورد', before:p.supInvDate||'—', after:supDate||'—' }); p.supInvDate = supDate; }
  if((p.notes||'')!==notes){ changes.push({ field:'ملاحظات', before:p.notes||'—', after:notes||'—' }); p.notes = notes; }
  if(!changes.length){ toast('مفيش أي تعديل', true); return; }
  // الإجمالي الجديد ← رصيد المورد بيتحدث تلقائياً لأنه بيتحسب من p.total
  const oldTotal = p.total||0;
  p.total = (p.items||[]).reduce((s,it)=>s+it.qty*it.unitCost,0);
  if(Math.abs(oldTotal-p.total)>0.001) changes.push({ field:'إجمالي الفاتورة', before:money(oldTotal), after:money(p.total) });
  // تحديث حركات التوريد المرتبطة + آخر سعر شراء ومتوسط التكلفة للمخزون المتبقي
  costTouched.forEach(({it, newCost})=>{
    DB.stockMoves.filter(m=>m.purchaseId===p.id && m.partId===it.partId && m.type==='in')
      .forEach(m=>{ m.unitCost = newCost; });
    const part = it.partId ? DB.inventory.find(x=>x.id===it.partId) : null;
    // تكلفة الصنف بتتحدث بس لو ده آخر توريد ليه (المخزون المتبقي بيتقيّم بالسعر الصح)
    if(part){
      const lastIn = partInMoves(part.id)[0];
      if(lastIn && lastIn.purchaseId===p.id) part.costPrice = newCost;
    }
  });
  purLog(p, wasApproved?'edited_approved':'edited', changes, reason);
  await Promise.all([saveKey('purchases', DB.purchases), saveKey('inventory', DB.inventory), saveKey('stockMoves', DB.stockMoves)]);
  const sup = DB.suppliers.find(s=>s.id===p.supplierId);
  await logAction('✏️ تعديل فاتورة شراء #'+p.purchaseNo+auditDetails([
    ['المورد', sup?sup.name:null],
    ...changes.map(c=>[c.field, c.before+' ← '+c.after]),
    ['الفرق على حساب المورد', money(p.total-oldTotal)],
    ['السبب', reason]
  ]));
  notify(closed?'purchase_closed_edit':(wasApproved?'purchase_approved_edit':'purchase_edit'),
    'تعديل فاتورة شراء #'+p.purchaseNo+(sup?' — '+sup.name:'')+(closed?' (مقفولة مالياً)':(wasApproved?' (معتمدة)':''))+
    ' — '+changes.slice(0,3).map(c=>c.field+': '+c.before+' ← '+c.after).join(' · ')+' — السبب: '+reason,
    { category:'financial', refType:'purchase', refId:p.id, refNo:p.purchaseNo, amount:Math.abs(p.total-oldTotal) });
  closeModal(); toast('تم حفظ تعديلات فاتورة الشراء'); refreshContent();
}

function approvePurchase(purchaseId){
  if(!can('pur.approve')){ toast('مالكش صلاحية اعتماد فواتير الشراء', true); return; }
  const p = DB.purchases.find(x=>x.id===purchaseId);
  if(!p){ toast('الفاتورة غير موجودة', true); return; }
  if(purStatus(p)==='approved'){ toast('الفاتورة معتمدة بالفعل', true); return; }
  const sup = DB.suppliers.find(s=>s.id===p.supplierId);
  askConfirmReason('اعتماد فاتورة الشراء #'+p.purchaseNo+(sup?' — '+sup.name:'')+'؟<br><span class="muted" style="font-size:12px">إجماليها '+money(p.total)+'. بعد الاعتماد الأسعار بتبقى نهائية والفاتورة بتتقفل — وتعديلها بعد كده محتاج صلاحية «تعديل فاتورة شراء».</span>',
    async (reason)=>{
      p.status = 'approved'; p.approvedAt = new Date().toISOString(); p.approvedBy = actorName();
      purLog(p, 'approved', [{ field:'حالة الفاتورة', before:'بانتظار فاتورة المورد', after:'معتمدة' }], reason);
      await saveKey('purchases', DB.purchases);
      await logAction('🟢 اعتماد فاتورة شراء #'+p.purchaseNo+auditDetails([
        ['المورد', sup?sup.name:null], ['الإجمالي', money(p.total)],
        ['رقم فاتورة المورد', p.supInvNo||'—'], ['السبب/الملاحظة', reason||'—']
      ]));
      notify('purchase_approve', 'اعتماد فاتورة شراء #'+p.purchaseNo+(sup?' — '+sup.name:'')+' بقيمة '+money(p.total),
        { category:'financial', refType:'purchase', refId:p.id, refNo:p.purchaseNo, amount:p.total });
      closeModal(); toast('تم اعتماد فاتورة الشراء'); refreshContent();
    });
}

function reopenPurchase(purchaseId){
  if(!can('pur.edit')){ toast('مالكش صلاحية تعديل فواتير الشراء', true); return; }
  const p = DB.purchases.find(x=>x.id===purchaseId);
  if(!p || purStatus(p)!=='approved'){ toast('الفاتورة مش معتمدة أصلاً', true); return; }
  if(purIsClosed(p) && !isOwnerSession()){ toast('الفاتورة مقفولة مالياً — إعادة فتحها لصاحب المركز فقط', true); return; }
  askConfirmReason('إعادة فتح فاتورة الشراء #'+p.purchaseNo+' لتعديل الأسعار؟<br><span class="muted" style="font-size:12px">هترجع «بانتظار فاتورة المورد» وتقدر تعدّل بنودها، وبعدها تعتمدها تاني.</span>',
    async (reason)=>{
      p.status = 'pending'; delete p.approvedAt; delete p.approvedBy;
      purLog(p, 'reopened', [{ field:'حالة الفاتورة', before:'معتمدة', after:'بانتظار فاتورة المورد' }], reason);

async function saveStockAdjustment(){
  if(!can('inv.adjust')){ toast('مالكش صلاحية تسوية المخزون', true); return; }
  const partId = document.getElementById('adjPart').value;
  const newQty = parseFloat(document.getElementById('adjNewQty').value);
  const reason = document.getElementById('adjReason').value.trim();
  const notes = ((document.getElementById('adjNotes')||{}).value||'').trim();
  const p = DB.inventory.find(x=>x.id===partId);
  if(!p){ toast('اختار الصنف الأول', true); return; }
  // الملاحظة 45: حماية خلفية — ممنوع تسوية على صنف مؤرشف
  if(p.archived){ toast('الصنف مؤرشف — استرجعه من الأرشيف الأول قبل التسوية', true); return; }
  if(isNaN(newQty) || newQty<0){ toast('اكتب كمية صحيحة', true); return; }
  if(!reason){ toast('سبب التسوية إلزامي', true); return; }
  const diff = newQty - p.qty;
  if(diff===0){ toast('الكمية زي الموجودة بالظبط، مفيش تغيير', true); return; }
  p.qty = newQty;
  // الملاحظة 54: نخزّن اتجاه التسوية وقيمها الفعلية عشان الرصيد الجاري يتحسب صح
  DB.stockMoves.push({id:uid('mv'), partId, type:'adjustment', qty:Math.abs(diff), delta:diff,
    qtyBefore:newQty-diff, qtyAfter:newQty, date:new Date().toISOString(), actor:actorName(),
    note:(diff>0?'زيادة':'نقص')+' بالتسوية '+Math.abs(diff)+(reason?' — '+reason:'')+(notes?' — '+notes:'')});
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('stockMoves', DB.stockMoves)]);
  await logAction('تسوية مخزون: '+p.name+' من '+(p.qty-diff)+' إلى '+newQty+' (فرق '+(diff>0?'+':'')+diff+') — السبب: '+reason+(notes?' — '+notes:''));
  pushNotif({ category:'inventory', type:'adjust', priority:'high',
    action:'تسوية مخزون: '+p.name+' ('+(p.qty-diff)+' ← '+newQty+')', refType:'inventory' });
  closeModal(); toast('تم تسجيل التسوية'); refreshContent();
}
/* مرتجع العميل المربوط بأمر الشغل (الملاحظة 28):
   اختار القطعة ← النظام يعرض بس الأوامر اللي اتصرفت عليها ← إرجاع بحد أقصى المصروف
   ← خصم من بنود الأمر (التكلفة بتتعدل تلقائياً) + رجوع الكمية لنفس مخزن القطعة */
let crSelectedJobId = null;
function crDispensedQty(job, partId){
  return job.items.filter(it=>it.kind==='part' && it.partId===partId).reduce((s,it)=>s+it.qty,0);
}
/* الملاحظة 48: كميات المرتجع الحقيقية من حركات المخزن — مصروف / مرتجع / متبقي للإرجاع */
function crIssuedQty(job, partId){
  return DB.stockMoves.filter(m=>m.jobId===job.id && m.partId===partId && m.type==='out').reduce((s,m)=>s+(m.qty||0),0);
}
function crReturnedQty(job, partId){
  return DB.stockMoves.filter(m=>m.jobId===job.id && m.partId===partId && m.type==='customer_return').reduce((s,m)=>s+(m.qty||0),0);
}
/* المتبقي للإرجاع = الأقل بين (المصروف − المرتجع) والموجود فعلياً في بنود الأمر — أأمن حساب */
function crRemainingQty(job, partId){
  const fromMoves = Math.max(crIssuedQty(job, partId) - crReturnedQty(job, partId), 0);
  const onJob = crDispensedQty(job, partId);
  return crIssuedQty(job, partId) > 0 ? Math.min(fromMoves, onJob) : onJob;
}

async function saveCustomerReturn(){
  if(!(can('inv.return'))){ toast('مالكش صلاحية تسجيل مرتجعات العملاء', true); return; }   /* حارس م65 */
  const partId = (document.getElementById('crPart')||{}).value;
  const qty = parseFloat((document.getElementById('crQty')||{}).value)||0;
  const reason = ((document.getElementById('crReason')||{}).value||'').trim();
  const p = DB.inventory.find(x=>x.id===partId);
  const job = crSelectedJobId ? DB.jobs.find(j=>j.id===crSelectedJobId) : null;
  if(!p){ toast('اختار القطعة الأول', true); return; }
  // الملاحظة 45: حماية خلفية — ممنوع مرتجع على صنف مؤرشف
  if(p.archived){ toast('الصنف مؤرشف — استرجعه من الأرشيف الأول قبل تسجيل المرتجع', true); return; }
  if(!job){ toast('اختار أمر الشغل اللي اتصرفت عليه القطعة', true); return; }
  // الملاحظة 48: المتاح للإرجاع = المصروف − اللي اترجع قبل كده (مينفعش يتعدّى)
  const avail = crRemainingQty(job, partId);
  if(avail<=0){ toast('القطعة دي مش مصروفة على الأمر ده (أو اترجعت بالكامل)', true); return; }
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(qty>avail){ toast('مينفعش ترجع أكتر من المتاح للإرجاع ('+avail+') — المصروف '+crIssuedQty(job, partId)+' واترجع قبل كده '+crReturnedQty(job, partId), true); return; }
  const invd = DB.invoices.some(i=>i.jobId===job.id && !i.cancelled);
  if(invd && !can('bill.cancel')){
    toast('الأمر ده متفوتر — المرتجع بعد الفاتورة صلاحية الحسابات أو المالك فقط', true); return;
  }
  // 1) خصم الكمية من بنود الأمر (والبند يتشال لو وصل صفر) ← تكلفة الأمر بتتعدل تلقائياً
  let remaining = qty;
  job.items = job.items.filter(it=>{
    if(remaining<=0 || it.kind!=='part' || it.partId!==partId) return true;
    const take = Math.min(it.qty, remaining);
    it.qty -= take; remaining -= take;
    return it.qty > 0;
  });
  // 2) رجوع الكمية لنفس المخزن الأصلي بتاع القطعة
  p.qty += qty;
  const cust = DB.customers.find(c=>c.id===job.customerId);
  // 3) حركة موثقة: الأمر، العميل، الكمية، المخزن، المنفذ، الوقت
  DB.stockMoves.push({id:uid('mv'), partId, type:'customer_return', qty, unitCost:p.costPrice, warehouseId: partWhId(p),
    reason: reason||'غير محدد', date:new Date().toISOString(), actor:actorName(),
    note:'مرتجع عميل — أمر شغل #'+job.jobNo+(cust?' — '+cust.name:'')+' — رجعت لمخزن: '+whName(partWhId(p))+(reason?' — '+reason:''),
    jobId: job.id, customerId: job.customerId});
  await Promise.all([saveKey('inventory'), saveKey('jobs'), saveKey('stockMoves')]);
  await logAction('مرتجع عميل: '+qty+' من '+p.name+' — أمر شغل #'+job.jobNo+' — رجعت لمخزن '+whName(partWhId(p)));
  closeModal(); toast('تم المرتجع: '+qty+' رجعت لمخزن '+whName(partWhId(p))+' واتخصمت من أمر الشغل #'+job.jobNo); refreshContent();
}

function jobCostBreakdown(job){
  const inParts = job.items.filter(it=>it.kind==='part').reduce((s,it)=>s+it.qty*(it.costPrice||0),0);
  const extParts = job.items.filter(it=>it.kind==='ext_part').reduce((s,it)=>s+it.qty*(it.costPrice||0),0);
  const extWork = job.items.filter(it=>it.kind==='ext_work').reduce((s,it)=>s+it.qty*(it.costPrice||0),0);
  const paint = (job.internalCosts||[]).reduce((s,ic)=>s+ic.total,0);
  const revenue = job.items.reduce((s,it)=>s+it.qty*it.unitPrice,0);
  const total = inParts + extParts + extWork + paint;
  return { inParts, extParts, extWork, paint, total, revenue, profit: revenue - total };
}

  // مفتوح = لسه ماتعملوش فاتورة سارية، ومش ملغي

async function saveExtOutFromStock(){
  if(!can('jobs.edit')){ toast('مالكش صلاحية تعديل أوامر الشغل', true); return; }
  const jobId = document.getElementById('exJob').value;
  const name = document.getElementById('exName').value.trim();
  const supplierId = document.getElementById('exSupplier').value || null;
  const qty = parseFloat(document.getElementById('exQty').value)||1;
  const costPrice = parseFloat(document.getElementById('exCost').value)||0;
  const sellPrice = parseFloat(document.getElementById('exSell').value)||0;
  const payMethod = document.getElementById('exPay').value;
  const note = document.getElementById('exNote').value.trim();
  const job = DB.jobs.find(j=>j.id===jobId);
  if(!job){ toast('اختار أمر الشغل', true); return; }
  if(!name){ toast('اكتب اسم القطعة', true); return; }
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(payMethod==='آجل' && !supplierId){ toast('السداد الآجل لازم يتربط بمورد — اختار المورد', true); return; }
  const car = DB.cars.find(c=>c.id===job.carId);
  // 1) بند في فاتورة العميل بسعر البيع + التكلفة على أمر الشغل
  job.items.push({id:uid('it'), kind:'ext_part', name, qty, unitPrice:sellPrice, costPrice, supplierId, payMethod, note});
  // 2) فاتورة شراء على المورد (آجل = مديونية / كاش = مدفوعة)
  let purchaseId = null;
  if(supplierId){
    purchaseId = uid('pur');
    const purchase = {
      id: purchaseId, purchaseNo: nextNo(DB.purchases,'purchaseNo'), supplierId,
      date: new Date().toISOString(), paymentMethod: payMethod,
      note: 'قطعة غيار خارجية — أمر شغل #'+job.jobNo+(car?' — '+car.plate:''),
      items: [{partId:null, name, qty, unitCost:costPrice}],
      total: qty*costPrice, payments: [], jobId: job.id, extKind:'ext_part'
    };
    if(payMethod!=='آجل') purchase.payments.push({id:uid('pay'), amount:purchase.total, date:new Date().toISOString()});
    DB.purchases.push(purchase);
  }
  // 3) حركة مخزنية مستقلة بدون تأثير على أي رصيد
  DB.stockMoves.push({
    id:uid('mv'), partId:null, extName:name, type:'ext_part', qty, unitCost:costPrice, unitPrice:sellPrice,
    supplierId, purchaseId, payMethod, jobId:job.id, customerId:job.customerId,
    date:new Date().toISOString(), actor:actorName(),
    note:'قطعة غيار خارجية — أمر شغل #'+job.jobNo+(car?' — '+car.plate:'')+(note?' — '+note:'')
  });
  const saves = [saveKey('jobs', DB.jobs), saveKey('stockMoves', DB.stockMoves)];
  if(supplierId) saves.push(saveKey('purchases', DB.purchases));
  await Promise.all(saves);
  await logAction('قطعة غيار خارجية: '+name+' لأمر الشغل #'+job.jobNo+' — تكلفة '+money(qty*costPrice)+' / بيع '+money(qty*sellPrice)+' ('+payMethod+')');
  toast('تم صرف القطعة الخارجية'+(payMethod==='آجل'?' وتسجيل المديونية على المورد':''));
  document.getElementById('exName').value=''; document.getElementById('exNote').value='';
  document.getElementById('exQty').value='1'; document.getElementById('exCost').value='0'; document.getElementById('exSell').value='0';
}

async function saveStockOut(){
  if(!can('inv.issue')){ toast('مالكش صلاحية صرف القطع', true); return; }
  const jobId = document.getElementById('mvJob').value;
  const partId = document.getElementById('mvPart').value;
  const qty = parseFloat(document.getElementById('mvQty').value)||0;
  const p = DB.inventory.find(x=>x.id===partId);
  const job = DB.jobs.find(j=>j.id===jobId);
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(qty>p.qty){ toast('الكمية أكبر من المتاح في المخزون', true); return; }
  const car = DB.cars.find(c=>c.id===job.carId);
  p.qty -= qty;
  job.items.push({id:uid('it'), kind:'part', name:p.name, qty, unitPrice:p.sellPrice, costPrice:p.costPrice, partId:p.id});
  const carDesc = car ? ` — السيارة: ${car.plate}${carLabel(car)?' / '+carLabel(car):''}` : '';
  DB.stockMoves.push({id:uid('mv'), partId, type:'out', qty, unitCost:p.costPrice, unitPrice:p.sellPrice, date:new Date().toISOString(), note:'صرف لأمر شغل #'+job.jobNo+carDesc, jobId:job.id, customerId:job.customerId, actor:actorName()});
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('jobs', DB.jobs), saveKey('stockMoves', DB.stockMoves)]);
  toast('تم صرف القطعة لأمر الشغل #'+job.jobNo); refreshContent();
  await logAction('صرف '+qty+' من '+p.name+' لأمر الشغل #'+job.jobNo);
}

let icFilters = { dateFrom:'', dateTo:'', supplierId:'', type:'', jobNo:'' };
function itemMoves(partId){
  return DB.stockMoves.filter(m=>m.partId===partId).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function itemStats(partId){
  const moves = itemMoves(partId);
  const inMoves = moves.filter(m=>m.type==='in' && m.unitCost!==undefined);
  const totalInQty = inMoves.reduce((s,m)=>s+m.qty,0);
  const totalInValue = inMoves.reduce((s,m)=>s+m.qty*(m.unitCost||0),0);
  const avgCost = totalInQty>0 ? totalInValue/totalInQty : 0;
  const lastIn = [...inMoves].reverse()[0];
  const lastSupplier = lastIn && lastIn.supplierId ? DB.suppliers.find(s=>s.id===lastIn.supplierId) : null;
  return { avgCost, lastCost: lastIn?lastIn.unitCost:null, lastSupplier };
}

/* الملاحظة 54: أثر الحركة على الرصيد (+ / − / تسوية مطلقة)
   التسوية بتحدد الرصيد مباشرة (qtyAfter) أو بفرقها (delta)؛ والسجلات القديمة
   بنستنتج اتجاهها من النص عشان الرصيد التاريخي يفضل صح. */
function moveDelta(m){
  if(m.type==='in' || m.type==='customer_return' || m.type==='transfer_in') return (m.qty||0);
  if(m.type==='out' || m.type==='return' || m.type==='scrap' || m.type==='paint_out' || m.type==='transfer_out') return -(m.qty||0);
  if(m.type==='adjustment'){
    if(typeof m.delta === 'number') return m.delta;
    // توافق مع الحركات القديمة: "نقص/عجز" = سالب، وإلا موجب
    const note = String(m.note||'');
    const negative = /نقص|عجز/.test(note);
    return negative ? -(m.qty||0) : (m.qty||0);
  }
  return 0;
}
function itemLedgerRowsHTML(partId){
  const all = itemMoves(partId);
  // الرصيد الجاري بيتحسب على كل الحركات بالترتيب — مش على المفلترة بس
  let running = 0;
  const balanceById = new Map();
  all.forEach(m=>{
    if(m.type==='adjustment' && typeof m.qtyAfter === 'number') running = m.qtyAfter;  // التسوية بتحدد الرصيد مباشرة
    else running += moveDelta(m);
    balanceById.set(m.id, running);
  });
  let moves = all;
  const f = icFilters;
  if(f.dateFrom) moves = moves.filter(m=>new Date(m.date) >= new Date(f.dateFrom));
  if(f.dateTo) moves = moves.filter(m=>new Date(m.date) <= new Date(new Date(f.dateTo).getTime()+86399999));
  if(f.type) moves = moves.filter(m=>m.type===f.type);
  if(f.supplierId) moves = moves.filter(m=>m.supplierId===f.supplierId);
  if(f.jobNo){
    moves = moves.filter(m=>{
      const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
      return job && job.jobNo.includes(f.jobNo.trim());
    });
  }
  if(moves.length===0) return `<div class="empty">لا توجد حركات مطابقة</div>`;
  const withBalance = moves.map(m=>({...m, balanceAfter: balanceById.get(m.id)}));
  const typeTagMap = {
    in: '<span class="tag tag-ready">شراء</span>', out: '<span class="tag tag-cancel">صرف</span>',
    customer_return: '<span class="tag tag-inspect">مرتجع عميل</span>', return: '<span class="tag tag-partial">مرتجع مورد</span>',
    adjustment: '<span class="tag tag-working">تسوية</span>', scrap: '<span class="tag tag-cancel">هالك/تالف</span>', paint_out: '<span class="tag tag-partial">خامات دهان</span>',
    transfer_in: '<span class="tag tag-ready">تحويل وارد</span>',
    transfer_out: '<span class="tag tag-working">تحويل صادر</span>'
  };
  return `<table><thead><tr><th>التاريخ</th><th>النوع</th><th>التفاصيل</th><th>الكمية</th><th>السعر</th><th>الرصيد بعدها</th></tr></thead>
  <tbody>${[...withBalance].reverse().map(m=>{
    const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
    const car = job ? DB.cars.find(c=>c.id===job.carId) : null;
    const cust = job ? DB.customers.find(c=>c.id===job.customerId) : (m.customerId?DB.customers.find(c=>c.id===m.customerId):null);
    const supplier = m.supplierId ? DB.suppliers.find(s=>s.id===m.supplierId) : null;
    const purchase = m.purchaseId ? DB.purchases.find(pu=>pu.id===m.purchaseId) : null;
    let details = [];
    if(m.type==='in'){
      if(supplier) details.push('مورد: '+supplier.name);
      if(purchase) details.push('فاتورة #'+purchase.purchaseNo);
    } else if(m.type==='out'){
      if(job) details.push('أمر شغل #'+job.jobNo);
      if(car) details.push(car.plate+' — '+carLabel(car));
      if(cust) details.push(cust.name);
      if(job && (job.technicianId||job.technician)) details.push('الفني: '+(job.technicianId?techLabelOf(job.technicianId):job.technician));
    } else if(m.type==='customer_return'){
      if(job) details.push('أمر شغل #'+job.jobNo);
      if(cust) details.push(cust.name);
    } else if(m.type==='return'){
      if(supplier) details.push('مورد: '+supplier.name);
    }
    if(m.note) details.push(m.note);
    moveTrackParts(m).forEach(x=>details.push(x));
    const price = m.unitCost!=null ? 'شراء: '+money(m.unitCost) : (m.unitPrice!=null ? 'بيع: '+money(m.unitPrice) : '—');
    const clickable = job ? `onclick="openWorkOrderReport('${job.id}')" style="cursor:pointer"` : '';
    return `<tr ${clickable}><td>${fmtDateTime(m.date)}</td><td>${typeTagMap[m.type]||m.type}</td>
      <td class="muted" style="max-width:220px">${details.join(' · ')||'—'}</td>
      <td>${(()=>{ const dl=moveDelta(m); return dl>0?('+ '+Math.abs(dl)):(dl<0?('− '+Math.abs(dl)):m.qty); })()}</td><td>${price}</td><td style="font-weight:800">${m.balanceAfter}</td></tr>`;
  }).join('')}</tbody></table>`;
}

async function saveExtItem(jobId, kind){
  if(!can('jobs.edit')){ toast('مالكش صلاحية تعديل أوامر الشغل', true); return; }
  const job = DB.jobs.find(j=>j.id===jobId);
  const name = document.getElementById('extName').value.trim();
  const supplierId = document.getElementById('extSupplier').value || null;
  const qty = parseFloat(document.getElementById('extQty').value)||1;
  const costPrice = parseFloat(document.getElementById('extCost').value)||0;
  const sellPrice = parseFloat(document.getElementById('extSell').value)||0;
  const payMethod = document.getElementById('extPay').value;
  const note = document.getElementById('extNote').value.trim();
  if(!name){ toast('اكتب الاسم', true); return; }
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(payMethod==='آجل' && !supplierId){ toast('السداد الآجل لازم يتربط بمورد — اختار المورد', true); return; }
  const car = DB.cars.find(c=>c.id===job.carId);
  const kindTxt = kind==='ext_part'?'قطعة غيار خارجية':'أعمال خارجية';
  // 1) إضافة البند للفاتورة/أمر الشغل
  const item = {id:uid('it'), kind, name, qty, unitPrice:sellPrice, costPrice, supplierId, payMethod, note};
  job.items.push(item);
  await saveKey('jobs', DB.jobs);
  // 2) فاتورة شراء على المورد (آجل = مديونية / كاش = مدفوعة) مربوطة بأمر الشغل
  let purchaseId = null;
  if(supplierId){
    purchaseId = uid('pur');
    const purchase = {
      id: purchaseId, purchaseNo: nextNo(DB.purchases,'purchaseNo'), supplierId,
      date: new Date().toISOString(), paymentMethod: payMethod,
      note: kindTxt+' — أمر شغل #'+job.jobNo+(car?' — '+car.plate:''),
      items: [{partId:null, name, qty, unitCost:costPrice}],
      total: qty*costPrice, payments: [],
      jobId: job.id, extKind: kind
    };
    if(payMethod!=='آجل') purchase.payments.push({id:uid('pay'), amount:purchase.total, date:new Date().toISOString()});
    DB.purchases.push(purchase);
    await saveKey('purchases', DB.purchases);
  }
  // 3) حركة مخزنية مستقلة (دخول 1 → خروج 1: لا تؤثر على أي رصيد)
  DB.stockMoves.push({
    id:uid('mv'), partId:null, extName:name, type:kind, qty, unitCost:costPrice, unitPrice:sellPrice,
    supplierId, purchaseId, payMethod, jobId:job.id, customerId:job.customerId,
    date:new Date().toISOString(),
    note: kindTxt+' — أمر شغل #'+job.jobNo+(car?' — '+car.plate:'')+(note?' — '+note:'')
  });
  await saveKey('stockMoves', DB.stockMoves);
  await logAction(kindTxt+': '+name+' لأمر الشغل #'+job.jobNo+' — تكلفة '+money(qty*costPrice)+' / بيع '+money(qty*sellPrice)+' ('+payMethod+(supplierId?' — '+((DB.suppliers.find(s=>s.id===supplierId)||{}).name||''):'')+')');
  closeModal();
  toast('تمت الإضافة'+(payMethod==='آجل'?' وتسجيل المديونية على المورد':''));
  openJobDetail(jobId); refreshContent();
}

function countDiffLabel(line){
  if(line.physicalQty===null || line.physicalQty==='' || line.physicalQty===undefined) return ['—',''];
  const diff = line.physicalQty - line.systemQty;
  if(diff===0) return ['لا يوجد فرق','tag-paid'];
  if(diff<0) return ['عجز '+Math.abs(diff),'tag-unpaid'];
  return ['زيادة +'+diff,'tag-partial'];
}

    ${stat(String(shortage.length),'أصناف بها عجز', shortage.length>0)}
    ${stat(String(surplus.length),'أصناف بها زيادة')}
  </div>
  ${shortage.length? `<div class="muted" style="font-size:12.5px;margin-bottom:14px;color:var(--danger)">قيمة العجز التقديرية (بسعر الشراء): ${money(shortageValue)}</div>`:''}
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">

    ${editable && !can('inv.count_approve') && ic.status==='draft' && filled>0 ? `<button class="btn" onclick="submitCountForApproval('${ic.id}')">📤 إرسال للاعتماد</button>` : ''}

  <div class="card">

      <tbody>

          <td id="cdiff_${idx}">${dCls?`<span class="tag ${dCls}">${dLbl}</span>`:dLbl}</td>

      }).join('')}
      </tbody>
    </table>
  </div>
  ${prev.length? `
  <div class="section-head" style="margin-top:22px"><h3>جردات سابقة</h3></div>
  <div class="card"><table><thead><tr><th>رقم</th><th>التاريخ</th><th>الحالة</th><th></th></tr></thead>

}

function approveCount(icId){
  if(!can('inv.count_approve')){ toast('مالكش صلاحية اعتماد الجرد', true); return; }
  const ic = DB.inventoryCounts.find(x=>x.id===icId);
  const withDiff = ic.lines.filter(l=>l.physicalQty!==null && l.physicalQty!=='' && l.physicalQty!==l.systemQty);
  if(withDiff.length===0){ toast('لا توجد فروقات للتسوية', true); return; }
  askConfirm('اعتماد التسوية النهائية لجرد #'+ic.countNo+'؟ سيتم تعديل رصيد '+withDiff.length+' صنف في المخزون ليطابق الجرد الفعلي، وتسجيل حركة تسوية موثقة لكل صنف. هذا الإجراء نهائي.', async ()=>{
    const enteredBy = ic.submittedBy || ic.createdBy;
    for(const l of withDiff){
      const p = DB.inventory.find(x=>x.id===l.partId);
      if(!p) continue;
      const before = p.qty;
      const after = l.physicalQty;
      const diff = after - before;
      p.qty = after;
      DB.stockMoves.push({
        id: uid('mv'), partId: p.id, type:'adjustment', qty: Math.abs(diff), delta: diff,
        qtyBefore: before, qtyAfter: after, unitCost: p.costPrice, countId: ic.id,

      });
    }
    ic.status = 'approved';
    ic.approvedAt = new Date().toISOString();
    ic.approvedBy = actorName();

    await saveKey('stockMoves', DB.stockMoves);

async function saveScrap(){
  if(!can('inv.scrap')){ toast('مالكش صلاحية تسجيل الهالك', true); return; }
  const partId = (document.getElementById('scPart')||{}).value;
  if(!partId){ toast('دوّر على الصنف واختاره الأول', true); return; }
  const kind = document.getElementById('scKind').value;
  const qty = parseFloat(document.getElementById('scQty').value)||0;
  const reason = document.getElementById('scReason').value;
  const techId = (document.getElementById('scTech')||{}).value || null;
  const tech = techId ? techLabelOf(techId) : '';
  const supplierId = document.getElementById('scSupplier').value || null;
  const note = document.getElementById('scNote').value.trim();
  const p = DB.inventory.find(x=>x.id===partId);
  if(!p){ toast('الصنف غير موجود', true); return; }
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(qty>p.qty){ toast('الكمية أكبر من المتاح في المخزون ('+p.qty+')', true); return; }
  p.qty -= qty;
  DB.stockMoves.push({id:uid('mv'), partId, type:'scrap', scrapKind:kind, qty, unitCost:p.costPrice, reason, technicianId:techId, technician:tech||null, supplierId, warehouseId:partWhId(p), actor:actorName(), date:new Date().toISOString(),
    note:[kind, reason, tech?('الفني: '+tech):null, note].filter(Boolean).join(' — ')});
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('stockMoves', DB.stockMoves)]);
  await logAction('تسجيل '+kind+': '+qty+' من '+p.name+' — '+reason+' (خسارة '+money(qty*p.costPrice)+')');
  pushNotif({ category:'inventory', type:'scrap', priority:'high', amount:qty*p.costPrice,
    action:'تسجيل '+kind+': '+qty+' × '+p.name+' — '+reason, refType:'inventory' });
  closeModal(); toast('تم تسجيل الهالك وخصمه من المخزون'); refreshContent();
}

/* ============ الملاحظة 56: تقرير الهالك والتالف بفلاتر (تاريخ · مخزن · صنف · مستخدم) ============ */
let scrapRepFilters = { from:'', to:'', wh:'', q:'', user:'' };
function scrapMoveWh(m){ const p = m.partId?DB.inventory.find(x=>x.id===m.partId):null; return m.warehouseId || (p?partWhId(p):null); }
function scrapMovesFiltered(){
  const f = scrapRepFilters;
  return DB.stockMoves.filter(m=>m.type==='scrap').filter(m=>{
    if(f.from && new Date(m.date) < new Date(f.from)) return false;
    if(f.to && new Date(m.date) > new Date(new Date(f.to).getTime()+86399999)) return false;
    if(f.wh && scrapMoveWh(m)!==f.wh) return false;
    if(f.user && (m.actor||'—')!==f.user) return false;
    if(f.q){ const t=f.q.trim().toLowerCase(); const p=m.partId?DB.inventory.find(x=>x.id===m.partId):null;
      const hay=[(p&&p.name)||m.extName||'', (p&&p.sku)||'', m.reason||'', m.scrapKind||'', m.note||''].join(' ').toLowerCase();
      if(!hay.includes(t)) return false; }
    return true;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));
}

/* ======================= STOCK STATS (التقارير والإحصائيات) ======================= */
function openStockStatsModal(){ openModal(stockStatsHTML()); }
function stockStatsHTML(){
  // --- تقارير المرتجعات ---
  const totalPurchasesValue = DB.stockMoves.filter(m=>m.type==='in').reduce((s,m)=>s+m.qty*(m.unitCost||0),0);
  const supReturnsValue = DB.supplierReturns.reduce((s,r)=>s+r.total,0);
  const supReturnRate = totalPurchasesValue>0 ? (supReturnsValue/totalPurchasesValue*100) : 0;
  const totalSalesValue = DB.stockMoves.filter(m=>m.type==='out').reduce((s,m)=>s+m.qty*(m.unitPrice||0),0);
  const custReturns = DB.stockMoves.filter(m=>m.type==='customer_return');
  const custReturnsValue = custReturns.reduce((s,m)=>s+m.qty*(m.unitCost||0),0);
  const custReturnRate = totalSalesValue>0 ? (custReturnsValue/totalSalesValue*100) : 0;

  const lossTable = (obj)=>{

  return `

    <table><thead><tr><th>المخزن</th><th>عدد الأصناف</th><th>قيمة المخزون (كمية × سعر شراء)</th><th>أصناف تحت الحد الأدنى</th></tr></thead>
    <tbody>${DB.warehouses.map(w=>{

      return `<tr><td>${w.name}</td><td>${items.length}</td><td>${money(val)}</td><td class="${low>0?'low-stock':''}">${low}</td></tr>`;
    }).join('')}</tbody></table>
  </div>

  <label class="f-label" style="display:block;margin:14px 0 8px">أولاً: تقارير المرتجعات</label>
  <div class="grid g2" style="margin-bottom:10px">
    ${stat(supReturnRate.toFixed(1)+'%','نسبة مرتجعات الموردين ('+money(supReturnsValue)+')', supReturnRate>5)}
    ${stat(custReturnRate.toFixed(1)+'%','نسبة مرتجعات العملاء ('+money(custReturnsValue)+')', custReturnRate>5)}
  </div>
  ${reasonRows.length? `<div class="card" style="margin-bottom:14px"><label class="f-label">تحليل أسباب المرتجعات</label>
  <table style="margin-top:6px"><thead><tr><th>السبب</th><th>عدد المرات</th></tr></thead>
  <tbody>${reasonRows.map(([r,c])=>`<tr><td>${r}</td><td>${c}</td></tr>`).join('')}</tbody></table></div>` : ''}

  <label class="f-label" style="display:block;margin:14px 0 8px">ثانياً: تقارير الربحية لكل قطعة</label>

    <tbody>${profitRows.length? [...profitRows].sort((a,b)=>b.sold-a.sold).map(r=>`
      <tr><td>${r.name}</td><td>${money(r.purchased)}</td><td>${money(r.sold)}</td>

/* ======================= SUPPLIERS ======================= */
/* ---- الملاحظة 47: سجل حركات المورد (خصومات + تسويات) — بيتخزن على المورد نفسه زي سلف الموظفين ---- */
function supLedger(sup){ return (sup && sup.ledger) ? sup.ledger : []; }
/* الرصيد الافتتاحي بإشارته: "علينا للمورد" موجب · "له عندنا" سالب */
function supOpeningSigned(sup){
  if(!sup || !sup.openingBalance) return 0;
  const v = Math.abs(parseFloat(sup.openingBalance)||0);
  return sup.openingType==='debit' ? -v : v;
}
/* ============ الملاحظة 69: محرك المطابقة المالية لفواتير الموردين ============
   القاعدة الذهبية: أي تغيير في طريقة الدفع = عكس الأثر القديم ثم تطبيق الجديد،
   عشان مفيش ازدواج مالي أبداً. الدفعة التلقائية (auto) بتمثّل «مدفوع كاش وقت الشراء». */
function supName(id){ const s=DB.suppliers.find(x=>x.id===id); return s?s.name:'—'; }
function purIsCredit(p){ return p.paymentMethod === 'آجل'; }
function purManualPaid(p){ return (p.payments||[]).filter(x=>!x.auto).reduce((s,x)=>s+x.amount,0); }
function purAutoPayment(p){ return (p.payments||[]).find(x=>x.auto); }
/* يعكس الأثر المالي الحالي لطريقة الدفع (الدفعة التلقائية + حركتها المالية لو موجودة) */
function purReversePayEffect(p){
  const auto = purAutoPayment(p);
  if(!auto) return false;   // آجل — مفيش أثر تلقائي يتعكس
  if(auto.finMoveId){
    const fm = DB.finMoves.find(m=>m.id===auto.finMoveId);
    if(fm) addFinMove(fm.accountId, 'in', auto.amount, 'reversal', 'عكس دفع فاتورة شراء #'+p.purchaseNo+' (تغيير طريقة الدفع)', { refPurchase:p.id });
  }
  p.payments = (p.payments||[]).filter(x=>!x.auto);
  return true;
}
/* يطبّق الأثر المالي لطريقة الدفع الحالية (كاش = دفعة تلقائية بالمتبقي، وحركة مالية لو اتحدد الحساب) */
function purApplyPayEffect(p, accountId){
  if(purIsCredit(p)) return;   // آجل — مفيش دفعة تلقائية
  const remaining = Math.max(0, Math.round((p.total - purManualPaid(p))*100)/100);
  if(remaining <= 0) return;
  const pay = { id:uid('spay'), amount:remaining, date:new Date().toISOString(), auto:true, accountId: accountId||null };
  if(accountId){
    const acc = DB.finAccounts.find(a=>a.id===accountId);
    if(acc){ const fm = addFinMove(acc.id, 'out', remaining, 'supplier', 'دفع فاتورة شراء #'+p.purchaseNo+' — '+supName(p.supplierId), { refPurchase:p.id }); pay.finMoveId = fm.id; }
  }
  p.payments = p.payments || [];
  p.payments.push(pay);
}
/* دالة نقية: تغيير طريقة الدفع = عكس القديم ثم تطبيق الجديد (بدون ازدواج) — قابلة للاختبار */
function purApplyMethodChange(p, newMethod, accountId){
  purReversePayEffect(p);
  p.paymentMethod = newMethod;
  purApplyPayEffect(p, accountId);
}
function supplierBalance(supplierId){
  const sup = DB.suppliers.find(s=>s.id===supplierId);
  const purchases = DB.purchases.filter(p=>p.supplierId===supplierId);
  const totalPurchased = purchases.reduce((s,p)=>s+p.total,0);
  const totalPaid = purchases.reduce((s,p)=>s+(p.payments||[]).reduce((a,x)=>a+x.amount,0),0);
  const returns = DB.supplierReturns.filter(r=>r.supplierId===supplierId);
  const totalReturns = returns.reduce((s,r)=>s+r.total,0);
  const led = supLedger(sup);
  const totalDiscounts = led.filter(e=>e.kind==='discount').reduce((s,e)=>s+(e.amount||0),0);
  const totalAdjust = led.filter(e=>e.kind==='adjustment').reduce((s,e)=>s+(e.amount||0),0);
  const totalRefunds = led.filter(e=>e.kind==='refund').reduce((s,e)=>s+(e.amount||0),0);   // استرداد رصيد دائن (م69)
  const opening = supOpeningSigned(sup);
  const balance = opening + totalPurchased - totalPaid - totalReturns - totalDiscounts + totalAdjust + totalRefunds;
  // ============ الملاحظة 70: فصل واضح — موجب = مديونية علينا · سالب = رصيد دائن لنا ============
  // الرصيد الدائن بيتطبّق تلقائياً على المديونية (رصيد واحد للمورد زي المحاسبة الصح).
  // تصنيف كل مرتجع (خصم مديونية / رصيد دائن) متخزّن على المرتجع نفسه للتتبّع والعرض.
  const liability = Math.max(0, balance);
  const creditBalance = Math.max(0, -balance);
  // إجمالي الرصيد الدائن اللي **أنشأته المرتجعات** (قبل التطبيق التلقائي) — للعرض والتتبّع
  const returnsCredit = returns.reduce((s,r)=> s + (typeof r.creditAmount==='number' ? r.creditAmount : 0), 0);
  return { opening, totalPurchased, totalPaid, totalReturns, totalDiscounts, totalAdjust, totalRefunds, returnsCredit,
    discountsCount: led.filter(e=>e.kind==='discount').length,
    balance, liability, creditBalance, count: purchases.length, returnsCount: returns.length };
}
/* المتبقي علينا لفاتورة معينة (الإجمالي − المدفوع − تخفيضات المرتجعات المرتبطة بيها) */
function purchaseOutstanding(inv){
  const paid = (inv.payments||[]).reduce((s,x)=>s+x.amount,0);
  const red = DB.supplierReturns.filter(r=>r.invoiceId===inv.id).reduce((s,r)=>s+(r.payableReduction||0),0);
  return Math.max(0, Math.round((inv.total - paid - red)*100)/100);
}
/* عليه أي حركة مالية؟ (لو أيوة → الرصيد الافتتاحي بيتقفل للحفاظ على سلامة الحسابات) */
function supplierHasTransactions(supplierId){
  const sup = DB.suppliers.find(s=>s.id===supplierId);
  if(DB.purchases.some(p=>p.supplierId===supplierId)) return true;
  if(DB.supplierReturns.some(r=>r.supplierId===supplierId)) return true;
  if(supLedger(sup).length>0) return true;
  return false;
}
/* متوسط فترة السداد بالأيام (من تاريخ الفاتورة لتاريخ آخر دفعة عليها) */
function supAvgPaymentDays(supplierId){
  const paid = DB.purchases.filter(p=>p.supplierId===supplierId && (p.payments||[]).length>0);
  if(!paid.length) return null;
  const days = paid.map(p=>{
    const last = [...p.payments].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    return Math.max(0, Math.round((new Date(last.date)-new Date(p.date))/86400000));
  });
  return Math.round(days.reduce((s,d)=>s+d,0)/days.length);
}
/* كشف حساب موحّد بالترتيب الزمني: افتتاحي + فواتير + مدفوعات + مرتجعات + خصومات + تسويات */
function supplierStatement(supplierId){
  const sup = DB.suppliers.find(s=>s.id===supplierId);
  const rows = [];
  const op = supOpeningSigned(sup);
  if(op !== 0) rows.push({ date: sup.createdAt||'2000-01-01', type:'رصيد افتتاحي', desc: sup.openingType==='debit'?'له عندنا':'علينا له', amount: op });
  DB.purchases.filter(p=>p.supplierId===supplierId).forEach(p=>{
    rows.push({ date:p.date, type:'فاتورة شراء', desc:'#'+p.purchaseNo, amount:p.total });
    (p.payments||[]).forEach(pay=>rows.push({ date:pay.date, type:'سداد', desc:'على فاتورة #'+p.purchaseNo, amount:-pay.amount }));
  });
  DB.supplierReturns.filter(r=>r.supplierId===supplierId).forEach(r=>{
    rows.push({ date:r.date, type:'مرتجع للمورد', desc:r.name||'—', amount:-(r.total||0) });
  });
  supLedger(sup).forEach(e=>{
    const t = e.kind==='discount' ? 'خصم من المورد' : (e.kind==='refund' ? 'استرداد رصيد' : 'تسوية رصيد');
    rows.push({ date:e.date, type: t,
      desc:(e.reason||'')+(e.notes?' — '+e.notes:'')+' · بواسطة '+(e.by||'—'),
      amount: (e.kind==='discount') ? -(e.amount||0) : (e.amount||0) });   // الاسترداد والتسوية بيزوّدوا الرصيد نحو الصفر
  });
  rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
  let run = 0;
  rows.forEach(r=>{ run += r.amount; r.running = run; });
  return rows;
}
/* الملاحظة 44: أرشفة المورد — بشرط رصيد صفر (مفيش مستحقات معلقة) */
let supShowArchived = false;
function toggleSupArchived(){ supShowArchived = !supShowArchived; refreshContent(); }
function archiveSupplier(supplierId){
  if(!isOwnerSession()){ toast('أرشفة الموردين صلاحية صاحب المركز فقط', true); return; }
  const sup = DB.suppliers.find(s=>s.id===supplierId); if(!sup) return;
  const b = supplierBalance(supplierId);
  if(Math.abs(b.balance) > 0.005){ toast('مينفعش أرشفة المورد — عليه رصيد مستحق ('+money(b.balance)+'). سدّده الأول.', true); return; }
  askConfirmReason('أرشفة المورد «'+sup.name+'»؟<br><span class="muted" style="font-size:12px">هيختفي من قوائم الاختيار والموردين النشطين، وكل تاريخه (مشتريات/كشف حساب/تقارير) هيفضل زي ما هو. تقدر ترجّعه في أي وقت.</span>', async (reason)=>{
    sup.archived = true; sup.archivedAt = new Date().toISOString(); sup.archivedBy = actorName();
    await saveKey('suppliers', DB.suppliers);
    await logAction('🗄️ أرشفة مورد: '+sup.name+(reason?' — السبب: '+reason:''));
    notify('supplier_archive', 'أرشفة مورد: '+sup.name+(reason?' — '+reason:''), { category:'financial', refType:'supplier', refId:sup.id });
    closeModal(); toast('تم أرشفة المورد «'+sup.name+'»'); refreshContent();
  });
}
async function restoreSupplier(supplierId){
  if(!isOwnerSession()){ toast('استرجاع الموردين صلاحية صاحب المركز فقط', true); return; }
  const sup = DB.suppliers.find(s=>s.id===supplierId); if(!sup) return;
  sup.archived = false; delete sup.archivedAt; delete sup.archivedBy;
  await saveKey('suppliers', DB.suppliers);
  await logAction('♻️ استرجاع مورد من الأرشيف: '+sup.name);
  notify('supplier_restore', 'استرجاع مورد من الأرشيف: '+sup.name, { category:'financial', refType:'supplier', refId:sup.id });
  closeModal(); toast('رجع المورد «'+sup.name+'» نشط تاني'); refreshContent();
}

async function saveNewSupplier(){
  if(!(canScreen('suppliers'))){ toast('مالكش صلاحية على شاشة الموردين', true); return; }   /* حارس م65 */
  const f = readSupplierForm();
  if(!f.name){ toast('اكتب اسم المورد', true); return; }
  if(DB.suppliers.some(s=>s.name===f.name && !s.archived)){ toast('فيه مورد بنفس الاسم موجود بالفعل', true); return; }
  const opening = Math.abs(parseFloat((document.getElementById('supOpening')||{}).value)||0);
  const openingType = (document.getElementById('supOpeningType')||{}).value || 'credit';
  DB.suppliers.push({ id:uid('sup'), ...f, openingBalance:opening, openingType, ledger:[], createdAt:new Date().toISOString() });
  await saveKey('suppliers', DB.suppliers);
  await logAction('إضافة مورد: '+f.name+(opening?' — رصيد افتتاحي '+money(opening)+' ('+(openingType==='debit'?'له عندنا':'علينا له')+')':''));
  if(opening) notify('supplier_edit', 'مورد جديد برصيد افتتاحي: '+f.name+' — '+money(opening), { category:'financial', refType:'supplier', amount:opening });
  closeModal(); toast('تم إضافة المورد'); refreshContent();
}
function openEditSupplierModal(supplierId){

  openModal(`

    ${supplierFormHTML(sup)}
    <button class="btn btn-accent" style="width:100%;margin-top:10px" onclick="saveEditSupplier('${supplierId}')">حفظ التعديلات</button>

async function saveEditSupplier(supplierId){
  if(!(canScreen('suppliers'))){ toast('مالكش صلاحية على شاشة الموردين', true); return; }   /* حارس م65 */
  const sup = DB.suppliers.find(s=>s.id===supplierId); if(!sup) return;
  const f = readSupplierForm();
  if(!f.name){ toast('اكتب اسم المورد', true); return; }
  if(DB.suppliers.some(s=>s.id!==supplierId && s.name===f.name && !s.archived)){ toast('فيه مورد تاني بنفس الاسم', true); return; }
  Object.assign(sup, f);
  // الرصيد الافتتاحي بيتعدل بس لو مفيش أي حركة مالية (سلامة الحسابات)
  if(!supplierHasTransactions(supplierId)){
    sup.openingBalance = Math.abs(parseFloat((document.getElementById('supOpening')||{}).value)||0);
    sup.openingType = (document.getElementById('supOpeningType')||{}).value || 'credit';
  }
  await saveKey('suppliers', DB.suppliers);
  await logAction('تعديل بيانات المورد: '+sup.name);
  notify('supplier_edit', 'تعديل بيانات المورد: '+sup.name, { category:'financial', refType:'supplier', refId:sup.id });
  closeModal(); toast('تم حفظ بيانات المورد'); openSupplierDetail(supplierId); refreshContent();
}

    </div>

/* تصنيف المرتجع: قد المديونية اللي بيقلّلها وقد الرصيد الدائن اللي بيعمله (الملاحظة 70) */
function classifySupplierReturn(supplierId, invoiceId, amount){
  const inv = invoiceId ? DB.purchases.find(p=>p.id===invoiceId) : null;
  let outstanding;
  if(inv){ outstanding = purchaseOutstanding(inv); }
  else {
    // بدون فاتورة محددة: النظام بيختار أقدم فاتورة عليها متبقي، وإلا يقلّل إجمالي المديونية
    const withOut = DB.purchases.filter(p=>p.supplierId===supplierId && purchaseOutstanding(p)>0)
      .sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(withOut.length){ return classifySupplierReturn(supplierId, withOut[0].id, amount); }
    outstanding = supplierBalance(supplierId).liability;   // اجمالي المديونية الحالية
  }
  const payableReduction = Math.min(amount, Math.max(0, outstanding));
  const creditAmount = Math.round((amount - payableReduction)*100)/100;
  return { invoiceId: inv ? inv.id : (invoiceId||null), payableReduction, creditAmount };
}
async function saveSupplierReturn(supplierId){
  if(!(can('inv.receive'))){ toast('مالكش صلاحية مرتجعات الموردين', true); return; }   /* حارس م65 */
  const partId = document.getElementById('retPart').value;
  const qty = parseFloat(document.getElementById('retQty').value)||0;
  const cost = parseFloat(document.getElementById('retCost').value)||0;
  const note = document.getElementById('retNote').value.trim();
  const p = DB.inventory.find(x=>x.id===partId);
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(qty>p.qty){ toast('الكمية المرتجعة أكبر من المتاح في المخزون', true); return; }
  p.qty -= qty;
  const total = qty*cost;
  const invoiceId = ((document.getElementById('retInvoice')||{}).value) || null;
  // الملاحظة 70: تصنيف المرتجع حسب حالة سداد الفاتورة المرتبطة
  const cls = classifySupplierReturn(supplierId, invoiceId, total);
  const ret = {id:uid('ret'), supplierId, partId, name:p.name, qty, unitCost:cost, total, date:new Date().toISOString(), note,
    invoiceId: cls.invoiceId, payableReduction: cls.payableReduction, creditAmount: cls.creditAmount};
  DB.supplierReturns.push(ret);
  DB.stockMoves.push({id:uid('mv'), partId, type:'return', qty, unitCost:cost, date:new Date().toISOString(), note:'مرتجع لمورد'+(note?' — '+note:''), supplierId, retId: ret.id});
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('supplierReturns', DB.supplierReturns), saveKey('stockMoves', DB.stockMoves)]);
  const linkedInv = cls.invoiceId ? DB.purchases.find(x=>x.id===cls.invoiceId) : null;
  await logAction('مرتجع لمورد '+supName(supplierId)+' بقيمة '+money(total)+(linkedInv?' على فاتورة #'+linkedInv.purchaseNo:'')+
    ' — '+(cls.payableReduction>0?'خصم '+money(cls.payableReduction)+' من المديونية':'')+
    (cls.creditAmount>0?(cls.payableReduction>0?' + ':'')+'رصيد دائن '+money(cls.creditAmount):''));
  notify('supplier_return', 'مرتجع لمورد '+supName(supplierId)+' بقيمة '+money(total)+
    (cls.creditAmount>0?' — رصيد دائن لنا '+money(cls.creditAmount):' — خصم من المديونية'),
    { category:'financial', refType:'supplier', refId:supplierId, amount:total });
  closeModal();
  toast(cls.creditAmount>0
    ? 'تم المرتجع — رصيد دائن لنا '+money(cls.creditAmount)+(cls.payableReduction>0?' + خصم '+money(cls.payableReduction)+' من المديونية':'')
    : 'تم المرتجع — خصم '+money(cls.payableReduction)+' من مديونية المورد');
  refreshContent();
}

async function purFinApprove(purchaseId){

  const oldMethod = p.paymentMethod;
  const beforeBal = supplierBalance(p.supplierId).balance;
  // القاعدة الذهبية: عكس القديم ثم تطبيق الجديد (بدون ازدواج)
  purApplyMethodChange(p, wantMethod, srcAcc);
  const changes = [];
  if(methodChanged) changes.push({ field:'طريقة الدفع', before:oldMethod, after:wantMethod });
  changes.push({ field:'الحالة', before:'بانتظار مراجعة المحاسب', after:'معتمدة مالياً' });
  p.status = 'approved'; p.finApproved = true; p.finApprovedBy = actorName(); p.finApprovedAt = new Date().toISOString();
  purLog(p, 'fin_approved', changes, reason);

  const afterBal = supplierBalance(p.supplierId).balance;

  ]));

async function saveSupplierPayment(supplierId){
  if(!can('sup.pay')){ toast('مالكش صلاحية سداد الموردين', true); return; }
  let amount = parseFloat(document.getElementById('supPayAmt').value)||0;
  // الملاحظة 47: الخصم حركة محاسبية مستقلة — مابيعدّلش قيم الفواتير أبداً
  const discAmt = Math.max(parseFloat((document.getElementById('supDiscAmt')||{}).value)||0, 0);
  const discReason = ((document.getElementById('supDiscReason')||{}).value||'').trim();
  if(discAmt>0 && !discReason){ toast('اكتب سبب الخصم — إلزامي مع أي خصم', true); return; }
  if(amount<=0 && discAmt<=0){ toast('اكتب مبلغ صحيح', true); return; }
  const bal = supplierBalance(supplierId).liability;   // المديونية علينا (م69)
  if(discAmt + amount > bal + 0.001){ toast('الخصم + المدفوع أكبر من المديونية علينا ('+money(bal)+')', true); return; }
  const supForDisc = DB.suppliers.find(s=>s.id===supplierId);
  if(discAmt>0){
    supForDisc.ledger = supForDisc.ledger || [];
    supForDisc.ledger.push({ id:uid('sled'), kind:'discount', amount:discAmt, reason:discReason,
      date:new Date().toISOString(), by:actorName() });
    await saveKey('suppliers', DB.suppliers);
    await logAction('💸 خصم من المورد '+supForDisc.name+' بقيمة '+money(discAmt)+' — السبب: '+discReason);
    pushNotif({ category:'financial', type:'supplier_discount', priority:'high', amount:discAmt,
      action:'خصم من المورد '+supForDisc.name+' بقيمة '+money(discAmt)+' — '+discReason, refType:'expense' });
  }
  if(amount<=0){
    closeModal(); toast('اتسجل الخصم '+money(discAmt)+' على حساب المورد'); refreshContent(); return;
  }
  // الملاحظة 69: فواتير محددة (لو المستخدم اختار) وإلا الأقدم أولاً
  const selIds = [...document.querySelectorAll('.supPaySel:checked')].map(c=>c.value);
  if(selIds.length && !can('sup.pay_specific')){ toast('مالكش صلاحية تسديد فواتير محددة', true); return; }
  let purchases = DB.purchases.filter(p=>p.supplierId===supplierId);
  if(selIds.length){ const set=new Set(selIds); purchases = purchases.filter(p=>set.has(p.id)); }
  purchases = purchases.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const paidInvoices = [];
  for(const p of purchases){
    if(amount<=0) break;
    const paidSoFar = (p.payments||[]).reduce((s,x)=>s+x.amount,0);
    const remaining = Math.round((p.total - paidSoFar)*100)/100;
    if(remaining<=0) continue;   // مسدَّدة بالكامل — مابتتسددش تاني
    const toPay = Math.min(remaining, amount);
    p.payments = p.payments || [];
    p.payments.push({id:uid('spay'), amount:toPay, date:new Date().toISOString()});
    amount -= toPay;

  DB.expenses.push({id:uid('exp'), category:'سداد مورد', amount: paidTotal, note: supNm, accountId:acc?acc.id:null, payAccount:acc?acc.name:null, date:new Date().toISOString()});

function sadjRecalc(cur){
  const correct = parseFloat((document.getElementById('sadjCorrect')||{}).value);

  if(isNaN(correct)){ box.innerHTML = '<div class="muted" style="font-size:12px">اكتب الرصيد الصحيح</div>'; return; }
  const diff = Math.round((correct - cur)*100)/100;
  box.innerHTML = `

async function saveSupplierAdjust(supplierId){
  if(!isOwnerSession()){ toast('تسوية أرصدة الموردين صلاحية صاحب المركز فقط', true); return; }
  const sup = DB.suppliers.find(s=>s.id===supplierId); if(!sup) return;
  const cur = supplierBalance(supplierId).balance;
  const correct = parseFloat((document.getElementById('sadjCorrect')||{}).value);
  const reason = ((document.getElementById('sadjReason')||{}).value||'').trim();
  const notes = ((document.getElementById('sadjNotes')||{}).value||'').trim();
  if(isNaN(correct)){ toast('اكتب الرصيد الصحيح', true); return; }
  if(!reason){ toast('سبب التسوية إلزامي', true); return; }
  const diff = Math.round((correct - cur)*100)/100;
  if(Math.abs(diff) < 0.005){ toast('الرصيد الصحيح زي الحالي بالظبط — مفيش تسوية', true); return; }
  sup.ledger = sup.ledger || [];
  sup.ledger.push({ id:uid('sled'), kind:'adjustment', amount:diff, reason, notes,
    date:new Date().toISOString(), by:actorName(), prevBalance:cur, newBalance:correct });
  await saveKey('suppliers', DB.suppliers);
  await logAction('⚖️ تسوية رصيد المورد '+sup.name+' — من '+money(cur)+' إلى '+money(correct)+' (فرق '+(diff>0?'+':'')+money(diff)+') — السبب: '+reason+(notes?' — '+notes:''));
  pushNotif({ category:'financial', type:'supplier_adjust', priority:'critical', amount:Math.abs(diff),
    action:'تسوية رصيد المورد '+sup.name+': '+money(cur)+' ← '+money(correct)+' — '+reason, refType:'expense' });
  closeModal(); toast('اتسجلت التسوية — الرصيد بقى '+money(correct)); openSupplierDetail(supplierId); refreshContent();
}

/* ============ الملاحظة 39: بحث ذكي في المخزون + منع تكرار الأصناف ============ */
/* تطبيع النص للبحث: توحيد الألف/الياء/التاء المربوطة، شيل التشكيل، أرقام عربية→إنجليزية، lowercase */
function normSearch(s){
  return String(s||'')
    .toLowerCase()
    .replace(/[ً-ْـ]/g,'')
    .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
    .replace(/[٠-٩]/g, d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))
    .replace(/[^a-z0-9؀-ۿ]+/g,' ')
    .trim();
}
/* مسافة تحرير بسيطة بسقف (للأخطاء الإملائية) */
function editDist(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let dp=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){
    let prev=dp[0]; dp[0]=i; let rowMin=dp[0];
    for(let j=1;j<=b.length;j++){
      const t=dp[j];
      dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev+(a[i-1]===b[j-1]?0:1));
      prev=t; if(dp[j]<rowMin) rowMin=dp[j];
    }
    if(rowMin>max) return max+1;
  }
  return dp[b.length];
}
/* نص البحث المجمّع لكل صنف (اسم + كود + OEM + رقم المورد + ماركة + كلمات بديلة + فئة + وصف) — بكاش للأداء */
const _partHayCache = new WeakMap();
function partHaystack(p){
  const sig = [p.name,p.sku,p.oemNo,p.supplierPartNo,p.barcode,p.brand,p.keywords,p.category,p.description].join('|');
  const c = _partHayCache.get(p);
  if(c && c.sig===sig) return c.text;
  const text = normSearch([p.name,p.sku,p.oemNo,p.supplierPartNo,p.barcode,p.brand,p.keywords,p.category,p.description].filter(Boolean).join(' '));
  _partHayCache.set(p,{sig,text});
  return text;
}
/* درجة تطابق 0..1: نسبة كلمات البحث اللي لقيناها (جزئي أو بخطأ إملائي بسيط) */
function partMatchScore(qTokens, p){
  const hayTokens = partHaystack(p).split(' ');
  if(!hayTokens.length) return 0;
  let matched = 0;
  for(const qt of qTokens){
    let hit = false;
    for(const ht of hayTokens){
      if(ht.includes(qt) || (qt.length>=3 && qt.includes(ht) && ht.length>=3)){ hit=true; break; }
      if(qt.length>=4){ const cap=qt.length>=7?2:1; if(editDist(qt,ht,cap)<=cap){ hit=true; break; } }
    }
    if(hit) matched++;
  }
  return matched/qTokens.length;
}
/* البحث الذكي: يرجّع [{part, score}] مرتبة بالأفضل */
function smartSearchParts(query, limit){
  const qTokens = normSearch(query).split(' ').filter(t=>t.length>=2);
  if(!qTokens.length) return [];
  const scored = [];
  for(const p of activeInventory()){
    const score = partMatchScore(qTokens, p);
    if(score>0) scored.push({part:p, score});
  }
  scored.sort((a,b)=> b.score-a.score || a.part.name.localeCompare(b.part.name,'ar'));
  return scored.slice(0, limit||8);
}
/* حركات التوريد بسعر (الأحدث أولاً) — لآخر سعر شراء ومتوسط التكلفة والتاريخ */
function partInMoves(partId){
  return DB.stockMoves.filter(m=>m.partId===partId && m.type==='in' && m.unitCost!=null)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
}
function lastPurchaseInfo(partId){
  const mv = partInMoves(partId)[0];
  if(!mv){ const p=DB.inventory.find(x=>x.id===partId); return { price:p?p.costPrice:0, date:null, supplierName:null }; }
  const s = mv.supplierId ? DB.suppliers.find(x=>x.id===mv.supplierId) : null;
  return { price:mv.unitCost, date:mv.date, supplierName:s?s.name:null };
}
function avgPurchaseCost(partId){
  const ms = partInMoves(partId);
  if(!ms.length){ const p=DB.inventory.find(x=>x.id===partId); return p?p.costPrice:0; }
  const tq = ms.reduce((s,m)=>s+m.qty,0)||1;
  return ms.reduce((s,m)=>s+m.qty*m.unitCost,0)/tq;
}
function partPurchaseHistory(partId, n){
  return partInMoves(partId).slice(0, n||3).map(mv=>({
    date:mv.date, price:mv.unitCost,
    supplier:(mv.supplierId && (DB.suppliers.find(x=>x.id===mv.supplierId)||{}).name)||'—'
  }));
}
/* نفس الصنف في مخازن تانية (بنفس الاسم بعد التطبيع) */
function partSiblings(p){ const key=normSearch(p.name); return DB.inventory.filter(x=>normSearch(x.name)===key); }
/* صفوف نتائج البحث المبسطة: كود · اسم · متاح · آخر شراء · [تفاصيل] */

}
/* البحث اللحظي أثناء كتابة اسم الصنف الجديد + تحذير التشابه (70%+) */
window._plNewName = '';

  window._plNewName = val;

async function savePurchaseInvoice(){
  if(!can('inv.receive')){ toast('مالكش صلاحية تسجيل المشتريات', true); return; }
  if(!purchaseDraft.supplierId){ toast('اختار المورد أولاً', true); return; }
  if(purchaseDraft.lines.length===0){ toast('أضف صنف واحد على الأقل', true); return; }
  // الملاحظة 45: حماية خلفية — لو صنف في الفاتورة اتأرشف (مثلاً من جهاز تاني) أو المورد اتأرشف، الحفظ يترفض قبل أي تعديل
  const archivedLine = purchaseDraft.lines.find(l=>l.partId && (DB.inventory.find(p=>p.id===l.partId)||{}).archived);
  if(archivedLine){ toast('الصنف «'+archivedLine.name+'» مؤرشف — استرجعه من الأرشيف الأول أو شيله من الفاتورة', true); return; }
  const supplier = DB.suppliers.find(s=>s.id===purchaseDraft.supplierId);
  if(supplier && supplier.archived){ toast('المورد «'+supplier.name+'» مؤرشف — استرجعه من الأرشيف الأول', true); return; }
  const purchaseId = uid('pur');
  const invoiceItems = [];
  for(const line of purchaseDraft.lines){
    let part;
    if(line.partId){
      part = DB.inventory.find(p=>p.id===line.partId);
      part.qty += line.qty;
      part.costPrice = line.costPrice;
      if(line.sellPrice) part.sellPrice = line.sellPrice;
    } else {
      part = {id:uid('p'), name:line.name, sku:line.sku||'', brand:line.brand||'', oemNo:line.oemNo||'', category:line.category||'', unit:line.unit||'قطعة', qty:line.qty, minQty:2, costPrice:line.costPrice, sellPrice:line.sellPrice, warehouseId:line.warehouseId||defaultWhId(), createdAt:new Date().toISOString()};
      DB.inventory.push(part);
    }
    DB.stockMoves.push({id:uid('mv'), partId:part.id, type:'in', qty:line.qty, unitCost:line.costPrice, warehouseId:partWhId(part), date:new Date().toISOString(), note:'فاتورة شراء #'+(purchaseDraft.invoiceNo||'—')+' — '+purchaseDraft.paymentMethod+' — مخزن: '+whName(partWhId(part)), supplierId:purchaseDraft.supplierId, purchaseId,
      notes:line.notes||'', reqById:line.reqById||'', reqByName:line.reqByName||'', forJobId:line.forJobId||'', forJobNo:line.forJobNo||'', forCarId:line.forCarId||'', forCarLbl:line.forCarLbl||''});
    invoiceItems.push({partId:part.id, name:part.name, qty:line.qty, unitCost:line.costPrice});
  }
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('stockMoves', DB.stockMoves)]);
  const total = invoiceItems.reduce((s,it)=>s+it.qty*it.unitCost,0);
  const purchase = {
    id: purchaseId, purchaseNo: purchaseDraft.invoiceNo || nextNo(DB.purchases,'purchaseNo'),
    supplierId: purchaseDraft.supplierId,
    date: purchaseDraft.date ? new Date(purchaseDraft.date).toISOString() : new Date().toISOString(),
    note: 'طريقة الدفع: '+purchaseDraft.paymentMethod,
    paymentMethod: purchaseDraft.paymentMethod,
    items: invoiceItems, total, payments: [],
    // الملاحظة 63: الفاتورة بتتسجل «بانتظار فاتورة المورد» — الأسعار مبدئية لحد ما تتعتمد
    status: 'pending', supInvNo: purchaseDraft.invoiceNo || '', supInvDate: '',
    createdBy: actorName(),
    history: [{ id:uid('ph'), at:new Date().toISOString(), actor:actorName(), action:'created',
      changes:[{ field:'إجمالي الفاتورة', before:'—', after:money(total) }], reason:'' }]
  };
  // الملاحظة 69: كاش = دفعة تلقائية (المديونية مابتزيدش) لكن الخصم الفعلي من الخزنة
  // بيتعمل وقت اعتماد المحاسب لما يحدّد المصدر. آجل = مفيش دفعة (المديونية بتزيد فوراً).
  if(purchaseDraft.paymentMethod !== 'آجل'){
    purchase.payments.push({id:uid('pay'), amount: total, date: new Date().toISOString(), auto:true, accountId:null });
  }
  DB.purchases.push(purchase);
  await saveKey('purchases', DB.purchases);
  await logAction('فاتورة شراء جديدة #'+purchase.purchaseNo+' من '+supplier.name+' بقيمة '+money(total)+' ('+purchaseDraft.paymentMethod+')');
  notify('purchase_create', 'فاتورة شراء جديدة #'+purchase.purchaseNo+' من '+supplier.name+' بقيمة '+money(total)+' — بانتظار فاتورة المورد',
    { category:'financial', refType:'purchase', refId:purchase.id, refNo:purchase.purchaseNo, amount:total });
  toast('تم حفظ الفاتورة وتحديث المخزون وحساب المورد');
  purchaseDraft = null;
  currentTab='suppliers'; render();
}
