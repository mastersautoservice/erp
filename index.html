<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- منع كاش المتصفح: أي نسخة جديدة تترفع تظهر فوراً على كل الأجهزة بدون مسح كاش يدوي -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>نظام إدارة مركز الصيانة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B;
  --surface:#141416;
  --surface-2:#1D1D20;
  --surface-3:#28282C;
  --accent:#F2D410;
  --accent-dim:#6E6104;
  --accent-2:#E02525;
  --text:#F4F4F2;
  --muted:#9A9A93;
  --success:#5CB88B;
  --danger:#E02525;
  --border:#2E2E33;
  --radius:10px;
}
/* ===== الملاحظة 48: الوضع الفاتح (Light Mode) — نفس التخطيط بالظبط، ألوان بس ===== */
:root[data-theme="light"]{
  --bg:#F4F5F7;
  --surface:#FFFFFF;
  --surface-2:#EFF1F4;
  --surface-3:#E2E5EA;
  --accent:#B99A00;
  --accent-dim:#F2D410;
  --accent-2:#C41F1F;
  --text:#16181D;
  --muted:#5C6270;
  --success:#1E7A50;
  --danger:#C41F1F;
  --border:#D5D9E0;
}
:root[data-theme="light"] .tag-received{background:#FDF0D8;color:#8A5A00;}
:root[data-theme="light"] .tag-inspect{background:#DCEBF5;color:#1F5D80;}
:root[data-theme="light"] .tag-working{background:#EAE0F8;color:#5B3A9E;}
:root[data-theme="light"] .tag-ready{background:#DCF2E6;color:#1E7A50;}
:root[data-theme="light"] .tag-delivered{background:#E6EAEE;color:#4A5560;}
:root[data-theme="light"] .tag-cancel{background:#FADDDB;color:#A8231A;}
:root[data-theme="light"] .tag-paid{background:#DCF2E6;color:#1E7A50;}
:root[data-theme="light"] .tag-partial{background:#FDF0D8;color:#8A5A00;}
:root[data-theme="light"] .tag-unpaid{background:#FADDDB;color:#A8231A;}
:root[data-theme="light"] .logout-btn:hover,
:root[data-theme="light"] .btn-danger:hover{color:#fff;}
:root[data-theme="light"] .btn-accent{color:#16181D;}
/* ===== الوضع القياسي (Standard) — داكن أنعم (رمادي مزرقّ) بين الأسود والفاتح ===== */
:root[data-theme="standard"]{
  --bg:#1B2430;
  --surface:#232F3E;
  --surface-2:#2C3A4C;
  --surface-3:#374658;
  --accent:#F2D410;
  --accent-dim:#6E6104;
  --accent-2:#FF5A52;
  --text:#EAEFF5;
  --muted:#9DB0C4;
  --success:#5CB88B;
  --danger:#FF6B62;
  --border:#37475A;
}
:root[data-theme="standard"] .tag-received{background:#3d3620;color:#F2C15E;}
:root[data-theme="standard"] .tag-inspect{background:#243a48;color:#79BEE0;}
:root[data-theme="standard"] .tag-working{background:#33304f;color:#C3A6EE;}
:root[data-theme="standard"] .tag-ready{background:#213f34;color:#7ED3A6;}
:root[data-theme="standard"] .tag-delivered{background:#2a3542;color:#A6B4C0;}
:root[data-theme="standard"] .tag-cancel{background:#432a2a;color:#FF8A82;}
:root[data-theme="standard"] .tag-paid{background:#213f34;color:#7ED3A6;}
:root[data-theme="standard"] .tag-partial{background:#3d3620;color:#F2C15E;}
:root[data-theme="standard"] .tag-unpaid{background:#432a2a;color:#FF8A82;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;}
h1,h2,h3,h4,.num,.brand{font-family:'Cairo',sans-serif;}
#root{min-height:100vh;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
button{font-family:'Tajawal',sans-serif;cursor:pointer;border:none;}
input,select,textarea{font-family:'Tajawal',sans-serif;}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, #1c242b 0%, #12161A 55%);}
.login-card{width:min(760px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;position:relative;overflow:hidden;}
.login-card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.login-title{font-size:26px;font-weight:900;margin:0 0 4px;}
.login-sub{color:var(--muted);margin:0 0 28px;font-size:14px;}
.role-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.role-btn{background:var(--surface-2);border:2px solid var(--border);border-radius:12px;padding:18px 8px;text-align:center;transition:.15s;color:var(--text);}
.role-btn:hover{border-color:var(--accent);transform:translateY(-2px);}
.role-btn.active{border-color:var(--accent);background:var(--surface-3);}
.role-icon{width:30px;height:30px;margin:0 auto 8px;display:block;}
.role-name{font-weight:700;font-size:14px;}
.pin-row{display:flex;gap:10px;}
.pin-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--text);font-size:20px;letter-spacing:6px;text-align:center;}
.login-go{background:var(--accent);color:#241704;font-weight:800;border-radius:10px;padding:0 26px;font-size:15px;}
.login-hint{margin-top:14px;color:var(--muted);font-size:12px;}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}

/* ---------- SHELL ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0;}
.brand{font-size:19px;font-weight:900;margin:0 4px 4px;}
.brand-sub{color:var(--muted);font-size:11px;margin:0 4px 22px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:10px;color:var(--muted);font-weight:700;font-size:14.5px;margin-bottom:4px;background:transparent;width:100%;text-align:right;}
.nav-item svg{width:19px;height:19px;flex-shrink:0;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--surface-3);color:var(--accent);}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;}
.role-tag{font-size:12px;color:var(--muted);margin-bottom:8px;}
.logout-btn{width:100%;background:var(--surface-2);color:var(--text);padding:10px;border-radius:8px;font-size:13px;font-weight:700;}
.logout-btn:hover{background:var(--danger);color:#fff;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:66px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:var(--surface);flex-shrink:0;}
.topbar h2{font-size:18px;margin:0;}
.search-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;display:flex;align-items:center;gap:8px;width:280px;}
.search-box input{background:transparent;border:none;color:var(--text);outline:none;flex:1;font-size:13.5px;}
.content{flex:1;padding:26px;overflow-y:auto;}

/* ---------- COMMON UI ---------- */
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.stat-card .num{font-size:30px;font-weight:900;}
.stat-card .lbl{color:var(--muted);font-size:13px;margin-top:4px;}
.stat-card{border-top:3px solid var(--accent);}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-head h3{margin:0;font-size:16.5px;}
.btn{background:var(--surface-2);color:var(--text);padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:700;border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--surface-3);}
.btn-accent{background:var(--accent);color:#241704;border:none;}
.btn-accent:hover{filter:brightness(1.08);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:right;color:var(--muted);font-weight:700;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--border);}
td{padding:12px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-2);}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.tag-received{background:#3a3220;color:#F2A93B;}
.tag-inspect{background:#25323a;color:#4C8DAE;}
.tag-working{background:#2c2440;color:#B48CE0;}
.tag-ready{background:#1e3a30;color:#5CB88B;}
.tag-delivered{background:#22282e;color:#8A97A0;}
.tag-cancel{background:#3a2222;color:#E2584D;}
.tag-paid{background:#1e3a30;color:#5CB88B;}
.tag-partial{background:#3a3220;color:#F2A93B;}
.tag-unpaid{background:#3a2222;color:#E2584D;}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty svg{width:40px;height:40px;margin-bottom:10px;opacity:.5;}
.pill-input,input.f,select.f,textarea.f{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13.5px;width:100%;}
label.f-label{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:block;font-weight:700;}
.form-row{margin-bottom:14px;}
.low-stock{color:var(--danger);font-weight:800;}

/* Ticket / job card - signature element */
.ticket{background:var(--surface);border:1px solid var(--border);border-radius:14px;position:relative;overflow:hidden;cursor:pointer;transition:.15s;}
.ticket:hover{border-color:var(--accent);transform:translateY(-2px);}
.ticket-top{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:flex-start;}
.ticket-hole{position:absolute;top:14px;left:14px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--border);}
.ticket-jobno{font-family:'Cairo',sans-serif;font-weight:900;color:var(--accent);font-size:13px;letter-spacing:1px;}
.ticket-plate{font-weight:800;font-size:17px;margin-top:2px;}
.ticket-car{color:var(--muted);font-size:12.5px;}
.ticket-divider{border-top:2px dashed var(--border);margin:0 18px;}
.stepper{display:flex;align-items:center;padding:14px 18px 16px;gap:2px;}
.step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.step-dot{width:11px;height:11px;border-radius:50%;background:var(--surface-3);border:2px solid var(--border);z-index:1;}
.step.done .step-dot{background:var(--success);border-color:var(--success);}
.step.current .step-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-dim);}
.step-line{position:absolute;top:5px;height:2px;background:var(--border);width:100%;right:50%;z-index:0;}
.step.done .step-line{background:var(--success);}
.step:first-child .step-line{display:none;}
.step-lbl{font-size:9.5px;color:var(--muted);margin-top:6px;text-align:center;}
.step.current .step-lbl{color:var(--accent);font-weight:800;}

/* Modal & Toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:min(560px,100%);max-height:88vh;overflow-y:auto;padding:26px;}
.modal h3{margin:0 0 18px;font-size:17px;}
.modal-close{position:absolute;left:22px;top:22px;background:var(--surface-2);width:30px;height:30px;border-radius:50%;color:var(--muted);}
.toast-wrap{position:fixed;bottom:22px;left:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface-3);border:1px solid var(--border);border-right:4px solid var(--success);padding:12px 18px;border-radius:9px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:slidein .2s;}
.toast.err{border-right-color:var(--danger);}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.items-table input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px;}
.muted{color:var(--muted);}
.total-row{font-weight:800;font-size:16px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
body.busy button{pointer-events:none;opacity:.55;}
#busyBar{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--accent);color:var(--accent);padding:10px 22px;border-radius:24px;font-size:13.5px;font-weight:800;z-index:500;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4);}
#printArea{display:none;}
@media print{
  body > *:not(#printArea){display:none !important;}
  #printArea{display:block !important;background:#fff;color:#111;padding:20px;font-family:Tahoma,Arial,sans-serif;}
  #printArea h1{font-size:20px;margin-bottom:2px;}
  #printArea .pmuted{color:#555;font-size:13px;}
  #printArea table{width:100%;border-collapse:collapse;margin-top:16px;}
  #printArea th,#printArea td{border:1px solid #999;padding:8px;text-align:right;font-size:13px;color:#111;}
  #printArea .ptotals{margin-top:14px;width:280px;margin-right:auto;font-size:13.5px;}
  #printArea .ptotals div{display:flex;justify-content:space-between;padding:4px 0;}
  #printArea .pgrand{font-weight:bold;font-size:16px;border-top:2px solid #333;margin-top:6px;padding-top:8px;}
}
@media(max-width:900px){
  .sidebar{position:fixed;right:0;top:0;bottom:0;z-index:50;transform:translateX(100%);transition:.2s;}
  .sidebar.open{transform:translateX(0);}
  .g4{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(2,1fr);}
  .role-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

const SUPABASE_URL = 'https://sjidczbngscyuswyoldu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqaWRjemJuZ3NjeXVzd3lvbGR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MDMyNDksImV4cCI6MjA5OTM3OTI0OX0.289dXkcDayebXTyEuntO9rvchqPyh8Sz1z_HWtr3qOQ';

const TABLE_MAP = {
  customers:'customers', cars:'cars', jobs:'jobs', inventory:'inventory',
  stockMoves:'stock_moves', invoices:'invoices', expenses:'expenses', suppliers:'suppliers',
  purchases:'purchases', supplierReturns:'supplier_returns', inventoryCounts:'inventory_counts',
  warehouses:'warehouses', staff:'staff', finAccounts:'fin_accounts', finMoves:'fin_moves',
  appointments:'appointments', cannedServices:'canned_services', activityLog:'activity_log',
  expenseCategories:'expense_categories', employees:'hr_employees', leaveRequests:'leave_requests',
  permits:'hr_permits', tools:'special_tools', toolMoves:'tool_moves',
  notifications:'notifications', custodies:'custodies'
};
const DATA_KEYS = Object.keys(TABLE_MAP);
const KV_KEYS = ['users','settings'];
let sb = null;
const _shadow = {};
function sbConfigured(){
  return SUPABASE_URL.indexOf('https://')===0 && SUPABASE_ANON_KEY.length > 30;
}
function initSupabase(){
  if(!sbConfigured() || !window.supabase) return false;
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false } });
  return true;
}
function _actor(){ try{ return (session && typeof actorName==='function') ? actorName() : null; }catch(e){ return null; } }
function _snapshot(key){
  const m = new Map();
  (DB[key]||[]).forEach(r=>{ if(r && r.id) m.set(r.id, JSON.stringify(r)); });
  return m;
}

let _saveQueue = Promise.resolve();
let _pendingSaves = 0;
const _queuedKeys = {};
window._lastSaveAt = 0;

function saveKey(key){
  // حفظ بالفروقات: بيقارن الحالة الحالية بآخر حالة محفوظة ويرسل المتغير فقط
  // + دمج: لو نفس الجدول في الطابور، الحفظة المنتظرة هتشمل التعديل الحالي
  if(_queuedKeys[key]) return _queuedKeys[key];
  _pendingSaves++;
  const run = _saveQueue.then(()=>{
    delete _queuedKeys[key];
    return _withRetry(()=>_persistKey(key), 'save:'+key);
  });
  _queuedKeys[key] = run;
  _saveQueue = run.catch(()=>{});
  return run.finally(()=>{ _pendingSaves--; window._lastSaveAt = Date.now(); });
}
async function _persistKey(key){
  if(KV_KEYS.includes(key)){
    const { error } = await sb.from('kv_store').upsert({ key, data: DB[key], updated_by:_actor() });
    if(error) throw error;
    return true;
  }
  const t = TABLE_MAP[key];
  if(!t) return true;
  const cur = DB[key] || [];
  const shadow = _shadow[key] || new Map();
  const ups = [];
  const curIds = new Set();
  cur.forEach(r=>{
    if(!r || !r.id) return;
    curIds.add(r.id);
    const s = JSON.stringify(r);
    if(shadow.get(r.id) !== s) ups.push({ id:r.id, data:r, updated_by:_actor() });
  });
  const dels = [];
  shadow.forEach((v, id)=>{ if(!curIds.has(id)) dels.push(id); });
  for(let i=0; i<ups.length; i+=400){
    const { error } = await sb.from(t).upsert(ups.slice(i, i+400));
    if(error) throw error;
  }
  if(dels.length){
    const { error } = await sb.from(t).delete().in('id', dels);
    if(error) throw error;
  }
  _shadow[key] = _snapshot(key);
  return true;
}
async function _withRetry(fn, label){
  let lastErr = null;
  const waits = [800, 2000, 4000];
  for(let a=0; a<4; a++){
    try{ const r = await fn(); hideStorageWarning(); return r; }
    catch(e){ lastErr = e; }
    if(a<3) await new Promise(r=>setTimeout(r, waits[a]));
  }
  // إظهار السبب الحقيقي للفشل (مش مجرد "لا يوجد إنترنت")
  const reason = (lastErr && (lastErr.message || lastErr.hint || lastErr.details || lastErr.code)) || 'خطأ غير معروف';

function fullDeptPerms(dept){
  if(dept==='owner') return { screens:Object.keys(SCREEN_LABELS), actions:ALL_ACTIONS.slice() };
  return { screens:(DEPT_SCREENS[dept]||['dashboard']).slice(), actions:(DEPT_DEFAULT_ACTIONS[dept]||[]).slice() };

function isOwnerSession(){ return !!session && session.role==='owner'; }
/* جلسة مالهاش Sets (دخول أقسام قديم أو جلسة مبسطة) ⇒ صلاحيات القسم كاملة */
function sessionActions(){
  if(!session) return null;
  if(session.actions instanceof Set) return session.actions;
  return new Set(fullDeptPerms(session.role).actions);
}
function sessionScreens(){
  if(!session) return null;
  if(session.screens instanceof Set) return session.screens;
  return new Set(fullDeptPerms(session.role).screens);
}
function can(actionKey){
  if(!session) return false;
  if(isOwnerSession()) return true;
  return sessionActions().has(actionKey);
}
function canScreen(tab){
  if(!session) return false;
  if(isOwnerSession()) return true;
  return sessionScreens().has(tab);
}
function visibleTabs(){
  if(!session) return [];
  if(isOwnerSession()) return ROLE_TABS.owner;
  // الملاحظة 41: أي شاشة ممنوحة بتظهر — حتى لو مش من شاشات القسم الافتراضية (شاشات إضافية)
  return ROLE_TABS.owner.filter(t=>canScreen(t));
}
function firstVisibleTab(){
  const tabs = visibleTabs();
  return tabs.includes('dashboard') ? 'dashboard' : (tabs[0] || 'dashboard');
}
function buildSession(dept, staff){
  const perms = (staff && Array.isArray(staff.screens) && Array.isArray(staff.actions))
    ? { screens:staff.screens, actions:staff.actions }
    : fullDeptPerms(dept);   // حسابات قديمة أو دخول بالرقم السري ⇒ صلاحيات القسم كاملة
  // توافق: حساب اتحفظ قبل الصلاحيات التفصيلية (v51) بياخد الصلاحيات اللي كانت ضمنية عنده.
  // الحسابات المحفوظة بالمحرر الجديد (permsV>=2) صلاحياتها صريحة ومستقلة 100%.
  const actions = (staff && !(staff.permsV>=2)) ? expandLegacyActions(perms.actions) : perms.actions;
  return {
    role: dept,
    staffId: staff ? staff.id : null,
    staffName: staff ? staff.name : null,
    template: staff ? staff.template : null,
    screens: new Set(perms.screens),
    actions: new Set(actions)
  };
}

const THEME_MODES = [['dark','🌙 داكن'],['standard','🌆 قياسي'],['light','☀️ فاتح'],['system','🖥️ حسب الجهاز']];
function systemPrefersLight(){
  try{ return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches; }catch(e){ return false; }
}
function resolveTheme(mode){
  if(mode==='system') return systemPrefersLight() ? 'light' : 'dark';
  return ['dark','standard','light'].includes(mode) ? mode : 'dark';
}
function themeStorageKey(){

  if(session && session.staffId){
    const st = DB.staff.find(s=>s.id===session.staffId);
    if(st && st.theme) return st.theme;
  }
  try{ const v = localStorage.getItem(themeStorageKey()); if(v) return v; }catch(e){}

function fmtAuditVal(v){

  const parts = pairs.map(([k,v])=>{ const s=fmtAuditVal(v); return s?(k+': '+s):null; }).filter(Boolean);
  return parts.length ? ' — ' + parts.join(' · ') : '';

/* وصف كامل لبند أمر شغل (قطعة داخلية / خارجية / خدمة / أعمال خارجية) */
function describeJobItem(it, job){

  const sup = it.supplierId ? (DB.suppliers.find(s=>s.id===it.supplierId)||{}).name : null;
  const tech = (it.kind==='service'||it.kind==='ext_work') && (it.technicianId||it.technician) ? itemTechLabel(it, job) : null;
  const part = it.partId ? DB.inventory.find(p=>p.id===it.partId) : null;
  return kindTxt + ' «' + (it.name||'—') + '»' + auditDetails([
    ['الكمية', it.qty],
    ['سعر التكلفة', (it.costPrice!==undefined && it.costPrice!==null) ? money(it.costPrice) : null],
    ['سعر البيع', money(it.unitPrice||0)],

function durationText(from, to){
  const ms = new Date(to||new Date()) - new Date(from);
  if(ms < 0) return '—';
  const mins = Math.floor(ms/60000);
  const days = Math.floor(mins/1440);
  const hours = Math.floor((mins%1440)/60);
  const m = mins%60;
  const parts = [];
  if(days>0) parts.push(days+' يوم');
  if(hours>0) parts.push(hours+' ساعة');
  if(days===0 && m>0) parts.push(m+' دقيقة');
  return parts.length? parts.join(' و ') : 'أقل من دقيقة';
}

/* إصلاح ذاتي للتكامل: أي قطعة مصروفة على أمر شغل (موجودة في بنوده) ولا يوجد لها
   حركة صرف مسجلة في سجل المخزن، يتم إعادة بناء الحركة تلقائياً وربطها بالأمر */
async function repairMissingStockMoves(){
  let created = 0;
  DB.jobs.forEach(job=>{
    const partItems = job.items.filter(it=>it.kind==='part' && it.partId);
    if(partItems.length===0) return;
    const byPart = {};
    partItems.forEach(it=>{ (byPart[it.partId] = byPart[it.partId]||[]).push(it); });
    Object.entries(byPart).forEach(([pid, items])=>{
      // نحسب الحركات الموجودة لنفس الأمر ونفس القطعة (بالمعرف أو برقم الأمر في الوصف للحركات القديمة)
      const have = DB.stockMoves.filter(m=>m.type==='out' && m.partId===pid &&
        (m.jobId===job.id || (m.note && m.note.includes('#'+job.jobNo)))).length;
      for(let i=have; i<items.length; i++){
        const it = items[i];
        const car = DB.cars.find(c=>c.id===job.carId);
        DB.stockMoves.push({
          id:uid('mv'), partId:pid, type:'out', qty:it.qty, unitCost:it.costPrice, unitPrice:it.unitPrice,
          date: job.receivedAt, jobId: job.id, customerId: job.customerId,
          note:'صرف لأمر شغل #'+job.jobNo+(car?' — السيارة: '+car.plate+(carLabel(car)?' / '+carLabel(car):''):'')+' (استعادة تلقائية لحركة لم تُحفظ وقتها)'
        });
        created++;
      }
    });
  });
  if(created>0){
    await saveKey('stockMoves', DB.stockMoves);
    logAction('استعادة تلقائية لعدد '+created+' حركة صرف كانت مفقودة من السجل');
    toast('تم استرجاع '+created+' حركة مخزن كانت مفقودة وربطها بأوامر الشغل ✓');
    refreshContent();
  }
}

/* ============ المزامنة اللحظية بين كل الأجهزة (Real-time) ============
   أي تعديل من أي جهاز بيوصل لكل الأجهزة التانية في نفس الثانية */
let _rtTimer = null;
function startRealtime(){
  try{
    const ch = sb.channel('erp-sync');
    Object.entries(TABLE_MAP).forEach(([key, t])=>{
      ch.on('postgres_changes', { event:'*', schema:'public', table:t }, p=>_applyRemote(key, p));
    });
    ch.on('postgres_changes', { event:'*', schema:'public', table:'kv_store' }, p=>{
      const k = (p.new && p.new.key) || (p.old && p.old.key);
      if(k && KV_KEYS.includes(k) && p.new){ DB[k] = p.new.data; _scheduleRtRefresh(); }
    });
    ch.subscribe();
  }catch(e){ console.error('realtime init failed', e); }
}
function _applyRemote(key, p){
  try{
    const arr = DB[key];
    if(!arr) return;
    if(p.eventType === 'DELETE'){
      const id = p.old && p.old.id;
      if(!id) return;
      const i = arr.findIndex(r=>r.id===id);
      if(i>=0) arr.splice(i,1);
      if(_shadow[key]) _shadow[key].delete(id);
    } else {
      const row = p.new;
      if(!row || !row.id) return;
      const s = JSON.stringify(row.data);
      if(_shadow[key] && _shadow[key].get(row.id) === s) return; // تغيير صادر من نفس الجهاز
      const i = arr.findIndex(r=>r.id===row.id);
      if(i>=0) arr[i] = row.data; else arr.push(row.data);
      if(_shadow[key]) _shadow[key].set(row.id, s);
    }
    _scheduleRtRefresh();
  }catch(e){ console.error('applyRemote', e); }
}
function _scheduleRtRefresh(){
  clearTimeout(_rtTimer);
  _rtTimer = setTimeout(()=>{
    try{
      if(!session || !loaded) return;
      if(document.getElementById('modalOverlay')) return;
      if(window._opBusy || _pendingSaves > 0) return;
      const a = document.activeElement;
      if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.tagName==='SELECT')) return;
      if(currentTab==='newPurchase' || currentTab==='inventoryCount') return;
      refreshContent();
    }catch(e){}
  }, 600);
}

/* ============ فحص تحديثات النسخة تلقائياً ============
   GitHub Pages بيبعت Cache-Control: max-age=600 وبيتجاهل meta tags،
   فبنسأل السيرفر بنفسنا (برابط مكسّر للكاش) ولو فيه نسخة أحدث بنحدّث لوحدنا. */
async function fetchRemoteVersion(){
  const url = location.pathname + '?_v=' + Date.now();
  const res = await fetch(url, { cache:'no-store' });
  if(!res.ok) throw new Error('fetch failed');
  const html = await res.text();
  const m = /APP_VERSION\s*=\s*'([^']+)'/.exec(html);
  return m ? m[1] : null;
}
function hardReload(){
  // إعادة تحميل برابط جديد — بتتجاوز كاش المتصفح والـ CDN
  const base = location.origin + location.pathname;
  location.replace(base + '?_v=' + Date.now());
}
async function checkForUpdate(silent){
  try{
    const remote = await fetchRemoteVersion();
    if(!remote){ if(!silent) toast('مش قادر أقرا رقم النسخة من السيرفر', true); return; }
    if(remote === APP_VERSION){
      if(!silent) toast('إنت على آخر نسخة ('+APP_VERSION+') ✓');
      return;
    }
    // فيه نسخة أحدث — منقاطعش شغل جاري (حفظ معلق / عملية جارية / نافذة مفتوحة)
    if(window._opBusy || _pendingSaves > 0 || document.getElementById('modalOverlay')) return;
    // حارس ضد أي تكرار: منحدّثش تلقائياً لنفس النسخة أكتر من مرة في نفس الجلسة
    let loopGuard = false;
    try{ loopGuard = sessionStorage.getItem('_autoReloadV') === remote; }catch(e){}
    // على شاشة الدخول (مفيش حد فاتح حساب) → حدّث تلقائياً وبصمت من غير ما نسأل
    if(!session && !loopGuard){
      try{ sessionStorage.setItem('_autoReloadV', remote); }catch(e){}
      if(!silent) toast('بيتم تحميل آخر نسخة ('+remote+')...');
      setTimeout(hardReload, 400);
      return;
    }
    // داخل بحساب (أو حصل تكرار غير متوقع) → نسأله الأول عشان منقاطعش شغله
    if(window._updatePrompted) return;
    window._updatePrompted = true;
    askConfirm('🎉 فيه تحديث جديد للنظام!<br><br>نسختك: <b>'+APP_VERSION+'</b> — المتاح: <b>'+remote+'</b><br><br>هيتم إعادة تحميل الصفحة عشان تاخد التحديث. بياناتك كلها محفوظة ومش هيحصلها حاجة.', ()=>{
      hardReload();
    });
    // لو ألغى، نسأله تاني بعد 10 دقايق
    setTimeout(()=>{ window._updatePrompted = false; }, 600000);
  }catch(e){ if(!silent) toast('تعذر فحص التحديثات — اتأكد من النت', true); }
}
function startUpdateChecker(){
  // مش بيشتغل محلياً (file://) ولا في بيئة الاختبار
  if(typeof location === 'undefined' || typeof fetch !== 'function') return;
  if(location.protocol === 'file:') return;
  setTimeout(()=>checkForUpdate(true), 1500);         // بسرعة بعد التحميل (يحل مشكلة كاش جتهب على شاشة الدخول)
  setInterval(()=>checkForUpdate(true), 60*1000);     // وكل دقيقة
}

/* ======================= TOAST ======================= */
function toast(msg, isErr){
  let wrap = document.getElementById('toastWrap');
  if(!wrap){ wrap=document.createElement('div'); wrap.id='toastWrap'; wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast'+(isErr?' err':'');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* ======================= MODAL ======================= */
function openModal(html){
  closeModal();
  const ov = document.createElement('div');
  ov.className='overlay'; ov.id='modalOverlay';
  ov.onclick=(e)=>{ if(e.target===ov) closeModal(); };
  ov.innerHTML = `<div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeModal()">✕</button>${html}</div>`;
  document.body.appendChild(ov);
}
function closeModal(){ const ov=document.getElementById('modalOverlay'); if(ov) ov.remove(); }
window._confirmCb = null;
function askConfirm(msg, cb){
  window._confirmCb = cb;
  openModal(`
    <h3>تأكيد العملية</h3>
    <p style="font-size:14px;line-height:1.8">${msg}</p>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn" style="flex:1" onclick="window._confirmCb=null;closeModal()">إلغاء</button>
      <button class="btn btn-danger" style="flex:1" onclick="const c=window._confirmCb;window._confirmCb=null;closeModal();if(c)c();">تأكيد</button>
    </div>
  `);
}
/* تأكيد بسبب إلزامي — للإلغاءات والحذف النهائي (الملاحظة 23): السبب بيتسجل في سجل العمليات */
function askConfirmReason(msg, cb){
  window._confirmCb = cb;
  openModal(`
    <h3>تأكيد العملية</h3>
    <p style="font-size:14px;line-height:1.8">${msg}</p>
    <div class="form-row"><label class="f-label">سبب العملية (إلزامي — بيتسجل في سجل العمليات باسمك)</label>
      <input class="f" id="confirmReason" placeholder="مثال: فاتورة خاطئة، تكرار بالغلط..."></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn" style="flex:1" onclick="window._confirmCb=null;closeModal()">إلغاء</button>
      <button class="btn btn-danger" style="flex:1" onclick="const r=(document.getElementById('confirmReason')||{value:''}).value.trim();if(!r){toast('اكتب سبب العملية الأول',true);return;}const c=window._confirmCb;window._confirmCb=null;closeModal();if(c)c(r);">تأكيد</button>
    </div>
  `);
}

        <div class="form-row"><input class="f" id="staffPass" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter') doStaffLogin()"></div>
        <button class="login-go" style="width:100%" onclick="doStaffLogin()">دخول</button>
      </div>
      <p class="login-err" id="loginErr"></p>
      <p class="login-hint">${DB.staff.length===0?'لسه مفيش حسابات موظفين — ادخل من "دخول الأقسام" بحساب المالك وأنشئ حسابات الموظفين من الإعدادات':'كل عملياتك هتتسجل باسمك في سجل العمليات'}</p>
      ` : `
      <p class="login-sub" style="text-align:center">اختار دورك وادخل الرقم السري للدخول</p>
      <div class="role-grid">
        ${roles.map(r=>`
          <button class="role-btn ${pickedRole===r.id?'active':''}" onclick="pickRole('${r.id}')">
            <span class="role-icon">${r.icon}</span>
            <span class="role-name">${r.name}</span>
          </button>`).join('')}
      </div>
      <div class="pin-row">
        <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••" onkeydown="if(event.key==='Enter') doLogin()">
        <button class="login-go" onclick="doLogin()">دخول</button>
      </div>
      <p class="login-err" id="loginErr"></p>
      <p class="login-hint">الأرقام السرية الافتراضية: استقبال 1111 · حسابات 2222 · مخزن 3333 · المالك 9999 (تقدر تغيرها من إعدادات المالك)</p>
      `}
    </div>
  </div>`;
}
function pickRole(r){ pickedRole=r; render(); setTimeout(()=>{const el=document.getElementById('pinInput'); if(el) el.focus();},0); }
function doStaffLogin(){
  const err = document.getElementById('loginErr');
  const username = document.getElementById('staffUser').value.trim();
  const password = document.getElementById('staffPass').value;
  if(!username || !password){ err.textContent='اكتب اسم المستخدم وكلمة المرور'; return; }
  const st = DB.staff.find(s=>s.username.toLowerCase()===username.toLowerCase() && s.password===password);
  if(!st){ err.textContent='اسم المستخدم أو كلمة المرور غلط'; return; }
  if(st.active===false){ err.textContent='الحساب ده موقوف — كلم صاحب المركز'; return; }
  session = buildSession(st.dept || st.role, st);
  currentTab = firstVisibleTab();
  logAction('تسجيل دخول');
  render();
}
function doLogin(){
  const err = document.getElementById('loginErr');
  if(!pickedRole){ err.textContent='اختار الدور الأول'; return; }
  const pin = document.getElementById('pinInput').value.trim();
  if(DB.users[pickedRole] !== pin){ err.textContent='الرقم السري غلط'; return; }
  session = buildSession(pickedRole, null);   // دخول الأقسام = صلاحيات القسم كاملة (زي النظام القديم)
  currentTab = firstVisibleTab();
  render();
}
function logout(){ session=null; pickedRole=null; render(); }

/* ======================= DASHBOARD ======================= */
function renderDashboard(){
  const activeJobs = DB.jobs.filter(j=>!isJobClosed(j));
  const readyJobs = DB.jobs.filter(j=>j.status==='جاهزة للتسليم');
  const lowStock = activeInventory().filter(p=>p.qty<=p.minQty);
  const todayStr = new Date().toDateString();
  const todayInvoices = DB.invoices.filter(i=>!i.cancelled && new Date(i.date).toDateString()===todayStr);
  const todayCollected = todayInvoices.reduce((s,i)=>s+(i.payments||[]).reduce((a,p)=>a+p.amount,0),0);
  const outstanding = DB.invoices.filter(i=>!i.cancelled).reduce((s,i)=>{ const paid=(i.payments||[]).reduce((a,p)=>a+p.amount,0); return s+(i.total-paid); },0);
  const supplierPayable = activeSuppliers().reduce((s,sup)=>s+supplierBalance(sup.id).balance,0);

  let cards = '';
  if(['reception','owner'].includes(session.role)) cards += stat(String(activeJobs.length),'أوامر شغل مفتوحة');
  if(['reception','owner'].includes(session.role)) cards += stat(String(readyJobs.length),'جاهزة للتسليم');
  if(['warehouse','owner'].includes(session.role)) cards += stat(String(lowStock.length),'قطع تحت حد الأمان', lowStock.length>0);
  if(['warehouse','owner'].includes(session.role)){
    const od = overdueTools().length, outNow = DB.tools.filter(t=>t.status==='مصروفة').length;
    if(outNow>0 || od>0) cards += stat(String(outNow)+(od?' ('+od+' متأخرة)':''),'عدد خاصة بره المخزن', od>0);
  }
  if(['warehouse','owner'].includes(session.role)) cards += stat(money(supplierPayable),'مستحق للموردين', supplierPayable>0);
  if(['accounts','owner'].includes(session.role)) cards += stat(money(todayCollected),'تحصيل اليوم');
  if(['accounts','owner'].includes(session.role)) cards += stat(money(outstanding),'مستحقات غير محصلة');
  if(can('rep.profit')){
    const monthProfit = computeProfitStats(periodRange({preset:'this_month'}));
    cards += stat(money(monthProfit.profit),'💰 صافي ربح هذا الشهر', monthProfit.profit<0);
    cards += stat(monthProfit.margin.toFixed(1)+'%','نسبة الربحية هذا الشهر', monthProfit.margin<15 && monthProfit.sales>0);
  }
  if(['reception','owner'].includes(session.role)) cards += stat(String(DB.customers.length),'إجمالي العملاء');

  const recentJobs = [...DB.jobs].filter(j=>!isJobClosed(j)).sort((a,b)=>new Date(b.receivedAt)-new Date(a.receivedAt)).slice(0,4);

  return `
    ${canScreen('settings') && backupStatus().overdue ? (()=>{ const b=backupStatus(); return `
    <div class="card" style="margin-bottom:18px;border:1px solid var(--danger)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><b style="color:var(--danger)">🛡️ نسخة احتياطية مستحقة</b>
          <div class="muted" style="font-size:12.5px">${b.lastStr?'آخر نسخة من '+b.daysSince+' يوم — عدّى موعد التذكير ('+b.intervalDays+' يوم).':'لسه معملتش أي نسخة احتياطية لبياناتك.'} اعملها دلوقتي واحفظها في مكان آمن.</div></div>
        <button class="btn btn-accent btn-sm" onclick="exportBackup()">⬇ اعمل نسخة احتياطية</button>
      </div>
    </div>` })() : ''}
    <div class="grid g4" style="margin-bottom:24px">${cards}</div>
    ${canScreen('notifications') ? renderNotifCenterWidget() : ''}
    ${['reception','owner'].includes(session.role) ? `
    <div class="section-head"><h3>أحدث أوامر الشغل</h3><button class="btn btn-accent btn-sm" onclick="goTab('jobs')">عرض الكل</button></div>
    <div class="grid g3">${recentJobs.length? recentJobs.map(ticketCard).join('') : emptyState('لسه مفيش أوامر شغل')}</div>
    ` : ''}

        ${chip('عدة تالفة/صيانة',dmg,'tools')}
        ${chip('موظف بسلف عالية',highAdv,'notifications')}
        ${chip('موظف بغياب عالي',highAbs,'notifications')}

      </div>
    </div>`;
}
function renderServiceRemindersWidget(){
  const today = new Date();
  const soon = DB.cars.filter(c=>{
    if(c.nextServiceDate){
      const d = new Date(c.nextServiceDate);
      const diffDays = (d-today)/(1000*60*60*24);
      if(diffDays<=7) return true;
    }
    if(c.nextServiceKm && c.currentOdometer && (c.nextServiceKm - c.currentOdometer)<=500) return true;
    return false;
  });
  if(soon.length===0) return '';
  return `
  <div class="section-head" style="margin-top:26px"><h3>تذكير: سيارات قربت على موعد الصيانة</h3></div>
  <div class="card"><table><thead><tr><th>اللوحة</th><th>الموديل</th><th>العميل</th><th>التفاصيل</th></tr></thead>
  <tbody>${soon.map(c=>{
    const cust = DB.customers.find(x=>x.id===c.customerId);
    const details = [];
    if(c.nextServiceDate) details.push('تاريخ: '+fmtDate(c.nextServiceDate));
    if(c.nextServiceKm) details.push('عند '+c.nextServiceKm+' كم (الحالي '+(c.currentOdometer||'—')+')');
    return `<tr><td>${c.plate}</td><td>${carLabel(c)}</td><td>${cust?cust.name:'—'}</td><td class="muted">${details.join(' · ')}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function renderTodayAppointmentsWidget(){
  const todayStr = new Date().toDateString();
  const list = DB.appointments.filter(a=>a.status!=='ملغي' && new Date(a.date).toDateString()===todayStr).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(list.length===0) return '';
  return `
  <div class="section-head" style="margin-top:26px"><h3>مواعيد اليوم (${list.length})</h3><button class="btn btn-sm" onclick="goTab('appointments')">عرض كل المواعيد</button></div>
  <div class="card"><table><thead><tr><th>الوقت</th><th>العميل</th><th>السيارة</th><th>ملاحظة</th></tr></thead>
  <tbody>${list.map(a=>`<tr><td>${new Date(a.date).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</td><td>${a.customerName}</td><td>${a.carInfo||'—'}</td><td class="muted">${a.note||'—'}</td></tr>`).join('')}</tbody></table></div>`;
}
function stat(num,lbl,danger){
  return `<div class="card stat-card"><div class="num" style="${danger?'color:var(--danger)':''}">${num}</div><div class="lbl">${lbl}</div></div>`;
}
function emptyState(msg){
  return `<div class="empty" style="grid-column:1/-1">${ICONS.empty}<div>${msg}</div></div>`;
}

let custSearchTerm = '';
function handleGlobalSearch(v){
  custSearchTerm = v.trim();
  if(currentTab==='jobs') refreshContent();
  else if(currentTab==='customers') refreshContent();
  else refreshContent();
}
/* أرشفة وحذف العملاء: الأرشفة بتخفيه من القوائم مع الحفاظ على تاريخه،
   والحذف النهائي مسموح بس لو مالوش أي تاريخ (اتسجل بالغلط) — والاتنين للمالك فقط */
let custShowArchived = false;
function toggleCustArchive(){ custShowArchived = !custShowArchived; refreshContent(); }
function customerHistoryCount(custId){
  return {
    cars: DB.cars.filter(c=>c.customerId===custId).length,
    jobs: DB.jobs.filter(j=>j.customerId===custId).length,
    invoices: DB.invoices.filter(i=>i.customerId===custId).length
  };
}
function customerHasHistory(custId){
  const h = customerHistoryCount(custId);
  return (h.jobs + h.invoices) > 0;
}
function renderCustomers(){
  const everyone = DB.customers;
  const archivedCount = everyone.filter(c=>c.archived).length;
  let list = custShowArchived ? everyone : everyone.filter(c=>!c.archived);
  if(custSearchTerm){
    list = list.filter(c=>customerMatchesSearch(c, custSearchTerm));
  }
  return `
  <div class="section-head"><h3>العملاء (${everyone.filter(c=>!c.archived).length})</h3>

      ${can('customers.create')?`<button class="btn btn-accent" onclick="openNewCustomerModal()">${ICONS.plus} عميل جديد</button>`:''}
    </div></div>

    ${list.length? list.map(customerCard).join('') : emptyState(custSearchTerm?'مفيش نتائج مطابقة':'لسه مفيش عملاء مسجلين')}

}
function customerCard(c){
  const cars = DB.cars.filter(x=>x.customerId===c.id);
  const isOwner = can('customers.archive');
  return `
  <div class="card" style="${c.archived?'opacity:.6':''}">
    <div class="flex-between">
      <div>
        <div style="font-weight:800;font-size:15px">${c.name} ${c.archived?'<span class="muted" style="font-size:11px">🗄️ أرشيف</span>':''}</div>
        <div class="muted" style="font-size:12.5px;margin-top:2px">${c.phone}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn btn-sm" onclick="openCustomerHistory('${c.id}')">سجل العميل</button>
        ${c.archived||!can('customers.create')?'':`<button class="btn btn-sm" onclick="openAddCarModal('${c.id}')">${ICONS.plus} سيارة</button>`}
        ${isOwner?`<button class="btn btn-sm" onclick="archiveCustomer('${c.id}')">${c.archived?'↩️ رجّع':'🗄️'}</button>`:''}
        ${can('customers.delete') && !customerHasHistory(c.id) ? `<button class="btn btn-sm btn-danger" onclick="deleteCustomer('${c.id}')">حذف</button>` : ''}
      </div>
    </div>

      ${cars.length? cars.map(car=>`
        <div style="display:flex;justify-content:space-between;background:var(--surface-2);padding:8px 10px;border-radius:8px;font-size:12.5px">
          <span>${car.plate} — ${carLabel(car)}</span>
          ${c.archived||!can('jobs.create')?'':`<button class="btn btn-sm btn-accent" onclick="openNewJobModal('${car.id}')">أمر شغل</button>`}

    </div>
  </div>`;
}
function archiveCustomer(custId){
  if(!can('customers.archive')){ toast('مالكش صلاحية أرشفة العملاء', true); return; }
  const c = DB.customers.find(x=>x.id===custId);
  if(!c) return;
  if(c.archived){
    askConfirm('رجوع العميل «'+c.name+'» من الأرشيف؟ هيظهر تاني في القوائم وتقدر تفتحله أوامر شغل.', async ()=>{
      c.archived = false; delete c.archivedAt;
      await saveKey('customers');
      await logAction('إرجاع العميل من الأرشيف: '+c.name);
      toast('رجع العميل للقوائم'); refreshContent();
    });
    return;
  }
  const openJobs = DB.jobs.filter(j=>j.customerId===custId && !isJobClosed(j) && j.status!=='ملغاة').length;
  if(openJobs>0){ toast('مينفعش تأرشف عميل عنده '+openJobs+' أمر شغل مفتوح — اقفلهم الأول', true); return; }
  const h = customerHistoryCount(custId);
  askConfirmReason('أرشفة العميل «'+c.name+'»؟<br><span class="muted" style="font-size:12px">هيختفي من القوائم بس تاريخه هيفضل محفوظ بالكامل ('+h.jobs+' أمر شغل · '+h.invoices+' فاتورة) وتقدر ترجّعه في أي وقت.</span>', async (reason)=>{
    c.archived = true; c.archivedAt = new Date().toISOString();
    await saveKey('customers');
    await logAction('أرشفة العميل: '+c.name+' — السبب: '+(reason||'—'));
    toast('تمت أرشفة العميل'); refreshContent();
  });
}
function deleteCustomer(custId){
  if(!can('customers.delete')){ toast('مالكش صلاحية حذف العملاء', true); return; }
  const c = DB.customers.find(x=>x.id===custId);
  if(!c) return;
  if(customerHasHistory(custId)){
    toast('مينفعش حذف عميل ليه أوامر شغل أو فواتير — استخدم الأرشفة', true); return;
  }
  const cars = DB.cars.filter(x=>x.customerId===custId);
  askConfirmReason('حذف العميل «'+c.name+'» نهائياً؟'+(cars.length?'<br><span class="muted" style="font-size:12px">هتتحذف معاه '+cars.length+' سيارة مسجلة عليه.</span>':'')+'<br><span class="muted" style="font-size:12px">الحذف متاح لأنه مالوش أي أوامر شغل أو فواتير.</span>', async (reason)=>{
    DB.cars = DB.cars.filter(x=>x.customerId!==custId);
    DB.customers = DB.customers.filter(x=>x.id!==custId);
    await Promise.all([saveKey('customers'), saveKey('cars')]);
    await logAction('🗑️ حذف عميل نهائياً «'+c.name+'»'+auditDetails([
      ['النوع', c.custType||'فرد'], ['الموبايل', c.phone],
      ['السيارات المحذوفة معاه', cars.length? cars.length+' ('+cars.map(x=>x.plate+(carLabel(x)?' '+carLabel(x):'')).join(' · ')+')' : null],
      ['السبب', reason||'—']
    ]));
    toast('تم حذف العميل'); refreshContent();
  });
}

    const carJobs = jobs.filter(j=>j.carId===c.id);

  }).join('') : '<div class="muted" style="font-size:12.5px">لا توجد سيارات مسجلة</div>'}</div>
  <label class="f-label">سجل أوامر الشغل والصيانات</label>
  <table style="margin-top:6px"><thead><tr><th>رقم</th><th>السيارة</th><th>التاريخ</th><th>الحالة</th><th>الخدمات/القطع</th><th>القيمة</th></tr></thead>
  <tbody>${[...jobs].reverse().map(j=>{
    const car = cars.find(c=>c.id===j.carId);

  }).join('') || `<tr><td colspan="6" class="empty">لا يوجد سجل صيانة بعد</td></tr>`}</tbody></table>
  ${invoices.length? `
  <label class="f-label" style="margin-top:16px;display:block">الفواتير السابقة</label>
  <table style="margin-top:6px"><thead><tr><th>رقم</th><th>التاريخ</th><th>الإجمالي</th><th>المدفوع</th></tr></thead>
  <tbody>${invoices.map(inv=>{
    const paid = (inv.payments||[]).reduce((s,p)=>s+p.amount,0);
    return `<tr><td>#${inv.invNo}</td><td>${fmtDate(inv.date)}</td><td>${money(inv.total)}</td><td>${money(paid)}</td></tr>`;
  }).join('')}</tbody></table>` : ''}
  `;
}

/* ======================= JOBS ======================= */
function ticketCard(job){
  const car = DB.cars.find(c=>c.id===job.carId) || {};
  const cust = DB.customers.find(c=>c.id===job.customerId) || {};
  const stepIdx = STATUSES.indexOf(job.status);
  const cancelled = job.status==='ملغاة';
  return `
  <div class="ticket" onclick="openJobDetail('${job.id}')">
    <div class="ticket-hole"></div>
    <div class="ticket-top">
      <div>
        <div class="ticket-jobno">#${job.jobNo}</div>
        <div class="ticket-plate">${car.plate||'—'}</div>
        <div class="ticket-car">${carLabel(car)} · ${cust.name||''}</div>
        <div class="ticket-car" style="margin-top:4px;color:var(--accent-2)">
          فُتح: ${fmtDateTime(job.receivedAt)}
          ${job.status==='تم التسليم' && job.deliveredAt
            ? ' · استغرقت: '+durationText(job.receivedAt, job.deliveredAt)
            : (job.status!=='ملغاة' ? ' · بالمركز منذ: '+durationText(job.receivedAt) : '')}
        </div>
      </div>
      <span class="tag ${STATUS_TAGCLASS[job.status]}">${job.status}</span>
    </div>
    <div class="ticket-divider"></div>
    ${cancelled ? `<div style="padding:16px 18px;color:var(--danger);font-size:12.5px">تم إلغاء أمر الشغل</div>` : `
    <div class="stepper">
      ${STATUSES.map((s,i)=>`
        <div class="step ${i<stepIdx?'done':''} ${i===stepIdx?'current':''}">
          <div class="step-line"></div><div class="step-dot"></div>
          <div class="step-lbl">${s}</div>
        </div>`).join('')}
    </div>`}
  </div>`;
}
function isJobClosed(job){
  // القاعدة: إصدار فاتورة (غير ملغاة) = السيارة خرجت من المركز — المتابعة المالية من شاشة الفواتير
  if(job.status === 'ملغاة') return true;
  return DB.invoices.some(i=>i.jobId===job.id && !i.cancelled);
}
function renderJobs(){
  let list = [...DB.jobs].filter(j=>!isJobClosed(j)).sort((a,b)=>new Date(b.receivedAt)-new Date(a.receivedAt));
  if(custSearchTerm){
    list = list.filter(j=>jobMatchesSearch(j,custSearchTerm));
  }
  const closedCount = DB.jobs.filter(isJobClosed).length;
  return `
  <div class="section-head"><h3>أوامر الشغل النشطة (${list.length})</h3>
    ${can('jobs.create')?`<button class="btn btn-accent" onclick="openPickCarForJob()">${ICONS.plus} أمر شغل جديد</button>`:''}</div>
  ${closedCount>0 ? `<div class="muted" style="margin-bottom:14px;font-size:12.5px">القاعدة: وجود الأمر هنا = السيارة لسه داخل المركز. ${closedCount} أمر صدرت له فاتورة أو أُلغي — انتقلوا لشاشة الفواتير وسجل العميل.</div>` : ''}

/* ============ هوية الفني: الربط بالرقم الوظيفي مش بالاسم (الملاحظة 30) ============
   كل بند شغل بيتخزن معاه technicianId (معرف الموظف) + technician (لقطة من الاسم للسجلات القديمة والطباعة).
   التقارير والحوافز بتتجمع بالـ ID ⇐ مفيش تكرار أسماء، وتغيير اسم الموظف مش بيكسر السجلات القديمة. */
const TECH_JOB_KEYWORDS = ['فني','ميكانيك','كهرب','سمكر','دهان','ورشة'];
function isTechEmployee(e){
  if(!e || e.status!=='نشط') return false;
  const hay = (e.job||'')+' '+(e.dept||'');
  return TECH_JOB_KEYWORDS.some(k=>hay.includes(k));
}
function techEmployees(){ return DB.employees.filter(isTechEmployee).sort((a,b)=>a.name.localeCompare(b.name,'ar')); }
function techOptionsHTML(selectedId){
  const list = techEmployees();
  if(list.length===0) return `<option value="">— مفيش فنيين نشطين في الموارد البشرية —</option>`;
  return `<option value="">— اختار الفني —</option>` +
    list.map(e=>`<option value="${e.id}" ${selectedId===e.id?'selected':''}>${e.name} — #${e.empNo||'—'} — ${e.job||'—'}</option>`).join('');
}
/* المفتاح الثابت للفني: الـ ID لو موجود، وإلا الاسم القديم (توافق مع السجلات القديمة) */
function techKeyOf(it, job){
  const id = (it && it.technicianId) || (job && job.technicianId);
  if(id) return id;
  const nm = (it && it.technician && it.technician.trim()) || (job && job.technician && job.technician.trim());
  return nm || 'غير محدد';
}
/* الاسم المعروض: بيتقرا من ملف الموظف (فيتحدث لو الاسم اتغير)، وإلا اللقطة القديمة */
function techLabelOf(key){
  const e = DB.employees.find(x=>x.id===key);
  return e ? e.name : (key || 'غير محدد');
}
function itemTechLabel(it, job){ return techLabelOf(techKeyOf(it, job)); }

async function saveNewJob(carId){
  if(!can('jobs.create')){ toast('مالكش صلاحية إنشاء أوامر شغل', true); return; }
  const car = DB.cars.find(c=>c.id===carId);
  // حماية من التكرار: ممنوع أمر شغل جديد لسيارة عندها أمر مفتوح بالفعل
  const existingOpen = DB.jobs.find(j=>j.carId===carId && !isJobClosed(j));
  if(existingOpen){
    toast('السيارة دي عندها أمر شغل مفتوح بالفعل (#'+existingOpen.jobNo+') — اقفله أو ألغيه الأول', true);
    return;
  }
  const notes = document.getElementById('jobNotes').value.trim();
  const techId = (document.getElementById('jobTech')||{}).value || null;
  const tech = techId ? techLabelOf(techId) : '';
  const odo = parseFloat(document.getElementById('jobOdo').value)||null;
  const nextKm = parseFloat(document.getElementById('jobNextKm').value)||null;
  const nextDate = document.getElementById('jobNextDate').value || null;
  if(odo!==null) car.currentOdometer = odo;
  if(nextKm!==null) car.nextServiceKm = nextKm;
  if(nextDate) car.nextServiceDate = nextDate;
  await saveKey('cars', DB.cars);
  const job = {
    id: uid('job'), jobNo: nextNo(DB.jobs,'jobNo'),
    carId, customerId: car.customerId, status:'مستلمة',
    receivedAt: new Date().toISOString(), notes, technicianId: techId, technician: tech, odometer: odo,
    items: [], deliveredAt:null, customerApproved:false
  };
  DB.jobs.push(job);
  await saveKey('jobs', DB.jobs);
  await logAction('إنشاء أمر شغل #'+job.jobNo+' — '+car.plate);
  closeModal(); toast('تم إنشاء أمر الشغل #'+job.jobNo);
  currentTab='jobs'; render();
}

    byName:(session.staffName||ROLE_LABEL[session.role]||'—'), dept:ROLE_LABEL[session.role]||session.role,
    date:new Date().toISOString() });
  await saveKey('jobs', DB.jobs);

  const n = (job.internalNotes||[]).find(x=>x.id===noteId);
  if(!n || !canEditInternalNote(job, n)){ toast('مالكش صلاحية تعديل الملاحظة دي', true); return; }
  openModal(`
    <h3>تعديل ملاحظة داخلية</h3>
    <div class="muted" style="font-size:12px;margin-bottom:8px">${n.byName||'—'} · ${n.dept||'—'} · ${fmtDateTime(n.date)}</div>
    <div class="form-row"><textarea class="f" id="editInternalNote" rows="3">${n.text}</textarea></div>
    <button class="btn btn-accent" style="width:100%" onclick="saveEditInternalNote('${jobId}','${noteId}')">حفظ التعديل</button>
  `);
}
async function saveEditInternalNote(jobId, noteId){
  const job = DB.jobs.find(j=>j.id===jobId); if(!job) return;
  const n = (job.internalNotes||[]).find(x=>x.id===noteId);
  if(!n || !canEditInternalNote(job, n)){ toast('مالكش صلاحية التعديل', true); return; }
  const text = ((document.getElementById('editInternalNote')||{}).value||'').trim();
  if(!text){ toast('اكتب نص الملاحظة', true); return; }
  const old = n.text;
  n.text = text; n.editedAt = new Date().toISOString(); n.editedBy = actorName();
  await saveKey('jobs', DB.jobs);
  await logAction('✎ تعديل ملاحظة داخلية على أمر الشغل #'+job.jobNo+' — من: "'+old.slice(0,40)+'" إلى: "'+text.slice(0,40)+'"');
  closeModal(); openJobDetail(jobId);
}
function softDeleteInternalNote(jobId, noteId){
  if(!isOwnerSession()){ toast('حذف الملاحظات صلاحية صاحب المركز فقط', true); return; }
  const job = DB.jobs.find(j=>j.id===jobId); if(!job) return;
  const n = (job.internalNotes||[]).find(x=>x.id===noteId); if(!n) return;
  askConfirm('حذف الملاحظة دي؟ (حذف آمن — بتفضل محفوظة في السجل مع مين حذفها)', async ()=>{
    n.deleted = true; n.deletedBy = actorName(); n.deletedAt = new Date().toISOString();
    await saveKey('jobs', DB.jobs);
    await logAction('🗑️ حذف ملاحظة داخلية (آمن) على أمر الشغل #'+job.jobNo+' — كانت: "'+String(n.text).slice(0,50)+'"');
    closeModal(); openJobDetail(jobId);
  });
}
/* الملاحظة 40: الموظف المسؤول عن أمر الشغل — بحث ذكي في كل موظفي المركز (مش الفنيين بس) */
function jdRespFilter(jobId, val){
  const box = document.getElementById('jdRespResults');
  if(!box) return;
  const q = normSearch(val);
  if(!q){ box.innerHTML=''; return; }
  const emps = DB.employees
    .filter(e=>e.status==='نشط' && normSearch(e.name).includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name,'ar')).slice(0,8);
  box.innerHTML = emps.length
    ? emps.map(e=>`<div class="btn" style="width:100%;text-align:right;margin-bottom:4px;justify-content:space-between;display:flex" onclick="setJobResponsible('${jobId}','${e.id}')">
        <span>${e.name}</span><span class="muted" style="font-size:11px">${e.job||''}</span>
      </div>`).join('')
    : `<div class="muted" style="font-size:12px">مفيش موظف بالاسم ده</div>`;
}
async function setJobResponsible(jobId, empId){
  if(!can('jobs.edit')){ toast('مالكش صلاحية تعديل أوامر الشغل', true); return; }
  const job = DB.jobs.find(j=>j.id===jobId);
  const emp = DB.employees.find(e=>e.id===empId);
  if(!job || !emp) return;
  job.responsibleId = emp.id;
  job.responsibleName = emp.name;
  await saveKey('jobs', DB.jobs);
  await logAction('تحديد الموظف المسؤول عن أمر الشغل #'+job.jobNo+': '+emp.name);
  toast('تم تحديد الموظف المسؤول: '+emp.name);
  openJobDetail(jobId);
}
function notifyCustomerWhatsapp(jobId){
  const job = DB.jobs.find(j=>j.id===jobId);
  const car = DB.cars.find(c=>c.id===job.carId)||{};
  const cust = DB.customers.find(c=>c.id===job.customerId)||{};
  let phone = (cust.phone||'').replace(/\D/g,'');
  if(phone.startsWith('0')) phone = '2'+phone;
  const msg = (DB.settings.whatsappTemplate||'سيارتك {plate} جاهزة للاستلام من {center}.')
    .replace('{plate}', car.plate||'').replace('{center}', DB.settings.centerName||'');
  // window.open محجوب في بيئة الأرتيفاكت — نستخدم رابط مؤقت بدلاً منه
  const a = document.createElement('a');
  a.href = 'https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
  a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

async function saveEditJobItem(jobId, itemId){
  if(!can('jobs.edit')){ toast('مالكش صلاحية تعديل أوامر الشغل', true); return; }
  const job = DB.jobs.find(j=>j.id===jobId);
  const it = job.items.find(i=>i.id===itemId);
  const name = document.getElementById('editItName').value.trim();
  const price = parseFloat(document.getElementById('editItPrice').value)||0;
  if(!name){ toast('اكتب اسم صحيح', true); return; }
  it.name = name;
  it.unitPrice = price;
  // الملاحظة 42: الكمية والفني للخدمات والمصنعيات الخارجية بس — القطع (مخزن/خارجية) اسم وسعر بيع فقط
  if(it.kind==='service' || it.kind==='ext_work'){
    const qtyEl = document.getElementById('editItQty');
    if(qtyEl) it.qty = parseFloat(qtyEl.value)||1;
    const techEl = document.getElementById('editItTech');
    if(techEl){
      it.technicianId = techEl.value || null;
      it.technician = it.technicianId ? techLabelOf(it.technicianId) : '';
    }
  }
  await saveKey('jobs', DB.jobs);
  await logAction('تعديل بند "'+name+'" في أمر الشغل #'+job.jobNo);
  closeModal(); toast('تم حفظ التعديل'); openJobDetail(jobId); refreshContent();
}

  const desc = describeJobItem(itemPre, jobPre);
  askConfirm('حذف البند ده من أمر الشغل #'+jobPre.jobNo+'؟<br><span class="muted" style="font-size:12px">'+desc.replace(/^ — /,'')+'</span>', async ()=>{

  return (job.items && job.items.length>0) || ((job.internalCosts||[]).length>0);
}

async function confirmCancelJob(jobId){
  if(!can('jobs.cancel')){ toast('مالكش صلاحية إلغاء أوامر الشغل', true); return; }
  const job = DB.jobs.find(j=>j.id===jobId);
  // حماية: أمر عليه معاملات لا يُلغى إلا بواسطة الأدمن (الملاحظة 35)
  if(jobHasTransactions(job) && !isOwnerSession()){
    toast('مالكش صلاحية إلغاء أمر شغل عليه معاملات مخزنية أو مالية', true); closeModal(); return;
  }
  const reason = document.getElementById('cancelReason').value;
  const notes = document.getElementById('cancelNotes').value.trim();
  const totalCost = jobCostBreakdown(job).total;
  job.status = 'ملغاة';
  job.cancellationReason = reason;
  job.cancellationNotes = notes;
  job.cancelledAt = new Date().toISOString();
  job.cancelledCost = totalCost;   // نحفظ التكلفة وقت الإلغاء للتدقيق
  await saveKey('jobs', DB.jobs);
  await logAction('إلغاء أمر الشغل #'+job.jobNo+' — السبب: '+reason+(totalCost>0?' — إجمالي التكلفة وقت الإلغاء: '+money(totalCost):''));
  pushNotif({ category:'jobs', type:'job_cancel', priority:'high', amount:totalCost,
    action:'إلغاء أمر شغل #'+job.jobNo+(totalCost>0?' (عليه معاملات بتكلفة '+money(totalCost)+')':'')+' — '+reason, refType:'job', refId:job.id, refNo:job.jobNo });
  toast('تم إلغاء أمر الشغل وتوثيق السبب');
  openJobDetail(jobId); refreshContent();
}

  askConfirmReason('هل أنت متأكد من حذف أمر الشغل #'+job.jobNo+' نهائياً؟'+(totalCost>0?'<br><span class="muted" style="font-size:12px">إجمالي التكلفة المرتبطة: '+money(totalCost)+' (هتتشال من السجل)</span>':'')+'<br>هذا الإجراء لا يمكن التراجع عنه.', async (reason)=>{

    await logAction('🗑️ حذف أمر شغل نهائياً #'+job.jobNo+auditDetails([
      ['العميل', cstD?cstD.name:null], ['السيارة', carD?(carD.plate+(carLabel(carD)?' — '+carLabel(carD):'')):null],

    ]));
    pushNotif({ category:'jobs', type:'job_delete', priority:'critical', amount:totalCost,
      action:'حذف أمر شغل #'+job.jobNo+' نهائياً — '+(reason||'—'), refNo:job.jobNo });

/* ============ الملاحظة 44: أرشفة الأصناف والموردين (بديل الحذف النهائي) ============
   المؤرشف بيختفي من الشغل اليومي وقوائم الاختيار، ويفضل موجود في كل التقارير والتاريخ. */
function activeInventory(){ return DB.inventory.filter(p=>!p.archived); }

}
/* الملاحظة 46: فلتر المتاح — الكل / المتاح فقط (كمية > 0) / تحت الحد الأدنى / المتصفر */
let invAvailFilter = '';
function setInvAvailFilter(v){ invAvailFilter = v; refreshContent(); }
function invAvailMatch(p){
  if(invAvailFilter==='available') return (p.qty||0) > 0;
  if(invAvailFilter==='low') return (p.qty||0) <= (p.minQty||0);
  if(invAvailFilter==='zero') return (p.qty||0) <= 0;
  return true;
}
function visibleInventory(){
  const t = invSearchTerm.trim().toLowerCase();
  return [...DB.inventory]
    .filter(p=> invShowArchived ? true : !p.archived)
    .filter(p=> !invWhFilter || partWhId(p)===invWhFilter)
    .filter(invAvailMatch)
    .filter(p=> !t || p.name.toLowerCase().includes(t) || (p.sku&&p.sku.toLowerCase().includes(t)) || (p.category&&p.category.toLowerCase().includes(t)))
    .sort((a,b)=>a.name.localeCompare(b.name,'ar'));
}
/* نطاق المخزن المختار (مخزن + بحث + أرشيف) — من غير فلتر المتاح، عشان الكروت تدي الصورة الكاملة دايماً */
function inventoryScope(){
  const t = invSearchTerm.trim().toLowerCase();
  return DB.inventory
    .filter(p=> invShowArchived ? true : !p.archived)
    .filter(p=> !invWhFilter || partWhId(p)===invWhFilter)
    .filter(p=> !t || p.name.toLowerCase().includes(t) || (p.sku&&p.sku.toLowerCase().includes(t)) || (p.category&&p.category.toLowerCase().includes(t)));
}
function inventoryValueHTML(){
  const items = inventoryScope();
  const value = items.reduce((s,p)=>s+p.qty*(p.costPrice||0),0);
  const live = items.filter(p=>!p.archived);   // المؤرشف مايدخلش الحسابات التشغيلية
  const avail = live.filter(p=>(p.qty||0) > 0).length;
  const low = live.filter(p=>(p.qty||0) <= (p.minQty||0) && (p.qty||0) > 0).length;
  const zero = live.filter(p=>(p.qty||0) <= 0).length;
  const scope = invWhFilter ? whName(invWhFilter) : 'جميع المخازن';
  return `<div class="grid g4">
    ${stat(money(value),'قيمة المخزون — '+scope)}
    ${stat(String(avail)+' من '+live.length,'✅ أصناف متاحة — '+scope)}
    ${stat(String(low),'⚠️ تحت الحد الأدنى (لسه فيه كمية)', low>0)}
    ${stat(String(zero),'⛔ أصناف متصفرة', zero>0)}
  </div>`;
}
function inventoryRowsHTML(){
  const items = visibleInventory();
  return items.length ? items.map(p=>`
        <tr onclick="openItemCard('${p.id}')" style="cursor:pointer${p.archived?';opacity:.55':''}">
          <td>${p.name}${p.archived?' <span class="muted" style="font-size:11px">🗄️ مؤرشف</span>':''}</td><td class="muted">${p.category||'—'}</td><td class="muted">${p.sku||'—'}</td>
          <td><span class="tag tag-inspect">${whName(partWhId(p))}</span></td>
          <td class="${!p.archived && p.qty<=p.minQty?'low-stock':''}">${p.qty} ${p.unit||''}</td>
          <td>${p.minQty}</td><td>${money(p.costPrice)}</td><td>${money(p.sellPrice)}</td>
          <td>${p.archived
            ? (isOwnerSession()?`<button class="btn btn-sm btn-accent" onclick="event.stopPropagation(); restoreInventoryItem('${p.id}')">♻️ استرجاع</button>`:'')
            : `<button class="btn btn-sm" onclick="event.stopPropagation(); openStockInModal('${p.id}')">توريد</button>`}</td>
        </tr>`).join('') : `<tr><td colspan="9" class="empty">لا يوجد أصناف مطابقة</td></tr>`;
}

  <div class="card">

  const note = document.getElementById('trNote').value.trim();
  const src = DB.inventory.find(x=>x.id===partId);
  // الملاحظة 45: حماية خلفية — ممنوع تحويل من/إلى صنف مؤرشف
  if(src && src.archived){ toast('الصنف مؤرشف — استرجعه من الأرشيف الأول قبل التحويل', true); return; }
  const srcWhId = partWhId(src);
  if(destWhId===srcWhId){ toast('اختار مخزن مختلف عن مخزن المصدر', true); return; }
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(qty>src.qty){ toast('الكمية أكبر من المتاح في مخزن المصدر', true); return; }
  // إيجاد أو إنشاء نفس الصنف في المخزن الوجهة
  let dest = DB.inventory.find(p=>p.id!==src.id && partWhId(p)===destWhId && p.name===src.name && (p.sku||'')===(src.sku||''));
  if(dest && dest.archived){ toast('نفس الصنف موجود مؤرشف في مخزن «'+whName(destWhId)+'» — استرجعه من الأرشيف الأول قبل التحويل ليه', true); return; }
  if(!dest){
    dest = {...src, id:uid('p'), warehouseId:destWhId, qty:0, createdAt:new Date().toISOString()};
    DB.inventory.push(dest);
  }
  src.qty -= qty;
  dest.qty += qty;
  const who = actorName();
  const noteTxt = 'تحويل مخزني: '+whName(srcWhId)+' ← '+whName(destWhId)+' — بواسطة: '+who+(note?' — '+note:'');
  DB.stockMoves.push({id:uid('mv'), partId:src.id, type:'transfer_out', qty, unitCost:src.costPrice, fromWhId:srcWhId, toWhId:destWhId, date:new Date().toISOString(), note:noteTxt});
  DB.stockMoves.push({id:uid('mv'), partId:dest.id, type:'transfer_in', qty, unitCost:src.costPrice, fromWhId:srcWhId, toWhId:destWhId, date:new Date().toISOString(), note:noteTxt});
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('stockMoves', DB.stockMoves)]);
  await logAction('تحويل '+qty+' من '+src.name+' — '+whName(srcWhId)+' ← '+whName(destWhId));
  closeModal(); toast('تم التحويل بين المخازن'); refreshContent();
}

async function saveStockIn(partId){
  if(!can('inv.receive')){ toast('مالكش صلاحية التوريد', true); return; }
  // الملاحظة 45: حماية خلفية — ممنوع توريد على صنف مؤرشف حتى لو اتفتحت النافذة بأي طريقة
  const pGuard = DB.inventory.find(x=>x.id===partId);
  if(pGuard && pGuard.archived){ toast('الصنف مؤرشف — استرجعه من الأرشيف الأول قبل التوريد', true); return; }
  const qty = parseFloat(document.getElementById('inQty').value)||0;
  const cost = parseFloat(document.getElementById('inCost').value)||0;
  const note = document.getElementById('inNote').value.trim();
  const supplierId = document.getElementById('inSupplier').value;
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  const p = DB.inventory.find(x=>x.id===partId);
  p.qty += qty;
  if(cost>0) p.costPrice = cost;
  let purchaseId = null;
  if(supplierId){
    purchaseId = uid('pur');
  }
  DB.stockMoves.push({id:uid('mv'), partId, type:'in', qty, unitCost:cost, date:new Date().toISOString(), note, supplierId: supplierId||null, purchaseId});
  await saveKey('inventory', DB.inventory);
  await saveKey('stockMoves', DB.stockMoves);

  if(supplierId){
    const supplier = DB.suppliers.find(s=>s.id===supplierId);
    const purchase = {
      id: purchaseId, purchaseNo: nextNo(DB.purchases,'purchaseNo'),
      supplierId, date: new Date().toISOString(), note,
      items: [{partId, name:p.name, qty, unitCost:cost}],
      total: qty*cost, payments: []
    };
    DB.purchases.push(purchase);
    await saveKey('purchases', DB.purchases);
    closeModal(); toast('تم التوريد وتسجيل فاتورة شراء من '+supplier.name); refreshContent();
  } else {
    closeModal(); toast('تم التوريد'); refreshContent();
  }
}

function jobMatchesSearch(job, term){
  if(!term) return true;
  const t = term.trim().toLowerCase();
  const car = DB.cars.find(c=>c.id===job.carId) || {};
  const cust = DB.customers.find(c=>c.id===job.customerId) || {};
  const haystack = [
    job.jobNo, job.status, job.notes, job.technician,
    car.plate, car.make, car.model, car.year, car.vin, car.color,
    cust.name, cust.phone
  ].filter(Boolean).join(' | ').toLowerCase();
  return haystack.includes(t);
}
function customerMatchesSearch(cust, term){
  if(!term) return true;
  const t = term.trim().toLowerCase();
  const cars = DB.cars.filter(c=>c.customerId===cust.id);
  const haystack = [cust.name, cust.phone, ...cars.flatMap(c=>[c.plate,c.make,c.model,c.year,c.vin,c.color])]
    .filter(Boolean).join(' | ').toLowerCase();
  return haystack.includes(t);
}

  transfer_out:'تحويل صادر تحويل مخزني',
};
const _moveHayCache = new WeakMap();
function moveHaystack(m){
  const cached = _moveHayCache.get(m);
  if(cached && cached.v === m._hv) return cached.text;
  const parts = [];
  const p = m.partId ? DB.inventory.find(x=>x.id===m.partId) : null;
  if(p) parts.push(p.name, p.sku, p.oemNo, p.supplierPartNo, p.barcode, p.brand, p.category, p.keywords);
  if(m.extName) parts.push(m.extName);
  parts.push(MOVE_TYPE_WORDS[m.type]||m.type);
  const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
  if(job){
    parts.push('أمر شغل', job.jobNo, job.notes);
    const car = DB.cars.find(c=>c.id===job.carId);
    if(car) parts.push(car.plate, car.make, car.model, car.year, carLabel(car));
    const cu = DB.customers.find(c=>c.id===job.customerId);
    if(cu) parts.push(cu.name, cu.phone);
  }
  if(m.forJobNo) parts.push('أمر شغل', m.forJobNo);
  if(m.forCarLbl) parts.push(m.forCarLbl);
  if(m.customerId){ const cu = DB.customers.find(c=>c.id===m.customerId); if(cu) parts.push(cu.name, cu.phone); }
  if(m.supplierId){ const su = DB.suppliers.find(s=>s.id===m.supplierId); if(su) parts.push('مورد', su.name, su.phone, su.contactPerson); }
  if(m.purchaseId){ const pu = DB.purchases.find(x=>x.id===m.purchaseId); if(pu) parts.push('فاتورة شراء', pu.purchaseNo, pu.invoiceNo, pu.paymentMethod); }
  const whId = m.warehouseId || (p ? partWhId(p) : null);
  if(whId) parts.push(whName(whId));
  if(m.fromWhId) parts.push(whName(m.fromWhId));
  if(m.toWhId) parts.push(whName(m.toWhId));
  parts.push(m.note, m.notes, m.reqByName, m.actor, m.reason, m.payMethod, m.id);
  const text = normSearch(parts.filter(Boolean).join(' '));
  m._hv = (m._hv||0) + 1;
  _moveHayCache.set(m, { v:m._hv, text });
  return text;
}
/* كل كلمة في البحث لازم تتلاقى (بحث تراكمي) — جزئي وبتطبيع عربي/إنجليزي */
function moveMatchesSearch(m, q){
  const key = normSearch(q||'');
  if(!key) return true;
  const hay = moveHaystack(m);
  return key.split(' ').filter(Boolean).every(tok => hay.includes(tok));
}
/* الملاحظة 38: أجزاء عرض تتبع الحركة (طالب/أمر/سيارة/ملاحظات) */
function moveTrackParts(m){
  const parts = [];
  if(m.reqByName) parts.push('طلبها: '+m.reqByName);
  if(m.forJobNo) parts.push('لأمر #'+m.forJobNo);
  if(m.forCarLbl) parts.push('لسيارة: '+m.forCarLbl);
  if(m.notes) parts.push('📝 '+m.notes);
  return parts;
}
function moveMatchesFilters(m){
  const f = mvFilters;
  // الملاحظة 51: البحث الشامل بيشتغل مع باقي الفلاتر (مش بدلها)
  if(f.q && !moveMatchesSearch(m, f.q)) return false;
  if(f.dateFrom && new Date(m.date) < new Date(f.dateFrom)) return false;
  if(f.dateTo && new Date(m.date) > new Date(new Date(f.dateTo).getTime()+86399999)) return false;
  if(f.type==='transfer'){ if(m.type!=='transfer_in' && m.type!=='transfer_out') return false; }
  else if(f.type && m.type!==f.type) return false;
  if(f.supplierId && m.supplierId!==f.supplierId) return false;
  if(f.partId && m.partId!==f.partId) return false;
  if(f.reqById && m.reqById!==f.reqById) return false;
  if(f.jobNo){
    const jn = f.jobNo.trim();
    const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
    const matchConsumed = job && job.jobNo.includes(jn);
    const matchRelated = m.forJobNo && String(m.forJobNo).includes(jn);
    if(!matchConsumed && !matchRelated) return false;
  }
  if(f.carCust){
    const t = f.carCust.trim().toLowerCase();
    const job = m.jobId ? DB.jobs.find(j=>j.id===m.jobId) : null;
    const car = job ? DB.cars.find(c=>c.id===job.carId) : null;
    const cust = m.customerId ? DB.customers.find(c=>c.id===m.customerId) : (job ? DB.customers.find(c=>c.id===job.customerId) : null);
    const haystack = [car&&car.plate, car&&carLabel(car), cust&&cust.name, cust&&cust.phone].filter(Boolean).join(' ').toLowerCase();
    if(!haystack.includes(t)) return false;
  }
  return true;
}

      if(m.purchaseId){
        const pu = DB.purchases.find(x=>x.id===m.purchaseId);
        if(pu){
          const paid = (pu.payments||[]).reduce((s,x)=>s+x.amount,0);
          extra.push(paid>=pu.total?'✅ مسدد للمورد':(paid>0?'⚠ مسدد جزئياً':'🔴 آجل — غير مسدد'));
        }
      } else if(m.payMethod){ extra.push(m.payMethod); }
    }
    if(m.note) extra.push(m.note);
    moveTrackParts(m).forEach(x=>extra.push(x));
    const noteTxt = extra.join(' — ');
    const clickable = m.jobId ? `onclick="openWorkOrderReport('${m.jobId}')" style="cursor:pointer"` : '';
    return `<tr ${clickable}><td>${fmtDateTime(m.date)}</td><td>${itemName}</td>

  }).join('');
}

async function saveStockAdjustment(){
  if(!can('inv.adjust')){ toast('مالكش صلاحية تسوية المخزون', true); return; }
  const partId = document.getElementById('adjPart').value;
  const newQty = parseFloat(document.getElementById('adjNewQty').value);
  const reason = document.getElementById('adjReason').value.trim();
  const notes = ((document.getElementById('adjNotes')||{}).value||'').trim();
  const p = DB.inventory.find(x=>x.id===partId);
  if(!p){ toast('اختار الصنف الأول', true); return; }
  // الملاحظة 45: حماية خلفية — ممنوع تسوية على صنف مؤرشف
  if(p.archived){ toast('الصنف مؤرشف — استرجعه من الأرشيف الأول قبل التسوية', true); return; }
  if(isNaN(newQty) || newQty<0){ toast('اكتب كمية صحيحة', true); return; }
  if(!reason){ toast('سبب التسوية إلزامي', true); return; }
  const diff = newQty - p.qty;
  if(diff===0){ toast('الكمية زي الموجودة بالظبط، مفيش تغيير', true); return; }
  p.qty = newQty;
  DB.stockMoves.push({id:uid('mv'), partId, type:'adjustment', qty:Math.abs(diff), date:new Date().toISOString(), actor:actorName(),
    note:(diff>0?'زيادة':'نقص')+' بالتسوية '+Math.abs(diff)+(reason?' — '+reason:'')+(notes?' — '+notes:'')});
  await Promise.all([saveKey('inventory', DB.inventory), saveKey('stockMoves', DB.stockMoves)]);
  await logAction('تسوية مخزون: '+p.name+' من '+(p.qty-diff)+' إلى '+newQty+' (فرق '+(diff>0?'+':'')+diff+') — السبب: '+reason+(notes?' — '+notes:''));
  pushNotif({ category:'inventory', type:'adjust', priority:'high',
    action:'تسوية مخزون: '+p.name+' ('+(p.qty-diff)+' ← '+newQty+')', refType:'inventory' });
  closeModal(); toast('تم تسجيل التسوية'); refreshContent();
}
/* مرتجع العميل المربوط بأمر الشغل (الملاحظة 28):
   اختار القطعة ← النظام يعرض بس الأوامر اللي اتصرفت عليها ← إرجاع بحد أقصى المصروف
   ← خصم من بنود الأمر (التكلفة بتتعدل تلقائياً) + رجوع الكمية لنفس مخزن القطعة */
let crSelectedJobId = null;
function crDispensedQty(job, partId){
  return job.items.filter(it=>it.kind==='part' && it.partId===partId).reduce((s,it)=>s+it.qty,0);
}
/* الملاحظة 48: كميات المرتجع الحقيقية من حركات المخزن — مصروف / مرتجع / متبقي للإرجاع */
function crIssuedQty(job, partId){
  return DB.stockMoves.filter(m=>m.jobId===job.id && m.partId===partId && m.type==='out').reduce((s,m)=>s+(m.qty||0),0);
}
function crReturnedQty(job, partId){
  return DB.stockMoves.filter(m=>m.jobId===job.id && m.partId===partId && m.type==='customer_return').reduce((s,m)=>s+(m.qty||0),0);
}
/* المتبقي للإرجاع = الأقل بين (المصروف − المرتجع) والموجود فعلياً في بنود الأمر — أأمن حساب */
function crRemainingQty(job, partId){
  const fromMoves = Math.max(crIssuedQty(job, partId) - crReturnedQty(job, partId), 0);
  const onJob = crDispensedQty(job, partId);
  return crIssuedQty(job, partId) > 0 ? Math.min(fromMoves, onJob) : onJob;
}

async function saveCustomerReturn(){
  const partId = (document.getElementById('crPart')||{}).value;
  const qty = parseFloat((document.getElementById('crQty')||{}).value)||0;
  const reason = ((document.getElementById('crReason')||{}).value||'').trim();
  const p = DB.inventory.find(x=>x.id===partId);
  const job = crSelectedJobId ? DB.jobs.find(j=>j.id===crSelectedJobId) : null;
  if(!p){ toast('اختار القطعة الأول', true); return; }
  // الملاحظة 45: حماية خلفية — ممنوع مرتجع على صنف مؤرشف
  if(p.archived){ toast('الصنف مؤرشف — استرجعه من الأرشيف الأول قبل تسجيل المرتجع', true); return; }
  if(!job){ toast('اختار أمر الشغل اللي اتصرفت عليه القطعة', true); return; }
  // الملاحظة 48: المتاح للإرجاع = المصروف − اللي اترجع قبل كده (مينفعش يتعدّى)
  const avail = crRemainingQty(job, partId);
  if(avail<=0){ toast('القطعة دي مش مصروفة على الأمر ده (أو اترجعت بالكامل)', true); return; }
  if(qty<=0){ toast('اكتب كمية صحيحة', true); return; }
  if(qty>avail){ toast('مينفعش ترجع أكتر من المتاح للإرجاع ('+avail+') — المصروف '+crIssuedQty(job, partId)+' واترجع قبل كده '+crReturnedQty(job, partId), true); return; }
  const invd = DB.invoices.some(i=>i.jobId===job.id && !i.cancelled);
  if(invd && !can('bill.cancel')){
    toast('الأمر ده متفوتر — المرتجع بعد الفاتورة صلاحية الحسابات أو المالك فقط', true); return;
  }
  // 1) خصم الكمية من بنود الأمر (والبند يتشال لو وصل صفر) ← تكلفة الأمر بتتعدل تلقائياً
  let remaining = qty;
  job.items = job.items.filter(it=>{
    if(remaining<=0 || it.kind!=='part' || it.partId!==partId) return true;
    const take = Math.min(it.qty, remaining);
    it.qty -= take; remaining -= take;
    return it.qty > 0;
  });
  // 2) رجوع الكمية لنفس المخزن الأصلي بتاع القطعة
  p.qty += qty;
  const cust = DB.customers.find(c=>c.id===job.customerId);
  // 3) حركة موثقة: الأمر، العميل، الكمية، المخزن، المنفذ، الوقت
  DB.stockMoves.push({id:uid('mv'), partId, type:'customer_return', qty, unitCost:p.costPrice, warehouseId: partWhId(p),
    reason: reason||'غير محدد', date:new Date().toISOString(), actor:actorName(),
    note:'مرتجع عميل — أمر شغل #'+job.jobNo+(cust?' — '+cust.name:'')+' — رجعت لمخزن: '+whName(partWhId(p))+(reason?' — '+reason:''),
    jobId: job.id, customerId: job.customerId});
  await Promise.all([saveKey('inventory'), saveKey('jobs'), saveKey('stockMoves')]);
  await logAction('مرتجع عميل: '+qty+' من '+p.name+' — أمر شغل #'+job.jobNo+' — رجعت لمخزن '+whName(partWhId(p)));
  closeModal(); toast('تم المرتجع: '+qty+' رجعت لمخزن '+whName(partWhId(p))+' واتخصمت من أمر الشغل #'+job.jobNo); refreshContent();
}

/* ---- تقارير أوامر الشغل المفتوحة (الملاحظة 26) — للحسابات والمالك فقط ---- */
function jobCostBreakdown(job){
  const inParts = job.items.filter(it=>it.kind==='part').reduce((s,it)=>s+it.qty*(it.costPrice||0),0);
  const extParts = job.items.filter(it=>it.kind==='ext_part').reduce((s,it)=>s+it.qty*(it.costPrice||0),0);
  const extWork = job.items.filter(it=>it.kind==='ext_work').reduce((s,it)=>s+it.qty*(it.costPrice||0),0);
  const paint = (job.internalCosts||[]).reduce((s,ic)=>s+ic.total,0);
  const revenue = job.items.reduce((s,it)=>s+it.qty*it.unitPrice,0);
  const total = inParts + extParts + extWork + paint;
  return { inParts, extParts, extWork, paint, total, revenue, profit: revenue - total };
}
function isOpenJob(j){
  // مفتوح = لسه ماتعملوش فاتورة سارية، ومش ملغي
  if(j.status==='ملغاة') return false;
  return !DB.invoices.some(i=>i.jobId===j.id && !i.cancelled);
}
